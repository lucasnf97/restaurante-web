<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante — Social</title>
<script id="tema-boot">try{var s=localStorage.getItem('token'),k='@anon';if(s){var p=JSON.parse(atob(s.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));k=(p.admin_override||p.rol==='superadmin')?'@super':(p.sub||'@anon');}var t=localStorage.getItem('tema::'+k)||localStorage.getItem('tema_ultimo')||'auto';document.documentElement.dataset.tema=(t==='auto')?(matchMedia('(prefers-color-scheme:dark)').matches?'oscuro':'claro'):t;}catch(e){}</script>
<link rel="stylesheet" href="css/tema.css?v=5">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--sup-app, #f0f2f5); min-height: 100vh; }
        .navbar { background: #1a1a2e; color: white; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .navbar-brand { font-size: 18px; font-weight: 700; }
        .navbar-links { display: flex; gap: 16px; align-items: center; }
        .btn-logout { background: transparent; border: 1px solid var(--ac, #4f46e5); color: var(--nav-tx, #a5b4fc); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-logout:hover { background: var(--ac, #4f46e5); color: var(--tx-inv, white); }

        .content { margin-top: 60px; padding: 24px 16px 60px; max-width: 760px; margin-left: auto; margin-right: auto; }

        /* Selector de feed — tabs estilo "Para ti / Siguiendo" */
        .feeds-bar { display: flex; gap: 24px; align-items: center; margin-bottom: 18px;
            border-bottom: 1px solid var(--bd, #e5e7eb); overflow-x: auto;
            position: sticky; top: 60px; background: var(--sup-app, #f0f2f5); z-index: 50; }
        .feed-tab { padding: 12px 2px; font-size: 15px; font-weight: 600; color: var(--tx-4, #9ca3af);
            cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
        .feed-tab:hover { color: var(--fg-a16, #4b5563); }
        .feed-tab.active { color: var(--tx, #1a1a2e); font-weight: 800; border-bottom-color: var(--bd-a5, #1a1a2e); }
        .feed-cog { font-size: 12px; opacity: .7; margin-left: 4px; }
        .feed-add { color: var(--tx-ac-2, #7c3aed); font-weight: 800; }

        /* Composer */
        .composer { background: var(--sup, #fff); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 16px; margin-bottom: 22px; }
        .composer textarea { width: 100%; border: 1px solid var(--bd, #e5e7eb); border-radius: 10px; padding: 11px 13px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; }
        .composer textarea:focus { border-color: var(--ac, #4f46e5); }
        .composer-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
        .comp-link { flex: 1; min-width: 180px; border: 1px solid var(--bd, #e5e7eb); border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none; }
        .comp-link:focus { border-color: var(--ac, #4f46e5); }
        .btn-attach { padding: 8px 13px; border: 1px solid var(--bd-6, #d7dbe3); background: var(--sup, #fff); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--tx-ac, #4f46e5); cursor: pointer; }
        .btn-publicar { padding: 8px 22px; border: none; background: var(--ac, #4f46e5); color: var(--tx-inv, #fff); border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-left: auto; }
        .btn-publicar:disabled { opacity: .5; cursor: default; }
        /* Autocompletar menciones */
        .mention-box { border: 1px solid var(--bd, #e5e7eb); border-radius: 10px; margin-top: 6px; max-height: 210px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.1); background: var(--sup, #fff); }
        .mention-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; cursor: pointer; }
        .mention-item:hover { background: var(--ac-sf, #eef2ff); }
        .mention-item .mi-tag { margin-left: auto; font-size: 11px; color: var(--tx-4, #9ca3af); }
        .mention { color: var(--tx-ac, #4f46e5); font-weight: 600; }

        .adj-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .adj-chip { font-size: 12px; background: var(--ac-sf, #eef2ff); color: var(--fg-a13, #3730a3); border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
        .adj-chip .x { cursor: pointer; font-weight: 800; color: var(--fg-a19, #6366f1); }

        /* Post card */
        .post { background: var(--sup, #fff); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 18px; overflow: hidden; transition: box-shadow .3s; }
        .post.post-highlight { box-shadow: 0 0 0 3px #4f46e5, 0 2px 10px rgba(0,0,0,.06); }
        .post-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--ac, #4f46e5); color: var(--tx-inv, #fff); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
        .post-meta { flex: 1; min-width: 0; }
        .post-user { font-size: 14px; font-weight: 700; color: var(--tx, #1a1a2e); }
        .post-fecha { font-size: 11px; color: var(--tx-4, #9ca3af); }
        .post-acciones { display: flex; gap: 4px; }
        .post-acc-btn { border: none; background: transparent; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; color: var(--tx-3, #6b7280); }
        .post-acc-btn:hover { background: var(--sup-3, #f3f4f6); }
        .post-texto { padding: 0 16px 12px; font-size: 14px; color: var(--tx-13, #1f2937); white-space: pre-wrap; word-break: break-word; }
        .post-img { width: 100%; height: auto; display: block; background: var(--sup-3, #f3f4f6); }
        .post-files { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 12px; }
        .post-file { display: flex; align-items: center; gap: 10px; border: 1px solid var(--bd-4, #eef0f3); border-radius: 10px; padding: 9px 12px; text-decoration: none; color: var(--tx-13, #1f2937); font-size: 13px; font-weight: 600; }
        .post-file:hover { background: var(--sup-2, #fafafe); }
        .post-file .fi { font-size: 20px; }
        .post-enlace { padding: 0 16px 14px; }
        .post-enlace a { color: var(--tx-ac, #4f46e5); font-size: 13px; font-weight: 600; word-break: break-all; }
        .empty { text-align: center; color: var(--tx-4, #9ca3af); font-size: 14px; padding: 40px 0; }
        .btn-mas { display: block; margin: 0 auto; padding: 9px 24px; border: 1px solid var(--bd-6, #d7dbe3); background: var(--sup, #fff); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--tx-ac, #4f46e5); cursor: pointer; }

        /* Badges 📌 fijado / 🚨 prioritaria */
        .badge-pin { background: var(--av-sf, #fef3c7); color: var(--av-tx, #92400e); border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
        .badge-prio { background: var(--pel-sf, #fee2e2); color: var(--pel-tx, #b91c1c); border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
        .post.fijado { border: 1px solid var(--bd-a37, #fcd34d); }
        .post.prio { border: 1px solid var(--bd-a36, #fca5a5); }

        /* Barra de acciones del post (reacciones, comentarios, vistas, acuses) */
        .post-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--bd-4, #f3f4f6); }
        .react-chip { border: 1px solid var(--bd, #e5e7eb); background: var(--sup, #fff); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--fg-a16, #4b5563); }
        .react-chip:hover { background: var(--sup-3, #f3f4f6); }
        .react-chip.mine { background: var(--ac-sf, #eef2ff); border-color: var(--bd-a19, #a5b4fc); color: var(--fg-a13, #3730a3); font-weight: 700; }
        .react-chip .rn { font-size: 12px; font-weight: 700; }
        .act-chip { border: none; background: transparent; border-radius: 8px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; color: var(--tx-3, #6b7280); cursor: pointer; }
        .act-chip:hover { background: var(--sup-3, #f3f4f6); }
        .act-chip.acuses { color: var(--pel-tx, #b91c1c); }

        /* Comentarios */
        .post-comments { border-top: 1px solid var(--bd-4, #f3f4f6); padding: 10px 16px 14px; background: var(--sup-2, #fafafe); }
        .coment { display: flex; gap: 9px; padding: 7px 0; align-items: flex-start; }
        .coment-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-a20, #6366f1); color: var(--tx-inv, #fff); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
        .coment-body { flex: 1; min-width: 0; background: var(--sup, #fff); border: 1px solid var(--bd-4, #eef0f3); border-radius: 10px; padding: 7px 11px; }
        .coment-user { font-size: 12px; font-weight: 700; color: var(--tx, #1a1a2e); }
        .coment-user .cf { font-weight: 400; color: var(--tx-4, #9ca3af); font-size: 11px; margin-left: 6px; }
        .coment-texto { font-size: 13px; color: var(--tx-13, #1f2937); white-space: pre-wrap; word-break: break-word; }
        .coment-del { border: none; background: transparent; cursor: pointer; color: var(--tx-4, #9ca3af); font-size: 12px; padding: 2px 4px; }
        .coment-del:hover { color: var(--pel-tx-2, #dc2626); }
        .coment-form { display: flex; gap: 8px; margin-top: 8px; }
        .coment-form input { flex: 1; border: 1px solid var(--bd, #e5e7eb); border-radius: 999px; padding: 8px 14px; font-size: 13px; outline: none; }
        .coment-form input:focus { border-color: var(--ac, #4f46e5); }
        .coment-form button { border: none; background: var(--ac, #4f46e5); color: var(--tx-inv, #fff); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

        /* Toggles del composer (📌 / 🚨, solo edición) */
        .comp-toggle { padding: 8px 13px; border: 1px solid var(--bd-6, #d7dbe3); background: var(--sup, #fff); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--tx-3, #6b7280); cursor: pointer; }
        .comp-toggle.on-pin { background: var(--av-sf, #fef3c7); border-color: var(--bd-a33, #f59e0b); color: var(--av-tx, #92400e); }
        .comp-toggle.on-prio { background: var(--pel-sf, #fee2e2); border-color: var(--bd-a30, #ef4444); color: var(--pel-tx, #b91c1c); }

        /* Sección de fijados */
        .fijados-titulo { font-size: 12px; font-weight: 800; color: var(--av-tx, #92400e); text-transform: uppercase; letter-spacing: .5px; margin: 2px 0 10px; }

        /* Listados en modal (acuses / vistas) */
        .lista-det { max-height: 320px; overflow-y: auto; }
        .lista-det .li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--bd-4, #f3f4f6); font-size: 13px; color: var(--tx-2, #374151); }
        .lista-det .li .lf { color: var(--tx-4, #9ca3af); font-size: 12px; white-space: nowrap; }
        .lista-sub { font-size: 12px; font-weight: 800; color: var(--tx-3, #6b7280); text-transform: uppercase; letter-spacing: .4px; margin: 14px 0 4px; }
        .lista-sub.ok { color: var(--fg-a2, #059669); }
        .lista-sub.falta { color: var(--pel-tx, #b91c1c); }

        /* Modal grupo */
        .modal-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; align-items: center; justify-content: center; }
        .modal-ov.open { display: flex; }
        .modal { background: var(--sup, #fff); border-radius: 14px; width: 460px; max-width: 94vw; max-height: 88vh; overflow-y: auto; padding: 22px; }
        .modal h3 { font-size: 18px; margin-bottom: 14px; color: var(--tx, #1a1a2e); }
        .modal label.lbl { font-size: 12px; font-weight: 700; color: var(--tx-3, #6b7280); text-transform: uppercase; letter-spacing: .4px; display: block; margin: 12px 0 6px; }
        .modal input.txt { width: 100%; border: 1px solid var(--bd, #e5e7eb); border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none; }
        .checks { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; border: 1px solid var(--bd-4, #f0f0f0); border-radius: 8px; padding: 8px; }
        .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tx-2, #374151); padding: 3px 4px; }
        .modal-acc { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .btn-save { padding: 9px 20px; border: none; background: var(--ac, #4f46e5); color: var(--tx-inv, #fff); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-sec { padding: 9px 16px; border: 1px solid var(--bd-3, #d1d5db); background: var(--sup, #fff); border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-del { padding: 9px 16px; border: 1px solid var(--pel-bd, #fecaca); background: var(--pel-sf-2, #fef2f2); color: var(--pel-tx-2, #dc2626); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: auto; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="feeds-bar" id="feeds-bar"></div>

    <div class="composer" style="position:relative;">
        <textarea id="comp-texto" placeholder="Escribí una publicación… (escribí @ para etiquetar a alguien)"
                  oninput="mentionOnInput(this, document.getElementById('mention-box'), _mencionSel)"></textarea>
        <div class="mention-box" id="mention-box" style="display:none"></div>
        <div class="adj-preview" id="comp-adj"></div>
        <div class="composer-row">
            <select id="comp-rest" class="comp-link" style="display:none;flex:0 0 auto;min-width:150px;max-width:210px" title="Publicar en"></select>
            <input type="text" class="comp-link" id="comp-link" placeholder="Enlace (opcional): https://…">
            <input type="file" id="comp-files" multiple style="display:none" onchange="onFilesSel(this.files)">
            <button class="btn-attach" onclick="document.getElementById('comp-files').click()">📎 Adjuntar</button>
            <button class="comp-toggle" id="comp-fijar" style="display:none" title="Fijar arriba del muro" onclick="toggleCompFlag(this,'on-pin')">📌 Fijar</button>
            <button class="comp-toggle" id="comp-prio" style="display:none" title="Todos deben aceptarla para seguir usando el sistema" onclick="toggleCompFlag(this,'on-prio')">🚨 Prioritaria</button>
            <button class="btn-publicar" id="btn-publicar" onclick="publicar()">Publicar</button>
        </div>
    </div>

    <div id="feed-fijados"></div>
    <div id="feed"></div>
    <button class="btn-mas" id="btn-mas" style="display:none" onclick="cargarMas()">Cargar más</button>
</div>

<!-- Modal Grupo -->
<div class="modal-ov" id="modal-grupo">
    <div class="modal">
        <h3 id="grupo-title">Nuevo grupo</h3>
        <label class="lbl">Nombre del grupo</label>
        <input type="text" class="txt" id="grupo-nombre" placeholder="Ej: Camareros">
        <label class="lbl">Roles</label>
        <div class="checks" id="grupo-roles"></div>
        <label class="lbl">Usuarios</label>
        <div class="checks" id="grupo-usuarios"></div>
        <div class="modal-acc">
            <button class="btn-save" id="btn-guardar-grupo" onclick="guardarGrupo()">Guardar</button>
            <button class="btn-sec" onclick="cerrarModal('modal-grupo')">Cancelar</button>
            <button class="btn-del" id="grupo-del" style="display:none" onclick="eliminarGrupo()">🗑 Eliminar</button>
        </div>
    </div>
</div>

<!-- Modal Editar publicación -->
<div class="modal-ov" id="modal-editar">
    <div class="modal">
        <h3>Editar publicación</h3>
        <textarea class="txt" id="edit-texto" style="min-height:90px;resize:vertical"
                  oninput="mentionOnInput(this, document.getElementById('edit-mention-box'), _editMenciones)"></textarea>
        <div class="mention-box" id="edit-mention-box" style="display:none"></div>
        <label class="lbl">Enlace</label>
        <input type="text" class="txt" id="edit-link" placeholder="https://…">
        <label class="lbl">Adjuntos actuales</label>
        <div class="checks" id="edit-adjuntos"></div>
        <label class="lbl">Agregar adjuntos</label>
        <input type="file" id="edit-files" multiple>
        <div id="edit-flags" style="display:none">
            <label class="lbl">Opciones</label>
            <label class="check-row" style="display:flex;align-items:center;gap:8px;font-size:13px;color: var(--tx-2, #374151);padding:3px 4px;">
                <input type="checkbox" id="edit-fijado"> 📌 Fijada arriba del muro</label>
            <label class="check-row" style="display:flex;align-items:center;gap:8px;font-size:13px;color: var(--tx-2, #374151);padding:3px 4px;">
                <input type="checkbox" id="edit-prio"> 🚨 Prioritaria (todos deben aceptarla)</label>
        </div>
        <div class="modal-acc">
            <button class="btn-save" onclick="guardarEdicion()">Guardar cambios</button>
            <button class="btn-sec" onclick="cerrarModal('modal-editar')">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal listado (vistas / acuses) -->
<div class="modal-ov" id="modal-lista">
    <div class="modal">
        <h3 id="lista-title">Detalle</h3>
        <div id="lista-body" class="lista-det"></div>
        <div class="modal-acc">
            <button class="btn-sec" onclick="cerrarModal('modal-lista')">Cerrar</button>
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();
// Social es de acceso libre: todos entran. edicion_social = moderar ajenas + grupos.
const _user = getUser() || {};
const _canModerar = hasPermiso('edicion_social');   // admin/gerente también (vía hasPermiso)
// Empleado de cadena (contexto cuenta): muro AGREGADO de sus locales, solo lectura.
const _emp = (typeof esEmpleadoCadena === 'function' && esEmpleadoCadena()
              && (typeof enCuenta !== 'function' || enCuenta()));

let _grupos = [];           // grupos visibles {id, nombre, es_miembro, roles, usuarios}
let _puedeGestionar = false;
let _feedGrupoId = null;    // null = general
let _composerFiles = [];
let _lastId = null;         // para paginar
let _editId = null;
const _postsCache = {};     // id → post (para el editor)
// Menciones (@): catálogos + selección (composer y editor) + contexto activo
let _menUsuarios = [];      // {id, username}
let _menRoles = [];         // {nombre}
let _mencionSel = [];       // composer: [{tipo:'u'|'r', id, nombre, display:'@…'}]
let _editMenciones = [];    // editor: idem
let _mCtx = null;           // {ta, box, sel, tok:{start,end}, cands:[]}

// esc(): global de api.js (la declaración local top-level chocaba con la global).
const iniciales = n => (n || '?').substring(0, 2).toUpperCase();
function fmtFecha(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' +
           d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}
// Resalta @menciones en el texto (ya escapado)
function resaltarMenciones(txtEsc) {
    return txtEsc.replace(/(^|\s)(@[\wÀ-ÿ.\-]+)/g, '$1<span class="mention">$2</span>');
}

// ── Menciones (@usuario / @rol) ──────────────────────────────
async function cargarMenciones() {
    try { _menUsuarios = (await api.get('/auth/usuarios')).filter(u => u.activo !== false && u.rol !== 'admin')
            .map(u => ({ id: u.id, username: u.username })); } catch (e) { _menUsuarios = []; }
    try { _menRoles = (await api.get('/roles')).map(r => ({ nombre: r.nombre })); } catch (e) { _menRoles = []; }
}

// Genérico: se conecta a un textarea + su dropdown + su array de selección
function mentionOnInput(ta, box, sel) {
    _mCtx = { ta, box, sel, tok: null, cands: [] };
    const caret = ta.selectionStart;
    const before = ta.value.slice(0, caret);
    const m = before.match(/(^|\s)@([^\s@]*)$/);
    if (!m) { box.style.display = 'none'; return; }
    const q = m[2].toLowerCase();
    _mCtx.tok = { start: m.index + m[1].length, end: caret };
    const us = _menUsuarios.filter(u => coincide((u.username || ''), q)).slice(0, 6);
    const rs = _menRoles.filter(r => coincide((r.nombre || ''), q)).slice(0, 4);
    _mCtx.cands = us.map(u => ({ tipo: 'u', id: u.id, nombre: u.username }))
        .concat(rs.map(r => ({ tipo: 'r', id: null, nombre: r.nombre })));
    if (!_mCtx.cands.length) { box.style.display = 'none'; return; }
    box.innerHTML = _mCtx.cands.map((c, i) =>
        `<div class="mention-item" onmousedown="mentionPick(event, ${i})">
            <span>${c.tipo === 'u' ? '👤' : '🏷️'}</span> ${esc(c.nombre)}
            <span class="mi-tag">${c.tipo === 'u' ? 'usuario' : 'rol'}</span>
        </div>`).join('');
    box.style.display = 'block';
}

function mentionPick(ev, i) {
    ev.preventDefault();
    if (!_mCtx || !_mCtx.tok) return;
    const c = _mCtx.cands[i];
    if (!c) return;
    const ta = _mCtx.ta, val = ta.value;
    ta.value = val.slice(0, _mCtx.tok.start) + '@' + c.nombre + ' ' + val.slice(_mCtx.tok.end);
    const pos = _mCtx.tok.start + c.nombre.length + 2;
    ta.focus(); ta.setSelectionRange(pos, pos);
    _mCtx.sel.push({ tipo: c.tipo, id: c.id, nombre: c.nombre, display: '@' + c.nombre });
    _mCtx.box.style.display = 'none';
    _mCtx.tok = null;
}

// Devuelve {usuarios, roles} efectivos: menciones cuyo @display sigue en el texto
function _mencionesEfectivas(sel, texto) {
    const usados = sel.filter(m => texto.includes(m.display));
    return {
        usuarios: [...new Set(usados.filter(m => m.tipo === 'u').map(m => m.id))],
        roles:    [...new Set(usados.filter(m => m.tipo === 'r').map(m => m.nombre))],
    };
}

// ── Feeds (general + grupos) ─────────────────────────────────
async function cargarGrupos() {
    try {
        const r = await api.get('/social/grupos');
        _grupos = r.grupos || [];
        _puedeGestionar = !!r.puede_gestionar;
    } catch (e) { _grupos = []; _puedeGestionar = false; }
    renderFeedsBar();
}

function renderFeedsBar() {
    const bar = document.getElementById('feeds-bar');
    let html = `<div class="feed-tab ${_feedGrupoId === null ? 'active' : ''}" onclick="seleccionarFeed(null)">General</div>`;
    html += _grupos.map(g => {
        const active = _feedGrupoId === g.id;
        const cog = (active && _puedeGestionar) ? `<span class="feed-cog" onclick="event.stopPropagation();abrirGrupoModal(${g.id})">⚙️</span>` : '';
        return `<div class="feed-tab ${active ? 'active' : ''}" onclick="seleccionarFeed(${g.id})">${esc(g.nombre)}${cog}</div>`;
    }).join('');
    if (_puedeGestionar) html += `<div class="feed-tab feed-add" onclick="abrirGrupoModal(null)" title="Nuevo grupo">＋</div>`;
    bar.innerHTML = html;
}

function seleccionarFeed(grupoId) {
    _feedGrupoId = grupoId;
    renderFeedsBar();
    cargarFeed(true);
}

// ── Feed ─────────────────────────────────────────────────────
async function cargarFeed(reset) {
    const cont = document.getElementById('feed');
    const contF = document.getElementById('feed-fijados');
    if (reset) { cont.innerHTML = '<div class="empty">Cargando…</div>'; contF.innerHTML = ''; _lastId = null; }
    let url = `/social/feed?limit=20${_feedGrupoId ? '&grupo_id=' + _feedGrupoId : ''}`;
    if (!reset && _lastId) url += '&before_id=' + _lastId;
    let r = null;
    try { r = await api.get(url); } catch (e) { cont.innerHTML = '<div class="empty">No se pudo cargar el feed.</div>'; return; }
    // Tolerante a ambos shapes: array viejo u objeto {fijados, posts}
    const fijados = Array.isArray(r) ? [] : (r.fijados || []);
    const posts = Array.isArray(r) ? r : (r.posts || []);
    if (reset) {
        cont.innerHTML = '';
        if (fijados.length) {
            contF.innerHTML = '<div class="fijados-titulo">📌 Fijadas</div>';
            fijados.forEach(p => contF.insertAdjacentHTML('beforeend', renderPost(p)));
        }
        if (!posts.length && !fijados.length) cont.innerHTML = '<div class="empty">Todavía no hay publicaciones.</div>';
    }
    posts.forEach(p => cont.insertAdjacentHTML('beforeend', renderPost(p)));
    if (posts.length) _lastId = posts[posts.length - 1].id;
    document.getElementById('btn-mas').style.display = posts.length === 20 ? 'block' : 'none';
    _encolarVistas(fijados.concat(posts).map(p => p.id));
}
function cargarMas() { cargarFeed(false); }

// ── Vistas (tracking pasivo, batch con debounce) ─────────────
const _vistasEnviadas = new Set();
let _vistasCola = [], _vistasTimer = null;
function _encolarVistas(ids) {
    if (_emp) return;   // el muro agregado del empleado de cadena no trackea vistas
    (ids || []).forEach(id => {
        if (!_vistasEnviadas.has(id)) { _vistasEnviadas.add(id); _vistasCola.push(id); }
    });
    if (!_vistasCola.length) return;
    clearTimeout(_vistasTimer);
    _vistasTimer = setTimeout(async () => {
        const lote = _vistasCola.splice(0, 100);
        try { await apiFetch('/social/vistas', { method: 'POST', body: JSON.stringify({ post_ids: lote }) }); }
        catch (e) { /* best-effort */ }
    }, 2000);
}

function renderPost(p) {
    // Clave de cache: en el muro agregado del portal los ids pueden repetirse
    // entre restaurantes → se prefija el restaurante_id (igual que el id del DOM).
    const k = (p.restaurante_id != null ? (p.restaurante_id + '-') : '') + p.id;
    _postsCache[k] = p;
    const imgs = (p.adjuntos || []).filter(a => a.tipo === 'imagen')
        .map(a => `<img class="post-img" src="${esc(a.url)}" alt="" loading="lazy">`).join('');
    const vids = (p.adjuntos || []).filter(a => a.tipo === 'video')
        .map(a => `<video class="post-video" src="${esc(a.url)}" controls preload="metadata" playsinline style="max-width:100%;border-radius:10px;margin-top:8px;display:block;"></video>`).join('');
    const files = (p.adjuntos || []).filter(a => a.tipo === 'archivo')
        .map(a => `<a class="post-file" href="${esc(a.url)}" target="_blank" rel="noopener"><span class="fi">📄</span>${esc(a.nombre)}</a>`).join('');
    const filesBlock = files ? `<div class="post-files">${files}</div>` : '';
    // urlSegura() filtra el esquema (javascript:/data: → XSS): si no es http(s) se
    // muestra el texto sin link.
    const _lnk = p.enlace ? urlSegura(p.enlace) : '';
    const enlace = p.enlace
        ? `<div class="post-enlace">${_lnk
            ? `<a href="${escAttr(_lnk)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(p.enlace)}</a>`
            : `🔗 ${esc(p.enlace)}`}</div>`
        : '';
    const texto = p.contenido ? `<div class="post-texto">${resaltarMenciones(esc(p.contenido))}</div>` : '';
    let solBlock = '';
    if (p.solicitud_id && (p.solicitud_tipo === 'oferta' || p.solicitud_tipo === 'abierto')) {
        const esAb = p.solicitud_tipo === 'abierto';
        const rid = (p.restaurante_id != null) ? ('&restaurante_id=' + p.restaurante_id) : '';
        const href = `horarios.html?solicitud=${p.solicitud_id}${rid}`;
        const primTxt = esAb ? '✋ Postularme → ir a la grilla' : '✋ Tomar este turno → ir a la grilla';
        const btnPrim = `<a href="${href}" style="display:inline-block;background: var(--bg-a21, #6d28d9);color: var(--tx-inv, #fff);text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;">${primTxt}</a>`;
        const btnSec  = `<a href="${href}" style="display:inline-block;background: var(--sup, #fff);color: var(--fg-a21, #6d28d9);border: 1px solid var(--ac-bd-2, #c4b5fd);text-decoration:none;border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px;">📅 Ir a la grilla</a>`;
        const activa = esAb ? (p.solicitud_estado === 'abierta') : (p.solicitud_estado === 'disponible');
        if (activa)
            solBlock = `<div style="margin-top:8px;">${btnPrim}</div>`;
        else {
            const lbl = (esAb
                ? ({ asignada:'✔ Cubierto', cancelada:'Cerrado' })
                : ({ pend_confirmacion:'Reclamado — pendiente de confirmación', aprobada:'✔ Tomado', cancelada:'Cerrado', denegada:'Disponible nuevamente' })
              )[p.solicitud_estado] || p.solicitud_estado;
            solBlock = `<div style="margin-top:8px;font-size:13px;font-weight:700;color: var(--tx-3, #6b7280);margin-bottom:6px;">📣 ${esc(lbl)}</div><div>${btnSec}</div>`;
        }
    }
    let accBtns = '';
    if (!_emp && _canModerar)
        accBtns += `<button class="post-acc-btn" title="${p.fijado ? 'Desfijar' : 'Fijar arriba'}" onclick="toggleFijar(${p.id})">📌</button>`;
    if (p.can_edit)
        accBtns += `<button class="post-acc-btn" title="Editar" onclick="abrirEditar('${k}')">✏️</button>
            <button class="post-acc-btn" title="Eliminar" onclick="eliminarPost('${k}')">🗑</button>`;
    const acc = accBtns ? `<div class="post-acciones">${accBtns}</div>` : '';
    const editado = p.editado_en ? ' · editado' : '';
    const badges = (p.fijado ? ' <span class="badge-pin">📌 Fijada</span>' : '')
        + (p.prioritaria ? ' <span class="badge-prio">🚨 Prioritaria</span>' : '')
        + (p.prioritaria && p.aceptado_por_mi ? ' <span class="badge-pin" style="background: var(--ok-sf, #d1fae5);color: var(--fg-a3, #065f46);">✔ Aceptada</span>' : '')
        // Publicación DIRIGIDA (roles/personas): solo la ven los destinatarios + editores
        + (((p.dest_roles && p.dest_roles.length) || (p.dest_usuarios && p.dest_usuarios.length))
            ? ` <span class="badge-pin" style="background: var(--bg-a40, #e0e7ff);color: var(--fg-a13, #3730a3);" title="Dirigida${(p.dest_roles || []).length ? ' a: ' + p.dest_roles.join(', ') : ' a personas puntuales'}">🎯 Dirigida</span>` : '');
    return `
    <div class="post${p.fijado ? ' fijado' : ''}${p.prioritaria ? ' prio' : ''}" id="post-${p.restaurante_id!=null?(p.restaurante_id+'-'):''}${p.id}">
        <div class="post-head">
            <div class="post-avatar">${esc(iniciales(p.nombre_display || p.username))}</div>
            <div class="post-meta">
                <div class="post-user">${esc(p.nombre_display || p.username)}${p.restaurante ? ` <span style="background: var(--ac-sf, #eef2ff);color: var(--fg-a14, #4338ca);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;">🏠 ${esc(p.restaurante)}</span>` : ''}</div>
                <div class="post-fecha">${fmtFecha(p.creado_en)}${editado}${badges}</div>
            </div>
            ${acc}
        </div>
        ${texto}${solBlock}${imgs}${vids}${filesBlock}${enlace}
        ${_barraAcciones(p)}
        <div class="post-comments" id="coments-${p.id}" style="display:none"></div>
    </div>`;
}

// ── Barra de acciones (reacciones / comentarios / vistas / acuses) ──
const _EMOJIS = ['👍', '❤️', '👏', '🎉'];
function _barraAcciones(p) {
    if (_emp || p.reacciones === undefined) return '';   // muro agregado o API vieja: sin barra
    const chips = _EMOJIS.map(e => {
        const r = (p.reacciones || []).find(x => x.emoji === e);
        const n = r ? r.n : 0;
        const mine = p.mi_reaccion === e ? ' mine' : '';
        const title = r && r.usuarios && r.usuarios.length ? esc(r.usuarios.join(', ')) : '';
        return `<button class="react-chip${mine}" title="${title}" onclick="reaccionar(${p.id}, '${e}')">${e}${n ? ` <span class="rn">${n}</span>` : ''}</button>`;
    }).join('');
    const coment = `<button class="act-chip" onclick="toggleComentarios(${p.id})">💬 <span id="coment-count-${p.id}">${p.comentarios_count || 0}</span></button>`;
    const vistas = _canModerar
        ? `<button class="act-chip" title="Quiénes la vieron" onclick="abrirVistas(${p.id})">👁 ${p.vistas_count || 0}</button>`
        : `<span class="act-chip" style="cursor:default">👁 ${p.vistas_count || 0}</span>`;
    const acuses = (p.prioritaria && _canModerar && p.audiencia_total !== undefined)
        ? `<button class="act-chip acuses" onclick="abrirAcuses(${p.id})">✔ Aceptaron ${p.acuses_count || 0}/${p.audiencia_total} — Ver</button>`
        : '';
    return `<div class="post-actions" id="acciones-${p.id}">${chips}${coment}${vistas}${acuses}</div>`;
}

async function reaccionar(postId, emoji) {
    const p = _postsCache[postId];
    if (!p) return;
    const nuevo = p.mi_reaccion === emoji ? null : emoji;   // toggle
    try {
        const r = await apiFetch(`/social/posts/${postId}/reaccion`, {
            method: 'PUT', body: JSON.stringify({ emoji: nuevo }) });
        p.reacciones = r.reacciones; p.mi_reaccion = r.mi_reaccion;
        const bar = document.getElementById('acciones-' + postId);
        if (bar) bar.outerHTML = _barraAcciones(p);
    } catch (e) { alert('No se pudo reaccionar: ' + (e.message || e)); }
}

// ── Comentarios ──────────────────────────────────────────────
async function toggleComentarios(postId) {
    const box = document.getElementById('coments-' + postId);
    if (!box) return;
    if (box.style.display !== 'none') { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (!box.dataset.cargado) await cargarComentarios(postId);
}
async function cargarComentarios(postId) {
    const box = document.getElementById('coments-' + postId);
    box.innerHTML = '<div style="font-size:12px;color: var(--tx-4, #9ca3af);padding:6px 0">Cargando…</div>';
    let lista = [];
    try { lista = await api.get(`/social/posts/${postId}/comentarios`); }
    catch (e) { box.innerHTML = '<div style="font-size:12px;color: var(--tx-4, #9ca3af)">No se pudieron cargar los comentarios.</div>'; return; }
    box.dataset.cargado = '1';
    box.innerHTML = `<div id="coments-lista-${postId}">${lista.map(c => _comentHtml(c)).join('')}</div>
        <div class="coment-form">
            <input type="text" id="coment-input-${postId}" maxlength="2000" placeholder="Escribí un comentario…"
                   onkeydown="if(event.key==='Enter')comentar(${postId})">
            <button onclick="comentar(${postId})">Enviar</button>
        </div>`;
    const cnt = document.getElementById('coment-count-' + postId);
    if (cnt) cnt.textContent = lista.length;
    if (_postsCache[postId]) _postsCache[postId].comentarios_count = lista.length;
}
function _comentHtml(c) {
    const del = c.can_delete ? `<button class="coment-del" title="Eliminar" onclick="borrarComentario(${c.id}, this)">🗑</button>` : '';
    return `<div class="coment" id="coment-${c.id}">
        <div class="coment-avatar">${esc(iniciales(c.nombre_display || c.username))}</div>
        <div class="coment-body">
            <div class="coment-user">${esc(c.nombre_display || c.username)}<span class="cf">${fmtFecha(c.creado_en)}</span></div>
            <div class="coment-texto">${esc(c.texto)}</div>
        </div>${del}
    </div>`;
}
const _comentando = new Set();   // posts con un comentario en vuelo
async function comentar(postId) {
    const input = document.getElementById('coment-input-' + postId);
    const texto = (input.value || '').trim();
    if (!texto) return;
    // El input se limpia recien DESPUES del await y ni el boton ni el Enter se bloqueaban:
    // pulsar Enter dos veces (o Enter + clic en Enviar) mandaba el comentario duplicado al
    // muro y habia que borrar uno. publicar() en este mismo archivo si bloquea su boton.
    if (_comentando.has(postId)) return;
    _comentando.add(postId);
    try {
        const c = await apiFetch(`/social/posts/${postId}/comentarios`, {
            method: 'POST', body: JSON.stringify({ texto }) });
        input.value = '';
        document.getElementById('coments-lista-' + postId).insertAdjacentHTML('beforeend', _comentHtml(c));
        const cnt = document.getElementById('coment-count-' + postId);
        if (cnt) cnt.textContent = Number(cnt.textContent || 0) + 1;
        if (_postsCache[postId]) _postsCache[postId].comentarios_count = Number(cnt ? cnt.textContent : 1);
    } catch (e) { alert('No se pudo comentar: ' + (e.message || e)); }
    finally { _comentando.delete(postId); }
}
async function borrarComentario(comentId, btn) {
    if (!confirm('¿Eliminar este comentario?')) return;
    try {
        await apiFetch(`/social/comentarios/${comentId}`, { method: 'DELETE' });
        const el = document.getElementById('coment-' + comentId);
        const box = el?.closest('.post-comments');
        el?.remove();
        if (box) {
            const pid = box.id.replace('coments-', '');
            const cnt = document.getElementById('coment-count-' + pid);
            if (cnt) cnt.textContent = Math.max(0, Number(cnt.textContent || 1) - 1);
        }
    } catch (e) { alert('No se pudo eliminar: ' + (e.message || e)); }
}

// ── Fijar / desfijar (editores) ──────────────────────────────
async function toggleFijar(postId) {
    const p = _postsCache[postId];
    if (!p) return;
    try {
        await apiFetch(`/social/posts/${postId}/fijar`, {
            method: 'PATCH', body: JSON.stringify({ fijado: !p.fijado }) });
        cargarFeed(true);   // el post cambia de sección (fijados ↔ stream)
    } catch (e) { alert('No se pudo fijar: ' + (e.message || e)); }
}

// ── Modales de detalle (vistas / acuses) ─────────────────────
function _abrirLista(titulo, html) {
    document.getElementById('lista-title').textContent = titulo;
    document.getElementById('lista-body').innerHTML = html;
    document.getElementById('modal-lista').classList.add('open');
}
async function abrirVistas(postId) {
    try {
        const r = await api.get(`/social/posts/${postId}/vistas`);
        const filas = (r.usuarios || []).map(u =>
            `<div class="li"><span>${esc(u.username)}</span><span class="lf">${fmtFecha(u.creado_en)}</span></div>`).join('');
        _abrirLista(`👁 Vista por ${r.total}`, filas || '<div class="empty" style="padding:16px 0">Nadie la vio todavía.</div>');
    } catch (e) { alert('No se pudo cargar: ' + (e.message || e)); }
}
async function abrirAcuses(postId) {
    try {
        const r = await api.get(`/social/posts/${postId}/acuses`);
        const ok = (r.aceptaron || []).map(a =>
            `<div class="li"><span>✔ ${esc(a.username)}</span><span class="lf">${fmtFecha(a.creado_en)}</span></div>`).join('');
        const falta = (r.pendientes || []).map(u => `<div class="li"><span>${esc(u.username)}</span></div>`).join('');
        _abrirLista(`🚨 Acuses (${(r.aceptaron || []).length}/${r.audiencia_total})`,
            `<div class="lista-sub ok">Aceptaron (${(r.aceptaron || []).length})</div>` +
            (ok || '<div style="font-size:13px;color: var(--tx-4, #9ca3af);padding:4px">Nadie todavía.</div>') +
            `<div class="lista-sub falta">Pendientes (${(r.pendientes || []).length})</div>` +
            (falta || '<div style="font-size:13px;color: var(--tx-4, #9ca3af);padding:4px">Nadie pendiente 🎉</div>'));
    } catch (e) { alert('No se pudo cargar: ' + (e.message || e)); }
}

// ── Composer ─────────────────────────────────────────────────
function onFilesSel(files) {
    _composerFiles = _composerFiles.concat(Array.from(files));
    renderComposerAdj();
}
function renderComposerAdj() {
    document.getElementById('comp-adj').innerHTML = _composerFiles.map((f, i) =>
        `<span class="adj-chip">${esc(f.name)} <span class="x" onclick="quitarAdjComposer(${i})">✕</span></span>`).join('');
}
function quitarAdjComposer(i) { _composerFiles.splice(i, 1); renderComposerAdj(); }

function toggleCompFlag(btn, clase) {
    btn.classList.toggle(clase);
    if (clase === 'on-prio' && btn.classList.contains(clase)
        && !confirm('🚨 Una publicación PRIORITARIA aparece en primer plano al entrar al sistema y cada persona debe aceptarla para continuar. ¿Marcarla como prioritaria?')) {
        btn.classList.remove(clase);
    }
}

async function publicar() {
    const texto = document.getElementById('comp-texto').value.trim();
    const link = document.getElementById('comp-link').value.trim();
    if (!texto && !link && !_composerFiles.length) { alert('La publicación está vacía.'); return; }
    const btn = document.getElementById('btn-publicar');
    btn.disabled = true;
    try {
        const fd = new FormData();
        fd.append('contenido', texto);
        fd.append('enlace', link);
        let p, esFijado = false;
        if (_emp) {
            // Portal del empleado: publica al feed general del local elegido (sin flags ni menciones)
            const rid = document.getElementById('comp-rest').value;
            if (!rid) { alert('No estás asignado a ningún restaurante.'); return; }
            fd.append('restaurante_id', rid);
            _composerFiles.forEach(f => fd.append('files', f));
            p = await apiFetch('/empleado/social/posts', { method: 'POST', body: fd, token: getEmpToken() });
        } else {
            fd.append('grupo_id', _feedGrupoId ? String(_feedGrupoId) : '');
            const men = _mencionesEfectivas(_mencionSel, texto);
            fd.append('menciones_usuarios', JSON.stringify(men.usuarios));
            fd.append('menciones_roles', JSON.stringify(men.roles));
            esFijado = document.getElementById('comp-fijar').classList.contains('on-pin');
            const esPrio = document.getElementById('comp-prio').classList.contains('on-prio');
            fd.append('fijado', esFijado ? '1' : '');
            fd.append('prioritaria', esPrio ? '1' : '');
            _composerFiles.forEach(f => fd.append('files', f));
            p = await apiFetch('/social/posts', { method: 'POST', body: fd });
        }
        // limpiar y mostrar arriba
        document.getElementById('comp-texto').value = '';
        document.getElementById('comp-link').value = '';
        _composerFiles = []; renderComposerAdj();
        _mencionSel = [];
        document.getElementById('mention-box').style.display = 'none';
        document.getElementById('comp-fijar').classList.remove('on-pin');
        document.getElementById('comp-prio').classList.remove('on-prio');
        if (esFijado) { cargarFeed(true); return; }   // entra a la sección de fijadas
        const feed = document.getElementById('feed');
        if (feed.querySelector('.empty')) feed.innerHTML = '';
        feed.insertAdjacentHTML('afterbegin', renderPost(p));
        if (!_emp) _encolarVistas([p.id]);
    } catch (e) {
        alert('No se pudo publicar: ' + (e.message || e));
    } finally { btn.disabled = false; }
}

async function eliminarPost(k) {
    if (!confirm('¿Eliminar esta publicación?')) return;
    const p = _postsCache[k];
    if (!p) return;
    try {
        if (_emp) await apiFetch(`/empleado/social/posts/${p.restaurante_id}/${p.id}`, { method: 'DELETE', token: getEmpToken() });
        else await apiFetch(`/social/posts/${p.id}`, { method: 'DELETE' });
        document.getElementById('post-' + k)?.remove();
    } catch (e) { alert('No se pudo eliminar: ' + (e.message || e)); }
}

// ── Editar publicación ───────────────────────────────────────
let _editAdjuntos = [];
async function abrirEditar(k) {
    // Traer el post desde el feed cargado no guarda adjuntos completos; recargamos el feed item simple:
    // usamos los datos ya renderizados pidiendo de nuevo el feed sería costoso → guardamos en memoria al render.
    const p = _postsCache[k];
    if (!p) return;
    _editId = k;
    _editAdjuntos = (p.adjuntos || []).slice();
    document.getElementById('edit-texto').value = p.contenido || '';
    document.getElementById('edit-link').value = p.enlace || '';
    document.getElementById('edit-files').value = '';
    document.getElementById('edit-adjuntos').innerHTML = _editAdjuntos.length
        ? _editAdjuntos.map(a => `<label class="check-row"><input type="checkbox" value="${esc(a.public_id)}"> Quitar: ${esc(a.nombre)} (${a.tipo})</label>`).join('')
        : '<span style="font-size:12px;color: var(--tx-4, #9ca3af)">Sin adjuntos</span>';
    _editMenciones = [];   // solo se notifican las menciones agregadas en esta edición
    document.getElementById('edit-mention-box').style.display = 'none';
    // Flags 📌/🚨: solo editores los tocan (el autor común edita sin verlos)
    document.getElementById('edit-flags').style.display = _canModerar ? '' : 'none';
    if (_canModerar) {
        document.getElementById('edit-fijado').checked = !!p.fijado;
        document.getElementById('edit-prio').checked = !!p.prioritaria;
    }
    document.getElementById('modal-editar').classList.add('open');
}
async function guardarEdicion() {
    if (_editId == null) return;
    const texto = document.getElementById('edit-texto').value.trim();
    const quitar = [...document.querySelectorAll('#edit-adjuntos input:checked')].map(c => c.value);
    const fd = new FormData();
    fd.append('contenido', texto);
    fd.append('enlace', document.getElementById('edit-link').value.trim());
    fd.append('quitar', quitar.join(','));
    const men = _mencionesEfectivas(_editMenciones, texto);
    fd.append('menciones_usuarios', JSON.stringify(men.usuarios));
    fd.append('menciones_roles', JSON.stringify(men.roles));
    let cambioFijado = false;
    if (_canModerar) {
        const antes = _postsCache[_editId] || {};
        const f = document.getElementById('edit-fijado').checked;
        fd.append('fijado', f ? '1' : '0');
        fd.append('prioritaria', document.getElementById('edit-prio').checked ? '1' : '0');
        cambioFijado = f !== !!antes.fijado;
    }
    const nuevos = document.getElementById('edit-files').files;
    Array.from(nuevos).forEach(f => fd.append('files', f));
    try {
        const antes = _postsCache[_editId] || {};
        let p;
        if (_emp) p = await apiFetch(`/empleado/social/posts/${antes.restaurante_id}/${antes.id}`, { method: 'PATCH', body: fd, token: getEmpToken() });
        else p = await apiFetch(`/social/posts/${antes.id}`, { method: 'PATCH', body: fd });
        cerrarModal('modal-editar');
        if (cambioFijado) { _editId = null; cargarFeed(true); return; }   // cambia de sección
        const el = document.getElementById('post-' + _editId);
        if (el) el.outerHTML = renderPost(p);
        _editId = null;
    } catch (e) { alert('No se pudo guardar: ' + (e.message || e)); }
}

// ── Grupos (modal) ───────────────────────────────────────────
let _rolesDisp = [], _usuariosDisp = [], _grupoEdit = null;
async function _cargarRolesUsuarios() {
    if (!_rolesDisp.length) { try { _rolesDisp = await api.get('/roles'); } catch (e) { _rolesDisp = []; } }
    if (!_usuariosDisp.length) {
        try { _usuariosDisp = (await api.get('/auth/usuarios')).filter(u => u.rol !== 'admin'); }
        catch (e) { _usuariosDisp = []; }
    }
}
async function abrirGrupoModal(grupoId) {
    await _cargarRolesUsuarios();
    _grupoEdit = grupoId ? _grupos.find(g => g.id === grupoId) : null;
    document.getElementById('grupo-title').textContent = _grupoEdit ? 'Editar grupo' : 'Nuevo grupo';
    document.getElementById('grupo-nombre').value = _grupoEdit ? _grupoEdit.nombre : '';
    const rolesSel = new Set(_grupoEdit ? (_grupoEdit.roles || []) : []);
    const usrSel = new Set(_grupoEdit ? (_grupoEdit.usuarios || []) : []);
    document.getElementById('grupo-roles').innerHTML = _rolesDisp.map(r =>
        `<label class="check-row"><input type="checkbox" value="${esc(r.nombre)}" ${rolesSel.has(r.nombre) ? 'checked' : ''}> ${esc(r.nombre)}</label>`).join('')
        || '<span style="font-size:12px;color: var(--tx-4, #9ca3af)">Sin roles</span>';
    document.getElementById('grupo-usuarios').innerHTML = _usuariosDisp.map(u =>
        `<label class="check-row"><input type="checkbox" value="${u.id}" ${usrSel.has(u.id) ? 'checked' : ''}> ${esc(displayName(u))} <span style="color: var(--tx-4, #9ca3af)">(${esc(u.rol)})</span></label>`).join('')
        || '<span style="font-size:12px;color: var(--tx-4, #9ca3af)">Sin usuarios</span>';
    document.getElementById('grupo-del').style.display = _grupoEdit ? '' : 'none';
    document.getElementById('modal-grupo').classList.add('open');
}
async function guardarGrupo() {
    const nombre = document.getElementById('grupo-nombre').value.trim();
    if (!nombre) { alert('Poné un nombre al grupo.'); return; }
    const roles = [...document.querySelectorAll('#grupo-roles input:checked')].map(c => c.value);
    const usuarios = [...document.querySelectorAll('#grupo-usuarios input:checked')].map(c => Number(c.value));
    const body = { nombre, roles, usuarios };
    // Sin bloqueo, un segundo clic creaba el grupo DOS veces (el POST no es idempotente y
    // el modal sigue vivo durante el await). publicar() en este mismo archivo ya lo hacía.
    const btn = document.getElementById('btn-guardar-grupo');
    if (btn) { if (btn.disabled) return; btn.disabled = true; }
    try {
        if (_grupoEdit) await apiFetch(`/social/grupos/${_grupoEdit.id}`, { method: 'PATCH', body: JSON.stringify(body) });
        else await apiFetch('/social/grupos', { method: 'POST', body: JSON.stringify(body) });
        cerrarModal('modal-grupo');
        await cargarGrupos();
    } catch (e) { alert('No se pudo guardar el grupo: ' + (e.message || e)); }
    finally { if (btn) btn.disabled = false; }
}
async function eliminarGrupo() {
    if (!_grupoEdit) return;
    if (!confirm(`¿Eliminar el grupo "${_grupoEdit.nombre}" y sus publicaciones?`)) return;
    try {
        await apiFetch(`/social/grupos/${_grupoEdit.id}`, { method: 'DELETE' });
        cerrarModal('modal-grupo');
        if (_feedGrupoId === _grupoEdit.id) _feedGrupoId = null;
        await cargarGrupos();
        cargarFeed(true);
    } catch (e) { alert('No se pudo eliminar: ' + (e.message || e)); }
}

function cerrarModal(id) { document.getElementById(id).classList.remove('open'); }

// Ocultar los dropdowns de menciones al salir del textarea (leve delay para el click)
document.getElementById('comp-texto').addEventListener('blur', () => {
    setTimeout(() => { document.getElementById('mention-box').style.display = 'none'; }, 150);
});
document.getElementById('edit-texto').addEventListener('blur', () => {
    setTimeout(() => { document.getElementById('edit-mention-box').style.display = 'none'; }, 150);
});

// ── Muro del empleado (read-only, agregado de sus locales) ───────────────────
async function _cargarFeedEmpleado() {
    const cont = document.getElementById('feed');
    cont.innerHTML = '<div class="empty">Cargando…</div>';
    let posts = [];
    try { posts = await apiFetch('/empleado/social?limit=30', { token: getEmpToken() }); }
    catch (e) { cont.innerHTML = '<div class="empty">No se pudo cargar el muro.</div>'; return; }
    cont.innerHTML = posts.length ? '' : '<div class="empty">Todavía no hay publicaciones.</div>';
    posts.forEach(p => cont.insertAdjacentHTML('beforeend', renderPost(p)));
    const mas = document.getElementById('btn-mas'); if (mas) mas.style.display = 'none';
}

// ── Init ─────────────────────────────────────────────────────
(async function () {
    if (_emp) {
        if (typeof volverACuenta === 'function') volverACuenta();
        document.getElementById('feeds-bar')?.style.setProperty('display', 'none');
        // El empleado publica desde el portal: elegir a qué local va la publicación
        try {
            const rests = await apiFetch('/empleado/mis-restaurantes', { token: getEmpToken() });
            const sel = document.getElementById('comp-rest');
            sel.innerHTML = (rests || []).map(r =>
                `<option value="${r.restaurante_id}">🏠 ${esc(r.restaurante || r.codigo)}</option>`).join('');
            if ((rests || []).length > 1) sel.style.display = '';
            if (!(rests || []).length) document.querySelector('.composer')?.style.setProperty('display', 'none');
        } catch (e) { document.querySelector('.composer')?.style.setProperty('display', 'none'); }
        await _cargarFeedEmpleado();
        const pe = new URLSearchParams(location.search);
        const postE = pe.get('post'), restE = pe.get('rest');
        if (postE) {
            const tid = 'post-' + (restE ? (restE + '-') : '') + postE;
            const el = document.getElementById(tid);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('post-highlight');
                setTimeout(() => el.classList.remove('post-highlight'), 2800);
            }
        }
        return;
    }
    if (_canModerar) {
        document.getElementById('comp-fijar').style.display = '';
        document.getElementById('comp-prio').style.display = '';
    }
    await cargarMenciones();
    await cargarGrupos();
    // Link directo a una publicación (desde una notificación): ?post=<id>&grupo=<id>
    const params = new URLSearchParams(location.search);
    const postParam = params.get('post');
    const grupoParam = params.get('grupo');
    if (grupoParam && _grupos.some(g => g.id === Number(grupoParam))) {
        _feedGrupoId = Number(grupoParam);
        renderFeedsBar();
    }
    await cargarFeed(true);
    if (postParam) {
        const el = document.getElementById('post-' + postParam);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('post-highlight');
            setTimeout(() => el.classList.remove('post-highlight'), 2800);
        }
    }
})();
</script>
