<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi portal</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:#f0f2f5; color:#1e293b; }
    .navbar { background:#1a1a2e; color:#fff; height:60px; display:flex; align-items:center; padding:0 28px; gap:14px; }
    .navbar h1 { font-size:18px; font-weight:700; flex:1; }
    .navbar .who { font-size:13px; color:#a5b4fc; }
    .btn-logout { background:transparent; border:1px solid #4f46e5; color:#a5b4fc; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
    .btn-logout:hover { background:#4f46e5; color:#fff; }
    .wrap { max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
    .sec-title { font-size:15px; font-weight:700; color:#1a1a2e; margin:0 0 6px; }
    .hint { font-size:13px; color:#94a3b8; margin-bottom:18px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
    .rcard { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:10px; }
    .rcard .rn { font-size:16px; font-weight:700; color:#1a1a2e; }
    .rcard .rc { font-size:12px; color:#94a3b8; }
    .rcard .rol { align-self:flex-start; background:#eef2ff; color:#4338ca; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; text-transform:capitalize; }
    .rcard button { margin-top:auto; background:#4f46e5; color:#fff; border:none; border-radius:9px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; }
    .rcard button:hover { background:#4338ca; }
    .empty { text-align:center; color:#94a3b8; padding:40px; background:#fff; border-radius:14px; border:1px solid #e5e7eb; }
</style>
</head>
<body>
    <div class="navbar">
        <span style="font-size:20px;">🙂</span>
        <h1>Mi portal</h1>
        <span class="who" id="who"></span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="wrap">
        <div class="sec-title">Tus restaurantes</div>
        <p class="hint">Entrá a un restaurante para acceder a lo que tu rol te habilita ahí.</p>
        <div class="cards" id="cards"><div class="empty">Cargando…</div></div>
    </div>

    <script src="js/api.js"></script>
    <script>
    requireAuth();
    const _user = getUser() || {};
    if (_user.rol !== 'empleado_cadena') { window.location.href = 'dashboard.html'; }
    document.getElementById('who').textContent = _user.nombre || _user.username || '';

    function _esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    let _rests = [];

    async function cargar(){
        const cont = document.getElementById('cards');
        try { _rests = await api.get('/empleado/mis-restaurantes'); }
        catch(e){ cont.innerHTML = '<div class="empty">No se pudieron cargar tus restaurantes.</div>'; return; }
        if (!_rests.length) { cont.innerHTML = '<div class="empty">Todavía no estás asignado a ningún restaurante. Pedile a tu encargado que te asigne.</div>'; return; }
        cont.innerHTML = _rests.map(r => `
            <div class="rcard">
                <div class="rn">${_esc(r.restaurante || r.codigo)}</div>
                <div class="rc">Código: ${_esc(r.codigo || '—')}</div>
                <span class="rol">${_esc(r.rol || '—')}</span>
                <button onclick="entrar(${r.restaurante_id}, this)">Entrar →</button>
            </div>`).join('');
    }

    async function entrar(id, btn){
        if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
        try {
            const resp = await api.post('/empleado/entrar/'+id, {});
            setToken(resp.access_token);
            setUser(resp);
            window.location.href = 'dashboard.html';
        } catch(e){
            alert('No se pudo entrar: ' + (e.message || e));
            if (btn) { btn.disabled = false; btn.textContent = 'Entrar →'; }
        }
    }

    cargar();
    </script>
</body>
</html>
