<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi portal</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:#f0f2f5; color:#1e293b; }
    .navbar { background:#1a1a2e; color:#fff; height:60px; display:flex; align-items:center; padding:0 28px; gap:14px; }
    .navbar h1 { font-size:18px; font-weight:700; flex:1; }
    .navbar .who { font-size:13px; color:#a5b4fc; }
    .btn-logout { background:transparent; border:1px solid #4f46e5; color:#a5b4fc; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
    .btn-logout:hover { background:#4f46e5; color:#fff; }
    .wrap { max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
    .sec-title { font-size:15px; font-weight:700; color:#1a1a2e; margin:0 0 6px; }
    .hint { font-size:13px; color:#94a3b8; margin-bottom:18px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
    .rcard { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:10px; }
    .rcard .rn { font-size:16px; font-weight:700; color:#1a1a2e; }
    .rcard .rc { font-size:12px; color:#94a3b8; }
    .rcard .rol { align-self:flex-start; background:#eef2ff; color:#4338ca; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; text-transform:capitalize; }
    .rcard button { margin-top:auto; background:#4f46e5; color:#fff; border:none; border-radius:9px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; }
    .rcard button:hover { background:#4338ca; }
    .empty { text-align:center; color:#94a3b8; padding:40px; background:#fff; border-radius:14px; border:1px solid #e5e7eb; }
    .psec { margin-top:28px; }
    .psec h2 { font-size:14px; font-weight:700; color:#1a1a2e; margin:0 0 10px; }
    .plist { background:#fff; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); overflow:hidden; }
    .prow { padding:11px 14px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; font-size:13.5px; }
    .prow:last-child { border-bottom:none; }
    .prow.unread { background:#faf5ff; }
    .prow .main { flex:1; min-width:0; }
    .prow .tt { font-weight:600; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .prow .sub { font-size:12px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rtag { background:#eef2ff; color:#4338ca; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:700; white-space:nowrap; }
    .turno { background:#eef2ff; color:#4338ca; border-radius:6px; padding:1px 7px; font-weight:700; font-size:12px; }
    .pempty { padding:22px; text-align:center; color:#cbd5e1; font-size:13px; }
    .wk { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .wk button { background:#fff; border:1px solid #e5e7eb; width:30px; height:30px; border-radius:7px; cursor:pointer; font-size:15px; }
    .wk button:hover { background:#eef2ff; }
    .wk .wl { font-size:13px; font-weight:600; color:#1a1a2e; min-width:200px; text-align:center; }
</style>
</head>
<body>
    <div class="navbar">
        <span style="font-size:20px;">🙂</span>
        <h1>Mi portal</h1>
        <span class="who" id="who"></span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="wrap">
        <div class="sec-title">Tus restaurantes</div>
        <p class="hint">Entrá a un restaurante para acceder a lo que tu rol te habilita ahí.</p>
        <div class="cards" id="cards"><div class="empty">Cargando…</div></div>

        <div class="psec">
            <h2>✉️ Mis mensajes</h2>
            <div class="plist" id="msg-list"><div class="pempty">Cargando…</div></div>
        </div>

        <div class="psec">
            <h2>🗓️ Mis horarios</h2>
            <div class="wk">
                <button onclick="cambiarSemana(-1)" title="Semana anterior">‹</button>
                <span class="wl" id="wk-label">—</span>
                <button onclick="cambiarSemana(1)" title="Semana siguiente">›</button>
            </div>
            <div class="plist" id="hor-list"><div class="pempty">Cargando…</div></div>
        </div>

        <div class="psec">
            <h2>🕐 Mis fichajes recientes</h2>
            <div class="plist" id="fic-list"><div class="pempty">Cargando…</div></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    requireAuth();
    const _user = getUser() || {};
    if (_user.rol !== 'empleado_cadena') { window.location.href = 'dashboard.html'; }
    document.getElementById('who').textContent = _user.nombre || _user.username || '';

    function _esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    let _rests = [];

    async function cargar(){
        const cont = document.getElementById('cards');
        try { _rests = await api.get('/empleado/mis-restaurantes'); }
        catch(e){ cont.innerHTML = '<div class="empty">No se pudieron cargar tus restaurantes.</div>'; return; }
        if (!_rests.length) { cont.innerHTML = '<div class="empty">Todavía no estás asignado a ningún restaurante. Pedile a tu encargado que te asigne.</div>'; return; }
        cont.innerHTML = _rests.map(r => `
            <div class="rcard">
                <div class="rn">${_esc(r.restaurante || r.codigo)}</div>
                <div class="rc">Código: ${_esc(r.codigo || '—')}</div>
                <span class="rol">${_esc(r.rol || '—')}</span>
                <button onclick="entrar(${r.restaurante_id}, this)">Entrar →</button>
            </div>`).join('');
    }

    async function entrar(id, btn){
        if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
        try {
            const resp = await api.post('/empleado/entrar/'+id, {});
            setToken(resp.access_token);
            setUser(resp);
            window.location.href = 'dashboard.html';
        } catch(e){
            alert('No se pudo entrar: ' + (e.message || e));
            if (btn) { btn.disabled = false; btn.textContent = 'Entrar →'; }
        }
    }

    // ── Portal común: mensajes / horarios / fichajes ──
    const _DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const _MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    function _fmtD(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function _semana(off){ const h=new Date(); h.setHours(0,0,0,0); const ds=h.getDay()===0?6:h.getDay()-1; const lun=new Date(h); lun.setDate(h.getDate()-ds+off*7); const dom=new Date(lun); dom.setDate(lun.getDate()+6); return {lun,dom}; }
    function _dt(ts){ if(!ts) return null; const d=new Date(String(ts).replace(' ','T')); return isNaN(d.getTime())?null:d; }
    function _fmtDT(ts){ const d=_dt(ts); if(!d) return '—'; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function _hm(ts){ const d=_dt(ts); if(!d) return '—'; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

    async function cargarMensajes(){
        const el=document.getElementById('msg-list');
        let list=[]; try{ list=await api.get('/empleado/mensajes'); }catch(e){ el.innerHTML='<div class="pempty">No se pudo cargar.</div>'; return; }
        if(!list.length){ el.innerHTML='<div class="pempty">No tenés mensajes.</div>'; return; }
        el.innerHTML=list.slice(0,30).map(m=>`<div class="prow ${m.leido?'':'unread'}">
            <div class="main"><div class="tt">${_esc(m.asunto||'(sin asunto)')}</div>
              <div class="sub">De ${_esc(m.de_username||'Sistema')} · ${_fmtDT(m.creado_en)}</div></div>
            <span class="rtag">${_esc(m.restaurante||'')}</span></div>`).join('');
    }

    let _wkOff=0;
    function cambiarSemana(d){ _wkOff+=d; cargarHorarios(); }
    async function cargarHorarios(){
        const el=document.getElementById('hor-list'); const wk=_semana(_wkOff);
        document.getElementById('wk-label').textContent=`${wk.lun.getDate()} ${_MES[wk.lun.getMonth()]} – ${wk.dom.getDate()} ${_MES[wk.dom.getMonth()]}`;
        let list=[]; try{ list=await api.get(`/empleado/horarios?desde=${_fmtD(wk.lun)}&hasta=${_fmtD(wk.dom)}`); }catch(e){ el.innerHTML='<div class="pempty">No se pudo cargar.</div>'; return; }
        if(!list.length){ el.innerHTML='<div class="pempty">Sin turnos publicados esta semana.</div>'; return; }
        list.sort((a,b)=> (a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0));
        el.innerHTML=list.map(s=>{
            const d=new Date(s.fecha+'T00:00:00'); const dn=_DIAS[d.getDay()===0?6:d.getDay()-1];
            const fr=(s.franjas||[]).map(f=>`<span class="turno">${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}</span>`).join(' ');
            return `<div class="prow"><div class="main"><div class="tt">${dn} ${d.getDate()}/${d.getMonth()+1} &nbsp; ${fr||'<span style="color:#cbd5e1">Libre</span>'}</div>
              ${s.rol_turno?`<div class="sub">${_esc(s.rol_turno)}${s.break_mins?` · descanso ${s.break_mins}m`:''}</div>`:''}</div>
              <span class="rtag">${_esc(s.restaurante||'')}</span></div>`;
        }).join('');
    }

    async function cargarFichajes(){
        const el=document.getElementById('fic-list');
        let list=[]; try{ list=await api.get('/empleado/fichajes'); }catch(e){ el.innerHTML='<div class="pempty">No se pudo cargar.</div>'; return; }
        if(!list.length){ el.innerHTML='<div class="pempty">Sin fichajes registrados.</div>'; return; }
        el.innerHTML=list.slice(0,40).map(f=>`<div class="prow"><div class="main">
            <div class="tt">${_fmtDT(f.ts_entrada)} → ${f.activo?'<span style="color:#16a34a">en curso</span>':_hm(f.ts_salida)}</div></div>
            <span class="rtag">${_esc(f.restaurante||'')}</span></div>`).join('');
    }

    cargar();
    cargarMensajes();
    cargarHorarios();
    cargarFichajes();
    </script>
</body>
</html>
