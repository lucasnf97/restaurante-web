<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Mis horarios</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-brand { font-size:18px; font-weight:700; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

.content { margin-top:60px; padding:24px 32px; max-width:820px; }
.page-header { margin-bottom:18px; }
.page-header h2 { font-size:22px; font-weight:700; color:#1a1a2e; }
.page-header p  { font-size:13px; color:#9ca3af; margin-top:4px; }

.weekbar {
    display:flex; align-items:center; justify-content:space-between;
    background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.06);
    padding:10px 14px; margin-bottom:16px;
}
.weekbar .rango { font-size:14.5px; font-weight:700; color:#1a1a2e; }
.navbtn {
    background:#eef2ff; color:#4338ca; border:none; border-radius:8px;
    padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
}
.navbtn:hover { background:#e0e7ff; }
.navbtn.hoy { background:#4f46e5; color:white; }

.day {
    background:white; border-radius:10px; box-shadow:0 1px 5px rgba(0,0,0,.05);
    margin-bottom:10px; padding:12px 16px; display:flex; gap:16px; align-items:flex-start;
}
.day.today { border:1.5px solid #4f46e5; }
.day .fecha { min-width:90px; }
.day .fecha .dow { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#9ca3af; font-weight:700; }
.day .fecha .num { font-size:20px; font-weight:700; color:#1a1a2e; }
.day .turnos { flex:1; display:flex; flex-direction:column; gap:8px; }
.turno {
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    background:#f8fafc; border:1px solid #eef0f3; border-radius:8px; padding:8px 12px;
}
.turno .horas { font-weight:700; color:#1a1a2e; font-size:14px; }
.resto-tag {
    display:inline-block; background:#eef2ff; color:#4338ca; font-weight:600;
    font-size:11.5px; padding:3px 9px; border-radius:999px;
}
.rol-tag { font-size:11.5px; color:#6b7280; }
.libre { color:#cbd5e1; font-size:13px; font-style:italic; padding-top:3px; }
.loading { padding:30px; text-align:center; color:#9ca3af; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</nav>

<div class="content">
    <div class="page-header">
        <h2>📋 Mis horarios</h2>
        <p>Tus turnos publicados en todos los restaurantes donde trabajás.</p>
    </div>

    <div class="weekbar">
        <button class="navbtn" onclick="semana(-1)">‹ Semana anterior</button>
        <span class="rango" id="rango">—</span>
        <span style="display:flex;gap:8px;">
            <button class="navbtn hoy" onclick="semana(0)">Hoy</button>
            <button class="navbtn" onclick="semana(1)">Semana siguiente ›</button>
        </span>
    </div>

    <div id="dias"><div class="loading">Cargando…</div></div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let _offset = 0;  // semanas respecto a la actual

function _esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function _iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// Lunes de la semana que contiene a `base`
function lunesDe(base){
    const d = new Date(base);
    const dow = (d.getDay()+6)%7;   // 0=lunes
    d.setDate(d.getDate()-dow);
    d.setHours(0,0,0,0);
    return d;
}

function semana(n){
    _offset = (n === 0) ? 0 : _offset + n;
    cargar();
}

async function cargar(){
    const cont = document.getElementById('dias');
    cont.innerHTML = '<div class="loading">Cargando…</div>';

    const lunes = lunesDe(new Date());
    lunes.setDate(lunes.getDate() + _offset*7);
    const domingo = new Date(lunes); domingo.setDate(domingo.getDate()+6);

    document.getElementById('rango').textContent =
        `${lunes.getDate()} ${MES[lunes.getMonth()]} – ${domingo.getDate()} ${MES[domingo.getMonth()]} ${domingo.getFullYear()}`;

    let rows = [];
    try {
        rows = await apiFetch(`/empleado/horarios?desde=${_iso(lunes)}&hasta=${_iso(domingo)}`, { token: getEmpToken() });
    } catch (e) {
        cont.innerHTML = `<div class="loading">No se pudieron cargar tus horarios: ${_esc(e.message||e)}</div>`;
        return;
    }

    // Agrupar por fecha
    const porDia = {};
    (rows || []).forEach(r => { (porDia[r.fecha] = porDia[r.fecha] || []).push(r); });

    const hoyIso = _iso(new Date());
    let html = '';
    for (let i=0; i<7; i++){
        const d = new Date(lunes); d.setDate(d.getDate()+i);
        const iso = _iso(d);
        const turnos = porDia[iso] || [];
        const turnosHtml = turnos.length ? turnos.map(t => {
            const horas = (t.franjas||[]).map(f => `${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}`).join(', ') || '—';
            const rol = t.rol_turno ? `<span class="rol-tag">· ${_esc(t.rol_turno)}</span>` : '';
            const brk = t.break_mins ? `<span class="rol-tag">· descanso ${t.break_mins}m</span>` : '';
            return `<div class="turno">
                <span class="resto-tag">${_esc(t.restaurante)}</span>
                <span class="horas">${horas}</span>${rol}${brk}
            </div>`;
        }).join('') : '<div class="libre">Libre</div>';
        html += `<div class="day${iso===hoyIso?' today':''}">
            <div class="fecha"><div class="dow">${DOW[i]}</div><div class="num">${d.getDate()}</div></div>
            <div class="turnos">${turnosHtml}</div>
        </div>`;
    }
    cont.innerHTML = html;
}

cargar();
</script>
</body>
</html>
