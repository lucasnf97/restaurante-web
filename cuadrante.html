<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Cuadrante de Personal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links { display:flex; gap:16px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

.content { margin-top:60px; padding:24px 32px; }

.page-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:24px;
}
.page-header h2 { font-size:22px; font-weight:700; color:#1a1a2e; }

.placeholder-card {
    background:white; border-radius:12px; padding:60px 32px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; text-align:center;
    min-height:320px;
}
.placeholder-icon { font-size:52px; }
.placeholder-title { font-size:20px; font-weight:700; color:#1a1a2e; }
.placeholder-desc  { font-size:14px; color:#9ca3af; max-width:400px; line-height:1.6; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="page-header">
        <h2>📋 Cuadrante de Personal</h2>
    </div>

    <div class="placeholder-card">
        <div class="placeholder-icon">📋</div>
        <div class="placeholder-title">Cuadrante de turnos</div>
        <div class="placeholder-desc">
            Acá se va a armar la grilla de turnos del personal.<br>
            Próximamente disponible.
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
    requireAuth();
</script>
</body>
</html>
