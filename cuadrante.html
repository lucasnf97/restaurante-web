<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Cuadrante de Personal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:200;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links  { display:flex; gap:16px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

/* ── View tabs ──────────────────────────────────────────────── */
.view-tabs {
    position:fixed; top:60px; left:0; right:0; z-index:160;
    background:white; border-bottom:1px solid #e5e7eb;
    display:flex; justify-content:center; align-items:center;
    gap:6px; height:50px; padding:0 16px;
}
.view-tab {
    background:none; border:1.5px solid #e0e0e0; border-radius:8px;
    padding:6px 18px; cursor:pointer; font-size:13px; font-weight:600;
    color:#6b7280; transition:all .15s; display:flex; align-items:center; gap:6px;
}
.view-tab:hover  { background:#f5f3ff; border-color:#c4b5fd; color:#6d28d9; }
.view-tab.active { background:#4f46e5; color:white; border-color:#4f46e5; }

/* ── Navigator bar ──────────────────────────────────────────── */
.nav-bar {
    position:fixed; top:110px; left:0; right:0; z-index:155;
    background:#f8f9fa; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:center;
    gap:14px; height:46px; padding:0 60px;
}
.nav-btn {
    background:white; border:1.5px solid #e0e0e0; border-radius:6px;
    width:30px; height:30px; cursor:pointer; font-size:15px; color:#4f46e5;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; flex-shrink:0;
}
.nav-btn:hover { background:#ede9fe; }
.nav-label {
    font-size:14px; font-weight:700; color:#1a1a2e;
    min-width:260px; text-align:center;
}
.btn-horarios {
    position:absolute; right:16px;
    background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.3);
    color:#6366f1; padding:5px 13px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:600;
    transition:all .15s; display:flex; align-items:center; gap:5px;
}
.btn-horarios:hover { background:rgba(99,102,241,.2); }

/* ── Content / grid wrapper ─────────────────────────────────── */
.content {
    margin-top:156px; /* 60+50+46 */
    padding:16px 20px;
}
.grid-wrap {
    overflow:auto;
    max-height:calc(100vh - 190px);
    border-radius:12px;
    border:1px solid #e5e7eb;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    background:white;
}

/* ── Cuadrante table ────────────────────────────────────────── */
.cq-table { border-collapse:collapse; }

/* Sticky header row */
.cq-table thead th {
    position:sticky; top:0; z-index:3;
    background:white; padding:0;
    border:1px solid #e5e7eb;
    white-space:nowrap;
}

/* Sticky time column */
.cq-table .tc {
    position:sticky; left:0; z-index:2;
    background:#f9fafb;
    width:56px; min-width:56px; max-width:56px;
    font-size:10px; font-weight:600; color:#9ca3af;
    text-align:right; padding:0 6px 0 0;
    border:1px solid #e5e7eb;
    white-space:nowrap;
}
/* Corner cell: top-left, highest z */
.cq-table thead th.tc { z-index:4; height:52px; }

/* Day header content */
.day-head {
    padding:5px 4px; min-width:76px;
    display:flex; flex-direction:column; align-items:center; gap:0;
}
.day-head .dn { font-size:10px; font-weight:700; text-transform:uppercase; color:#9ca3af; letter-spacing:.4px; }
.day-head .dd { font-size:16px; font-weight:800; color:#1a1a2e; line-height:1.2; }
.day-head .dm { font-size:10px; color:#9ca3af; }

/* Today column */
.col-hoy .day-head .dn { color:#6366f1; }
.col-hoy .day-head .dd { color:#4f46e5; }
.col-hoy.slot-active   { background:#fafafe; }
.col-hoy.slot-inactive { background:#f0f2ff; }

/* Weekend */
.col-wknd { background:#fafafa !important; }
.col-wknd .day-head .dd { color:#9ca3af; }

/* Slot cells */
.cq-table td {
    border:1px solid #efefef;
    height:26px; padding:0;
    position:relative;
    vertical-align:top;
}
.slot-inactive { background:#f3f4f6; }
.slot-active   { background:white; cursor:pointer; }
.slot-active:hover { background:#ede9fe; }

/* Hour row separator */
tr.hr-row td { border-top:1px solid #d1d5db !important; }

/* Blocked slot */
.slot-blocked {
    background:#fef2f2; cursor:pointer;
}
.slot-blocked:hover { background:#fee2e2; }
.blk-bar {
    position:absolute; left:0; top:0; bottom:0;
    width:3px; background:#ef4444;
}
.blk-lbl {
    font-size:9px; font-weight:600; color:#dc2626;
    padding:2px 4px 0 6px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
}

/* Month view: narrower columns */
body.view-mes .day-head { min-width:44px; }
body.view-mes .day-head .dn  { font-size:9px; }
body.view-mes .day-head .dd  { font-size:13px; }
body.view-mes .cq-table td { min-width:44px; }

/* 2-week: slightly narrower */
body.view-dos_semanas .day-head { min-width:62px; }
body.view-dos_semanas .cq-table td { min-width:62px; }

/* ── Horarios panel ─────────────────────────────────────────── */
.hp-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.2); z-index:400;
}
.hp-overlay.open { display:block; }
.horarios-panel {
    position:fixed; top:0; right:0; width:400px; height:100%;
    background:white; z-index:401;
    box-shadow:-4px 0 24px rgba(0,0,0,.15);
    display:flex; flex-direction:column;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.horarios-panel.open { transform:translateX(0); }
.hp-head {
    padding:16px 20px; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
}
.hp-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.hp-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.hp-body  { flex:1; overflow-y:auto; padding:12px 20px; }
.hp-footer { padding:14px 20px; border-top:1px solid #e5e7eb; flex-shrink:0; }
.btn-hp-save {
    width:100%; padding:10px; background:#4f46e5; color:white;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn-hp-save:hover { background:#4338ca; }

/* Day config blocks */
.dia-block { margin-bottom:10px; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; }
.dia-head {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:#f9fafb;
}
.dia-nombre { flex:1; font-size:13px; font-weight:700; color:#374151; }
.dia-body   { padding:8px 14px 12px; display:flex; flex-direction:column; gap:6px; }
.franja-row { display:flex; align-items:center; gap:6px; }
.franja-row input[type=time] {
    padding:5px 8px; border:1.5px solid #e0e0e0; border-radius:6px;
    font-size:13px; font-family:inherit; flex:1; min-width:0;
}
.franja-row input[type=time]:focus { outline:none; border-color:#4f46e5; }
.franja-sep { color:#9ca3af; font-size:12px; flex-shrink:0; }
.btn-del-franja {
    background:none; border:none; color:#ef4444; cursor:pointer;
    font-size:16px; line-height:1; padding:0 2px; flex-shrink:0;
}
.btn-add-franja {
    background:none; border:1.5px dashed #c4b5fd; border-radius:6px;
    color:#7c3aed; font-size:12px; font-weight:600;
    padding:4px 10px; cursor:pointer; width:fit-content; margin-top:2px;
}
.btn-add-franja:hover { background:#f5f3ff; }

/* Toggle switch */
.tsw { position:relative; width:34px; height:19px; flex-shrink:0; }
.tsw input { opacity:0; width:0; height:0; }
.tsl { position:absolute; inset:0; background:#d1d5db; border-radius:20px; cursor:pointer; transition:.2s; }
.tsl::before { content:''; position:absolute; width:13px; height:13px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .tsl { background:#4f46e5; }
input:checked + .tsl::before { transform:translateX(14px); }

/* ── Modals ─────────────────────────────────────────────────── */
.modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; z-index:500;
}
.modal-overlay.open { display:flex; }
.modal {
    background:white; border-radius:14px; width:100%;
    max-width:400px; padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.modal h3 { font-size:16px; font-weight:700; color:#1a1a2e; margin-bottom:20px; }
.form-group { margin-bottom:14px; }
.form-group label {
    display:block; font-size:11px; font-weight:700; color:#6b7280;
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px;
}
.form-group input, .form-group select {
    width:100%; padding:9px 13px; border:1.5px solid #e0e0e0;
    border-radius:8px; font-size:14px; font-family:inherit;
}
.form-group input:focus, .form-group select:focus { outline:none; border-color:#4f46e5; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.btn { padding:9px 18px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:700; transition:all .15s; }
.btn-primary   { background:#4f46e5; color:white; }
.btn-primary:hover { background:#4338ca; }
.btn-secondary { background:#f3f4f6; color:#6b7280; }
.btn-danger    { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; }
.btn-danger:hover { background:#fecaca; }

/* bloqueo info box */
.blk-info {
    background:#fef2f2; border:1px solid #fecaca;
    border-radius:10px; padding:14px; margin-bottom:4px;
    font-size:13px; color:#374151; line-height:1.8;
}

/* loading */
.grid-loading { text-align:center; padding:60px; color:#9ca3af; font-size:14px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<!-- View mode tabs -->
<div class="view-tabs">
    <button class="view-tab active" id="tab-semana"      onclick="setView('semana')">📅 Semana</button>
    <button class="view-tab"        id="tab-dos_semanas" onclick="setView('dos_semanas')">📅 2 Semanas</button>
    <button class="view-tab"        id="tab-mes"         onclick="setView('mes')">🗓️ Mes</button>
</div>

<!-- Navigator -->
<div class="nav-bar">
    <button class="nav-btn" onclick="navDate(-1)">◀</button>
    <span class="nav-label" id="nav-label">—</span>
    <button class="nav-btn" onclick="navDate(1)">▶</button>
    <button class="btn-horarios" onclick="abrirHorarios()">⚙️ Horarios</button>
</div>

<!-- Grid -->
<div class="content">
    <div class="grid-wrap" id="grid-wrap">
        <div class="grid-loading">Cargando cuadrante…</div>
    </div>
</div>

<!-- Horarios config panel -->
<div class="hp-overlay" id="hp-overlay" onclick="cerrarHorarios()"></div>
<div class="horarios-panel" id="horarios-panel">
    <div class="hp-head">
        <h3>⚙️ Horarios del restaurante</h3>
        <button class="hp-close" onclick="cerrarHorarios()">✕</button>
    </div>
    <div class="hp-body" id="hp-body"></div>
    <div class="hp-footer">
        <button class="btn-hp-save" onclick="guardarHorarios()">Guardar horarios</button>
    </div>
</div>

<!-- Modal: nuevo bloqueo -->
<div class="modal-overlay" id="modal-bloqueo">
    <div class="modal">
        <h3>🚫 Nuevo bloqueo</h3>
        <div class="form-group">
            <label>Fecha</label>
            <input type="text" id="nb-fecha-lbl" readonly
                   style="background:#f9fafb;color:#6b7280;cursor:default;">
        </div>
        <div class="form-group">
            <label>Alcance</label>
            <select id="nb-tipo" onchange="toggleNbTipo()">
                <option value="parcial">Horario específico</option>
                <option value="dia">Día completo</option>
            </select>
        </div>
        <div class="form-row" id="nb-horas">
            <div class="form-group">
                <label>Desde</label>
                <input type="time" id="nb-inicio" step="1800">
            </div>
            <div class="form-group">
                <label>Hasta</label>
                <input type="time" id="nb-fin" step="1800">
            </div>
        </div>
        <div class="form-group">
            <label>Motivo <span style="font-weight:400;color:#9ca3af;">(opcional)</span></label>
            <input type="text" id="nb-motivo" placeholder="Ej: Evento privado, mantenimiento…">
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal('modal-bloqueo')">Cancelar</button>
            <button class="btn btn-primary"   onclick="guardarBloqueo()">Crear bloqueo</button>
        </div>
    </div>
</div>

<!-- Modal: ver bloqueo -->
<div class="modal-overlay" id="modal-ver-bloqueo">
    <div class="modal">
        <h3>🚫 Bloqueo activo</h3>
        <div class="blk-info" id="vb-info"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal('modal-ver-bloqueo')">Cerrar</button>
            <button class="btn btn-danger"    onclick="eliminarBloqueoActual()">Eliminar bloqueo</button>
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

// ── Constantes ──────────────────────────────────────────────────
const DIAS_LARGO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_CORTO = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES      = ['enero','febrero','marzo','abril','mayo','junio',
                    'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C    = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// ── Estado ──────────────────────────────────────────────────────
let viewMode   = 'semana';
let anchorDate = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let horarios   = [];
let bloqueos   = [];
let bloqueoActualId = null;
let nbFecha    = null; // fecha del modal nuevo bloqueo

// ── Utilidades de fecha ─────────────────────────────────────────
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };

function getMondayOf(d) {
    const r = new Date(d);
    const j = r.getDay(); // 0=Dom
    r.setDate(r.getDate() - (j === 0 ? 6 : j - 1));
    return r;
}

function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isToday(d) {
    const t = new Date(); t.setHours(0,0,0,0);
    return d.getTime() === t.getTime();
}

// JS getDay() → API dia_semana (0=Lun … 6=Dom)
function jsDay2Api(d) { const j = d.getDay(); return j === 0 ? 6 : j - 1; }

function timeToMins(t) {
    if (!t) return 0;
    const [h, m] = String(t).slice(0,5).split(':').map(Number);
    return h * 60 + (m||0);
}
function minsToTime(m) {
    return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

// ── Vista ───────────────────────────────────────────────────────
function setView(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    // Ajustar body class para CSS de columnas
    document.body.className = document.body.className
        .replace(/\bview-\S+/g,'').trim();
    document.body.classList.add(`view-${mode}`);
    renderGrid();
}

// ── Navegación ──────────────────────────────────────────────────
function navDate(dir) {
    if (viewMode === 'mes') {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + dir, 1);
    } else if (viewMode === 'dos_semanas') {
        anchorDate = addDays(anchorDate, dir * 7);
    } else {
        anchorDate = addDays(anchorDate, dir);
    }
    renderGrid();
}

// ── Rango de días a mostrar ─────────────────────────────────────
function getDays() {
    if (viewMode === 'semana') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:7}, (_,i) => addDays(mon, i));
    }
    if (viewMode === 'dos_semanas') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:14}, (_,i) => addDays(mon, i));
    }
    // Mes: todos los días del mes de anchorDate
    const first = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
    const last  = new Date(anchorDate.getFullYear(), anchorDate.getMonth()+1, 0);
    const days = [];
    for (let d = new Date(first); d <= last; d = addDays(d,1)) days.push(new Date(d));
    return days;
}

// ── Rango horario del grid ──────────────────────────────────────
function getGridRange() {
    const activos = horarios.filter(h => h.activo && h.franjas?.length);
    if (!activos.length) return { start: 8*60, end: 24*60 };
    let mn = Infinity, mx = 0;
    activos.forEach(h => h.franjas.forEach(f => {
        mn = Math.min(mn, timeToMins(f.inicio));
        mx = Math.max(mx, timeToMins(f.fin));
    }));
    if (mn === Infinity) return { start: 8*60, end: 24*60 };
    return {
        start: Math.floor(mn/60)*60,
        end:   mx === 0 ? 24*60 : Math.min(Math.ceil(mx/60)*60, 24*60)
    };
}

// ── Estado de cada slot ─────────────────────────────────────────
function isActiveSlot(date, mins) {
    const h = horarios.find(x => x.dia_semana === jsDay2Api(date));
    if (!h?.activo || !h.franjas?.length) return false;
    return h.franjas.some(f => mins >= timeToMins(f.inicio) && mins < timeToMins(f.fin));
}

function getBlock(date, mins) {
    const ds = formatDate(date);
    return bloqueos.find(b => {
        if (b.fecha !== ds) return false;
        if (!b.hora_inicio && !b.hora_fin) return true;   // día completo
        return mins >= timeToMins(b.hora_inicio) && mins < timeToMins(b.hora_fin);
    }) || null;
}

// ── Label del navegador ─────────────────────────────────────────
function updateNavLabel() {
    const days = getDays();
    const a = days[0], z = days[days.length-1];
    let lbl;
    if (viewMode === 'semana') {
        lbl = `Semana del ${a.getDate()} al ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`;
    } else if (viewMode === 'dos_semanas') {
        const sameMon = a.getMonth() === z.getMonth();
        lbl = sameMon
            ? `${a.getDate()} — ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`
            : `${a.getDate()} ${MESES_C[a.getMonth()]} — ${z.getDate()} ${MESES_C[z.getMonth()]} ${z.getFullYear()}`;
    } else {
        lbl = `${MESES[anchorDate.getMonth()].charAt(0).toUpperCase() + MESES[anchorDate.getMonth()].slice(1)} ${anchorDate.getFullYear()}`;
    }
    document.getElementById('nav-label').textContent = lbl;
}

// ── Renderizado del grid ────────────────────────────────────────
function renderGrid() {
    updateNavLabel();
    const days  = getDays();
    const range = getGridRange();
    const slots = [];
    for (let t = range.start; t < range.end; t += 30) slots.push(t);

    let html = '<table class="cq-table"><thead><tr>';
    html += '<th class="tc"></th>';
    days.forEach(d => {
        const apiDay = jsDay2Api(d);
        const wknd   = d.getDay() === 0 || d.getDay() === 6;
        const hoy    = isToday(d);
        const cls    = [hoy ? 'col-hoy' : '', wknd ? 'col-wknd' : ''].filter(Boolean).join(' ');
        html += `<th class="${cls}">
            <div class="day-head">
                <span class="dn">${DIAS_CORTO[apiDay]}</span>
                <span class="dd">${d.getDate()}</span>
                <span class="dm">${MESES_C[d.getMonth()]}</span>
            </div></th>`;
    });
    html += '</tr></thead><tbody>';

    slots.forEach(slot => {
        const isHour  = slot % 60 === 0;
        const timeLbl = isHour ? minsToTime(slot) : '';
        html += `<tr class="${isHour ? 'hr-row' : ''}">`;
        html += `<td class="tc">${timeLbl}</td>`;

        days.forEach(d => {
            const hoy  = isToday(d);
            const wknd = d.getDay() === 0 || d.getDay() === 6;
            const act  = isActiveSlot(d, slot);
            const blk  = act ? getBlock(d, slot) : null;
            const ds   = formatDate(d);
            const colCls = (hoy ? 'col-hoy ' : '') + (wknd ? 'col-wknd ' : '');

            if (blk) {
                const lbl = (blk.motivo && slot === timeToMins(blk.hora_inicio||'00:00'))
                    ? `<span class="blk-lbl">${blk.motivo}</span>` : '';
                html += `<td class="${colCls}slot-blocked" onclick="verBloqueo(${blk.id})"
                             title="${blk.motivo||'Bloqueo'} · ${minsToTime(slot)}">
                             <div class="blk-bar"></div>${lbl}</td>`;
            } else if (act) {
                html += `<td class="${colCls}slot-active"
                             onclick="abrirNuevoBloqueo('${ds}',${slot})"
                             title="Clic para bloquear · ${minsToTime(slot)}"></td>`;
            } else {
                html += `<td class="${colCls}slot-inactive"></td>`;
            }
        });
        html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('grid-wrap').innerHTML = html;
}

// ── Modal nuevo bloqueo ─────────────────────────────────────────
function abrirNuevoBloqueo(dateStr, slotMins) {
    nbFecha = dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    document.getElementById('nb-fecha-lbl').value =
        `${DIAS_LARGO[jsDay2Api(d)]} ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}`;
    document.getElementById('nb-tipo').value    = 'parcial';
    document.getElementById('nb-inicio').value  = minsToTime(slotMins);
    document.getElementById('nb-fin').value     = minsToTime(Math.min(slotMins+30, 24*60));
    document.getElementById('nb-motivo').value  = '';
    document.getElementById('nb-horas').style.display = '';
    document.getElementById('modal-bloqueo').classList.add('open');
    setTimeout(() => document.getElementById('nb-motivo').focus(), 80);
}

function toggleNbTipo() {
    document.getElementById('nb-horas').style.display =
        document.getElementById('nb-tipo').value === 'dia' ? 'none' : '';
}

async function guardarBloqueo() {
    const tipo = document.getElementById('nb-tipo').value;
    const body = {
        fecha:       nbFecha,
        hora_inicio: tipo === 'dia' ? null : (document.getElementById('nb-inicio').value || null),
        hora_fin:    tipo === 'dia' ? null : (document.getElementById('nb-fin').value    || null),
        motivo:      document.getElementById('nb-motivo').value.trim() || null,
    };
    try {
        await api.post('/horarios/bloqueos', body);
        cerrarModal('modal-bloqueo');
        await cargarBloqueos();
        renderGrid();
    } catch(e) { alert('Error: ' + e.message); }
}

// ── Modal ver bloqueo ───────────────────────────────────────────
function verBloqueo(id) {
    const b = bloqueos.find(x => x.id === id);
    if (!b) return;
    bloqueoActualId = id;
    const d = new Date(b.fecha + 'T00:00:00');
    let html = `<strong>📅 ${DIAS_LARGO[jsDay2Api(d)]}, ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}</strong><br>`;
    if (b.hora_inicio && b.hora_fin) html += `🕐 ${b.hora_inicio} — ${b.hora_fin}<br>`;
    else html += `🕐 Día completo<br>`;
    if (b.motivo)     html += `📝 ${b.motivo}<br>`;
    if (b.creado_por) html += `👤 ${b.creado_por}`;
    document.getElementById('vb-info').innerHTML = html;
    document.getElementById('modal-ver-bloqueo').classList.add('open');
}

async function eliminarBloqueoActual() {
    if (!confirm('¿Eliminar este bloqueo?')) return;
    try {
        await api.delete(`/horarios/bloqueos/${bloqueoActualId}`);
        cerrarModal('modal-ver-bloqueo');
        await cargarBloqueos();
        renderGrid();
    } catch(e) { alert('Error: ' + e.message); }
}

// ── Panel de horarios ───────────────────────────────────────────
function abrirHorarios() {
    renderHorariosPanel();
    document.getElementById('horarios-panel').classList.add('open');
    document.getElementById('hp-overlay').classList.add('open');
}

function cerrarHorarios() {
    document.getElementById('horarios-panel').classList.remove('open');
    document.getElementById('hp-overlay').classList.remove('open');
}

function renderHorariosPanel() {
    document.getElementById('hp-body').innerHTML = DIAS_LARGO.map((nombre, i) => {
        const h = horarios.find(x => x.dia_semana === i) || { dia_semana:i, activo:false, franjas:[] };
        const franjasHtml = (h.franjas||[]).map((f, fi) => `
            <div class="franja-row" id="fr-${i}-${fi}">
                <input type="time" value="${f.inicio}" id="fi-${i}-${fi}" step="1800">
                <span class="franja-sep">—</span>
                <input type="time" value="${f.fin}"    id="ff-${i}-${fi}" step="1800">
                <button class="btn-del-franja" onclick="delFranja(${i},${fi})">✕</button>
            </div>`).join('');
        return `
        <div class="dia-block">
            <div class="dia-head">
                <span class="dia-nombre">${nombre}</span>
                <label class="tsw">
                    <input type="checkbox" id="da-${i}" ${h.activo?'checked':''}
                           onchange="toggleDia(${i})">
                    <span class="tsl"></span>
                </label>
            </div>
            <div class="dia-body" id="db-${i}" style="${h.activo?'':'display:none'}">
                <div id="franjas-${i}">${franjasHtml}</div>
                <button class="btn-add-franja" onclick="addFranja(${i})">+ Agregar franja</button>
            </div>
        </div>`;
    }).join('');
}

function toggleDia(i) {
    document.getElementById(`db-${i}`).style.display =
        document.getElementById(`da-${i}`).checked ? '' : 'none';
}

function addFranja(i) {
    const c = document.getElementById(`franjas-${i}`);
    const fi = c.children.length;
    const div = document.createElement('div');
    div.className = 'franja-row'; div.id = `fr-${i}-${fi}`;
    div.innerHTML = `
        <input type="time" value="09:00" id="fi-${i}-${fi}" step="1800">
        <span class="franja-sep">—</span>
        <input type="time" value="17:00" id="ff-${i}-${fi}" step="1800">
        <button class="btn-del-franja" onclick="delFranja(${i},${fi})">✕</button>`;
    c.appendChild(div);
}

function delFranja(i, fi) {
    document.getElementById(`fr-${i}-${fi}`)?.remove();
}

async function guardarHorarios() {
    const btn = document.querySelector('.btn-hp-save');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
        for (let i = 0; i < 7; i++) {
            const activo = document.getElementById(`da-${i}`)?.checked ?? false;
            const c = document.getElementById(`franjas-${i}`);
            const franjas = [];
            if (c) [...c.children].forEach(row => {
                const ins = row.querySelectorAll('input[type=time]');
                if (ins.length === 2 && ins[0].value && ins[1].value)
                    franjas.push({ inicio: ins[0].value, fin: ins[1].value });
            });
            await api.patch(`/horarios/${i}`, { activo, franjas });
        }
        await cargarHorarios();
        renderGrid();
        cerrarHorarios();
    } catch(e) {
        alert('Error al guardar: ' + e.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Guardar horarios';
    }
}

// ── Cerrar modales ──────────────────────────────────────────────
function cerrarModal(id) {
    document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ── API ─────────────────────────────────────────────────────────
async function cargarHorarios() {
    horarios = await api.get('/horarios/');
}

async function cargarBloqueos() {
    const raw = await api.get('/horarios/bloqueos');
    bloqueos = raw.map(b => ({
        ...b,
        fecha:       (b.fecha||'').split('T')[0],
        hora_inicio: b.hora_inicio ? String(b.hora_inicio).slice(0,5) : null,
        hora_fin:    b.hora_fin    ? String(b.hora_fin).slice(0,5)    : null,
    }));
}

// ── Init ────────────────────────────────────────────────────────
(async () => {
    await Promise.all([cargarHorarios(), cargarBloqueos()]);
    document.body.classList.add('view-semana');
    renderGrid();
})();
</script>
</body>
</html>
