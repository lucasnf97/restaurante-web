<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Horarios de Personal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; overflow:hidden; }

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:200;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links  { display:flex; gap:16px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

/* ── View tabs ──────────────────────────────────────────────── */
.view-tabs {
    position:fixed; top:60px; left:0; right:0; z-index:160;
    background:white; border-bottom:1px solid #e5e7eb;
    display:flex; justify-content:center; align-items:center;
    gap:6px; height:50px; padding:0 16px;
}
.view-tab {
    background:none; border:1.5px solid #e0e0e0; border-radius:8px;
    padding:6px 18px; cursor:pointer; font-size:13px; font-weight:600;
    color:#6b7280; transition:all .15s; display:flex; align-items:center; gap:6px;
}
.view-tab:hover  { background:#f5f3ff; border-color:#c4b5fd; color:#6d28d9; }
.view-tab.active { background:#4f46e5; color:white; border-color:#4f46e5; }

/* ── Navigator bar ──────────────────────────────────────────── */
.nav-bar {
    position:fixed; top:110px; left:0; right:0; z-index:155;
    background:#f8f9fa; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:center;
    gap:14px; height:46px; padding:0 60px;
}
.nav-btn {
    background:white; border:1.5px solid #e0e0e0; border-radius:6px;
    width:30px; height:30px; cursor:pointer; font-size:15px; color:#4f46e5;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; flex-shrink:0;
}
.nav-btn:hover { background:#ede9fe; }
.nav-label {
    font-size:14px; font-weight:700; color:#1a1a2e;
    min-width:260px; text-align:center;
}
.btn-horarios {
    position:absolute; right:16px;
    background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.3);
    color:#6366f1; padding:5px 13px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:600;
    transition:all .15s; display:flex; align-items:center; gap:5px;
}
.btn-horarios:hover { background:rgba(99,102,241,.2); }

/* ── Main layout ────────────────────────────────────────────── */
.main-layout {
    position:fixed; top:156px; left:0; right:0; bottom:0;
    display:flex; overflow:hidden;
}

/* ── User sidebar ───────────────────────────────────────────── */
.user-sidebar {
    width:210px; min-width:210px; flex-shrink:0;
    background:white; border-right:1px solid #e5e7eb;
    display:flex; flex-direction:column; overflow:hidden;
}
.us-header {
    padding:10px 12px 6px;
    border-bottom:1px solid #f3f4f6; flex-shrink:0;
}
.us-title {
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.8px; color:#6366f1; margin-bottom:4px;
}
.us-tip {
    font-size:10px; color:#9ca3af; line-height:1.3;
}
.us-list { flex:1; overflow-y:auto; padding:6px 0; }

/* Role section */
.role-head {
    padding:8px 12px 3px;
    font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.6px; color:#9ca3af;
}

/* User entry */
.u-entry {
    display:flex; align-items:center; gap:8px;
    padding:7px 12px; cursor:pointer; transition:background .12s;
    position:relative; user-select:none;
}
.u-entry:hover { background:#f5f3ff; }
.u-entry.selected { background:#ede9fe; }
.u-entry.selected .u-name { color:#4f46e5; font-weight:700; }

.u-avatar {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:white;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.u-name {
    flex:1; font-size:12px; font-weight:500; color:#374151;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.u-color-wrap {
    flex-shrink:0; position:relative; cursor:pointer;
    display:flex; align-items:center;
}
.u-color-dot {
    width:16px; height:16px; border-radius:50%;
    border:2px solid white; box-shadow:0 0 0 1px rgba(0,0,0,.2);
    cursor:pointer; transition:transform .15s;
}
.u-color-dot:hover { transform:scale(1.2); }
.u-color-inp {
    position:absolute; opacity:0; width:0; height:0; cursor:pointer;
}

/* Deselect hint */
.us-deselect {
    padding:8px 12px; border-top:1px solid #f3f4f6;
    font-size:11px; color:#9ca3af; text-align:center;
    cursor:pointer; transition:color .12s; flex-shrink:0;
}
.us-deselect:hover { color:#6366f1; }
.us-deselect.hidden { display:none; }

/* ── Grid area ──────────────────────────────────────────────── */
.grid-area {
    flex:1; overflow:auto; background:#f0f2f5;
    padding:10px;
    /* Prevent text selection during drag paint */
    user-select:none; -webkit-user-select:none;
}

/* ── Cuadrante table ────────────────────────────────────────── */
.cq-table {
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 1px 6px rgba(0,0,0,.07);
}
/* All views fill full width */
body.view-semana     .cq-table { width:100%; table-layout:fixed; }
body.view-dos_semanas .cq-table { width:100%; table-layout:fixed; }
body.view-mes         .cq-table { width:100%; table-layout:fixed; }

/* Sticky header */
.cq-table thead th {
    position:sticky; top:0; z-index:3;
    background:white; padding:0;
    border:1px solid #e5e7eb; white-space:nowrap;
}
/* Sticky time col */
.cq-table .tc {
    position:sticky; left:0; z-index:2;
    background:#f9fafb;
    width:52px; min-width:52px; max-width:52px;
    font-size:10px; font-weight:600; color:#9ca3af;
    text-align:right; padding:0 6px 0 0;
    border:1px solid #e5e7eb; white-space:nowrap;
}
.cq-table thead th.tc { z-index:4; height:52px; }

/* Day header */
.day-head {
    padding:5px 4px; min-width:70px;
    display:flex; flex-direction:column; align-items:center;
}
.day-head .dn { font-size:10px; font-weight:700; text-transform:uppercase; color:#9ca3af; letter-spacing:.4px; }
.day-head .dd { font-size:16px; font-weight:800; color:#1a1a2e; line-height:1.2; }
.day-head .dm { font-size:10px; color:#9ca3af; }

/* Today */
.col-hoy .day-head .dn { color:#6366f1; }
.col-hoy .day-head .dd { color:#4f46e5; }
.col-hoy.slot-active   { background:#fafafe !important; }

/* Weekend header */
.col-wknd .day-head .dd { color:#9ca3af; }

/* Cells */
.cq-table td {
    border:1px solid #efefef;
    height:26px; padding:0;
    position:relative; vertical-align:top;
}
.slot-inactive { background:#f3f4f6; }
.slot-active   { background:white; cursor:crosshair; }
.slot-active:hover { background:#faf9ff; }

/* Hour row */
tr.hr-row td { border-top:1px solid #d1d5db !important; }

/* 2-week / mes: smaller text so columns fit */
body.view-dos_semanas .day-head { min-width:0; }
body.view-dos_semanas .cq-table td { min-width:0; }
body.view-mes .day-head { min-width:0; }
body.view-mes .day-head .dn { font-size:9px; }
body.view-mes .day-head .dd { font-size:13px; }
body.view-mes .cq-table td { min-width:0; }

/* ── Cell color stripes ─────────────────────────────────────── */
.cell-colors {
    position:absolute; inset:0;
    display:flex; flex-direction:row; gap:1px; padding:1px;
    pointer-events:none;
}
.cell-colors > div { flex:1; border-radius:2px; }

/* ── Horarios panel ─────────────────────────────────────────── */
.hp-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.2); z-index:400;
}
.hp-overlay.open { display:block; }
.horarios-panel {
    position:fixed; top:0; right:0; width:400px; height:100%;
    background:white; z-index:401;
    box-shadow:-4px 0 24px rgba(0,0,0,.15);
    display:flex; flex-direction:column;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.horarios-panel.open { transform:translateX(0); }
.hp-head {
    padding:16px 20px; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.hp-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.hp-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.hp-body  { flex:1; overflow-y:auto; padding:12px 20px; }
.hp-footer { padding:14px 20px; border-top:1px solid #e5e7eb; flex-shrink:0; }
.btn-hp-save {
    width:100%; padding:10px; background:#4f46e5; color:white;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn-hp-save:hover { background:#4338ca; }

.dia-block { margin-bottom:10px; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; }
.dia-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#f9fafb; }
.dia-nombre { flex:1; font-size:13px; font-weight:700; color:#374151; }
.dia-body   { padding:8px 14px 12px; display:flex; flex-direction:column; gap:6px; }
.franja-row { display:flex; align-items:center; gap:6px; }
.franja-row input[type=time] {
    padding:5px 8px; border:1.5px solid #e0e0e0; border-radius:6px;
    font-size:13px; font-family:inherit; flex:1; min-width:0;
}
.franja-row input[type=time]:focus { outline:none; border-color:#4f46e5; }
.franja-sep { color:#9ca3af; font-size:12px; flex-shrink:0; }
.btn-del-franja {
    background:none; border:none; color:#ef4444; cursor:pointer;
    font-size:16px; line-height:1; padding:0 2px; flex-shrink:0;
}
.btn-add-franja {
    background:none; border:1.5px dashed #c4b5fd; border-radius:6px;
    color:#7c3aed; font-size:12px; font-weight:600;
    padding:4px 10px; cursor:pointer; width:fit-content; margin-top:2px;
}
.btn-add-franja:hover { background:#f5f3ff; }

.tsw { position:relative; width:34px; height:19px; flex-shrink:0; }
.tsw input { opacity:0; width:0; height:0; }
.tsl { position:absolute; inset:0; background:#d1d5db; border-radius:20px; cursor:pointer; transition:.2s; }
.tsl::before { content:''; position:absolute; width:13px; height:13px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .tsl { background:#4f46e5; }
input:checked + .tsl::before { transform:translateX(14px); }

/* loading */
.grid-loading { text-align:center; padding:60px; color:#9ca3af; font-size:14px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="view-tabs">
    <button class="view-tab active" id="tab-semana"      onclick="setView('semana')">📅 Semana</button>
    <button class="view-tab"        id="tab-dos_semanas" onclick="setView('dos_semanas')">📅 2 Semanas</button>
    <button class="view-tab"        id="tab-mes"         onclick="setView('mes')">🗓️ Mes</button>
</div>

<div class="nav-bar">
    <button class="nav-btn" onclick="navDate(-1)">◀</button>
    <span class="nav-label" id="nav-label">—</span>
    <button class="nav-btn" onclick="navDate(1)">▶</button>
    <button class="btn-horarios" onclick="abrirHorarios()">⚙️ Horarios</button>
</div>

<div class="main-layout">
    <!-- LEFT: User sidebar -->
    <div class="user-sidebar" id="user-sidebar">
        <div class="us-header">
            <div class="us-title">👥 Personal</div>
            <div class="us-tip">Selecciona un empleado y pinta la grilla</div>
        </div>
        <div class="us-list" id="us-list">
            <div class="grid-loading" style="padding:20px;font-size:12px;">Cargando…</div>
        </div>
        <div class="us-deselect hidden" id="us-deselect" onclick="deseleccionarUsuario()">
            ✕ Cancelar selección
        </div>
    </div>

    <!-- RIGHT: Grid -->
    <div class="grid-area" id="grid-area">
        <div id="grid-wrap">
            <div class="grid-loading">Cargando horarios…</div>
        </div>
    </div>
</div>

<!-- Horarios panel -->
<div class="hp-overlay" id="hp-overlay" onclick="cerrarHorarios()"></div>
<div class="horarios-panel" id="horarios-panel">
    <div class="hp-head">
        <h3>⚙️ Horarios del restaurante</h3>
        <button class="hp-close" onclick="cerrarHorarios()">✕</button>
    </div>
    <div class="hp-body" id="hp-body"></div>
    <div class="hp-footer">
        <button class="btn-hp-save" onclick="guardarHorarios()">Guardar horarios</button>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

// ── Constantes ──────────────────────────────────────────────────
const DIAS_LARGO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_CORTO = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES      = ['enero','febrero','marzo','abril','mayo','junio',
                    'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C    = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ROL_CFG    = {
    admin:   { label:'Administrador', icon:'👑' },
    gerente: { label:'Gerente',       icon:'📊' },
    empleado:{ label:'Personal',      icon:'👤' },
};
const PALETTE = ['#6366f1','#ef4444','#f59e0b','#10b981','#3b82f6',
                 '#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16'];

// ── Estado ──────────────────────────────────────────────────────
let viewMode      = 'semana';
let anchorDate    = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let horarios      = [];
let asignaciones  = {};  // { "YYYY-MM-DD": { slot_mins: [{id, usuario_id}] } }
let usuarios      = [];
let userColors    = {};  // { userId: "#hex" }
let selectedUserId = null;

// Drag-paint state
let isPainting  = false;
let paintMode   = 'add'; // 'add' | 'remove'
let painted     = new Set(); // keys painted in this gesture, to avoid re-painting same cell
let pendingChanges = []; // batched API calls

// ── Colores de usuario ──────────────────────────────────────────
function loadUserColors() {
    try { userColors = JSON.parse(localStorage.getItem('cq_user_colors') || '{}'); }
    catch { userColors = {}; }
}
function saveUserColors() {
    localStorage.setItem('cq_user_colors', JSON.stringify(userColors));
}
function getUserColor(uid) {
    if (!userColors[uid]) {
        userColors[uid] = PALETTE[(uid - 1) % PALETTE.length];
        saveUserColors();
    }
    return userColors[uid];
}
function setUserColor(uid, hex) {
    userColors[uid] = hex;
    saveUserColors();
    // Update avatar + dot in sidebar
    const entry = document.querySelector(`.u-entry[data-uid="${uid}"]`);
    if (entry) {
        entry.querySelector('.u-avatar').style.background = hex;
        entry.querySelector('.u-color-dot').style.background = hex;
    }
    // Re-render all cells for this user
    refreshAllCells();
}

// ── Utilidades de fecha ─────────────────────────────────────────
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };

function getMondayOf(d) {
    const r = new Date(d);
    const j = r.getDay();
    r.setDate(r.getDate() - (j === 0 ? 6 : j - 1));
    return r;
}
function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isToday(d) {
    const t = new Date(); t.setHours(0,0,0,0);
    return d.getTime() === t.getTime();
}
// JS getDay() (0=Dom) → API dia_semana (0=Lun…6=Dom)
function jsDay2Api(d) { const j = d.getDay(); return j === 0 ? 6 : j - 1; }
// isEndTime=true: "00:00"–"05:59" se interpreta como pasada medianoche (ej: cierre a las 02:00)
function timeToMins(t, isEndTime = false) {
    if (!t) return isEndTime ? 24 * 60 : 0;
    const [h, m] = String(t).slice(0, 5).split(':').map(Number);
    const mins = h * 60 + (m || 0);
    if (isEndTime && h < 6) return 24 * 60 + mins; // pasada medianoche
    return mins;
}
function minsToTime(m) {
    // Soporta tiempos >= 24h (ej: 25:30 → "01:30")
    const m2 = m % (24 * 60);
    return `${String(Math.floor(m2 / 60)).padStart(2,'0')}:${String(m2 % 60).padStart(2,'0')}`;
}

// ── Vista ───────────────────────────────────────────────────────
function setView(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    document.body.className = document.body.className.replace(/\bview-\S+/g,'').trim();
    document.body.classList.add(`view-${mode}`);
    renderGrid();
}

// ── Navegación ──────────────────────────────────────────────────
function navDate(dir) {
    if (viewMode === 'mes') {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + dir, 1);
    } else if (viewMode === 'dos_semanas') {
        anchorDate = addDays(anchorDate, dir * 7);
    } else {
        anchorDate = addDays(anchorDate, dir);
    }
    renderGrid();
}

// ── Rango de días ───────────────────────────────────────────────
function getDays() {
    if (viewMode === 'semana') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:7}, (_,i) => addDays(mon, i));
    }
    if (viewMode === 'dos_semanas') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:14}, (_,i) => addDays(mon, i));
    }
    const first = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
    const last  = new Date(anchorDate.getFullYear(), anchorDate.getMonth()+1, 0);
    const days  = [];
    for (let d = new Date(first); d <= last; d = addDays(d,1)) days.push(new Date(d));
    return days;
}

// ── Rango horario del grid ──────────────────────────────────────
function getGridRange() {
    const activos = horarios.filter(h => h.activo && h.franjas?.length);
    if (!activos.length) return { start:8*60, end:24*60 };
    let mn = Infinity, mx = 0;
    activos.forEach(h => h.franjas.forEach(f => {
        mn = Math.min(mn, timeToMins(f.inicio));
        mx = Math.max(mx, timeToMins(f.fin, true)); // hora fin puede ser pasada medianoche
    }));
    if (mn === Infinity) return { start:8*60, end:24*60 };
    return {
        start: Math.floor(mn / 60) * 60,
        end:   Math.min(Math.ceil(mx / 60) * 60, 26 * 60) // máximo hasta las 02:00 del día siguiente
    };
}

// ── Slot activo ─────────────────────────────────────────────────
function isActiveSlot(date, mins) {
    const apiDay = jsDay2Api(date);
    const h = horarios.find(x => x.dia_semana === apiDay);
    if (!h || !h.activo || !h.franjas || !h.franjas.length) return false;
    return h.franjas.some(f => mins >= timeToMins(f.inicio) && mins < timeToMins(f.fin, true));
}

// ── Nav label ───────────────────────────────────────────────────
function updateNavLabel() {
    const days = getDays();
    const a = days[0], z = days[days.length-1];
    let lbl;
    if (viewMode === 'semana') {
        lbl = `Semana del ${a.getDate()} al ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`;
    } else if (viewMode === 'dos_semanas') {
        lbl = a.getMonth() === z.getMonth()
            ? `${a.getDate()} — ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`
            : `${a.getDate()} ${MESES_C[a.getMonth()]} — ${z.getDate()} ${MESES_C[z.getMonth()]} ${z.getFullYear()}`;
    } else {
        const m = MESES[anchorDate.getMonth()];
        lbl = m.charAt(0).toUpperCase() + m.slice(1) + ' ' + anchorDate.getFullYear();
    }
    document.getElementById('nav-label').textContent = lbl;
}

// ── Render cell colors HTML ─────────────────────────────────────
function cellColorsHTML(dateStr, slotMins) {
    const list = asignaciones[dateStr]?.[slotMins] || [];
    if (!list.length) return '';
    const strips = list.map(a =>
        `<div style="background:${getUserColor(a.usuario_id)}"></div>`
    ).join('');
    return `<div class="cell-colors">${strips}</div>`;
}

// ── Render grid ─────────────────────────────────────────────────
async function renderGrid() {
    updateNavLabel();
    await cargarAsignaciones();

    const days  = getDays();
    const range = getGridRange();
    const slots = [];
    for (let t = range.start; t < range.end; t += 30) slots.push(t);

    let html = `<table class="cq-table"><thead><tr>`;
    html += `<th class="tc"></th>`;
    days.forEach(d => {
        const apiDay = jsDay2Api(d);
        const wknd   = d.getDay() === 0 || d.getDay() === 6;
        const hoy    = isToday(d);
        const cls    = [hoy?'col-hoy':'', wknd?'col-wknd':''].filter(Boolean).join(' ');
        html += `<th class="${cls}"><div class="day-head">
            <span class="dn">${DIAS_CORTO[apiDay]}</span>
            <span class="dd">${d.getDate()}</span>
            <span class="dm">${MESES_C[d.getMonth()]}</span>
        </div></th>`;
    });
    html += `</tr></thead><tbody>`;

    slots.forEach(slot => {
        const isHour = slot % 60 === 0;
        html += `<tr class="${isHour ? 'hr-row' : ''}">`;
        html += `<td class="tc">${isHour ? minsToTime(slot) : ''}</td>`;
        days.forEach(d => {
            const hoy    = isToday(d);
            const wknd   = d.getDay() === 0 || d.getDay() === 6;
            const active = isActiveSlot(d, slot);
            const ds     = formatDate(d);
            const colCls = [(hoy?'col-hoy':''), (wknd?'col-wknd':'')].filter(Boolean).join(' ');
            if (active) {
                html += `<td class="${colCls} slot-active" data-date="${ds}" data-slot="${slot}">
                             ${cellColorsHTML(ds, slot)}</td>`;
            } else {
                html += `<td class="${colCls} slot-inactive"></td>`;
            }
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('grid-wrap').innerHTML = html;
}

// ── Update single cell DOM ──────────────────────────────────────
function updateCellDOM(dateStr, slotMins) {
    const td = document.querySelector(`td[data-date="${dateStr}"][data-slot="${slotMins}"]`);
    if (!td) return;
    const list = asignaciones[dateStr]?.[slotMins] || [];
    let colDiv = td.querySelector('.cell-colors');
    if (list.length === 0) {
        colDiv?.remove();
    } else {
        if (!colDiv) {
            colDiv = document.createElement('div');
            colDiv.className = 'cell-colors';
            td.appendChild(colDiv);
        }
        colDiv.innerHTML = list.map(a =>
            `<div style="background:${getUserColor(a.usuario_id)}"></div>`
        ).join('');
    }
}

function refreshAllCells() {
    // Re-render all existing cell colors (e.g. after color change)
    document.querySelectorAll('td[data-date][data-slot]').forEach(td => {
        const dateStr  = td.dataset.date;
        const slotMins = parseInt(td.dataset.slot);
        const list = asignaciones[dateStr]?.[slotMins] || [];
        let colDiv = td.querySelector('.cell-colors');
        if (list.length === 0) {
            colDiv?.remove();
        } else {
            if (!colDiv) { colDiv = document.createElement('div'); colDiv.className = 'cell-colors'; td.appendChild(colDiv); }
            colDiv.innerHTML = list.map(a => `<div style="background:${getUserColor(a.usuario_id)}"></div>`).join('');
        }
    });
}

// ── Painting logic ──────────────────────────────────────────────
function applyPaint(dateStr, slotMins) {
    if (!selectedUserId) return;
    const key = `${dateStr}_${slotMins}`;
    if (painted.has(key)) return;
    painted.add(key);

    if (!asignaciones[dateStr]) asignaciones[dateStr] = {};
    if (!asignaciones[dateStr][slotMins]) asignaciones[dateStr][slotMins] = [];

    const list = asignaciones[dateStr][slotMins];
    const idx  = list.findIndex(a => a.usuario_id === selectedUserId);

    if (paintMode === 'add' && idx === -1) {
        // Optimistic: add with temporary id -1
        list.push({ id: -1, usuario_id: selectedUserId });
        updateCellDOM(dateStr, slotMins);
        pendingChanges.push({ action:'add', fecha:dateStr, slot_mins:slotMins, usuario_id:selectedUserId });
    } else if (paintMode === 'remove' && idx !== -1) {
        const removed = list.splice(idx, 1)[0];
        updateCellDOM(dateStr, slotMins);
        pendingChanges.push({ action:'remove', id:removed.id, fecha:dateStr, slot_mins:slotMins, usuario_id:selectedUserId });
    }
}

async function flushPending() {
    if (!pendingChanges.length) return;
    const changes = [...pendingChanges];
    pendingChanges = [];

    for (const ch of changes) {
        try {
            if (ch.action === 'add') {
                const res = await api.post('/cuadrante/asignaciones', {
                    fecha: ch.fecha, slot_mins: ch.slot_mins, usuario_id: ch.usuario_id
                });
                // Update temp id with real id
                const list = asignaciones[ch.fecha]?.[ch.slot_mins];
                if (list) {
                    const item = list.find(a => a.usuario_id === ch.usuario_id && a.id === -1);
                    if (item && res.id) item.id = res.id;
                }
            } else if (ch.action === 'remove' && ch.id && ch.id !== -1) {
                await api.delete(`/cuadrante/asignaciones/${ch.id}`);
            } else if (ch.action === 'remove') {
                // id was -1 (never saved), nothing to delete from API
            }
        } catch(e) {
            console.error('Error sync:', e);
        }
    }
}

// ── Grid events (event delegation) ──────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    const gridArea = document.getElementById('grid-area');

    gridArea.addEventListener('mousedown', e => {
        const td = e.target.closest('td.slot-active[data-date]');
        if (!td || !selectedUserId) return;
        e.preventDefault();
        isPainting = true;
        painted.clear();
        const dateStr  = td.dataset.date;
        const slotMins = parseInt(td.dataset.slot);
        const list = asignaciones[dateStr]?.[slotMins] || [];
        paintMode = list.some(a => a.usuario_id === selectedUserId) ? 'remove' : 'add';
        applyPaint(dateStr, slotMins);
    });

    gridArea.addEventListener('mousemove', e => {
        if (!isPainting || !selectedUserId) return;
        const td = e.target.closest('td.slot-active[data-date]');
        if (!td) return;
        applyPaint(td.dataset.date, parseInt(td.dataset.slot));
    });

    document.addEventListener('mouseup', () => {
        if (isPainting) {
            isPainting = false;
            flushPending();
        }
    });
});

// ── Sidebar de usuarios ─────────────────────────────────────────
function renderUserSidebar() {
    const grouped = {};
    usuarios.forEach(u => {
        const rol = u.rol || 'empleado';
        if (!grouped[rol]) grouped[rol] = [];
        grouped[rol].push(u);
    });

    const rolOrder = ['admin','gerente','empleado'];
    let html = '';
    rolOrder.forEach(rol => {
        if (!grouped[rol]?.length) return;
        const cfg = ROL_CFG[rol] || { label: rol, icon: '👤' };
        html += `<div class="role-head">${cfg.icon} ${cfg.label}</div>`;
        grouped[rol].forEach(u => {
            const color = getUserColor(u.id);
            const ini   = u.iniciales || u.username.slice(0,2).toUpperCase();
            const sel   = selectedUserId === u.id ? ' selected' : '';
            html += `
            <div class="u-entry${sel}" data-uid="${u.id}" onclick="selectUser(${u.id})">
                <div class="u-avatar" style="background:${color}">${ini}</div>
                <span class="u-name">${u.username}</span>
                <label class="u-color-wrap" onclick="event.stopPropagation()" title="Cambiar color">
                    <div class="u-color-dot" style="background:${color}"
                         onclick="this.nextElementSibling.click()"></div>
                    <input type="color" class="u-color-inp" value="${color}"
                           oninput="setUserColor(${u.id}, this.value)">
                </label>
            </div>`;
        });
    });

    document.getElementById('us-list').innerHTML = html || '<div style="padding:16px;font-size:12px;color:#9ca3af">Sin usuarios</div>';
}

function selectUser(uid) {
    if (selectedUserId === uid) {
        deseleccionarUsuario();
        return;
    }
    selectedUserId = uid;
    document.querySelectorAll('.u-entry').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.uid) === uid);
    });
    document.getElementById('us-deselect').classList.remove('hidden');
    document.getElementById('grid-area').style.cursor = 'crosshair';
}

function deseleccionarUsuario() {
    selectedUserId = null;
    document.querySelectorAll('.u-entry').forEach(el => el.classList.remove('selected'));
    document.getElementById('us-deselect').classList.add('hidden');
    document.getElementById('grid-area').style.cursor = '';
}

// ── Panel de horarios ───────────────────────────────────────────
function abrirHorarios() {
    renderHorariosPanel();
    document.getElementById('horarios-panel').classList.add('open');
    document.getElementById('hp-overlay').classList.add('open');
}
function cerrarHorarios() {
    document.getElementById('horarios-panel').classList.remove('open');
    document.getElementById('hp-overlay').classList.remove('open');
}

function renderHorariosPanel() {
    document.getElementById('hp-body').innerHTML = DIAS_LARGO.map((nombre, i) => {
        const h = horarios.find(x => x.dia_semana === i) || { dia_semana:i, activo:false, franjas:[] };
        const franjasHtml = (h.franjas||[]).map((f, fi) => `
            <div class="franja-row" id="fr-${i}-${fi}">
                <input type="time" value="${f.inicio}" id="fi-${i}-${fi}" step="1800">
                <span class="franja-sep">—</span>
                <input type="time" value="${f.fin}"    id="ff-${i}-${fi}" step="1800">
                <button class="btn-del-franja" onclick="delFranja(${i},${fi})">✕</button>
            </div>`).join('');
        return `
        <div class="dia-block">
            <div class="dia-head">
                <span class="dia-nombre">${nombre}</span>
                <label class="tsw">
                    <input type="checkbox" id="da-${i}" ${h.activo?'checked':''}
                           onchange="toggleDia(${i})">
                    <span class="tsl"></span>
                </label>
            </div>
            <div class="dia-body" id="db-${i}" style="${h.activo?'':'display:none'}">
                <div id="franjas-${i}">${franjasHtml}</div>
                <button class="btn-add-franja" onclick="addFranja(${i})">+ Agregar franja</button>
            </div>
        </div>`;
    }).join('');
}

function toggleDia(i) {
    document.getElementById(`db-${i}`).style.display =
        document.getElementById(`da-${i}`).checked ? '' : 'none';
}
function addFranja(i) {
    const c  = document.getElementById(`franjas-${i}`);
    const fi = c.children.length;
    const div = document.createElement('div');
    div.className = 'franja-row'; div.id = `fr-${i}-${fi}`;
    div.innerHTML = `
        <input type="time" value="09:00" id="fi-${i}-${fi}" step="1800">
        <span class="franja-sep">—</span>
        <input type="time" value="17:00" id="ff-${i}-${fi}" step="1800">
        <button class="btn-del-franja" onclick="delFranja(${i},${fi})">✕</button>`;
    c.appendChild(div);
}
function delFranja(i, fi) {
    document.getElementById(`fr-${i}-${fi}`)?.remove();
}

async function guardarHorarios() {
    const btn = document.querySelector('.btn-hp-save');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
        for (let i = 0; i < 7; i++) {
            const activo = document.getElementById(`da-${i}`)?.checked ?? false;
            const c = document.getElementById(`franjas-${i}`);
            const franjas = [];
            if (c) [...c.children].forEach(row => {
                const ins = row.querySelectorAll('input[type=time]');
                if (ins.length === 2 && ins[0].value && ins[1].value)
                    franjas.push({ inicio: ins[0].value, fin: ins[1].value });
            });
            await api.patch(`/horarios/${i}`, { activo, franjas });
        }
        await cargarHorarios();
        renderGrid();
        cerrarHorarios();
    } catch(e) {
        alert('Error al guardar: ' + e.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Guardar horarios';
    }
}

// ── API ─────────────────────────────────────────────────────────
async function cargarHorarios() {
    horarios = await api.get('/horarios/');
}

async function cargarUsuarios() {
    try {
        usuarios = await api.get('/auth/usuarios');
    } catch {
        // Si no tiene permiso de admin/gerente, cargamos sólo el propio usuario
        usuarios = [];
    }
}

async function cargarAsignaciones() {
    const days = getDays();
    const desde = formatDate(days[0]);
    const hasta  = formatDate(days[days.length-1]);
    try {
        const raw = await api.get(`/cuadrante/asignaciones?desde=${desde}&hasta=${hasta}`);
        asignaciones = {};
        raw.forEach(a => {
            const fecha = (a.fecha||'').split('T')[0];
            if (!asignaciones[fecha]) asignaciones[fecha] = {};
            if (!asignaciones[fecha][a.slot_mins]) asignaciones[fecha][a.slot_mins] = [];
            asignaciones[fecha][a.slot_mins].push({ id: a.id, usuario_id: a.usuario_id });
        });
    } catch(e) {
        console.error('Error cargando asignaciones:', e);
    }
}

// ── Init ─────────────────────────────────────────────────────────
(async () => {
    loadUserColors();
    await Promise.all([cargarHorarios(), cargarUsuarios()]);
    renderUserSidebar();
    document.body.classList.add('view-semana');
    await renderGrid();
})();
</script>
