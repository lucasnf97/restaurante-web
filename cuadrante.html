<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Horarios de Personal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; overflow:hidden; }

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:200;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links  { display:flex; gap:16px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

/* ── View tabs ──────────────────────────────────────────────── */
.view-tabs {
    position:fixed; top:60px; left:0; right:0; z-index:160;
    background:white; border-bottom:1px solid #e5e7eb;
    display:flex; justify-content:center; align-items:center;
    gap:6px; height:44px; padding:0 16px;
}

/* ── Filter bar ─────────────────────────────────────────────── */
.filter-bar {
    position:fixed; top:150px; left:0; right:0; z-index:150;
    background:white; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; gap:10px; height:46px; padding:0 16px;
}
.view-tab {
    background:none; border:1.5px solid #e0e0e0; border-radius:8px;
    padding:5px 18px; cursor:pointer; font-size:13px; font-weight:600;
    color:#6b7280; transition:all .15s;
}
.view-tab:hover  { background:#f5f3ff; border-color:#c4b5fd; color:#6d28d9; }
.view-tab.active { background:#4f46e5; color:white; border-color:#4f46e5; }
#filtro-nombre {
    padding:5px 10px; border:1.5px solid #e0e0e0; border-radius:7px;
    font-size:13px; width:190px; flex-shrink:0; outline:none;
    transition:border-color .15s;
}
#filtro-nombre:focus { border-color:#6366f1; }
.area-chips { display:flex; gap:6px; overflow-x:auto; align-items:center; flex:1; scrollbar-width:none; }
.area-chips::-webkit-scrollbar { display:none; }
.area-chip {
    padding:3px 12px; border-radius:20px; border:1.5px dashed #d1d5db; background:white;
    font-size:11px; font-weight:600; color:#6b7280;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
    transition:all .15s; user-select:none;
}
.area-chip:hover  { opacity:.85; }
.area-chip.active { border-style:solid; color:white; }

/* ── Nav bar ────────────────────────────────────────────────── */
.nav-bar {
    position:fixed; top:104px; left:0; right:0; z-index:155;
    background:#f8f9fa; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:center;
    gap:14px; height:46px; padding:0 16px;
}
.nav-btn {
    background:white; border:1.5px solid #e0e0e0; border-radius:6px;
    width:30px; height:30px; cursor:pointer; font-size:15px; color:#4f46e5;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; flex-shrink:0;
}
.nav-btn:hover { background:#ede9fe; }
.nav-label {
    font-size:14px; font-weight:700; color:#1a1a2e;
    min-width:260px; text-align:center;
}
.nav-right {
    position:absolute; right:16px;
    display:flex; gap:8px; align-items:center;
}
.btn-publicar {
    background:#10b981; border:none; color:white;
    padding:5px 13px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:600;
    transition:background .15s; display:none;
}
.btn-publicar:hover { background:#059669; }
.btn-publicar.has-draft { display:flex; align-items:center; gap:5px; }
.btn-leyenda {
    background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.3);
    color:#6366f1; padding:5px 13px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:600;
    transition:all .15s;
}
.btn-leyenda:hover { background:rgba(99,102,241,.2); }
.btn-horarios-rest {
    background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3);
    color:#059669; padding:5px 13px; border-radius:6px;
    cursor:pointer; font-size:12px; font-weight:600;
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
    transition:all .15s;
}
.btn-horarios-rest:hover { background:rgba(16,185,129,.2); }

/* ── Grid area ──────────────────────────────────────────────── */
.grid-area {
    position:fixed; top:196px; left:0; right:0; bottom:0;
    overflow:auto; background:#f0f2f5;
    padding:10px;
}

/* ── Table ──────────────────────────────────────────────────── */
.cq-table {
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 1px 6px rgba(0,0,0,.07);
    min-width:100%;
}
body.view-semana .cq-table { width:100%; table-layout:fixed; }

/* Sticky header */
.cq-table thead th {
    position:sticky; top:0; z-index:3;
    background:white;
    border:1px solid #e5e7eb;
    padding:0;
}
/* Sticky user column */
.th-user {
    position:sticky; left:0; z-index:5 !important;
    background:white;
    width:180px; min-width:180px;
}
.th-user-inner {
    padding:10px 12px;
    font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.8px; color:#6366f1;
}
.td-user {
    position:sticky; left:0; z-index:2;
    background:white;
    width:180px; min-width:180px;
    border-right:2px solid #e5e7eb;
    border-bottom:1px solid #f3f4f6;
    vertical-align:middle;
}
.td-user-inner {
    padding:8px 12px;
    display:flex; align-items:center; gap:8px;
}
.u-avatar-sm {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:white;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.u-info-col { display:flex; flex-direction:column; min-width:0; }
.u-name-sm {
    font-size:12px; font-weight:600; color:#1a1a2e;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.u-period-h {
    font-size:11px; color:#6366f1; font-weight:700; margin-top:2px;
    white-space:nowrap;
}
.u-area-tag {
    font-size:9px; color:#9ca3af; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Day header */
.th-day { min-width:90px; }
body.view-dos_semanas .th-day { min-width:70px; }
body.view-mes         .th-day { min-width:58px; }

.day-head-inner {
    padding:6px 4px;
    display:flex; flex-direction:column; align-items:center; gap:1px;
}
.dh-dn { font-size:9px; font-weight:700; text-transform:uppercase; color:#9ca3af; letter-spacing:.4px; }
.dh-dd { font-size:15px; font-weight:800; color:#1a1a2e; line-height:1.2; }
.dh-dm { font-size:9px; color:#9ca3af; }
.th-day.col-hoy .dh-dn { color:#6366f1; }
.th-day.col-hoy .dh-dd { color:#4f46e5; }
.th-day.col-hoy { background:#fafafe !important; }
.th-day.col-wknd .dh-dd { color:#9ca3af; }

/* Day cells */
.td-day {
    border:1px solid #f3f4f6;
    vertical-align:top;
    min-height:52px;
    padding:4px;
    position:relative;
}
.td-day.col-hoy { background:#fafafe; }
.td-day.col-wknd { background:#fafafa; }

/* Cell content */
.cell-content {
    width:100%; height:100%; min-height:44px;
    border-radius:6px; padding:4px 6px;
    display:flex; flex-direction:column; gap:2px;
    cursor:pointer;
    transition:filter .15s;
}
.cell-content:hover { filter:brightness(.96); }
.cell-content.draft { border-style:dashed !important; border-width:2px !important; }
.cell-content.published { border-style:solid !important; border-width:2px !important; }

.franja-tag {
    font-size:10px; font-weight:700; color:inherit;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.4;
}
.cell-total-h {
    font-size:10px; font-weight:600; opacity:.75;
    margin-top:2px;
}

/* Empty cell add button (editors only) */
.cell-add {
    width:100%; height:100%; min-height:44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px; border:1.5px dashed #e0e0e0;
    color:#d1d5db; font-size:18px; cursor:pointer;
    transition:all .15s;
}
.cell-add:hover {
    border-color:#a5b4fc; color:#a5b4fc; background:#f5f3ff;
}


/* Empty state */
.grid-empty {
    text-align:center; padding:60px;
    color:#9ca3af; font-size:14px;
    background:white; border-radius:10px;
}

/* loading */
.grid-loading { text-align:center; padding:60px; color:#9ca3af; font-size:14px; }

/* ── Schedule modal ─────────────────────────────────────────── */
.modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.35); z-index:500;
}
.modal-overlay.open { display:block; }
.modal-sched {
    display:none; position:fixed; z-index:501;
    top:50%; left:50%; transform:translate(-50%,-50%);
    background:white; border-radius:14px;
    box-shadow:0 8px 40px rgba(0,0,0,.22);
    width:360px; max-width:96vw;
    flex-direction:column; overflow:hidden;
}
.modal-sched.open { display:flex; }
.ms-head {
    padding:16px 20px 12px;
    border-bottom:1px solid #f3f4f6;
    display:flex; align-items:center; justify-content:space-between;
}
.ms-title {
    font-size:14px; font-weight:700; color:#1a1a2e;
    max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ms-close {
    background:none; border:none; font-size:20px; cursor:pointer; color:#9ca3af;
    flex-shrink:0; padding:0 4px;
}
.ms-close:hover { color:#374151; }
.ms-body { padding:14px 20px; display:flex; flex-direction:column; gap:8px; }
.ms-franja-row {
    display:flex; align-items:center; gap:8px;
}
.ms-time {
    flex:1; padding:6px 8px;
    border:1.5px solid #e0e0e0; border-radius:7px;
    font-size:13px; font-family:inherit; min-width:0;
    outline:none; transition:border-color .15s;
}
.ms-time:focus { border-color:#4f46e5; }
.ms-sep { color:#9ca3af; font-size:12px; flex-shrink:0; }
.ms-del-franja {
    background:none; border:none; color:#ef4444;
    cursor:pointer; font-size:16px; flex-shrink:0;
    padding:0 2px; line-height:1;
}
.ms-add-btn {
    background:none; border:1.5px dashed #c4b5fd; border-radius:7px;
    color:#7c3aed; font-size:12px; font-weight:600;
    padding:5px 12px; cursor:pointer; align-self:flex-start;
    transition:background .15s;
}
.ms-add-btn:hover { background:#f5f3ff; }
.ms-footer {
    padding:12px 20px 16px;
    border-top:1px solid #f3f4f6;
    display:flex; align-items:center; justify-content:space-between;
}
.ms-total { font-size:13px; font-weight:700; color:#6366f1; }
.ms-actions { display:flex; gap:8px; }
.ms-btn-elim {
    background:none; border:1.5px solid #fca5a5; color:#ef4444;
    padding:7px 14px; border-radius:7px; font-size:13px; font-weight:600;
    cursor:pointer; transition:all .15s;
}
.ms-btn-elim:hover { background:#fef2f2; }
.ms-btn-save {
    background:#4f46e5; color:white; border:none;
    padding:7px 18px; border-radius:7px; font-size:13px; font-weight:700;
    cursor:pointer; transition:background .15s;
}
.ms-btn-save:hover { background:#4338ca; }
.ms-btn-save:disabled { background:#a5b4fc; cursor:not-allowed; }

/* ── Sidebar horarios restaurante ───────────────────────────── */
.hr-backdrop {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.25); z-index:600;
}
.hr-backdrop.open { display:block; }
.hr-sidebar {
    position:fixed; top:0; right:0; bottom:0; z-index:601;
    width:340px; max-width:95vw;
    background:white; box-shadow:-4px 0 24px rgba(0,0,0,.14);
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .25s ease;
}
.hr-sidebar.open { transform:translateX(0); }
.hr-sidebar-head {
    padding:16px 18px 12px;
    border-bottom:1px solid #f3f4f6;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
}
.hr-sidebar-title { font-size:15px; font-weight:700; color:#1a1a2e; }
.hr-sidebar-close {
    background:none; border:none; font-size:20px; cursor:pointer; color:#9ca3af;
    padding:0 4px;
}
.hr-sidebar-close:hover { color:#374151; }
.hr-sidebar-body {
    flex:1; overflow-y:auto; padding:12px 16px;
    display:flex; flex-direction:column; gap:10px;
}
.hr-day-card {
    border:1.5px solid #f3f4f6; border-radius:10px;
    padding:10px 12px;
    background:#fafafa;
}
.hr-day-card.activo { background:#f0fdf4; border-color:#bbf7d0; }
.hr-day-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
}
.hr-day-name { font-size:13px; font-weight:700; color:#374151; }
.hr-toggle {
    position:relative; display:inline-block; width:36px; height:20px; flex-shrink:0;
}
.hr-toggle input { opacity:0; width:0; height:0; }
.hr-slider {
    position:absolute; inset:0; background:#d1d5db; border-radius:20px;
    cursor:pointer; transition:background .2s;
}
.hr-slider:before {
    content:''; position:absolute; width:14px; height:14px;
    left:3px; top:3px; background:white; border-radius:50%;
    transition:transform .2s;
}
.hr-toggle input:checked + .hr-slider { background:#10b981; }
.hr-toggle input:checked + .hr-slider:before { transform:translateX(16px); }
.hr-franja-row {
    display:flex; align-items:center; gap:6px; margin-bottom:5px;
}
.hr-time {
    flex:1; padding:4px 6px;
    border:1.5px solid #e0e0e0; border-radius:6px;
    font-size:12px; min-width:0; outline:none;
    transition:border-color .15s;
}
.hr-time:focus { border-color:#10b981; }
.hr-time:disabled { background:#f9fafb; color:#9ca3af; border-color:#f3f4f6; cursor:default; }
.hr-sep { color:#9ca3af; font-size:11px; flex-shrink:0; }
.hr-del {
    background:none; border:none; color:#fca5a5; cursor:pointer;
    font-size:14px; padding:0 2px; flex-shrink:0;
}
.hr-del:hover { color:#ef4444; }
.hr-add {
    background:none; border:1.5px dashed #bbf7d0; border-radius:6px;
    color:#059669; font-size:11px; font-weight:600;
    padding:3px 10px; cursor:pointer; margin-top:2px;
    transition:background .15s;
}
.hr-add:hover { background:#f0fdf4; }
.hr-save {
    margin-top:8px; width:100%;
    background:#10b981; color:white; border:none;
    padding:6px; border-radius:7px; font-size:12px; font-weight:700;
    cursor:pointer; transition:background .15s;
}
.hr-save:hover { background:#059669; }
.hr-save:disabled { background:#a7f3d0; cursor:not-allowed; }
.hr-readonly { font-size:12px; color:#6b7280; }

/* ── Modal referencia restaurante ───────────────────────────── */
.ms-rest-ref {
    background:#f8f9fa; border-radius:7px;
    padding:7px 10px; margin-bottom:2px;
    font-size:11px; color:#6b7280;
}
.ms-rest-ref strong { color:#374151; font-weight:700; }
.ms-rest-chip {
    display:inline-block; background:#dcfce7; color:#059669;
    border-radius:4px; padding:1px 6px; font-weight:600; margin:2px 2px 0 0;
}
.ms-rest-closed {
    display:inline-block; background:#fef2f2; color:#ef4444;
    border-radius:4px; padding:1px 6px; font-weight:600;
}

/* ── Leyenda de colores ─────────────────────────────────────── */
.leyenda-panel {
    display:none; position:fixed; z-index:501;
    bottom:20px; right:20px;
    background:white; border-radius:12px;
    box-shadow:0 4px 24px rgba(0,0,0,.16);
    padding:14px 18px; min-width:200px;
}
.leyenda-panel.open { display:block; }
.leyenda-title { font-size:11px; font-weight:800; text-transform:uppercase; color:#6366f1; letter-spacing:.8px; margin-bottom:10px; }
.leyenda-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.leyenda-chip {
    width:22px; height:14px; border-radius:3px; flex-shrink:0;
}
.leyenda-label { font-size:12px; color:#374151; }
.leyenda-sep { width:100%; height:1px; background:#f3f4f6; margin:6px 0; }
.leyenda-draft   { border:2px dashed #6b7280; background:transparent; }
.leyenda-pub     { border:2px solid #6b7280; background:transparent; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="view-tabs">
    <button class="view-tab active" id="tab-semana"      onclick="setView('semana')">📅 Semana</button>
    <button class="view-tab"        id="tab-dos_semanas" onclick="setView('dos_semanas')">📅 2 Semanas</button>
    <button class="view-tab"        id="tab-mes"         onclick="setView('mes')">🗓️ Mes</button>
</div>

<div class="nav-bar">
    <button class="nav-btn" onclick="navDate(-1)">◀</button>
    <span class="nav-label" id="nav-label">—</span>
    <button class="nav-btn" onclick="navDate(1)">▶</button>
    <div class="nav-right">
        <button class="btn-publicar" id="btn-publicar" onclick="publicarHorarios()">📤 Publicar horarios</button>
        <button class="btn-horarios-rest" onclick="toggleSidebarHorarios()">🕐 Horarios restaurante</button>
        <button class="btn-leyenda" onclick="toggleLeyenda()">🎨 Leyenda</button>
    </div>
</div>

<div class="filter-bar">
    <input type="text" id="filtro-nombre" placeholder="🔍 Buscar empleado…"
           oninput="onFiltroNombre(this.value)">
    <div class="area-chips" id="area-chips">
        <span style="font-size:11px;color:#9ca3af;">Cargando roles…</span>
    </div>
</div>

<div class="grid-area" id="grid-area">
    <div id="grid-wrap">
        <div class="grid-loading">Cargando horarios…</div>
    </div>
</div>

<!-- Schedule modal -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal()"></div>
<div class="modal-sched" id="modal-sched">
    <div class="ms-head">
        <span class="ms-title" id="ms-title">Horario</span>
        <button class="ms-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="ms-body" id="ms-body">
        <div id="ms-rest-ref" class="ms-rest-ref" style="display:none"></div>
        <div id="ms-franjas"></div>
        <button class="ms-add-btn" onclick="msAddFranja()">+ Agregar franja</button>
    </div>
    <div class="ms-footer">
        <span class="ms-total" id="ms-total"></span>
        <div class="ms-actions">
            <button class="ms-btn-elim" id="ms-btn-elim" style="display:none" onclick="msEliminar()">🗑 Eliminar</button>
            <button class="ms-btn-save" id="ms-btn-save" onclick="msGuardar()">Guardar</button>
        </div>
    </div>
</div>

<!-- Sidebar horarios restaurante -->
<div class="hr-backdrop" id="hr-backdrop" onclick="toggleSidebarHorarios()"></div>
<div class="hr-sidebar" id="hr-sidebar">
    <div class="hr-sidebar-head">
        <span class="hr-sidebar-title">🕐 Horarios del restaurante</span>
        <button class="hr-sidebar-close" onclick="toggleSidebarHorarios()">✕</button>
    </div>
    <div class="hr-sidebar-body" id="hr-sidebar-body">
        <div style="text-align:center;padding:30px;color:#9ca3af;font-size:13px;">Cargando…</div>
    </div>
</div>

<!-- Color legend -->
<div class="leyenda-panel" id="leyenda-panel">
    <div class="leyenda-title">Leyenda</div>
    <div id="leyenda-areas"></div>
    <div class="leyenda-sep"></div>
    <div class="leyenda-row">
        <div class="leyenda-chip leyenda-draft"></div>
        <span class="leyenda-label">Borrador (no publicado)</span>
    </div>
    <div class="leyenda-row">
        <div class="leyenda-chip leyenda-pub"></div>
        <span class="leyenda-label">Publicado</span>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

// ── Constantes ──────────────────────────────────────────────────
const DIAS_LARGO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_CORTO = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES      = ['enero','febrero','marzo','abril','mayo','junio',
                    'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C    = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Paleta de colores visualmente distintos (en orden de asignación)
const COLOR_PALETTE = [
    '#10b981', // esmeralda
    '#3b82f6', // azul
    '#f59e0b', // ámbar
    '#ec4899', // rosa
    '#14b8a6', // teal
    '#f97316', // naranja
    '#8b5cf6', // violeta
    '#84cc16', // lima
    '#ef4444', // rojo
    '#06b6d4', // cian
    '#a78bfa', // lavanda
    '#fb923c', // melocotón
];
const ROL_LABELS = {
    gerente:  'Gerencia',
    empleado: 'Personal',
    bartender:'Bartender',
    cocinero: 'Cocina',
    camarero: 'Sala',
};

// Asignación dinámica rol → color (se construye en initRoles)
let rolColorMap = {};

function getRolColor(rol) {
    return rolColorMap[rol] || '#9ca3af';
}
function getRolLabel(rol) {
    return ROL_LABELS[rol] || (rol ? rol.charAt(0).toUpperCase() + rol.slice(1) : 'Sin rol');
}
function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}

// ── Estado ──────────────────────────────────────────────────────
let viewMode         = 'semana';
let anchorDate       = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let usuarios         = [];
let rolesDisponibles = [];
let horariosCeldas   = [];
let horariosRest     = [];   // horarios del restaurante por día
let canEdit          = false;
let meUser           = {};
let filtroNombre     = '';
let rolesActivos     = null;

// Modal state
let modalState = { userId: null, fecha: null, entryId: null, diaSemana: null };

// ── Fechas ──────────────────────────────────────────────────────
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
function getMondayOf(d) {
    const r = new Date(d); const j = r.getDay();
    r.setDate(r.getDate() - (j === 0 ? 6 : j - 1)); return r;
}
function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isToday(d) { const t = new Date(); t.setHours(0,0,0,0); return d.getTime() === t.getTime(); }
function jsDay2Api(d) { const j = d.getDay(); return j === 0 ? 6 : j - 1; }

// ── Horas ───────────────────────────────────────────────────────
function timeToMins(t) {
    if (!t) return 0;
    const [h, m] = String(t).slice(0,5).split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
}
function calcTotalMins(franjas) {
    let total = 0;
    (franjas || []).forEach(f => {
        let s = timeToMins(f.inicio), e = timeToMins(f.fin);
        if (e <= s) e += 24 * 60;
        if (e > s) total += e - s;
    });
    return total;
}
function formatHours(mins) {
    if (!mins || mins <= 0) return '';
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h}h ${m}m` : `${h}h`;
}

// ── Vista ───────────────────────────────────────────────────────
function setView(mode) {
    viewMode = mode;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    document.body.className = document.body.className.replace(/\bview-\S+/g,'').trim();
    document.body.classList.add(`view-${mode}`);
    cargarYRenderizar();
}

function navDate(dir) {
    if (viewMode === 'mes') {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + dir, 1);
    } else if (viewMode === 'dos_semanas') {
        anchorDate = addDays(anchorDate, dir * 7);
    } else {
        anchorDate = addDays(anchorDate, dir * 7);
    }
    cargarYRenderizar();
}

function getDays() {
    if (viewMode === 'semana') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:7}, (_,i) => addDays(mon, i));
    }
    if (viewMode === 'dos_semanas') {
        const mon = getMondayOf(anchorDate);
        return Array.from({length:14}, (_,i) => addDays(mon, i));
    }
    const first = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
    const last  = new Date(anchorDate.getFullYear(), anchorDate.getMonth()+1, 0);
    const days  = [];
    for (let d = new Date(first); d <= last; d = addDays(d,1)) days.push(new Date(d));
    return days;
}

function updateNavLabel() {
    const days = getDays();
    const a = days[0], z = days[days.length-1];
    let lbl;
    if (viewMode === 'semana') {
        lbl = `Semana del ${a.getDate()} al ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`;
    } else if (viewMode === 'dos_semanas') {
        lbl = a.getMonth() === z.getMonth()
            ? `${a.getDate()} — ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`
            : `${a.getDate()} ${MESES_C[a.getMonth()]} — ${z.getDate()} ${MESES_C[z.getMonth()]} ${z.getFullYear()}`;
    } else {
        const m = MESES[anchorDate.getMonth()];
        lbl = m.charAt(0).toUpperCase() + m.slice(1) + ' ' + anchorDate.getFullYear();
    }
    document.getElementById('nav-label').textContent = lbl;
}

// ── Filtros ─────────────────────────────────────────────────────
function getVisibleUsers() {
    return usuarios.filter(u => {
        // Admin nunca aparece en la grilla
        if (u.rol === 'admin') return false;
        // Rol: set vacío = sin filtro (mostrar todos); con roles = mostrar solo esos
        if (rolesActivos.size > 0) {
            if (!rolesActivos.has(u.rol || '')) return false;
        }
        // Nombre: vacío = mostrar todos; con texto = filtrar
        if (filtroNombre && !u.username.toLowerCase().includes(filtroNombre.toLowerCase())) return false;
        return true;
    });
}

function onFiltroNombre(val) {
    filtroNombre = val.trim();
    renderGrid();
}

// ── Roles (chips de filtro) ──────────────────────────────────────
function initRoles() {
    // Admin nunca aparece en la grilla de horarios
    const set = new Set(usuarios.filter(u => u.rol !== 'admin').map(u => u.rol).filter(Boolean));
    const orden = ['gerente', 'empleado', 'bartender', 'cocinero', 'camarero'];
    rolesDisponibles = [
        ...orden.filter(r => set.has(r)),
        ...[...set].filter(r => !orden.includes(r)).sort(),
    ];
    // Asignar un color único a cada rol en orden — nunca dos iguales
    rolColorMap = {};
    rolesDisponibles.forEach((rol, i) => {
        rolColorMap[rol] = COLOR_PALETTE[i % COLOR_PALETTE.length];
    });
    rolesActivos = new Set();   // vacío = sin filtro (mostrar todos)
    renderRolChips();
    renderLeyenda();
}

function renderRolChips() {
    const c = document.getElementById('area-chips');
    if (!c) return;
    const html = rolesDisponibles.map(rol => {
        const active = rolesActivos.has(rol);
        const col    = getRolColor(rol);
        // activo  → fondo sólido en color del rol
        // inactivo → borde punteado en color del rol, texto en color del rol
        const style = active
            ? `background:${col};border-color:${col};color:white;`
            : `border-color:${col};color:${col};`;
        return `<span class="area-chip${active?' active':''}" onclick="toggleRol('${rol}')"
                      style="${style}">${getRolLabel(rol)}</span>`;
    }).join('');
    c.innerHTML = html || '<span style="font-size:11px;color:#9ca3af;">Sin roles</span>';
}

function toggleRol(rol) {
    if (rolesActivos.has(rol)) rolesActivos.delete(rol);
    else rolesActivos.add(rol);
    // Conjunto vacío → sin filtro (mostrar todos)
    renderRolChips();
    renderGrid();
}

function renderLeyenda() {
    const c = document.getElementById('leyenda-areas');
    if (!c) return;
    const html = rolesDisponibles.map(rol => {
        const col = getRolColor(rol);
        return `<div class="leyenda-row">
            <div class="leyenda-chip" style="background:${hexToRgba(col,.15)};border:2px solid ${col};border-radius:3px;"></div>
            <span class="leyenda-label">${getRolLabel(rol)}</span>
        </div>`;
    }).join('');
    c.innerHTML = html || '<div class="leyenda-row"><span class="leyenda-label" style="color:#9ca3af">Sin usuarios cargados</span></div>';
}

function toggleLeyenda() {
    document.getElementById('leyenda-panel').classList.toggle('open');
}

// ── Render grid ─────────────────────────────────────────────────
async function cargarYRenderizar() {
    updateNavLabel();
    const days = getDays();
    const desde = formatDate(days[0]);
    const hasta  = formatDate(days[days.length - 1]);
    try {
        horariosCeldas = await api.get(`/horarios-personal?desde=${desde}&hasta=${hasta}`);
    } catch(e) {
        horariosCeldas = [];
    }
    // Update publish button visibility
    if (canEdit) {
        const hasDraft = horariosCeldas.some(h => !h.publicado);
        const btn = document.getElementById('btn-publicar');
        btn.classList.toggle('has-draft', hasDraft);
    }
    renderGrid();
}

function renderGrid() {
    const days     = getDays();
    const visibles = getVisibleUsers();

    if (!visibles.length) {
        document.getElementById('grid-wrap').innerHTML =
            '<div class="grid-empty">No hay usuarios que mostrar.<br><small>Ajusta los filtros de rol o nombre.</small></div>';
        return;
    }

    // ── Header ────────────────────────────────────────────────
    let html = `<table class="cq-table"><thead><tr>`;
    html += `<th class="th-user"><div class="th-user-inner">👥 Personal</div></th>`;
    days.forEach(d => {
        const apiDay = jsDay2Api(d);
        const wknd   = d.getDay() === 0 || d.getDay() === 6;
        const hoy    = isToday(d);
        const cls    = ['th-day', hoy?'col-hoy':'', wknd?'col-wknd':''].filter(Boolean).join(' ');
        html += `<th class="${cls}">
            <div class="day-head-inner">
                <span class="dh-dn">${DIAS_CORTO[apiDay]}</span>
                <span class="dh-dd">${d.getDate()}</span>
                <span class="dh-dm">${MESES_C[d.getMonth()]}</span>
            </div></th>`;
    });
    html += `</tr></thead><tbody>`;

    // ── User rows ─────────────────────────────────────────────
    const dateSet = new Set(days.map(formatDate));
    visibles.forEach(u => {
        const color    = getRolColor(u.rol);
        const colorBg  = hexToRgba(color, 0.08);
        const ini      = u.iniciales || u.username.slice(0,2).toUpperCase();
        const periodMins = calcUserPeriodMins(u.id, dateSet);
        const periodH    = formatHours(periodMins);
        const rolLabel   = getRolLabel(u.rol);

        html += `<tr data-uid="${u.id}">`;
        html += `<td class="td-user">
            <div class="td-user-inner">
                <div class="u-avatar-sm" style="background:${color}">${ini}</div>
                <div class="u-info-col">
                    <span class="u-name-sm">${u.username}</span>
                    <span class="u-area-tag">${rolLabel}</span>
                    ${periodH ? `<span class="u-period-h">⏱ ${periodH}</span>` : '<span class="u-period-h" style="color:#d1d5db">Sin horas</span>'}
                </div>
            </div></td>`;

        days.forEach(d => {
            const dateStr = formatDate(d);
            const entry   = horariosCeldas.find(h =>
                h.usuario_id === u.id && (h.fecha || '').split('T')[0] === dateStr
            );
            const wknd = d.getDay() === 0 || d.getDay() === 6;
            const hoy  = isToday(d);
            const tdCls = ['td-day', hoy?'col-hoy':'', wknd?'col-wknd':''].filter(Boolean).join(' ');

            html += `<td class="${tdCls}">`;
            if (entry && entry.franjas && entry.franjas.length > 0) {
                const borderStyle = entry.publicado ? 'published' : 'draft';
                const totalMins   = calcTotalMins(entry.franjas);
                const franjasHtml = entry.franjas.map(f =>
                    `<div class="franja-tag">${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}</div>`
                ).join('');
                html += `<div class="cell-content ${borderStyle}"
                               style="border-color:${color};background:${colorBg};color:${color};"
                               data-uid="${u.id}" data-date="${dateStr}">
                    ${franjasHtml}
                    <div class="cell-total-h">${formatHours(totalMins)}</div>
                </div>`;
            } else if (canEdit) {
                html += `<div class="cell-add" data-uid="${u.id}" data-date="${dateStr}">+</div>`;
            }
            html += `</td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('grid-wrap').innerHTML = html;
}

// ── Helpers ─────────────────────────────────────────────────────
function calcUserPeriodMins(userId, dateSet) {
    let total = 0;
    horariosCeldas.forEach(h => {
        if (h.usuario_id === userId && dateSet.has((h.fecha||'').split('T')[0])) {
            total += calcTotalMins(h.franjas);
        }
    });
    return total;
}

// ── Grid click delegation ────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('grid-area').addEventListener('click', e => {
        if (!canEdit) return;
        const el = e.target.closest('[data-uid][data-date]');
        if (!el) return;
        abrirModal(parseInt(el.dataset.uid), el.dataset.date);
    });
});

// ── Modal ────────────────────────────────────────────────────────
function abrirModal(userId, dateStr) {
    const u = usuarios.find(x => x.id === userId);
    if (!u) return;

    const entry = horariosCeldas.find(h =>
        h.usuario_id === userId && (h.fecha||'').split('T')[0] === dateStr
    );

    const d       = new Date(dateStr + 'T00:00:00');
    const diaSem  = jsDay2Api(d);
    modalState = { userId, fecha: dateStr, entryId: entry?.id ?? null, diaSemana: diaSem };

    // Title
    const dn = DIAS_LARGO[diaSem];
    document.getElementById('ms-title').textContent =
        `${u.username} — ${dn} ${d.getDate()} ${MESES[d.getMonth()]}`;

    // Referencia horario restaurante
    renderModalRestRef(diaSem);

    // Franjas
    renderModalFranjas(entry?.franjas || [{ inicio:'09:00', fin:'17:00' }]);

    // Delete button
    document.getElementById('ms-btn-elim').style.display = entry ? '' : 'none';

    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-sched').classList.add('open');
}

function cerrarModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-sched').classList.remove('open');
}

function renderModalFranjas(franjas) {
    const c = document.getElementById('ms-franjas');
    c.innerHTML = franjas.map((f, i) => `
        <div class="ms-franja-row" id="mfr-${i}">
            <input type="time" class="ms-time ms-inicio" value="${f.inicio||'09:00'}" oninput="updateTotal()">
            <span class="ms-sep">—</span>
            <input type="time" class="ms-time ms-fin"   value="${f.fin||'17:00'}"   oninput="updateTotal()">
            <button class="ms-del-franja" onclick="this.closest('.ms-franja-row').remove();updateTotal()">✕</button>
        </div>`).join('');
    updateTotal();
}

function msAddFranja() {
    const c   = document.getElementById('ms-franjas');
    const div = document.createElement('div');
    div.className = 'ms-franja-row';
    div.innerHTML = `
        <input type="time" class="ms-time ms-inicio" value="09:00" oninput="updateTotal()">
        <span class="ms-sep">—</span>
        <input type="time" class="ms-time ms-fin"   value="17:00" oninput="updateTotal()">
        <button class="ms-del-franja" onclick="this.closest('.ms-franja-row').remove();updateTotal()">✕</button>`;
    c.appendChild(div);
    updateTotal();
}

function updateTotal() {
    let total = 0;
    document.querySelectorAll('.ms-franja-row').forEach(row => {
        const s = timeToMins(row.querySelector('.ms-inicio')?.value);
        let   e = timeToMins(row.querySelector('.ms-fin')?.value);
        if (e <= s) e += 24 * 60;
        if (e > s) total += e - s;
    });
    document.getElementById('ms-total').textContent = total > 0 ? `Total: ${formatHours(total)}` : '';
}

async function msGuardar() {
    const franjas = [];
    document.querySelectorAll('.ms-franja-row').forEach(row => {
        const inicio = row.querySelector('.ms-inicio')?.value;
        const fin    = row.querySelector('.ms-fin')?.value;
        if (inicio && fin) franjas.push({ inicio, fin });
    });

    const btn = document.getElementById('ms-btn-save');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
        if (franjas.length === 0 && modalState.entryId) {
            await api.delete(`/horarios-personal/${modalState.entryId}`);
        } else if (franjas.length > 0) {
            await api.post('/horarios-personal', {
                usuario_id: modalState.userId,
                fecha:      modalState.fecha,
                franjas,
            });
        }
        cerrarModal();
        await cargarYRenderizar();
    } catch(e) {
        alert('Error al guardar: ' + (e.message || e));
    } finally {
        btn.disabled = false; btn.textContent = 'Guardar';
    }
}

async function msEliminar() {
    if (!modalState.entryId) return;
    if (!confirm('¿Eliminar este horario?')) return;
    try {
        await api.delete(`/horarios-personal/${modalState.entryId}`);
        cerrarModal();
        await cargarYRenderizar();
    } catch(e) {
        alert('Error al eliminar: ' + (e.message || e));
    }
}

// ── Publicar ─────────────────────────────────────────────────────
async function publicarHorarios() {
    const days  = getDays();
    const desde = formatDate(days[0]);
    const hasta  = formatDate(days[days.length - 1]);
    const draft  = horariosCeldas.filter(h => !h.publicado).length;

    if (draft === 0) {
        alert('No hay horarios en borrador para publicar en este período.');
        return;
    }
    if (!confirm(`¿Publicar ${draft} horario(s)? Serán visibles para todos los empleados.`)) return;

    const btn = document.getElementById('btn-publicar');
    btn.textContent = 'Publicando…';
    try {
        const r = await api.post('/horarios-personal/publicar', { desde, hasta });
        await cargarYRenderizar();
    } catch(e) {
        alert('Error al publicar: ' + (e.message || e));
    } finally {
        btn.textContent = '📤 Publicar horarios';
    }
}

// ── Horarios restaurante (sidebar) ───────────────────────────────
function toggleSidebarHorarios() {
    const sidebar  = document.getElementById('hr-sidebar');
    const backdrop = document.getElementById('hr-backdrop');
    const open     = sidebar.classList.toggle('open');
    backdrop.classList.toggle('open', open);
    if (open) renderSidebarHorarios();
}

function getRestDia(dia) {
    return horariosRest.find(h => h.dia_semana === dia) || { activo: false, franjas: [] };
}

function renderSidebarHorarios() {
    const body = document.getElementById('hr-sidebar-body');
    if (!horariosRest.length) {
        body.innerHTML = '<div style="text-align:center;padding:30px;color:#9ca3af;font-size:13px;">Sin datos de horarios</div>';
        return;
    }
    body.innerHTML = DIAS_LARGO.map((nombre, idx) => {
        const h      = getRestDia(idx);
        const activo = h.activo;
        const franjas = h.franjas || [];
        const franjasHtml = franjas.map((f, fi) => `
            <div class="hr-franja-row" id="hrf-${idx}-${fi}">
                <input type="time" class="hr-time" value="${f.inicio||''}" ${canEdit?'':'disabled'}>
                <span class="hr-sep">—</span>
                <input type="time" class="hr-time" value="${f.fin||''}"   ${canEdit?'':'disabled'}>
                ${canEdit ? `<button class="hr-del" onclick="hrDelFranja(${idx},${fi})">✕</button>` : ''}
            </div>`).join('');
        return `
        <div class="hr-day-card${activo?' activo':''}" id="hr-card-${idx}">
            <div class="hr-day-head">
                <span class="hr-day-name">${nombre}</span>
                <label class="hr-toggle">
                    <input type="checkbox" ${activo?'checked':''} ${canEdit?'':'disabled'}
                           onchange="hrToggleDia(${idx},this.checked)">
                    <span class="hr-slider"></span>
                </label>
            </div>
            <div id="hr-franjas-${idx}">
                ${activo ? franjasHtml : (canEdit ? '' : '<span class="hr-readonly">Cerrado</span>')}
            </div>
            ${activo && canEdit ? `<button class="hr-add" onclick="hrAddFranja(${idx})">+ Franja</button>` : ''}
            ${canEdit ? `<button class="hr-save" id="hr-save-${idx}" onclick="hrGuardarDia(${idx})">Guardar</button>` : ''}
        </div>`;
    }).join('');
}

function hrToggleDia(dia, activo) {
    const card = document.getElementById(`hr-card-${dia}`);
    card.classList.toggle('activo', activo);
    renderSidebarHorarios();   // re-render to show/hide franjas
}

function hrAddFranja(dia) {
    const cont = document.getElementById(`hr-franjas-${dia}`);
    const fi   = cont.querySelectorAll('.hr-franja-row').length;
    const div  = document.createElement('div');
    div.className = 'hr-franja-row';
    div.id = `hrf-${dia}-${fi}`;
    div.innerHTML = `
        <input type="time" class="hr-time" value="09:00">
        <span class="hr-sep">—</span>
        <input type="time" class="hr-time" value="17:00">
        <button class="hr-del" onclick="this.closest('.hr-franja-row').remove()">✕</button>`;
    cont.appendChild(div);
}

function hrDelFranja(dia, fi) {
    document.getElementById(`hrf-${dia}-${fi}`)?.remove();
}

async function hrGuardarDia(dia) {
    const card    = document.getElementById(`hr-card-${dia}`);
    const activo  = card.querySelector('input[type=checkbox]').checked;
    const franjas = [];
    card.querySelectorAll('.hr-franja-row').forEach(row => {
        const inputs = row.querySelectorAll('.hr-time');
        const inicio = inputs[0]?.value;
        const fin    = inputs[1]?.value;
        if (inicio && fin) franjas.push({ inicio, fin });
    });
    const btn = document.getElementById(`hr-save-${dia}`);
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
        await api.patch(`/horarios/${dia}`, { activo, franjas });
        horariosRest = await api.get('/horarios/');
        renderSidebarHorarios();
    } catch(e) {
        alert('Error al guardar: ' + (e.message || e));
        btn.disabled = false; btn.textContent = 'Guardar';
    }
}

// ── Referencia de restaurante en el modal ────────────────────────
function renderModalRestRef(diaSemana) {
    const el  = document.getElementById('ms-rest-ref');
    if (!el) return;
    const h   = getRestDia(diaSemana);
    if (!h.activo || !h.franjas || h.franjas.length === 0) {
        el.innerHTML = `<strong>Restaurante:</strong> <span class="ms-rest-closed">Cerrado</span>`;
    } else {
        const chips = h.franjas.map(f =>
            `<span class="ms-rest-chip">${(f.inicio||'').slice(0,5)} – ${(f.fin||'').slice(0,5)}</span>`
        ).join('');
        el.innerHTML = `<strong>Restaurante:</strong> ${chips}`;
    }
    el.style.display = '';
}

// ── Init ─────────────────────────────────────────────────────────
(async () => {
    try {
        meUser = await api.get('/auth/me');
        canEdit = (meUser.rol === 'admin' || meUser.rol === 'gerente' || meUser.edicion_agenda === true);
    } catch { canEdit = false; }

    // Show publish button only for editors
    if (!canEdit) document.getElementById('btn-publicar').style.display = 'none';

    await api.get('/auth/usuarios').then(u => { usuarios = u; }).catch(() => { usuarios = []; });
    initRoles();

    horariosRest = await api.get('/horarios/').catch(() => []);

    document.body.classList.add('view-semana');
    await cargarYRenderizar();
})();
</script>
