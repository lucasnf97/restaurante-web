<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background: var(--sup-inv, #111827); min-height:100vh; color: var(--tx-inv, #f9fafb); }

/* ── Navbar ── */
.navbar {
    background:#0f172a; border-bottom: 1px solid var(--bd-a7, #1e293b);
    padding:0 20px; height:54px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-left { display:flex; align-items:center; gap:14px; }
.navbar-brand { font-size:17px; font-weight:800; color:#f9fafb; letter-spacing:-.3px; }
.navbar-area  { font-size:13px; color:#64748b; }
.navbar-right { display:flex; align-items:center; gap:10px; }

.btn-nav {
    background:rgba(255,255,255,0.07); color: var(--tx-8, #94a3b8);
    border:1px solid rgba(255,255,255,0.1);
    padding:7px 14px; border-radius:8px;
    font-size:12px; font-weight:600; cursor:pointer; transition:all .15s;
    display:flex; align-items:center; gap:5px;
}
.btn-nav:hover { background:rgba(255,255,255,0.13); color: var(--fg-a52, #f1f5f9); }
.btn-nav.danger { border-color:rgba(239,68,68,.3); color: var(--fg-a53, #f87171); }
.btn-nav.danger:hover { background:rgba(239,68,68,.15); }

/* ── Refresh badge ── */
.refresh-badge {
    font-size:11px; color: var(--fg-a15, #475569);
    background: var(--sup-inv-2, #1e293b); padding:4px 10px;
    border-radius:20px; white-space:nowrap;
}

/* ── Area tabs ── */
.tabs-bar {
    position:fixed; top:54px; left:0; right:0; z-index:90;
    background: var(--bg-a5, #0f172a); border-bottom: 1px solid var(--bd-a7, #1e293b);
    display:flex; gap:0; padding:0 20px; overflow-x:auto;
}
.tab-btn {
    padding:12px 22px; font-size:13px; font-weight:700;
    color: var(--tx-9, #64748b); border:none; background:none; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap;
    transition:color .15s, border-color .15s;
    position:relative;
}
.tab-btn:hover { color: var(--tx-8, #94a3b8); }
.tab-btn.active { color: var(--tx-inv, #f9fafb); border-bottom-color: var(--bd-a11, #6366f1); }
.tab-badge {
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--bg-a20, #6366f1); color: var(--tx-inv, white); font-size:10px; font-weight:800;
    width:18px; height:18px; border-radius:50%; margin-left:6px;
}
.tab-badge.amber { background: var(--bg-a36, #d97706); }
.tab-badge.green { background: var(--ok, #16a34a); }

/* ── Content ── */
.content { margin-top:102px; padding:20px; }

/* ── Estado columns ── */
.columns { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:900px) { .columns { grid-template-columns:1fr; } }

.col-header {
    font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:1px; margin-bottom:12px; padding:0 2px;
    display:flex; align-items:center; gap:8px;
}
.col-dot { width:8px; height:8px; border-radius:50%; }

/* ── Order cards ── */
.orden-card {
    background: var(--sup-inv-2, #1e293b); border-radius:12px;
    border: 1px solid var(--bd-a9, #334155); margin-bottom:12px;
    overflow:hidden; transition:border-color .2s;
}
.orden-card:hover { border-color: var(--bd-a10, #475569); }
.orden-card.pendiente   { border-left: 4px solid var(--bd-a25, #d97706); }
.orden-card.en_preparacion { border-left: 4px solid var(--bd-a11, #6366f1); }
.orden-card.lista       { border-left: 4px solid var(--ok, #16a34a); }

.orden-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px 8px;
}
.orden-num  { font-size:11px; font-weight:800; color: var(--fg-a19, #6366f1); }
.orden-mesa { font-size:14px; font-weight:700; color: var(--fg-a52, #f1f5f9); }
.orden-time { font-size:11px; color: var(--tx-9, #64748b); font-variant-numeric:tabular-nums; }
.orden-time.urgente { color: var(--fg-a53, #f87171); }

.orden-items { padding:0 14px 10px; }
.item-row {
    display:flex; align-items:baseline; gap:8px;
    padding:4px 0; border-bottom: 1px solid var(--bd-a3, #0f172a);
}
.item-row:last-child { border-bottom:none; }
.item-cant { font-size:13px; font-weight:800; color: var(--tx-inv, #f9fafb); min-width:22px; }
.item-nombre { font-size:13px; color: var(--tx-6, #cbd5e1); flex:1; }
.item-nota { font-size:11px; color: var(--av-tx-2, #f59e0b); font-style:italic; }

.orden-footer { padding:8px 12px 10px; display:flex; gap:8px; }

.btn-accion {
    flex:1; padding:8px; border-radius:8px; border:none;
    font-size:12px; font-weight:700; cursor:pointer; transition:all .15s;
}
.btn-iniciar  { background: var(--bg-a16, #312e81); color: var(--nav-tx, #a5b4fc); }
.btn-iniciar:hover  { background: var(--bg-a17, #3730a3); color: var(--fg-a48, #e0e7ff); }
.btn-lista    { background: var(--bg-a7, #14532d); color: var(--fg-a25, #86efac); }
.btn-lista:hover    { background: var(--bg-a9, #166534); color: var(--fg-a37, #bbf7d0); }
.btn-entregar { background: var(--bg-a11, #1e3a5f); color: var(--fg-a27, #93c5fd); }
.btn-entregar:hover { background: var(--bg-a10, #1d4ed8); color: var(--tx-inv, white); }

/* ── Empty state ── */
.empty-col {
    text-align:center; color: var(--tx-2, #334155); font-size:13px;
    padding:32px 16px; background: var(--sup-inv-2, #1e293b);
    border-radius:12px; border: 1px dashed var(--bd-a9, #334155);
}
.empty-col .icon { font-size:28px; margin-bottom:8px; opacity:.5; }

/* ── Cargando ── */
.loading-full {
    display:flex; align-items:center; justify-content:center;
    height:60vh; gap:12px; color: var(--fg-a15, #475569); font-size:14px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Toast ── */
.toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--sup-inv-2, #1e293b); border: 1px solid var(--bd-a9, #334155); color: var(--fg-a52, #f1f5f9);
    padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:999; pointer-events:none; opacity:0; transition:opacity .25s;
    white-space:nowrap;
}
.toast.show { opacity:1; }

/* ── Take Away del día (misma lista que el exe y el POS) ── */
.tk-ov { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:900; display:flex; align-items:center; justify-content:center; padding:16px; }
.tk-box { background: var(--sup, #fff); color: var(--tx, #1e293b); border-radius:14px; width:100%; max-width:780px; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; }
.tk-head { display:flex; align-items:center; gap:10px; padding:14px 18px; background:#1a1a2e; color:#fff; }
.tk-head b { font-size:16px; }
.tk-head span { color:#cbd5e1; font-size:13px; flex:1; }
.tk-head button { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:600; }
.tk-cuerpo { padding:14px 16px; overflow-y:auto; background: var(--sup-2, #f0f2f5); }
.tk-fila { background: var(--sup, #fff); border:1.5px solid var(--bd, #e2e8f0); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.tk-fila.lista { border-color:#86efac; }
.tk-linea { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tk-abrir { flex:1; min-width:180px; text-align:left; background:none; border:none; cursor:pointer; color:inherit; font-size:14px; padding:4px 0; }
.tk-chip { border-radius:5px; padding:3px 9px; font-size:12px; font-weight:700; }
.tk-btn { border-radius:8px; padding:7px 14px; font-weight:700; cursor:pointer; border:1.5px solid #16a34a; background:#fff; color:#16a34a; }
.tk-btn.fuerte { background:#16a34a; color:#fff; }
.tk-btn:disabled { opacity:.6; cursor:default; }
.tk-det { padding:6px 0 2px 24px; font-size:13px; }
.tk-sub { color: var(--tx-9, #64748b); }
</style>

<body>

<div class="navbar">
    <div class="navbar-left">
        <div class="navbar-brand">🍳 Cocina</div>
        <div class="navbar-area" id="area-label">—</div>
    </div>
    <div class="navbar-right">
        <div class="refresh-badge" id="refresh-badge">—</div>
        <button class="btn-nav" id="btn-takeaway" onclick="abrirTakeAway()">🥡 Take Away</button>
        <button class="btn-nav" onclick="cargarOrdenes()">↺ Actualizar</button>
        <button class="btn-nav danger" onclick="logout()">Salir</button>
    </div>
</div>

<div class="tabs-bar" id="tabs-bar">
    <!-- generado por JS -->
</div>

<div class="content" id="content">
    <div class="loading-full"><div class="cp-orbit"></div>Cargando áreas…</div>
</div>

<div class="toast" id="toast"></div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();
requirePermiso('gestion_pedidos', 'gestion_produccion', 'acceso_cocina');

// ── Estado global ──────────────────────────────────────────────────────────
let _areas       = [];
let _areaActiva  = null;   // id del área seleccionada
let _ordenes     = [];
let _intervalo   = null;
let _cargando    = false;

// ── URL param ?area=cocina o ?area=bar ────────────────────────────────────
const _urlArea = new URLSearchParams(window.location.search).get('area') || '';

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, ms = 2200) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
}

// ── Formato tiempo ─────────────────────────────────────────────────────────
function fmtMin(seg) {
    if (!seg) return '0 min';
    const m = Math.floor(seg / 60);
    const s = seg % 60;
    return m > 0 ? `${m} min ${s}s` : `${s}s`;
}

function elapsed(orden) {
    if (orden.estado !== 'en_preparacion' || !orden.cook_start_ts) {
        return orden.cook_elapsed_s || 0;
    }
    const now = Math.floor(Date.now() / 1000);
    return (orden.cook_elapsed_s || 0) + (now - orden.cook_start_ts);
}

// ── Inicialización ─────────────────────────────────────────────────────────
async function init() {
    try {
        _areas = await apiFetch('/productos/areas');
    } catch (e) {
        document.getElementById('content').innerHTML =
            `<div class="loading-full">Error al cargar áreas: ${e.message}</div>`;
        return;
    }

    if (!_areas.length) {
        document.getElementById('content').innerHTML =
            `<div class="loading-full">No hay áreas de cocina configuradas.</div>`;
        return;
    }

    // Preseleccionar área según URL param
    const paramNorm = _urlArea.toLowerCase().trim();
    let pre = null;
    if (paramNorm) {
        pre = _areas.find(a => a.nombre.toLowerCase().includes(paramNorm));
    }
    _areaActiva = (pre || _areas[0]).id;

    renderTabs();
    await cargarOrdenes();

    // Tiempo real vía SSE: el server avisa "pos" cuando cambia algo de cocina.
    suscribirEventos('pos', () => { cargarOrdenes(); contarTakeAway(); if (_tkAbierto) cargarTakeAway(); });
    contarTakeAway();
    // Fallback lento por si se cae el stream (red/proxy); 90 s es suficiente.
    _intervalo = setInterval(cargarOrdenes, 90000);
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function renderTabs() {
    const bar = document.getElementById('tabs-bar');
    bar.innerHTML = _areas.map(a => `
        <button class="tab-btn ${a.id === _areaActiva ? 'active' : ''}"
                id="tab-${a.id}" onclick="seleccionarArea(${a.id})">
            ${esc(a.nombre)}
            <span class="tab-badge" id="badge-${a.id}" style="display:none;">0</span>
        </button>
    `).join('');
}

function seleccionarArea(id) {
    _areaActiva = id;
    // Actualizar tab activo
    _areas.forEach(a => {
        document.getElementById(`tab-${a.id}`)?.classList.toggle('active', a.id === id);
    });
    renderOrdenes();
    const area = _areas.find(a => a.id === id);
    document.getElementById('area-label').textContent = area ? area.nombre : '';
}

// ── Carga de órdenes ───────────────────────────────────────────────────────
async function cargarOrdenes() {
    if (_cargando) return;
    _cargando = true;
    try {
        _ordenes = await apiFetch(`/pedidos/ordenes/area/${_areaActiva}`);
        renderOrdenes();
        actualizarBadges();
        const now = new Date();
        document.getElementById('refresh-badge').textContent =
            `Actualizado ${now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;
    } catch (e) {
        toast('Error al cargar órdenes: ' + (e.message || e));
    } finally {
        _cargando = false;
    }
}

async function actualizarBadges() {
    // Cargar conteo de todas las áreas en paralelo
    const counts = await Promise.all(
        _areas.map(a => apiFetch(`/pedidos/ordenes/area/${a.id}`)
            .then(r => ({ id: a.id, n: (r||[]).filter(o => ['pendiente','en_preparacion','lista'].includes(o.estado)).length }))
            .catch(() => ({ id: a.id, n: 0 }))
        )
    );
    counts.forEach(({ id, n }) => {
        const el = document.getElementById(`badge-${id}`);
        if (!el) return;
        el.textContent = n;
        el.style.display = n > 0 ? 'inline-flex' : 'none';
    });
}

// ── Render de órdenes ──────────────────────────────────────────────────────
function renderOrdenes() {
    const area   = _areas.find(a => a.id === _areaActiva);
    document.getElementById('area-label').textContent = area?.nombre || '';

    const activas = (_ordenes || []).filter(o =>
        ['pendiente', 'en_preparacion', 'lista'].includes(o.estado)
    );

    const pendientes   = activas.filter(o => o.estado === 'pendiente');
    const enPrep       = activas.filter(o => o.estado === 'en_preparacion');
    const listas       = activas.filter(o => o.estado === 'lista');

    document.getElementById('content').innerHTML = `
        <div class="columns">
            <div>
                <div class="col-header">
                    <span class="col-dot" style="background: var(--bg-a36, #d97706);"></span>
                    Pendientes
                    ${pendientes.length ? `<span style="color: var(--fg-a45, #d97706);font-size:11px;">(${pendientes.length})</span>` : ''}
                </div>
                ${pendientes.length
                    ? pendientes.map(o => cardOrden(o)).join('')
                    : `<div class="empty-col"><div class="icon">⏳</div>Sin pendientes</div>`
                }
            </div>
            <div>
                <div class="col-header">
                    <span class="col-dot" style="background: var(--bg-a20, #6366f1);"></span>
                    En preparación
                    ${enPrep.length ? `<span style="color: var(--fg-a19, #6366f1);font-size:11px;">(${enPrep.length})</span>` : ''}
                </div>
                ${enPrep.length
                    ? enPrep.map(o => cardOrden(o)).join('')
                    : `<div class="empty-col"><div class="icon">🍳</div>Sin órdenes en curso</div>`
                }
            </div>
            <div>
                <div class="col-header">
                    <span class="col-dot" style="background: var(--ok, #16a34a);"></span>
                    Listas
                    ${listas.length ? `<span style="color: var(--ok-tx-2, #16a34a);font-size:11px;">(${listas.length})</span>` : ''}
                </div>
                ${listas.length
                    ? listas.map(o => cardOrden(o)).join('')
                    : `<div class="empty-col"><div class="icon">✅</div>Sin listas aún</div>`
                }
            </div>
        </div>
    `;
}

function persHtml(it) {
    let p = it.personalizacion;
    if (!p) return '';
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch { return ''; } }
    let out = '';
    (p.extras || []).forEach(e => {
        const q = (e.cantidad && e.cantidad > 1) ? ' ×' + e.cantidad : '';
        out += `<div style="margin-left:26px;font-size:13px;color: var(--ok-tx-2, #16a34a);font-weight:600;">+ ${esc(e.nombre) || 'Extra'}${q}</div>`;
    });
    (p.quitados || []).forEach(q => {
        out += `<div style="margin-left:26px;font-size:13px;color: var(--pel-tx-2, #dc2626);font-weight:600;">− sin ${esc(q.nombre) || ''}</div>`;
    });
    return out;
}

function cardOrden(o) {
    const items = Array.isArray(o.items) ? o.items : (typeof o.items === 'string' ? JSON.parse(o.items) : []);
    const seg   = elapsed(o);
    const esUrgente = o.estado === 'en_preparacion' && seg > 900; // >15 min

    const itemsHtml = items.map(it => `
        <div class="item-row">
            <span class="item-cant">${it.cantidad}×</span>
            <span class="item-nombre">${esc(it.nombre) || '—'}</span>
            ${it.notas ? `<span class="item-nota">⚑ ${esc(it.notas)}</span>` : ''}
        </div>
        ${persHtml(it)}
    `).join('');

    let footerHtml = '';
    if (o.estado === 'pendiente') {
        footerHtml = `<button class="btn-accion btn-iniciar" onclick="cambiarEstado(${o.id},'en_preparacion')">▶ Iniciar</button>`;
    } else if (o.estado === 'en_preparacion') {
        footerHtml = `<button class="btn-accion btn-lista" onclick="cambiarEstado(${o.id},'lista')">✓ Lista</button>`;
    } else if (o.estado === 'lista') {
        footerHtml = `<button class="btn-accion btn-entregar" onclick="cambiarEstado(${o.id},'entregada')">↑ Entregada</button>`;
    }

    const timeStr = o.estado === 'en_preparacion'
        ? `<span class="orden-time ${esUrgente ? 'urgente' : ''}">⏱ ${fmtMin(seg)}</span>`
        : '';

    return `
        <div class="orden-card ${o.estado}">
            <div class="orden-head">
                <div>
                    <div class="orden-num">#${o.numero_orden || o.id}</div>
                    <div class="orden-mesa">${esc(o.etiqueta || ('Mesa ' + (o.mesa_numero || '—')))}</div>
                </div>
                ${timeStr}
            </div>
            <div class="orden-items">${itemsHtml}</div>
            <div class="orden-footer">${footerHtml}</div>
        </div>
    `;
}

// ── Cambiar estado ─────────────────────────────────────────────────────────
async function cambiarEstado(ordenId, nuevoEstado) {
    try {
        await apiFetch(`/pedidos/ordenes/${ordenId}/estado`, {
            method: 'PATCH',
            body: JSON.stringify({ estado: nuevoEstado })
        });
        const labels = { en_preparacion: 'En preparación', lista: 'Lista ✓', entregada: 'Entregada' };
        toast(`Orden #${ordenId} → ${labels[nuevoEstado] || nuevoEstado}`);
        await cargarOrdenes();
    } catch (e) {
        toast('Error: ' + (e.message || e));
    }
}

// ── Reloj interno para timers (sin recargar API) ───────────────────────────
setInterval(() => {
    // Actualizar los timers de órdenes en preparación sin recargar
    const enPrep = (_ordenes || []).filter(o => o.estado === 'en_preparacion' && o.cook_start_ts);
    enPrep.forEach(o => {
        const seg     = elapsed(o);
        const esUrg   = seg > 900;
        const tarjeta = document.querySelector(`.orden-card.en_preparacion .orden-time`);
        // Actualizar todos los timers en el DOM directamente
    });
    // Re-render silencioso solo si hay órdenes en preparación con timer
    if (enPrep.length) renderOrdenes();
}, 10000);

// ── Arrancar ───────────────────────────────────────────────────────────────
init();

// ── Take Away del día ──────────────────────────────────────────────────────────
// Todo lo que sale para llevar (web, sin mesa y armado sobre una mesa): nombre, hora
// estimada y estado; tocar un pedido despliega sus comandas. Misma lista que el exe y el
// POS (GET /pedidos/takeaway/hoy). "Entregar" lo cierra (ya está pagado).
const _TK_EST = {
    lista: ['#dcfce7', '#166534', '✓ Listo para entregar'], en_preparacion: ['#dbeafe', '#1e40af', 'En preparación'],
    programado: ['#ede9fe', '#5b21b6', 'Programado'], sin_enviar: ['#f1f5f9', '#475569', 'Sin enviar a cocina'],
    sin_pagar: ['#fef9c3', '#92400e', 'Sin pagar'], entregado: ['#f1f5f9', '#475569', 'Entregado'],
};
const _TK_ORD = { lista: 0, en_preparacion: 1, programado: 2, sin_enviar: 3, sin_pagar: 4, entregado: 9 };
const _TK_EST_ORDEN = { pendiente: 'Pendiente', en_preparacion: 'En preparación', lista: 'Lista', entregada: 'Entregada', cancelada: 'Cancelada' };
let _tkAbierto = false, _tkDatos = null, _tkTimer = null;
const _tkDesplegados = new Set(), _tkEntregando = new Set();
const _tkMoney = (n) => (typeof fmtDinero === 'function' ? fmtDinero(n) : Number(n || 0).toFixed(2));

async function contarTakeAway() {
    try {
        const d = await api.get('/pedidos/takeaway/hoy');
        document.getElementById('btn-takeaway').textContent = `🥡 Take Away ${d.activos}`;
        if (_tkAbierto) { _tkDatos = d; pintarTakeAway(); }
    } catch (_) {}
}
function abrirTakeAway() {
    if (_tkAbierto) return;
    _tkAbierto = true;
    const ov = document.createElement('div');
    ov.className = 'tk-ov'; ov.id = 'tk-ov';
    ov.innerHTML = `<div class="tk-box"><div class="tk-head"><b>🥡 Take Away de hoy</b><span id="tk-res"></span>
        <button onclick="cerrarTakeAway()">Cerrar</button></div><div class="tk-cuerpo" id="tk-cuerpo">Cargando…</div></div>`;
    ov.addEventListener('click', (e) => { if (e.target === ov) cerrarTakeAway(); });
    document.body.appendChild(ov);
    _tkTimer = setInterval(cargarTakeAway, 10000);
    cargarTakeAway();
}
function cerrarTakeAway() {
    _tkAbierto = false; clearInterval(_tkTimer);
    const ov = document.getElementById('tk-ov'); if (ov) ov.remove();
}
async function cargarTakeAway() {
    try { _tkDatos = await api.get('/pedidos/takeaway/hoy'); pintarTakeAway(); }
    catch (e) { if (!_tkDatos) document.getElementById('tk-cuerpo').textContent = 'No se pudo cargar: ' + (e.message || e); }
}
function pintarTakeAway() {
    const cuerpo = document.getElementById('tk-cuerpo'); if (!cuerpo || !_tkDatos) return;
    const d = _tkDatos;
    document.getElementById('tk-res').textContent = `· ${d.activos} activo${d.activos === 1 ? '' : 's'} · ${d.listos} listo${d.listos === 1 ? '' : 's'}`;
    // En cocina, sin los entregados: están en "Entregadas", de donde se devuelven a cocina.
    const peds = [...(d.pedidos || [])].filter(p => p.estado_takeaway !== 'entregado').sort((a, b) => (_TK_ORD[a.estado_takeaway] ?? 5) - (_TK_ORD[b.estado_takeaway] ?? 5) || String(a.hora).localeCompare(String(b.hora)));
    if (!peds.length) { cuerpo.innerHTML = '<div class="tk-sub" style="text-align:center;padding:20px;">Todavía no hay pedidos para llevar hoy.</div>'; return; }
    let html = '', titulo = false;
    for (const p of peds) {
        const est = p.estado_takeaway;
        if (est === 'entregado' && !titulo) { titulo = true; html += '<div class="tk-sub" style="font-weight:700;margin:14px 2px 6px;">Entregados hoy</div>'; }
        const [bg, fg, txt] = _TK_EST[est] || ['#f1f5f9', '#475569', est];
        const hora = est === 'entregado' ? `Entregado ${p.hora_entregado || ''}` : (p.programado ? `Programado ${p.hora}` : `Aprox. ${p.hora}`);
        const abierto = _tkDesplegados.has(p.id);
        const puede = ['lista', 'en_preparacion', 'programado', 'sin_enviar'].includes(est);
        let det = '';
        if (abierto) {
            det = (p.cliente_telefono ? `<div class="tk-sub">📞 ${esc(p.cliente_telefono)}</div>` : '');
            for (const o of p.ordenes || []) {
                const eo = o.oculta ? 'Programada (todavía no en cocina)' : (_TK_EST_ORDEN[o.estado] || o.estado);
                det += `<div style="font-weight:700;margin-top:4px;">${esc(o.area || 'Cocina')} — ${esc(eo)}</div>`;
                let items = o.items || []; if (typeof items === 'string') { try { items = JSON.parse(items); } catch { items = []; } }
                for (const it of items) {
                    let pers = it.personalizacion || {}; if (typeof pers === 'string') { try { pers = JSON.parse(pers); } catch { pers = {}; } }
                    const ex = (pers.extras || []).map(e => '+ ' + (e.nombre || '')).join(', ');
                    det += `<div style="padding-left:10px;">${it.cantidad || 1} × ${esc(it.nombre || '')}${ex ? ` <span class="tk-sub">(${esc(ex)})</span>` : ''}${it.notas ? ` <span class="tk-sub">· ${esc(it.notas)}</span>` : ''}</div>`;
                }
            }
            if (!(p.ordenes || []).length) det += '<div class="tk-sub">Sin comandas.</div>';
            det = `<div class="tk-det">${det}<div class="tk-sub" style="margin-top:4px;">Total ${_tkMoney(p.total)}</div></div>`;
        }
        html += `<div class="tk-fila${est === 'lista' ? ' lista' : ''}"><div class="tk-linea">
            <button class="tk-abrir" onclick="desplegarTakeAway(${p.id})">${abierto ? '▾' : '▸'} <b>${esc(hora)}</b> &nbsp; <b>${esc(p.nombre)}</b></button>
            <span class="tk-chip" style="background:${bg};color:${fg};">${txt}</span>
            ${puede ? `<button class="tk-btn${est === 'lista' ? ' fuerte' : ''}" onclick="entregarTakeAway(${p.id})" ${_tkEntregando.has(p.id) ? 'disabled' : ''}>${_tkEntregando.has(p.id) ? 'Entregando…' : 'Entregar'}</button>` : ''}
        </div>${det}</div>`;
    }
    cuerpo.innerHTML = html;
}
function desplegarTakeAway(id) { _tkDesplegados.has(id) ? _tkDesplegados.delete(id) : _tkDesplegados.add(id); pintarTakeAway(); }
async function entregarTakeAway(id) {
    const p = (_tkDatos.pedidos || []).find(x => x.id === id); if (!p || _tkEntregando.has(id)) return;
    if (p.estado_takeaway !== 'lista' && !confirm(`${p.nombre} todavía no está listo en cocina.\n¿Marcarlo igual como entregado?`)) return;
    _tkEntregando.add(id); pintarTakeAway();
    try { await api.post(`/pedidos/${id}/takeaway/entregar`, {}); }
    catch (e) { alert('No se pudo entregar: ' + (e.message || e)); }
    _tkEntregando.delete(id);
    await cargarTakeAway(); contarTakeAway(); cargarOrdenes();
}
</script>

</html>
