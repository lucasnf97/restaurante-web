<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservá tu mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Página pública de reservas ──────────────────────────────────────────────
   Esencia de la marca (Chief Point) + la cara del local. Lo del local es todo
   opcional y viene de /publico/info → perfil (se edita en Reservas › Online):
   sin banner propio, el encabezado es el navy de la marca.
   Las animaciones del punto significan lo mismo que en el resto del sistema:
   latido = vivo/activo (abierto ahora, reserva confirmada) · órbita = pedido en
   vuelo (buscar horarios, confirmar), y sólo si tarda más de 400 ms.          */
:root{
    --navy:#1B1B33; --navy-2:#2A2A4A; --lime:#C9FF1F;
    --r1:#B4E025; --r2:#93BE1E; --r3:#6E8A18; --r4:#4C5A15;
    --tx:#1B1B33; --tx-2:#4A4A60; --tx-3:#55556A;   /* 8,6 y 7,3 a 1 sobre blanco */
    --bd:#E3E3EA; --bd-2:#F0F0F4; --sup-2:#F6F6F9;
    --pel:#B42336; --pel-sf:#FDF2F3; --av-sf:#FDF8EC; --av-bd:#E7D29A; --av-tx:#7A5B18;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
    font-family:Figtree,system-ui,sans-serif; color:var(--tx); background:#EDEEF2;
    line-height:1.45; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; min-height:100vh; min-height:100dvh; /* taste-skill-ignore */
}
button{font:inherit; color:inherit;}
.app{ position:relative; width:100%; max-width:480px; background:#fff; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; } /* taste-skill-ignore */
@media (min-width:520px){
    body{ padding:28px 16px; min-height:0; }
    .app{ min-height:0; border-radius:28px; overflow:hidden; }
}
.hidden{ display:none !important; }

/* ── Banner ── */
/* Mientras llegan los datos del local no se muestra un formulario a medio armar. La clase
   la pone el script: sin script, la página se ve entera. */
.app.app-cargando #local > *, .app.app-cargando .lado-form > *:not(.carga){ visibility:hidden; }   /* la columna navy queda */
.carga{ display:flex; justify-content:center; padding:56px 0; }
.carga .cp-orbit{ width:38px; height:38px; }
.carga .cp-orbit::after{ border-width:2.5px; }
.banner{ position:relative; background:var(--navy) center/cover no-repeat; color:#fff;
    padding:30px 24px 52px; min-height:190px; display:flex; flex-direction:column;
    justify-content:flex-end; gap:12px; overflow:hidden; }
.banner .aro{ position:absolute; border-radius:50%; pointer-events:none; }
/* taste-skill-ignore: los anillos son el eco del logo de 3 anillos (decisión del dueño). */
.banner .aro.a1{ right:-120px; top:-120px; width:300px; height:300px; border:1px solid rgba(201,255,31,.10); } /* taste-skill-ignore */
.banner .aro.a2{ right:-70px; top:-70px; width:200px; height:200px; border:1px solid rgba(201,255,31,.14); } /* taste-skill-ignore */
.banner.con-foto{ min-height:230px; }
.banner.con-foto .aro{ display:none; }
/* taste-skill-ignore: velo neutro sobre la foto para que se lea el nombre (excepción de la regla). */
.banner.con-foto::before{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(27,27,51,.10) 0%, rgba(27,27,51,0) 30%, rgba(27,27,51,.85) 100%); } /* taste-skill-ignore */
.banner.sin-texto::before{ background:linear-gradient(180deg, rgba(27,27,51,0) 60%, rgba(27,27,51,.55) 100%); } /* taste-skill-ignore */
.banner > *{ position:relative; }
/* Selector de idioma: sólo aparece con más de un idioma activo en el local. */
.idiomas{ position:absolute; top:16px; right:16px; z-index:2; display:flex; gap:2px; padding:3px;
    border-radius:999px; background:var(--navy); }
.idiomas button{ min-width:40px; min-height:32px; padding:0 10px; border:none; border-radius:999px; background:transparent;
    color:rgba(255,255,255,.8); font-size:13px; font-weight:600; letter-spacing:.06em; cursor:pointer; }
.idiomas button:hover{ color:#fff; }
.idiomas button[aria-pressed=true]{ background:var(--lime); color:var(--navy); }
.b-logo{ width:56px; height:56px; border-radius:16px; object-fit:cover; background:#fff; }
.b-nombre{ margin:2px 0 0; font-family:Poppins,sans-serif; font-weight:600; font-size:34px; line-height:1.05; letter-spacing:-.025em;
    text-wrap:balance; }
@media (min-width:900px){ .b-nombre{ font-size:44px; } }
.b-nombre .sk{ display:inline-block; width:62%; height:.85em; border-radius:8px; background:rgba(255,255,255,.14); }
.b-estado{ display:flex; align-items:center; gap:9px; font-size:14px; color:rgba(255,255,255,.85); }
.b-estado .pt{ width:9px; height:9px; border-radius:50%; background:#9CA194; flex:none; }
.b-estado .pt.vivo{ background:var(--lime); animation:cp-beat 1.9s ease-in-out infinite; }

/* ── Hoja blanca ── */
.hoja{ position:relative; margin-top:-28px; background:#fff; border-radius:28px 28px 0 0;
    padding:24px 22px 18px; display:flex; flex-direction:column; gap:22px; flex:1; }

/* El local: presentación + ubicación + contacto */
.local{ display:flex; flex-direction:column; gap:12px; }
.local p{ margin:0; font-size:14.5px; color:var(--tx-2); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 12px;
    border-radius:999px; background:var(--sup-2); color:var(--tx); text-decoration:none;
    font-size:13.5px; font-weight:500; max-width:100%; }
.chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip svg{ flex:none; color:var(--r3); }
a.chip:hover{ background:#ECEEF2; }

.sec{ display:flex; flex-direction:column; gap:10px; }
.lbl{ font-size:13px; font-weight:600; color:var(--tx-2); }
.nota{ font-size:14px; color:var(--tx-3); margin:0; max-width:60ch; }

/* Días */
.dias{ display:flex; gap:8px; }
.dia{ flex:1; min-width:0; height:64px; border-radius:14px; border:1.5px solid var(--bd); background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer;
    transition:border-color .12s; }
.dia small{ font-size:11px; color:var(--tx-3); font-weight:600; text-transform:uppercase; }
.dia b{ font-family:Poppins,sans-serif; font-size:19px; font-weight:600; }
.dia:hover{ border-color:var(--navy); }
.dia[aria-pressed=true]{ background:var(--navy); border-color:var(--navy); color:#fff; }
.dia[aria-pressed=true] small{ color:var(--lime); }
.dia:disabled{ background:var(--sup-2); border-color:var(--bd-2); color:#A9A9B8; cursor:default; }
.dia:disabled small{ color:#B5B5C3; }
.dia.cal{ flex:0 0 52px; border-color:var(--sup-2); background:var(--sup-2); }
.fecha-oculta{ position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }

/* Personas */
.personas{ display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; }
.persona{ width:100%; max-width:52px; aspect-ratio:1; justify-self:center; padding:0; border-radius:50%; border:1.5px solid var(--bd); background:#fff;
    font-family:Poppins,sans-serif; font-weight:500; font-size:16px; cursor:pointer; }
.persona:hover{ border-color:var(--navy); }
/* taste-skill-ignore: anillo de la marca (borde), no una sombra. */
.persona[aria-pressed=true]{ background:var(--lime); border-color:var(--lime); box-shadow:inset 0 0 0 2px var(--r4); font-weight:600; } /* taste-skill-ignore */

/* Horarios */
.horas{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
.hora{ height:46px; border-radius:12px; border:1.5px solid var(--bd); background:#fff; font-weight:500;
    font-size:15px; font-variant-numeric:tabular-nums; cursor:pointer; }
.hora:hover{ border-color:var(--navy); }
.hora[aria-pressed=true]{ background:var(--navy); border-color:var(--navy); color:var(--lime); font-weight:600; }
.cargando{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--tx-2); min-height:46px; }
.aviso{ display:flex; gap:10px; align-items:flex-start; padding:13px 14px; border-radius:14px;
    background:#F4F6EC; font-size:13.5px; color:#3A4510; }
.aviso svg{ flex:none; margin-top:1px; }

/* Datos */
.resumen{ display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:14px; background:var(--sup-2); }
.resumen b{ font-family:Poppins,sans-serif; font-weight:600; font-size:15px; }
.resumen button{ margin-left:auto; border:none; background:none; color:var(--r3); font-weight:600; font-size:13.5px;
    cursor:pointer; min-height:36px; }
.fila{ display:flex; gap:12px; }
.fila > *{ flex:1; min-width:0; }
.campo{ display:flex; flex-direction:column; gap:6px; }
.campo label{ font-size:13px; font-weight:600; color:var(--tx-2); }
input[type=text], input[type=email], input[type=tel], textarea{
    width:100%; font:inherit; font-size:16px; color:var(--tx); background:#fff;
    border:1.5px solid var(--bd); border-radius:12px; padding:12px 13px; outline:none;
    transition:border-color .15s, box-shadow .15s; } /* taste-skill-ignore */
textarea{ resize:vertical; min-height:64px; }
/* taste-skill-ignore: aro de foco (accesibilidad). */
input:focus, textarea:focus{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(27,27,51,.12); } /* taste-skill-ignore */
.hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

.err{ background:var(--pel-sf); color:var(--pel); border-radius:12px;
    padding:11px 13px; font-size:14px; }
.dup{ background:var(--av-sf); color:var(--av-tx); border-radius:12px;
    padding:12px 13px; font-size:14px; }
.dup .acc{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.dup .acc button{ flex:1; min-width:140px; height:44px; border-radius:12px; border:none; cursor:pointer; font-weight:600; font-size:14px; }

/* Botón principal */
.cta{ height:56px; border-radius:16px; border:none; background:var(--navy); color:#fff; cursor:pointer;
    font-weight:600; font-size:16px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:0 20px; width:100%; }
.cta .det{ color:var(--lime); font-weight:500; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cta:disabled{ opacity:.7; cursor:default; }
.cta.centro{ justify-content:center; }

/* Pie: la marca */
.pie{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:var(--tx-3); padding:6px 0 4px; }
.cp-marca{ display:inline-flex; align-items:center; font-family:Poppins,sans-serif; font-weight:500;
    color:var(--navy); font-size:13px; letter-spacing:-.012em; line-height:1; }
.cp-marca .cp-dot{ width:.78em; height:.78em; margin:0 .5px; }

/* El punto de la marca (mismas reglas que el kit de api.js: 3 anillos desde 32 px,
   2 entre 24 y 32, y nunca el lima tocando el fondo claro). */
.cp-dot{ position:relative; display:inline-block; flex:none; width:1em; height:1em; border-radius:50%; background:var(--r4); }
.cp-dot::before,.cp-dot::after{ content:""; position:absolute; border-radius:50%; }
.cp-dot::before{ inset:11%; background:var(--r2); }
.cp-dot::after{ inset:26%; background:var(--lime); }
.cp-dot.cp-xs{ background:var(--r3); }          /* < 24 px: plano; oliva sobre claro */
.cp-dot.cp-xs::before,.cp-dot.cp-xs::after{ display:none; }
.fin .cp-dot.cp-xs{ background:var(--lime); }     /* sobre el navy, el lima plano */
.cp-orbit{ position:relative; display:inline-block; flex:none; width:22px; height:22px; }
.cp-orbit::before{ content:""; position:absolute; inset:32%; border-radius:50%; background:var(--r3); }
.cp-orbit::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(147,190,30,.22);
    border-top-color:var(--r2); animation:cp-spin .95s linear infinite; }
.cta .cp-orbit::before{ background:var(--lime); }
@keyframes cp-spin{ to{ transform:rotate(360deg); } }
/* taste-skill-ignore: el latido de la marca ("vivo"). */
@keyframes cp-beat{
    0%,42%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(201,255,31,.55); } /* taste-skill-ignore */
    12%{ transform:scale(1.16); box-shadow:0 0 0 7px rgba(201,255,31,0); } /* taste-skill-ignore */
    26%{ transform:scale(1.10); box-shadow:0 0 0 10px rgba(201,255,31,0); } /* taste-skill-ignore */
}
@keyframes cp-beat-xl{
    0%,42%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(201,255,31,.5); } /* taste-skill-ignore */
    12%{ transform:scale(1.06); box-shadow:0 0 0 14px rgba(201,255,31,0); } /* taste-skill-ignore */
    26%{ transform:scale(1.03); box-shadow:0 0 0 22px rgba(201,255,31,0); } /* taste-skill-ignore */
}

/* ── Confirmación / gestión: el ticket ── */
.app.ticket-modo{ background:var(--navy); color:#fff; }
.fin{ padding:44px 20px 24px; display:flex; flex-direction:column; align-items:center; gap:24px; flex:1; }
.fin .sello{ font-size:84px; animation:cp-beat-xl 1.9s ease-in-out infinite; }
.fin .sello.quieto{ animation:none; }
.fin h1{ margin:0; font-family:Poppins,sans-serif; font-weight:600; font-size:28px; letter-spacing:-.02em; text-align:center; }
.fin .sub{ margin:6px 0 0; font-size:15px; color:rgba(255,255,255,.78); text-align:center; }
.talon{ width:100%; background:#fff; color:var(--tx); border-radius:20px; }
.talon .top{ padding:20px 22px 18px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.talon .k{ font-size:13px; font-weight:500; color:var(--tx-3); }
.talon .v{ font-family:Poppins,sans-serif; font-weight:600; font-size:19px; display:block; }
.talon .s{ font-size:13px; color:var(--tx-2); }
.talon .corte{ position:relative; border-top:2px dashed var(--bd); margin:0 18px; }
.talon .corte::before,.talon .corte::after{ content:""; position:absolute; top:-12px; width:22px; height:22px;
    border-radius:50%; background:var(--navy); }
.talon .corte::before{ left:-30px; } .talon .corte::after{ right:-30px; }
.talon .bot{ padding:16px 22px 20px; display:flex; flex-direction:column; gap:10px; font-size:14px; }
.talon .li{ display:flex; justify-content:space-between; gap:14px; }
.talon .li span{ color:var(--tx-2); flex:none; }
.talon .li b{ font-weight:600; text-align:right; overflow-wrap:anywhere; }
.acciones{ width:100%; display:flex; flex-direction:column; gap:10px; }
.btn-lima, .btn-borde{ height:54px; border-radius:16px; font-weight:600; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; width:100%; }
.btn-lima{ border:none; background:var(--lime); color:var(--navy); }
.btn-borde{ border:1.5px solid rgba(255,255,255,.28); background:transparent; color:#fff; }
.btn-borde:hover{ border-color:rgba(255,255,255,.55); }
.link-suave{ color:rgba(255,255,255,.72); font-size:14px; min-height:44px; display:inline-flex; align-items:center;
    background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.link-suave:hover{ color:#fff; }
.fin .err{ width:100%; }
.fin .pie{ color:rgba(255,255,255,.6); margin-top:auto; }
.fin .pie .cp-marca{ color:#fff; }

.lado-form{ display:flex; flex-direction:column; gap:22px; flex:1; }
.paso{ display:flex; flex-direction:column; gap:22px; }
#paso-datos{ gap:16px; }
.eleccion-fila{ display:flex; flex-direction:column; gap:22px; }
.pers-fila{ display:flex; flex-direction:column; gap:10px; }
.solo-movil{}
.link-gestion{ align-self:center; border:none; background:none; color:var(--tx-2); font-size:14px; font-weight:500;
    min-height:44px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.link-gestion:hover{ color:var(--navy); }
.volver{ align-self:flex-start; border:none; background:none; color:var(--r3); font-weight:600; font-size:14px;
    min-height:40px; padding:0; cursor:pointer; }
.gest-t{ margin:0; font-family:Poppins,sans-serif; font-weight:600; font-size:21px; letter-spacing:-.01em; }
.aviso-modif{ display:flex; align-items:center; gap:4px 12px; flex-wrap:wrap; padding:10px 14px; border-radius:14px;
    background:#F4F6EC; color:#3A4510; font-size:13.5px; }
.aviso-modif span{ flex:1 1 260px; }
.aviso-modif button{ margin-left:auto; border:none; background:none; color:var(--r4); font-weight:600; cursor:pointer;
    min-height:36px; text-decoration:underline; text-underline-offset:3px; }

/* Franjas del día: pestañas sobre los horarios (con 27 horas la grilla era una pared). */
.franjas{ display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--sup-2); }
.franja{ flex:1; min-height:38px; border:none; border-radius:10px; background:transparent; color:var(--tx-2);
    font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
.franja:hover{ color:var(--navy); }
.franja[aria-selected=true]{ background:var(--navy); color:#fff; }
.franja[aria-selected=true] .n{ color:var(--lime); }
.franja .n{ font-size:13px; font-weight:500; color:var(--tx-3); font-variant-numeric:tabular-nums; }

/* Calendario del mes (formato escritorio) */
.cal{ display:flex; flex-direction:column; gap:8px; }
.cal-cab{ display:flex; justify-content:space-between; align-items:center; }
.cal-cab b{ font-weight:600; font-size:15px; }
.cal-cab div{ display:flex; gap:4px; }
.cal-nav{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--bd); background:#fff; color:var(--navy);
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.cal-nav:disabled{ border-color:var(--bd-2); color:#C3C3CF; cursor:default; }
.cal-grilla{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:2px; text-align:center; }
.cal-grilla .sem{ font-size:11.5px; font-weight:600; color:var(--tx-3); padding:2px 0 4px; text-transform:uppercase; }
.cal-dia{ height:38px; border-radius:50%; border:none; background:transparent; font-size:14px; font-weight:500;
    cursor:pointer; padding:0; font-variant-numeric:tabular-nums; }
.cal-dia:hover{ background:var(--sup-2); }
/* taste-skill-ignore: borde del día de hoy. */
.cal-dia.hoy{ box-shadow:inset 0 0 0 1.5px var(--navy); font-weight:600; } /* taste-skill-ignore */
.cal-dia[aria-pressed=true]{ background:var(--navy); color:var(--lime); font-weight:600; box-shadow:none; } /* taste-skill-ignore */
.cal-dia:disabled{ color:#C3C3CF; cursor:default; background:transparent; }
.cal-dia.cerrado{ text-decoration:line-through; }
.form-titulo{ margin:0; font-family:Poppins,sans-serif; font-weight:600; font-size:22px; letter-spacing:-.02em; }
@media (min-width:900px){ .form-titulo{ font-size:26px; } }
.solo-ancho{ display:none !important; }

/* ── Formato ESCRITORIO ──────────────────────────────────────────────────────
   Se decide por el ANCHO disponible, no por el tipo de aparato: un iPad se anuncia
   como Mac, una ventana chica de escritorio necesita el formato celular, y si el
   local mete la página en su web (iframe) lo que importa es el espacio que le dio.
   A la izquierda el local (banner + presentación + contacto + horarios), a la
   derecha la reserva. Es la MISMA página: sólo cambia cómo se acomoda. */
@media (min-width:900px){
    body{ padding:40px 24px; align-items:flex-start; }
    .app{ max-width:1120px; display:grid; grid-template-columns:minmax(340px, 400px) 1fr;
        grid-template-rows:auto 1fr; grid-template-areas:"banner form" "lado form"; min-height:680px; align-items:stretch; gap:0; }
    .hoja{ display:contents; }
    .banner{ grid-area:banner; min-height:300px; padding:34px 32px 30px; }
    .banner.con-foto{ min-height:320px; }
    .idiomas{ top:20px; right:20px; }
    /* En escritorio el selector cae sobre el lado BLANCO (no sobre el banner). */
    .app:not(.ticket-modo) .idiomas{ background:var(--sup-2); }
    .app:not(.ticket-modo) .idiomas button{ color:var(--tx-2); }
    .app:not(.ticket-modo) .idiomas button:hover{ color:var(--navy); }
    .app:not(.ticket-modo) .idiomas button[aria-pressed=true]{ background:var(--navy); color:var(--lime); }
    .local{ grid-area:lado; background:var(--navy); color:#fff; padding:6px 32px 34px; gap:16px; }
    .local.hidden{ display:flex !important; }   /* la columna navy sigue aunque no haya datos */
    .local p{ color:rgba(255,255,255,.78); font-size:15px; }
    .local .chip{ background:rgba(255,255,255,.08); color:#fff; }
    .local a.chip:hover{ background:rgba(255,255,255,.16); }
    .local .chip svg{ color:var(--r1); }
    .solo-ancho{ display:block !important; }
    .cal.solo-ancho{ display:flex !important; }
    .solo-movil{ display:none !important; }
    /* Opción 3 (elegida por el dueño): personas en una fila arriba; debajo, el
       calendario y los horarios lado a lado. Todo entra en una pantalla. */
    .pers-fila{ flex-direction:row; align-items:center; gap:18px; flex-wrap:wrap; }
    .pers-fila .nota{ margin:0; }
    .eleccion-fila{ display:grid; grid-template-columns:340px minmax(0,1fr); gap:36px; align-items:start; }
    .link-gestion{ align-self:flex-start; }
    .paso .cta{ align-self:flex-start; }
    .semana.hidden{ display:none !important; }
    .lado-form{ grid-area:form; padding:40px 48px 26px; gap:26px; min-width:0; }
    /* En fila (no grilla): dentro de .pers-fila la grilla no tiene ancho propio y caía
       a una sola columna, apilando los círculos. */
    .personas{ display:flex !important; flex-wrap:wrap; gap:10px; }
    .persona{ width:52px; height:52px; max-width:none; flex:none; }
    .horas{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .cta{ max-width:520px; }
    /* El ticket es una pieza angosta: en escritorio, centrado. */
    .app.ticket-modo{ display:flex; max-width:560px; min-height:0; }
}
.semana{ margin-top:6px; }
.semana-t{ display:block; font-size:15px; font-weight:600;
    color:var(--r1); margin-bottom:8px; }
.semana .fila-dia{ display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:3px 0;
    color:rgba(255,255,255,.72); font-variant-numeric:tabular-nums; }
.semana .fila-dia.hoy{ color:#fff; font-weight:600; }

@media (max-width:360px){
    .hoja{ padding:22px 16px 16px; }
    .horas{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .fila{ flex-direction:column; }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

    let s = (TXT[LANG] && TXT[LANG][k]) ?? TXT.es[k] ?? k;
    if(vars) for(const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);
    return s;
}
function _lsGet(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function _lsSet(k, v){ try{ localStorage.setItem(k, v); }catch{} }
function elegirIdiomaInicial(){
    const pedidos = [QS.get('lang'), _lsGet('reserva-idioma::' + CODE),
        ...((navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language])]
        .filter(Boolean).map(x => String(x).slice(0, 2).toLowerCase());
    // Noruego/sueco leen danés mejor que inglés.
    const parecido = { nb:'da', no:'da', nn:'da', sv:'da' };
    for(const p of pedidos){
        if(IDIOMAS.includes(p)) return p;
        if(parecido[p] && IDIOMAS.includes(parecido[p])) return parecido[p];
    }
    return IDIOMAS[0];
}
function pintarSelectorIdioma(){
    const box = $('idiomas');
    if(!box) return;
    if(IDIOMAS.length < 2){ box.classList.add('hidden'); return; }
    box.innerHTML = IDIOMAS.map(c => `<button type="button" lang="${c}" aria-pressed="${c === LANG}"
        aria-label="${NOMBRE_IDIOMA[c]}" onclick="cambiarIdioma('${c}')">${c.toUpperCase()}</button>`).join('');
    box.classList.remove('hidden');
}
function cambiarIdioma(c){
    if(!IDIOMAS.includes(c) || c === LANG) return;
    LANG = c; _lsSet('reserva-idioma::' + CODE, c);
    aplicarIdioma();
}
// Repinta TODO lo que tiene texto. Las vistas armadas por JS se vuelven a generar con
// su estado actual (lo elegido no se pierde al cambiar de idioma).
function aplicarIdioma(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
    document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = t(el.dataset.tp));
    pintarSelectorIdioma();
    if(_vista === 'mensaje'){
        $('msg-global').textContent = t(_mensajeClave);
        if(_tituloClave) $('rest-name').textContent = t(_tituloClave);
        return;
    }
    if(!state.info) return;
    document.title = t(GTOKEN ? 'titulo_gestion' : 'titulo', { r: state.info.restaurante || '' });
    // El ticket reemplaza la página entera (sin banner ni formulario): se vuelve a armar.
    if(_vista === 'confirmada'){ mostrarConfirmacion(_ultima, _ultimoNombre); return; }
    if(_vista === 'gestion'){ if(_gestion) renderGestion(_gestionCancelada); return; }
    pintarEstado();
    pintarLocal();
    if(MIN_F){
        aplicarTope(); renderDias(); renderPersonas();
        if(!_cargandoHorarios) renderHorarios();
        if(state.hora){
            const b = [...document.querySelectorAll('.hora')].find(x => x.textContent === state.hora);
            if(b) b.setAttribute('aria-pressed', 'true');
            pintarResumen();
        }
        if(!$('btn-confirmar').disabled) $('btn-confirmar-txt').textContent = t('confirmar');
        pintarModificacion();
        if(!$('g-enviado').classList.contains('hidden')) $('g-enviado-txt').textContent = t('gest_enviado');
        pintarNotaTelefono();
        if(!$('dup-aviso').classList.contains('hidden')) mostrarDuplicado(true);
        mostrar('err', false);   // un error viejo quedaría en el idioma anterior
    }
}

// ── Fetch con header de restaurante (sin login) ──
async function api(path, opts={}){
    const headers = {'Content-Type':'application/json','X-Restaurant-Code':CODE, ...(opts.headers||{})};
    const res = await fetch(API + path, {...opts, headers});
    let data = null; try{ data = await res.json(); }catch{}
    if(!res.ok){
        const err = new Error((data && data.detail) || ('Error ' + res.status));
        err.status = res.status; err.data = data;   // p/ distinguir el 409 de duplicado
        throw err;
    }
    return data;
}
// Los mensajes del server están en español: en otro idioma se muestra el genérico.
const msgServer = (e, generico) => (LANG === 'es' && e && e.message && typeof e.data?.detail === 'string') ? e.message : t(generico);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mostrar = (id, si) => $(id).classList.toggle('hidden', !si);

// ── Fechas ──
// Aritmética de calendario en la hora del RESTAURANTE (info.hoy/info.ahora): el Date
// local se usa solo como calculadora de componentes, nunca se convierte de zona.
// Los nombres de días y meses salen de Intl con el idioma elegido.
function _fmtYMD(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function _d(iso){ const [y,m,dd] = iso.split('-').map(Number); return new Date(y, m-1, dd); }
function hoyStr(){ return _fmtYMD(new Date()); }
function hoyRest(){ return (state.info && state.info.hoy) || hoyStr(); }
const _cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function diaCorto(iso){ return new Intl.DateTimeFormat(LOCALE[LANG], {weekday:'short'}).format(_d(iso)).replace(/\.$/, ''); }
function mesLargo(iso){ return new Intl.DateTimeFormat(LOCALE[LANG], {month:'long'}).format(_d(iso)); }
function fmtFechaLarga(iso){ return new Intl.DateTimeFormat(LOCALE[LANG], {weekday:'long', day:'numeric', month:'long'}).format(_d(iso)); }
function fmtFechaCorta(iso){ return iso === hoyRest() ? t('hoy') : `${_cap(diaCorto(iso))} ${_d(iso).getDate()}`; }
function personasTxt(n){ return `${n} ${n === 1 ? t('persona') : t('personas_n')}`; }
function sumarHoras(isoMin, horas){
    const [f,tt] = isoMin.split('T'); const [y,m,dd] = f.split('-').map(Number);
    const [H,M] = (tt||'0:0').split(':').map(Number);
    const d = new Date(y, m-1, dd, H, M); d.setHours(d.getHours() + horas);
    return _fmtYMD(d);
}
function sumarDias(isoFecha, dias){ const d = _d(isoFecha); d.setDate(d.getDate() + dias); return _fmtYMD(d); }
function sumarMin(hhmm, min){
    const [H,M] = hhmm.split(':').map(Number); const x = (H*60 + M + min) % 1440;
    return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;
}
// dia_semana del server: 0 = lunes … 6 = domingo (date.weekday() de Python)
function diaSemanaPy(iso){ return (_d(iso).getDay() + 6) % 7; }
function abreEseDia(iso){
    const hs = (state.info && state.info.horarios) || [];
    if(!hs.length) return true;   // sin horarios cargados no se adivina: que decida el server
    const h = hs.find(x => x.dia_semana === diaSemanaPy(iso));
    return !!(h && h.activo !== false && (h.franjas || []).length);
}

function contactoTxt(){
    const c = CFG.contacto || {}; const p = [];
    if(c.telefono) p.push(t('tel') + ' ' + c.telefono);
    if(c.email) p.push(t('correo') + ': ' + c.email);
    if(c.redes) p.push(c.redes);
    return p.join(' · ');
}

// ── Carga de la pantalla ──
// Mientras llega /publico/info: nada a medio armar, y la órbita ("petición en vuelo")
// sólo si tarda más de 400 ms. Al terminar, las partes entran escalonadas (sube 18 px +
// aparece): es la señal de "ya cargó". Una sola vez; con movimiento reducido, directo.
document.getElementById('app').classList.add('app-cargando');
const _relojCarga = setTimeout(() => { const c = document.getElementById('carga'); if(c) c.classList.remove('hidden'); }, UMBRAL_ESPERA);
function terminarCarga(){
    clearTimeout(_relojCarga);
    const app = $('app'); if(!app.classList.contains('app-cargando')) return;
    app.classList.remove('app-cargando');
    if($('carga')) $('carga').classList.add('hidden');
    entrada(['#b-logo:not(.hidden)', '#b-texto', '#b-estado:not(.hidden)', '#local:not(.hidden)', '.form-titulo',
             '#aviso-modif:not(.hidden)', '#sec-pers', '#sec-dia', '#sec-horarios', '#btn-gestionar', '#msg-global:not(.hidden)', '#pie']);
}
function entrada(selectores){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let i = 0;
    for(const sel of selectores){
        const el = document.querySelector(sel);
        if(!el || !el.animate || !el.offsetParent) continue;
        el.animate([{ opacity:0, transform:'translateY(18px)' }, { opacity:1, transform:'none' }],
                   { duration:460, delay: i++ * 70, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards' });
    }
}

// "Abierto ahora" con el latido (vivo); cerrado = punto gris y quieto.
function pintarEstado(){
    const hs = state.info.horarios || [];
    const ahora = state.info.ahora; if(!hs.length || !ahora || _vista === 'mensaje') return;
    const [f, hm] = ahora.split('T'); const [H,M] = hm.split(':').map(Number); const m = H*60 + M;
    const franjasDe = iso => {
        const h = hs.find(x => x.dia_semana === diaSemanaPy(iso));
        if(!h || h.activo === false) return [];
        return (h.franjas || []).map(fr => {
            const [a1,a2] = fr.inicio.split(':').map(Number), [b1,b2] = fr.fin.split(':').map(Number);
            let ini = a1*60 + a2, fin = b1*60 + b2; if(fin <= ini) fin += 1440;
            return { ini, fin, txtIni: fr.inicio, txtFin: fr.fin };
        });
    };
    const hoyF = franjasDe(f), ayerF = franjasDe(sumarDias(f, -1));
    const abierta = hoyF.find(x => m >= x.ini && m < x.fin) || ayerF.find(x => m + 1440 < x.fin);
    let txt;
    if(abierta){
        txt = t('abierto', { h: abierta.txtFin });
    }else{
        const prox = hoyF.filter(x => x.ini > m).sort((a,b) => a.ini - b.ini)[0];
        txt = prox ? t('cerrado_abre', { h: prox.txtIni }) : t('cerrado_hoy');
    }
    $('b-estado-txt').textContent = txt;
    $('b-pt').classList.toggle('vivo', !!abierta);
    mostrar('b-estado', true);
}

const svg = (k, s=15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
function urlMapa(){
    if(PERFIL.mapa_url) return PERFIL.mapa_url;
    const q = PERFIL.direccion || (state.info && state.info.restaurante);
    return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : null;
}
const chip = (ico, txt, href, extra='') => href
    ? `<a class="chip" href="${esc(href)}" ${extra}>${svg(ico)}<span>${esc(txt)}</span></a>`
    : `<span class="chip">${svg(ico)}<span>${esc(txt)}</span></span>`;
function pintarLocal(){
    if(_vista !== 'form') return;
    const c = CFG.contacto || {}; const p = PERFIL; const chips = [];
    if(p.direccion) chips.push(chip('pin', p.direccion, urlMapa(), 'target="_blank" rel="noopener"'));
    if(c.telefono) chips.push(chip('tel', c.telefono, 'tel:' + String(c.telefono).replace(/[^\d+]/g,'')));
    if(c.email) chips.push(chip('mail', c.email, 'mailto:' + c.email));
    // Redes: el texto lo elige el local y el enlace lleva a donde él dijo. Sólo http(s)
    // (el server ya lo filtra; acá se repite por si acaso, porque va a un href público).
    const ICO_RED = { instagram:'ig', facebook:'fb', tiktok:'tt', web:'web', otra:'otro' };
    for(const r of (p.redes || [])){
        const url = /^https?:\/\//i.test(r.url || '') ? r.url : null;
        chips.push(chip(ICO_RED[r.tipo] || 'otro', r.texto, url, 'target="_blank" rel="noopener"'));
    }
    $('local-chips').innerHTML = chips.join('');
    pintarSemana();
    if(p.descripcion){ $('local-desc').textContent = p.descripcion; mostrar('local-desc', true); }
    mostrar('local', !!(chips.length || p.descripcion));
}

// Horarios de toda la semana (columna del local, sólo en escritorio). Lunes primero;
// el día de hoy resaltado. Los nombres salen de Intl con el idioma elegido.
function pintarSemana(){
    const hs = (state.info && state.info.horarios) || [];
    if(!hs.length){ mostrar('semana', false); return; }
    const lunes = sumarDias(hoyRest(), -diaSemanaPy(hoyRest()));
    $('semana-filas').innerHTML = [0,1,2,3,4,5,6].map(i => {
        const iso = sumarDias(lunes, i);
        const h = hs.find(x => x.dia_semana === i);
        const franjas = (h && h.activo !== false) ? (h.franjas || []) : [];
        const nombre = _cap(new Intl.DateTimeFormat(LOCALE[LANG], {weekday:'long'}).format(_d(iso)));
        const horas = franjas.length ? franjas.map(f => `${f.inicio}–${f.fin}`).join(', ') : t('cerrado_dia');
        return `<div class="fila-dia${iso === hoyRest() ? ' hoy' : ''}"><span>${esc(nombre)}</span><span>${esc(horas)}</span></div>`;
    }).join('');
    mostrar('semana', true);
}

// Ancho de escritorio: la tira de días muestra la semana entera.
const ANCHO = window.matchMedia('(min-width:900px)');
const _alCambiarAncho = () => { if(MIN_F && _vista === 'form') renderDias(); };
if(ANCHO.addEventListener) ANCHO.addEventListener('change', _alCambiarAncho); else ANCHO.addListener(_alCambiarAncho);

// Topes/contacto del restaurante → rango de fechas, tope de personas y leyenda.
function aplicarConfigOnline(){
    const hoy = hoyRest();
    MIN_F = (CFG.anticipacion_horas != null && state.info.ahora)
        ? sumarHoras(state.info.ahora, CFG.anticipacion_horas) : hoy;
    if(MIN_F < hoy) MIN_F = hoy;
    MAX_F = CFG.horizonte_dias != null ? sumarDias(hoy, CFG.horizonte_dias) : null;
    const f = $('f-fecha'); f.min = MIN_F; if(MAX_F) f.max = MAX_F;
    MAX_P = CFG.max_personas || 20;
    if(state.personas > MAX_P) state.personas = MAX_P;
    // Primer día que abre dentro del rango.
    let d = MIN_F;
    for(let i = 0; i < 14 && !abreEseDia(d) && (!MAX_F || d < MAX_F); i++) d = sumarDias(d, 1);
    state.fecha = d;
    buscarDisponibilidad();
}
function aplicarTope(){
    if(CFG.max_personas == null) return;
    const c = contactoTxt();
    $('tope-leyenda').textContent = t('tope', { n: MAX_P, c: c ? ': ' + c : '' });
    mostrar('tope-leyenda', true);
}

// ── Días: tira de los próximos + calendario para cualquier otro ──
function renderDias(){
    const N = ANCHO.matches ? 7 : 4; const dias = [];
    for(let i = 0; dias.length < N; i++){
        const d = sumarDias(MIN_F, i);
        if(MAX_F && d > MAX_F) break;
        dias.push(d);
    }
    if(state.fecha && !dias.includes(state.fecha)) dias[dias.length - 1] = state.fecha;
    $('dias').innerHTML = dias.map(d => {
        const abre = abreEseDia(d);
        const top = d === hoyRest() ? t('hoy') : diaCorto(d);
        return `<button type="button" class="dia" aria-pressed="${d === state.fecha}" ${abre ? '' : `disabled title="${esc(_cap(t('cerrado')))}"`}
            aria-label="${esc(fmtFechaLarga(d))}${abre ? '' : ' (' + esc(t('cerrado')) + ')'}" onclick="elegirFecha('${d}')">
            <small>${esc(top)}</small><b>${_d(d).getDate()}</b></button>`;
    }).join('') + `<button type="button" class="dia cal" aria-label="${esc(t('otra_fecha'))}" onclick="abrirCalendario()">${svg('cal', 20)}</button>`;
    if(state.fecha) _calMes = state.fecha.slice(0, 7);
    renderCalendario();
}
// ── Calendario del mes (formato escritorio) ──
let _calMes = null;   // 'YYYY-MM' que se está mirando
function renderCalendario(){
    const cont = $('cal'); if(!cont || !MIN_F) return;
    if(!_calMes) _calMes = (state.fecha || MIN_F).slice(0, 7);
    const [y, m] = _calMes.split('-').map(Number);
    const primero = `${_calMes}-01`;
    const huecos = diaSemanaPy(primero);                       // lunes primero
    const nDias = new Date(y, m, 0).getDate();
    const mesMin = MIN_F.slice(0, 7), mesMax = MAX_F ? MAX_F.slice(0, 7) : null;
    const titulo = _cap(new Intl.DateTimeFormat(LOCALE[LANG], {month:'long', year:'numeric'}).format(_d(primero)));
    const lunes = sumarDias(primero, -huecos);
    const sem = [0,1,2,3,4,5,6].map(i => `<span class="sem">${esc(new Intl.DateTimeFormat(LOCALE[LANG], {weekday:'narrow'}).format(_d(sumarDias(lunes, i))))}</span>`).join('');
    let dias = '<span></span>'.repeat(huecos);
    for(let n = 1; n <= nDias; n++){
        const iso = `${_calMes}-${String(n).padStart(2, '0')}`;
        const fuera = iso < MIN_F || (MAX_F && iso > MAX_F);
        const cerrado = !fuera && !abreEseDia(iso);
        const cls = ['cal-dia', iso === hoyRest() ? 'hoy' : '', cerrado ? 'cerrado' : ''].join(' ');
        dias += `<button type="button" class="${cls}" aria-pressed="${iso === state.fecha}" ${fuera || cerrado ? 'disabled' : ''}
            aria-label="${esc(fmtFechaLarga(iso))}${cerrado ? ' (' + esc(t('cerrado')) + ')' : ''}" onclick="elegirFecha('${iso}')">${n}</button>`;
    }
    cont.innerHTML = `<div class="cal-cab"><b>${esc(titulo)}</b><div>
        <button type="button" class="cal-nav" aria-label="${esc(t('mes_ant'))}" ${_calMes <= mesMin ? 'disabled' : ''} onclick="moverMes(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" class="cal-nav" aria-label="${esc(t('mes_sig'))}" ${mesMax && _calMes >= mesMax ? 'disabled' : ''} onclick="moverMes(1)">

// ── Horarios ──
let _busqueda = 0, _errHorarios = null, _cargandoHorarios = false;
async function buscarDisponibilidad(){
    const fecha = state.fecha; if(!fecha) return;
    const mia = ++_busqueda;
    state.hora = null; _errHorarios = null; _cargandoHorarios = true;
    mostrar('btn-continuar', false); mostrar('sin-horarios', false); mostrar('franjas', false);
    $('slots').innerHTML = '';
    renderDias();
    const tReloj = setTimeout(() => { if(mia === _busqueda) mostrar('buscando', true); }, UMBRAL_ESPERA);
    try{
        const data = await api(`/publico/disponibilidad?fecha=${fecha}&comensales=${state.personas}`
            + (MODIF ? '&reemplaza=' + encodeURIComponent(MODIF.token) : ''));
        if(mia !== _busqueda) return;   // llegó tarde: ya se pidió otra combinación
        _cargandoHorarios = false;
        let horas = data.horarios || [];
        // Para hoy, ocultar horarios ya pasados — solo sin anticipación configurada (con
        // anticipación el server ya filtró con el huso del restaurante, que es el que manda).
        if(fecha === hoyRest() && CFG.anticipacion_horas == null && state.info.ahora){
            const [H,M] = state.info.ahora.split('T')[1].split(':').map(Number);
            horas = horas.filter(h => { const [a,b] = h.split(':').map(Number); return a*60+b > H*60+M; });
        }
        state.horarios = horas;
        state.motivo = data.motivo || null;
        renderHorarios();
    }catch(e){
        if(mia !== _busqueda) return;
        _cargandoHorarios = false;
        state.horarios = [];
        _errHorarios = e;
        renderHorarios();
    }finally{
        clearTimeout(tReloj);
        if(mia === _busqueda){ mostrar('buscando', false); _cargandoHorarios = false; }
        postHeight();
    }
}

function renderHorarios(){
    const cont = $('slots');
    if(!state.horarios.length){
        const c = contactoTxt();
        let txt;
        if(_errHorarios){
            txt = msgServer(_errHorarios, 'err_horarios');
        }else if(state.motivo === 'anticipacion'){
            txt = t('sin_ant', { h: CFG.anticipacion_horas, c: c ? t('sin_ant_c', { c }) : '.' });
        }else if(state.motivo === 'horizonte'){
            txt = t('sin_hor', { d: CFG.horizonte_dias });
        }else{
            txt = t('sin_libres');
        }
        $('sin-horarios-txt').textContent = txt;
        mostrar('sin-horarios', true);
        mostrar('franjas', false);
        cont.innerHTML = '';
        return;
    }
    mostrar('sin-horarios', false);
    // Tres franjas por la hora de INICIO (decisión del dueño): mañana hasta las 12 inclusive
    // (12:30 incluida), tarde de 13 a 18 (18:30 incluida) y noche el resto, también lo
    // que pasa de medianoche. Sólo se muestran las que tienen lugar; con una sola, sin pestañas.
    const grupos = { manana: [], tarde: [], noche: [] };
    state.horarios.forEach(h => grupos[franjaDe(h)].push(h));
    const conLugar = ['manana', 'tarde', 'noche'].filter(f => grupos[f].length);
    const pre = state.horaPre ? franjaDe(state.horaPre) : null;
    if(pre && conLugar.includes(pre)) state.franja = pre;
    else if(!conLugar.includes(state.franja)) state.franja = conLugar.includes('noche') ? 'noche' : conLugar[0];
    const tabs = $('franjas');
    tabs.innerHTML = conLugar.map(f => `<button type="button" class="franja" role="tab" aria-selected="${f === state.franja}"
        onclick="elegirFranja('${f}')">${esc(t('f_' + f))}<span class="n">${grupos[f].length}</span></button>`).join('');
    tabs.classList.toggle('hidden', conLugar.length < 2);
    cont.innerHTML = grupos[state.franja].map(h =>
        `<button type="button" class="hora" aria-pressed="${h === state.hora}" onclick="elegirHora('${h}', this)">${h}</button>`).join('');
    // Al modificar: la hora que tenía queda marcada (si sigue habiendo lugar).
    if(state.horaPre && state.horarios.includes(state.horaPre)){
        const b = [...cont.querySelectorAll('.hora')].find(x => x.textContent === state.horaPre);
        state.horaPre = null;
        if(b) elegirHora(b.textContent, b);
    }
}

function franjaDe(hhmm){
    const H = parseInt(hhmm, 10);
    if(H >= 6 && H <= 12) return 'manana';
    if(H >= 13 && H <= 18) return 'tarde';
    return 'noche';
}
function elegirFranja(f){
    if(f === state.franja) return;
    state.franja = f;
    renderHorarios();   // la hora elegida sigue elegida aunque esté en otra pestaña
    postHeight();
}
function pintarResumen(){
    const corto = `${fmtFechaCorta(state.fecha)} · ${state.hora} · ${state.personas}`;
    $('pick-txt').textContent = `${fmtFechaCorta(state.fecha)} · ${state.hora} · ${personasTxt(state.personas)}`;
    $('cta-det').textContent = corto;
    $('cont-det').textContent = corto;
}
function elegirHora(h, btn){
    state.hora = h;
    document.querySelectorAll('.hora').forEach(s => s.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    pintarResumen();
    mostrar('btn-continuar', true);
    postHeight();
}

// ── Pasos con animación ──
// Hacia adelante lo que se deja sube y se desvanece, y lo nuevo entra desde abajo;
// hacia atrás, al revés. Sin animación si el sistema pide movimiento reducido.
const _SIN_MOVIMIENTO = window.matchMedia('(prefers-reduced-motion: reduce)');
let _pasoActual = 'paso-eleccion';
function irAPaso(destino, adelante){
    const desde = $(_pasoActual), hacia = $(destino);
    if(desde === hacia) return;
    _pasoActual = destino;
    const fin = () => {
        desde.classList.add('hidden');
        hacia.classList.remove('hidden');
        const top = $('form-wrap').getBoundingClientRect().top;
        if(top < 0) $('form-wrap').scrollIntoView({behavior: _SIN_MOVIMIENTO.matches ? 'auto' : 'smooth', block:'start'});
        if(!_SIN_MOVIMIENTO.matches && hacia.animate){
            hacia.animate([{ opacity:0, transform:`translateY(${adelante ? 36 : -36}px)` },
                           { opacity:1, transform:'none' }], { duration:300, easing:'cubic-bezier(.2,.8,.2,1)' });
        }
        postHeight();
    };
    if(_SIN_MOVIMIENTO.matches || !desde.animate){ fin(); return; }
    desde.animate([{ opacity:1, transform:'none' },
                   { opacity:0, transform:`translateY(${adelante ? -36 : 36}px)` }],
                  { duration:220, easing:'cubic-bezier(.4,0,1,1)' }).onfinish = fin;
}
function continuar(){
    if(!state.hora) return;
    pintarResumen();
    mostrar('err', false);
    irAPaso('paso-datos', true);
    setTimeout(() => { if(!$('d-nombre').value) $('d-nombre').focus({preventScroll:true}); }, 560);
}
function volverAHorarios(){
    // La hora elegida se mantiene marcada: volver es para cambiar algo, no para empezar de cero.
    irAPaso('paso-eleccion', false);
}

function mostrarErr(msg){ $('err').textContent = msg; mostrar('err', true); postHeight(); }

async function confirmar(){
    const nombre = $('d-nombre').value.trim();

    const email  = $('d-email').value.trim();
    if(!nombre){ mostrarErr(t('err_nombre')); $('d-nombre').focus(); return; }
    if(!tel && !email){ mostrarErr(t('err_contacto')); $('d-tel').focus(); return; }
    if(!state.hora){ mostrarErr(t('err_hora')); return; }
    await enviarReserva(null);
}

        : esc(t('confirmar'));
}

async function enviarReserva(accion){
    // La órbita sólo aparece si la espera supera el umbral de la marca.
    const reloj = setTimeout(() => _btnConfirmando(true), UMBRAL_ESPERA);
    $('btn-confirmar').disabled = true;
    mostrar('err', false); mostrar('dup-aviso', false);
    try{
        const r = await api('/publico/reservas', { method:'POST', body: JSON.stringify({
            nombre: $('d-nombre').value.trim(),
            telefono: $('d-tel').value.trim() || null,
            email: $('d-email').value.trim() || null,
            comensales: state.personas, fecha: state.fecha, hora_inicio: state.hora,
            alergeno: $('d-alergeno').value.trim() || null,
            notas: $('d-notas').value.trim() || null,
            website: $('d-website').value || null,
            accion: accion || null,
            idioma: LANG,   // el email de confirmación sale en este idioma
            reemplaza: MODIF ? MODIF.token : null,
        })});
        clearTimeout(reloj);
        if(MODIF){
            // La reserva vieja quedó cancelada: el enlace con su token ya no sirve.
            MODIF = null;
            try{ history.replaceState(null, '', location.pathname + '?r=' + encodeURIComponent(CODE)); }catch{}
        }
        mostrarConfirmacion(r, $('d-nombre').value.trim());
    }catch(e){
        clearTimeout(reloj);
        _btnConfirmando(false);
        // Duplicado por contacto: ya hay una reserva ese día a nombre de este tel/email
        if(e.status === 409 && e.data && e.data.duplicada){ mostrarDuplicado(); return; }
        if(e.status === 410){ mostrarErr(t('err_modificar')); return; }
        // Si justo se ocupó la última mesa, refrescar horarios
        if(/disponibles|409/.test(e.message||'')){
            mostrarErr(t('err_ocupado'));
            buscarDisponibilidad();
        }else{
            mostrarErr(msgServer(e, 'err_confirmar'));
        }
    }
}

// ── Calendario: .ics (Apple, Outlook, Android) + enlace directo a Google ──
// Hora "flotante" (sin zona): el cliente está en la ciudad del local, así que la
// hora que ve es la del restaurante. Evita depender del huso del navegador.
function _icsFecha(iso, hhmm){ return iso.replace(/-/g,'') + 'T' + hhmm.replace(':','') + '00'; }
function _finReserva(fecha, hora){
    const dur = (state.info && state.info.duracion_min) || 90;
    const fin = sumarMin(hora, dur);
    return { fecha: fin < hora ? sumarDias(fecha, 1) : fecha, hora: fin };
}
function _textoEvento(r){
    return { titulo: t('ev_titulo', { r: r.restaurante || '' }), lugar: PERFIL.direccion || '',
             desc: t('ev_mesa', { p: personasTxt(r.comensales) }) + (r.cancelar_url ? '\n' + t('ev_cancelar', { u: r.cancelar_url }) : '') };
}
function descargarIcs(r){
    const f = _finReserva(r.fecha, r.hora); const ev = _textoEvento(r);
    const e = s => String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g, m => '\\' + m);
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Chief Point//Reservas//ES','BEGIN:VEVENT',
        `UID:reserva-${r.id || Date.now()}@chiefpoint`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')}`,
        `DTSTART:${_icsFecha(r.fecha, r.hora)}`, `DTEND:${_icsFecha(f.fecha, f.hora)}`,
        `SUMMARY:${e(ev.titulo)}`, ev.lugar ? `LOCATION:${e(ev.lugar)}` : '', `DESCRIPTION:${e(ev.desc)}`,
        'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
    a.download = 'reserva.ics';
    document.body.appendChild(a); a.click(); a.remove();
}
function urlGoogleCal(r){
    const f = _finReserva(r.fecha, r.hora); const ev = _textoEvento(r);
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(ev.titulo)
        + '&dates=' + _icsFecha(r.fecha, r.hora) + '/' + _icsFecha(f.fecha, f.hora)
        + '&details=' + encodeURIComponent(ev.desc)
        + (ev.lugar ? '&location=' + encodeURIComponent(ev.lugar) : '');
}

    $('btn-gest-enviar').disabled = false;
    pintarNotaTelefono();
    irAPaso('paso-gestionar', true);
    setTimeout(() => $('g-email').focus({preventScroll:true}), 560);
}
function cerrarGestionar(){ irAPaso('paso-eleccion', false); }
async function enviarGestionar(){
    const email = $('g-email').value.trim();
    mostrar('g-email-err', false);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
        $('g-email-err').textContent = t('gest_err_email'); mostrar('g-email-err', true); return;
    }
    const btn = $('btn-gest-enviar'); btn.disabled = true;
    try{
        await api('/publico/reservas/recuperar', { method:'POST', body: JSON.stringify({ email, idioma: LANG }) });
        // Siempre el mismo mensaje: la página nunca dice si ese email tiene reservas.
        $('g-enviado-txt').textContent = t('gest_enviado');
        mostrar('g-enviado', true);
    }catch(e){
        btn.disabled = false;
        $('g-email-err').textContent = t('gest_err'); mostrar('g-email-err', true);
    }
    postHeight();
}

function pedirCancelacion(){
    const btn = $('btn-g-cancelar');
    btn.outerHTML = `<button type="button" class="btn-borde" id="btn-g-cancelar" style="border-color:#F3A5B0;color:#FFD5DB;"
        onclick="confirmarCancelacion()">${esc(t('si_cancelar'))}</button>`;
    postHeight();
}

async function confirmarCancelacion(){
    const btn = $('btn-g-cancelar');
    btn.disabled = true;
    const reloj = setTimeout(() => { btn.innerHTML = `<span class="cp-orbit"></span>${esc(t('cancelando'))}`; }, UMBRAL_ESPERA);
    try{
        await api(`/publico/reservas/gestion/${encodeURIComponent(GTOKEN)}/cancelar`, { method:'POST' });
        clearTimeout(reloj);
        renderGestion(true);
    }catch(e){
        clearTimeout(reloj);
        btn.disabled = false; btn.textContent = t('si_cancelar');
        const ge = $('g-err');
        ge.textContent = msgServer(e, 'err_cancelar');
        ge.classList.remove('hidden');
        postHeight();
    }
}

init();
</script>
