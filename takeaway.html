<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Take Away</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Sitio de Take Away de un local ────────────────────────────────────────────
   Inicio (portada, información, promociones) y Menú del local; carrito, pago y seguimiento.
   Mismos tokens y reglas que reserva.html (marca Chief Point + decisiones de Taste):
   sin sombras en reposo (sólo lo que flota: carrito, diálogo), sin etiquetas chicas
   en mayúsculas, texto de lectura ≥ 14 px, grises con contraste ≥ 7:1.
   Animaciones con significado: latido = abierto / listo, órbita = pedido en vuelo
   (sólo si tarda > 400 ms), pulso = esperando sin final conocido (pago, cocina). */
:root{
    --navy:#1B1B33; --navy-2:#2A2A4A; --lime:#C9FF1F;
    --r1:#B4E025; --r2:#93BE1E; --r3:#6E8A18; --r4:#4C5A15;
    --tx:#1B1B33; --tx-2:#4A4A60; --tx-3:#55556A;
    --bd:#E3E3EA; --bd-2:#F0F0F4; --sup-2:#F6F6F9; --sup-3:#EEEFF3;
    --pel:#B42336; --pel-sf:#FDF2F3; --ok-sf:#F4F6EC; --ok-tx:#3A4510;
    --ancho:1180px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:Figtree,system-ui,sans-serif; color:var(--tx); background:#fff; line-height:1.45;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
.hidden{ display:none !important; }
.envase{ max-width:var(--ancho); margin:0 auto; padding:0 20px; }
h1,h2,h3{ font-family:Poppins,sans-serif; font-weight:600; letter-spacing:-.025em; margin:0; text-wrap:balance; }

/* Número de pedido para el mostrador (los 3 últimos dígitos) */
.numero-pedido{ display:flex; flex-direction:column; align-items:center; gap:2px; margin:6px auto 4px;
    padding:14px 26px; border-radius:18px; background:var(--navy); color:#fff; }
.numero-pedido .t{ font-size:14px; color:#C4C4D4; }
.numero-pedido b{ font-family:Poppins,sans-serif; font-size:52px; line-height:1.05; letter-spacing:.04em; color:var(--lime); }
.numero-pedido .d{ font-size:14px; color:#E3E3EA; }

/* ── Barra superior ── */
.barra{ position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--bd-2); }
.barra .envase{ display:flex; align-items:center; gap:18px; height:64px; }
.marca-sitio{ display:flex; align-items:center; gap:10px; text-decoration:none; font-family:Poppins,sans-serif;
    font-weight:600; font-size:18px; letter-spacing:-.02em; min-width:0; }
.marca-sitio img{ width:34px; height:34px; border-radius:9px; object-fit:cover; }
.marca-sitio span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav{ display:flex; gap:4px; margin-left:auto; }
.nav a{ text-decoration:none; font-weight:600; font-size:15px; padding:8px 12px; border-radius:999px; color:var(--tx-2); }
.nav a:hover{ color:var(--navy); background:var(--sup-2); }
.nav a[aria-current=page]{ background:var(--navy); color:#fff; }
.idiomas{ display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--sup-2); }
.idiomas button{ min-width:38px; min-height:32px; border:none; border-radius:999px; background:transparent;
    color:var(--tx-2); font-size:12.5px; font-weight:600; letter-spacing:.06em; cursor:pointer; }
.idiomas button[aria-pressed=true]{ background:var(--navy); color:var(--lime); }
.btn-carrito{ position:relative; display:flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background:var(--navy); color:#fff; border-radius:999px; padding:0 16px; height:42px; font-weight:600; font-size:14.5px; }
.btn-carrito .n{ min-width:24px; height:24px; border-radius:50%; background:var(--lime); color:var(--navy);
    display:inline-flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 0 0 2px var(--r4); }
@media (max-width:760px){
    .nav{ position:fixed; left:0; right:0; bottom:0; z-index:31; justify-content:space-around; background:#fff;
        border-top:1px solid var(--bd-2); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); margin:0; }
    .nav a{ flex:1; text-align:center; }
    .btn-carrito .txt{ display:none; }
    .idiomas button{ min-width:32px; }
    body.con-nav-abajo{ padding-bottom:64px; }
}

/* ── Botones ── */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; border:none; cursor:pointer;
    border-radius:999px; font-weight:600; font-size:16px; padding:0 26px; height:54px; text-decoration:none; }
.btn-lima{ background:var(--lime); color:var(--navy); }
.btn-navy{ background:var(--navy); color:#fff; }
.btn-borde{ background:transparent; color:var(--navy); border:1.5px solid var(--bd); }
.btn-borde-claro{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.4); }
.btn:disabled{ opacity:.5; cursor:default; }

/* ── Home ── */
.hero{ position:relative; min-height:78vh; min-height:78svh; background:var(--navy) center/cover no-repeat; color:#fff;
    display:flex; align-items:flex-end; overflow:hidden; }
/* taste-skill-ignore: velo neutro sobre la foto para que se lea el título (excepción de la regla). */
.hero.con-foto::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(27,27,51,.15) 0%, rgba(27,27,51,.25) 45%, rgba(27,27,51,.92) 100%); } /* taste-skill-ignore */
.hero .aro{ position:absolute; border-radius:50%; border:1px solid rgba(201,255,31,.12); pointer-events:none; } /* taste-skill-ignore */
.hero.con-foto .aro{ display:none; }
.hero .envase{ position:relative; width:100%; padding-top:120px; padding-bottom:64px; display:flex; flex-direction:column; gap:18px; }
.hero h1{ font-size:clamp(40px, 7vw, 92px); line-height:.98; max-width:14ch; }
.hero p{ margin:0; font-size:clamp(16px, 1.6vw, 20px); color:rgba(255,255,255,.85); max-width:46ch; }
.hero .acciones{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
.bloque{ padding:72px 0; }
.bloque.gris{ background:var(--sup-2); }
.bloque h2{ font-size:clamp(28px, 3.4vw, 44px); line-height:1.05; margin-bottom:22px; }
.carrusel{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px, 260px); gap:16px; overflow-x:auto;
    scroll-snap-type:x mandatory; padding-bottom:8px; }
.carrusel > *{ scroll-snap-align:start; }
.seccion-home{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
.seccion-home:nth-child(even) .foto-sec{ order:2; }
.seccion-home + .seccion-home{ margin-top:64px; }
.foto-sec{ aspect-ratio:4/3; background:var(--sup-3) center/cover no-repeat; border-radius:24px; }
.seccion-home p{ font-size:17px; color:var(--tx-2); margin:0; max-width:52ch; white-space:pre-line; }
@media (max-width:760px){ .seccion-home{ grid-template-columns:1fr; gap:20px; } .seccion-home:nth-child(even) .foto-sec{ order:0; } }
.pie{ background:var(--navy); color:rgba(255,255,255,.8); padding:44px 0 56px; font-size:14px; }
.pie .envase{ display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between; }
.pie .redes{ display:flex; gap:8px; flex-wrap:wrap; }
.pie .redes a{ text-decoration:none; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.08); color:#fff; font-weight:500; }
.cp-marca{ display:inline-flex; align-items:center; font-family:Poppins,sans-serif; font-weight:500; color:#fff; font-size:14px; }
.cp-marca .cp-dot{ width:.78em; height:.78em; margin:0 .5px; background:var(--lime); }

/* ── Información del local (Inicio) ── */
.info-local{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:760px){ .info-local{ grid-template-columns:1fr; } }
.info-caja{ border-radius:22px; background:var(--sup-2); padding:22px 24px; display:flex; flex-direction:column; gap:10px; }
.info-caja h2{ font-size:24px; margin-bottom:4px; }
.info-caja .dato{ margin:0; font-size:15px; color:var(--tx-2); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.info-caja .aviso{ margin:0; font-size:14.5px; background:var(--ok-sf); color:var(--ok-tx); padding:10px 12px; border-radius:12px; }
.semana{ display:flex; flex-direction:column; }
.semana .dia{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:15px; border-bottom:1px solid var(--bd); }
.semana .dia:last-child{ border-bottom:none; }
.semana .dia span{ color:var(--tx-2); text-transform:capitalize; }
.semana .dia.hoy span{ color:var(--navy); font-weight:700; }
.estado{ display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:500; }
.estado .pt{ width:9px; height:9px; border-radius:50%; background:#9CA194; flex:none; }
.estado .pt.vivo{ background:var(--lime); box-shadow:0 0 0 2px var(--r4); animation:cp-beat 1.9s ease-in-out infinite; } /* taste-skill-ignore */

/* ── Menú ── */
.cab-local{ background:var(--navy); color:#fff; padding:34px 0 30px; }
.cab-local .envase{ display:flex; flex-wrap:wrap; gap:10px 24px; align-items:flex-end; justify-content:space-between; }
.cab-local h1{ font-size:clamp(30px, 4vw, 48px); }
.cab-local .dato{ color:rgba(255,255,255,.8); font-size:15px; }
.cab-local .estado{ color:rgba(255,255,255,.9); }
.cab-local a.cambiar{ color:var(--lime); font-weight:600; font-size:14.5px; }
.cats{ position:sticky; top:64px; z-index:20; background:#fff; border-bottom:1px solid var(--bd-2); }
.cats .envase{ display:flex; gap:8px; overflow-x:auto; padding-top:12px; padding-bottom:12px; scrollbar-width:none; }
.cats .envase::-webkit-scrollbar{ display:none; }
.cats button{ flex:none; border:none; cursor:pointer; border-radius:999px; padding:9px 16px; font-weight:600; font-size:14.5px;
    background:var(--sup-2); color:var(--tx-2); }
.cats button[aria-current=true]{ background:var(--navy); color:var(--lime); }
.menu-cuerpo{ display:grid; grid-template-columns:1fr; gap:32px; padding-top:28px; padding-bottom:110px; }
@media (min-width:1000px){ .menu-cuerpo{ grid-template-columns:1fr 340px; align-items:start; padding-bottom:60px; } }
.cat-menu{ scroll-margin-top:140px; }
.cat-menu + .cat-menu{ margin-top:40px; }
.cat-menu h2{ font-size:28px; margin-bottom:16px; }
.prods{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
.prod{ border:none; padding:0; text-align:left; cursor:pointer; background:var(--sup-2); border-radius:20px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s; }
/* Sobre una sección gris (Promociones del Inicio) la tarjeta va blanca: con el mismo gris
   no se veía dónde terminaba y el texto quedaba suelto sobre la página. */
.bloque.gris .prod{ background:#fff; }
.prod:hover{ transform:translateY(-2px); }
.prod:disabled{ cursor:default; transform:none; }
.prod .foto{ aspect-ratio:4/3; background:var(--sup-3) center/cover no-repeat; display:flex; align-items:center; justify-content:center; position:relative; }
.prod .foto .cp-dot{ font-size:44px; opacity:.35; }
.prod .etq{ position:absolute; left:12px; top:12px; background:var(--lime); color:var(--navy); font-weight:600; font-size:13px;
    padding:4px 10px; border-radius:999px; }
.prod .cuerpo{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.prod .nom{ font-family:Poppins,sans-serif; font-weight:600; font-size:17px; letter-spacing:-.01em; }
.prod .desc{ font-size:14px; color:var(--tx-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod .pie-prod{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:6px; }
.precio{ font-weight:600; font-size:16px; font-variant-numeric:tabular-nums; }
.precio s{ font-weight:400; color:var(--tx-3); margin-left:6px; font-size:14px; }
.mas{ width:38px; height:38px; border-radius:50%; background:var(--navy); color:var(--lime); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:500; }
.agot{ font-size:13.5px; font-weight:600; color:var(--pel); }
.prod.agotado .foto, .prod.agotado .nom{ opacity:.55; }

/* ── Carrito (columna en escritorio, barra + hoja en celular) ── */
.carrito{ background:var(--sup-2); border-radius:22px; padding:20px; position:sticky; top:150px; display:flex; flex-direction:column; gap:14px; }
.carrito h3{ font-size:20px; }
.linea{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:14.5px; }
.linea .nom{ font-weight:600; }
.linea .sub{ grid-column:1/-1; color:var(--tx-3); font-size:13.5px; }
.linea .cant{ display:flex; align-items:center; gap:6px; }
.linea .cant button{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--bd); background:#fff; cursor:pointer; font-size:16px; line-height:1; }
.total{ display:flex; justify-content:space-between; font-family:Poppins,sans-serif; font-weight:600; font-size:18px; padding-top:10px; border-top:1px solid var(--bd); }
.vacio{ color:var(--tx-3); font-size:14.5px; }
.barra-carrito{ position:fixed; left:12px; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:25;
    background:var(--navy); color:#fff; border:none; border-radius:999px; height:58px; padding:0 22px; display:flex; align-items:center;
    justify-content:space-between; font-weight:600; font-size:16px; cursor:pointer; box-shadow:0 18px 40px -18px rgba(27,27,51,.6); }
.barra-carrito .det{ color:var(--lime); }
@media (min-width:1000px){ .barra-carrito{ display:none !important; } }
@media (max-width:999px){ .carrito.lateral{ display:none; } }
@media (min-width:761px) and (max-width:999px){ .barra-carrito{ bottom:16px; } }

/* ── Diálogo (producto, carrito en celular) ── */
.velo{ position:fixed; inset:0; z-index:50; background:rgba(27,27,51,.55); display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:761px){ .velo{ align-items:center; padding:20px; } }
.dialogo{ background:#fff; width:100%; max-width:560px; max-height:92vh; max-height:92dvh; overflow-y:auto;
    border-radius:26px 26px 0 0; display:flex; flex-direction:column; }
@media (min-width:761px){ .dialogo{ border-radius:26px; } }
.dialogo .foto{ aspect-ratio:16/10; background:var(--sup-3) center/cover no-repeat; flex:none; }
.dialogo .cuerpo{ padding:22px; display:flex; flex-direction:column; gap:14px; }
.dialogo h2{ font-size:28px; }
.dialogo .desc{ color:var(--tx-2); font-size:15.5px; margin:0; }
.cerrar{ position:sticky; top:12px; margin:12px 12px -56px auto; z-index:2; width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; cursor:pointer; font-size:20px; flex:none; }
.extras{ display:flex; flex-direction:column; gap:8px; }
.extra{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:var(--sup-2); cursor:pointer; font-size:15px; }
.extra input{ width:20px; height:20px; accent-color:var(--navy); margin:0; }
.extra .p{ margin-left:auto; color:var(--tx-2); font-variant-numeric:tabular-nums; }
.lbl{ font-size:14px; font-weight:600; color:var(--tx-2); }
.paso-cant{ display:flex; align-items:center; gap:14px; }
.paso-cant button{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--bd); background:#fff; cursor:pointer; font-size:20px; }
.paso-cant b{ font-family:Poppins,sans-serif; font-size:20px; min-width:24px; text-align:center; }
input[type=text], input[type=tel], input[type=email], textarea{ width:100%; font:inherit; font-size:16px; color:var(--tx);
    background:#fff; border:1.5px solid var(--bd); border-radius:14px; padding:12px 14px; outline:none; }
input:focus, textarea:focus{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(27,27,51,.12); } /* taste-skill-ignore: aro de foco */

/* ── Checkout ── */
.checkout{ display:grid; grid-template-columns:1fr; gap:24px; padding-top:28px; padding-bottom:110px; }
@media (min-width:1000px){ .checkout{ grid-template-columns:1fr 380px; align-items:start; padding-bottom:60px; }
    .co-resumen{ position:sticky; top:90px; } }
.caja{ background:var(--sup-2); border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:14px; }
.caja h2{ font-size:22px; }
#co-retiro{ display:flex; flex-direction:column; gap:10px; }
.opcion{ display:flex; width:100%; text-align:left; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; border:1.5px solid var(--bd); background:#fff; cursor:pointer; font-size:15.5px; font-weight:500; }
.opcion[aria-pressed=true]{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); } /* taste-skill-ignore: borde de elegido */
.opcion small{ display:block; font-weight:400; color:var(--tx-3); font-size:13.5px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ border:none; cursor:pointer; border-radius:999px; padding:10px 16px; font-weight:600; font-size:14.5px; background:#fff; color:var(--tx-2); }
.chip[aria-pressed=true]{ background:var(--navy); color:var(--lime); }
.horas{ display:grid; grid-template-columns:repeat(auto-fill, minmax(82px, 1fr)); gap:8px; }
.hora{ height:46px; border-radius:12px; border:1.5px solid var(--bd); background:#fff; cursor:pointer; font-weight:500; font-size:15px; font-variant-numeric:tabular-nums; }
.hora[aria-pressed=true]{ background:var(--navy); border-color:var(--navy); color:var(--lime); font-weight:600; }
.fila2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:560px){ .fila2{ grid-template-columns:1fr; } }
.campo{ display:flex; flex-direction:column; gap:6px; }
.campo label{ font-size:14px; font-weight:600; color:var(--tx-2); }
.check{ display:flex; gap:10px; align-items:flex-start; font-size:14.5px; color:var(--tx-2); cursor:pointer; }
.check input{ width:20px; height:20px; margin:1px 0 0; accent-color:var(--navy); flex:none; }
.err{ background:var(--pel-sf); color:var(--pel); border-radius:14px; padding:12px 14px; font-size:14.5px; }
.nota{ font-size:14px; color:var(--tx-3); margin:0; }
/* Nota del local sobre el producto ("contiene frutos secos"): se distingue de la descripción. */
.nota-prod{ margin:0; padding:10px 14px; border-radius:12px; background:var(--sup-2); border-left:3px solid var(--navy);
    font-size:14.5px; color:var(--tx-2); }
.hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

/* ── Seguimiento del pedido ── */
.seguimiento{ max-width:620px; margin:0 auto; padding:40px 20px 110px; display:flex; flex-direction:column; gap:22px; }
.sello{ font-size:76px; align-self:center; }
.sello.vivo{ animation:cp-beat-xl 1.9s ease-in-out infinite; }
.pulso{ position:relative; width:76px; height:76px; align-self:center; }
.pulso::before{ content:""; position:absolute; inset:30%; border-radius:50%; background:var(--lime); box-shadow:0 0 0 3px var(--r4); z-index:1; } /* taste-skill-ignore */
.pulso span{ position:absolute; inset:0; border-radius:50%; opacity:0; border:2px solid var(--r2); animation:cp-pulse 2.2s ease-out infinite; }
.pulso span:nth-child(2){ animation-delay:.73s; } .pulso span:nth-child(3){ animation-delay:1.46s; }
.seguimiento h1{ font-size:clamp(28px, 4.4vw, 40px); text-align:center; }
.seguimiento .sub{ text-align:center; color:var(--tx-2); font-size:16px; margin:-10px 0 0; }
.pasos{ display:flex; flex-direction:column; gap:0; background:var(--sup-2); border-radius:22px; padding:18px 22px; }
.paso{ display:flex; gap:14px; align-items:center; padding:10px 0; font-size:15.5px; color:var(--tx-3); }
.paso .m{ width:14px; height:14px; border-radius:50%; background:var(--bd); flex:none; }
.paso.hecho{ color:var(--tx); } .paso.hecho .m{ background:var(--r3); }
.paso.actual{ color:var(--tx); font-weight:600; } .paso.actual .m{ background:var(--lime); box-shadow:0 0 0 2px var(--r4); } /* taste-skill-ignore */
.talon{ background:#fff; border:1.5px solid var(--bd); border-radius:22px; padding:18px 22px; display:flex; flex-direction:column; gap:10px; }
.talon .li{ display:flex; justify-content:space-between; gap:14px; font-size:15px; }
.talon .li span{ color:var(--tx-3); }
.talon .li b{ text-align:right; }
.carga{ display:flex; justify-content:center; padding:80px 0; }

/* ── Marca: el punto y sus animaciones (mismas reglas que js/api.js) ── */
.cp-dot{ position:relative; display:inline-block; flex:none; width:1em; height:1em; border-radius:50%; background:var(--r4); }
.cp-dot::before,.cp-dot::after{ content:""; position:absolute; border-radius:50%; }
.cp-dot::before{ inset:11%; background:var(--r2); }
.cp-dot::after{ inset:26%; background:var(--lime); }
.cp-marca .cp-dot::before, .cp-marca .cp-dot::after{ display:none; }
.cp-orbit{ position:relative; display:inline-block; flex:none; width:38px; height:38px; }
.cp-orbit.mini{ width:20px; height:20px; }
.cp-orbit::before{ content:""; position:absolute; inset:32%; border-radius:50%; background:var(--r3); }
.cp-orbit::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2.5px solid rgba(147,190,30,.22); border-top-color:var(--r2); animation:cp-spin .95s linear infinite; }
.btn .cp-orbit::before{ background:var(--lime); }
@keyframes cp-spin{ to{ transform:rotate(360deg); } }
@keyframes cp-pulse{ 0%{ transform:scale(.34); opacity:.9; } 100%{ transform:scale(1.5); opacity:0; } }
@keyframes cp-beat{
    0%,42%,100%{ transform:scale(1); box-shadow:0 0 0 2px var(--r4), 0 0 0 0 rgba(201,255,31,.55); } /* taste-skill-ignore */
    12%{ transform:scale(1.16); box-shadow:0 0 0 2px var(--r4), 0 0 0 7px rgba(201,255,31,0); } /* taste-skill-ignore */
    26%{ transform:scale(1.10); box-shadow:0 0 0 2px var(--r4), 0 0 0 10px rgba(201,255,31,0); } /* taste-skill-ignore */
}
@keyframes cp-beat-xl{
    0%,42%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(201,255,31,.5); } /* taste-skill-ignore */
    12%{ transform:scale(1.06); box-shadow:0 0 0 14px rgba(201,255,31,0); } /* taste-skill-ignore */
    26%{ transform:scale(1.03); box-shadow:0 0 0 22px rgba(201,255,31,0); } /* taste-skill-ignore */
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

              set(k, v) { try { localStorage.setItem(k, v); } catch {} },
              del(k) { try { localStorage.removeItem(k); } catch {} } };
function elegirIdioma() {
    const pedidos = [QS.get('lang'), _ls.get('tk-idioma'), ...(navigator.languages || [navigator.language])]
        .filter(Boolean).map(x => String(x).slice(0, 2).toLowerCase());
    const parecido = { nb:'da', no:'da', nn:'da', sv:'da' };
    for (const p of pedidos) {
        if (IDIOMAS.includes(p)) return p;
        if (parecido[p] && IDIOMAS.includes(parecido[p])) return parecido[p];
    }
    return IDIOMAS[0];
}
function pintarIdiomas() {
    const box = $('idiomas');
    if (IDIOMAS.length < 2) { box.classList.add('hidden'); return; }
    box.innerHTML = IDIOMAS.map(c => `<button type="button" aria-pressed="${c === LANG}" onclick="cambiarIdioma('${c}')">${c.toUpperCase()}</button>`).join('');
    box.classList.remove('hidden');
}
function cambiarIdioma(c) { LANG = c; _ls.set('tk-idioma', c); aplicarTextos(); render(); }
function aplicarTextos() {

const $ = (id) => document.getElementById(id);

    try { return new Intl.NumberFormat(LOCALE[LANG], { style:'currency', currency: MONEDA || 'EUR' }).format(n || 0); }
    catch { return (Number(n) || 0).toFixed(2); }
}
async function api(path, opts = {}, codigo = null) {
    const headers = { 'Content-Type': 'application/json', ...(codigo ? { 'X-Restaurant-Code': codigo } : {}) };
    const res = await fetch(API + path, { ...opts, headers });
    let data = null; try { data = await res.json(); } catch {}
    if (!res.ok) { const e = new Error((data && data.detail) || ('Error ' + res.status)); e.status = res.status; e.data = data; throw e; }
    return data;
}
// Órbita sólo si la espera pasa de 400 ms (la marca: nada que parpadee).
function conEspera(el, promesa) {

    return promesa.finally(() => { clearTimeout(reloj); el && el.classList.add('hidden'); });

// en el teléfono para siempre y al volver días después aparecía un pedido que nunca se hizo.
// Vencido, se borra del dispositivo (no sólo se oculta).
const CARRITO_VENCE_MS = 15 * 60 * 1000;
function leerCarrito() {
    const vacio = { codigo: CODIGO_SITIO, items: [] };
    let c = null;
    try { c = JSON.parse(_ls.get(CLAVE_CARRITO) || 'null'); } catch { c = null; }
    if (!c || !c.t || Date.now() - c.t > CARRITO_VENCE_MS) {   // sin fecha = carrito viejo
        _ls.del(CLAVE_CARRITO);
        return vacio;
    }
    return c;
}
let CARRITO = leerCarrito();
_ls.del('tk-cliente'); _ls.del('tk-carrito');   // restos de versiones anteriores
function guardarCarrito() {
    CARRITO.t = Date.now();
    if (CARRITO.items.length) _ls.set(CLAVE_CARRITO, JSON.stringify(CARRITO));
    else _ls.del(CLAVE_CARRITO);
    pintarContador();
}
// Si la pestaña quedó abierta y se vuelve después de los 15 minutos, también vence.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !CARRITO.items.length) return;
    if (Date.now() - (CARRITO.t || 0) > CARRITO_VENCE_MS) {
        _ls.del(CLAVE_CARRITO);
        CARRITO = { codigo: CODIGO_SITIO, items: [] };
        pintarContador();
        if (typeof pintarCarritoLateral === 'function') pintarCarritoLateral();
        if (rutaActual().vista === 'checkout') location.hash = '#menu';

});

const unidades = () => CARRITO.items.reduce((a, i) => a + i.cantidad, 0);

    const n = unidades();

    const enMenu = rutaActual().vista === 'menu';
    barra.classList.toggle('hidden', !(n && enMenu));

}

// ══ Rutas (#home, #menu, #checkout, #pedido/<token>) ══
function rutaActual() {
    const [vista, a, b] = (location.hash.replace(/^#/, '') || 'home').split('/');
    // #pedido/<local>/<token> es el formato viejo de los enlaces: se sigue aceptando.
    return { vista: ['home', 'menu', 'checkout', 'pedido'].includes(vista) ? vista : 'home', token: b || a };
}
window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
function marcarNav(v) {
    document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.r === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
async function render() {
    const r = rutaActual();
    cerrarDialogo();
    marcarNav(r.vista === 'checkout' || r.vista === 'pedido' ? 'menu' : r.vista);
    pintarContador();
    if (r.vista === 'home') return pintarHome();
    if (r.vista === 'menu') return pintarMenu(CODIGO_SITIO);
    if (r.vista === 'checkout') return pintarCheckout();
    if (r.vista === 'pedido') return pintarPedido(CODIGO_SITIO, r.token);
}
function entrada(sel) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    // Sólo lo que se ve al llegar: lo de más abajo no puede quedar invisible si el cliente baja rápido.
    [...document.querySelectorAll(sel)].filter(el => el.getBoundingClientRect().top < innerHeight).forEach((el, i) => el.animate && el.animate(
        [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }],
        { duration: 460, delay: Math.min(i, 8) * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
}

function irACategoria(id) {

let _espia = null;
function espiarCategorias() {
    if (_espia) _espia.disconnect();
    // Sólo se desplaza la barra de chips en horizontal: scrollIntoView movería también
    // la página (la barra es sticky) y pelearía con el scroll del cliente.
    const barra = $('cats');
    const marcar = (id) => barra.querySelectorAll('button').forEach(b => {
        const on = b.dataset.cat === id; b.setAttribute('aria-current', on);
        if (on) barra.scrollTo({ left: b.offsetLeft - (barra.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
    });
    _espia = new IntersectionObserver((ents) => {
        const vis = ents.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (vis.length) marcar(vis[0].target.dataset.cat);

    document.querySelectorAll('.cat-menu').forEach(s => _espia.observe(s));
    const primero = document.querySelector('#cats button'); if (primero) primero.setAttribute('aria-current', 'true');
}

function pintarRetiro() {

    const dias = R.programados || [];

    let html = '';
    if (R.asap) html += `<button type="button" class="opcion" aria-pressed="${S.horaElegida === 'asap'}" onclick="elegirHora('asap')">
        <span>${esc(t('asap'))}<small>${esc(t('asap_det', { m: R.prep_min }))}</small></span></button>`;
    if (dias.length) {
        const prog = S.horaElegida && S.horaElegida !== 'asap';
        html += `<button type="button" class="opcion" aria-pressed="${prog}" onclick="elegirProgramar()"><span>${esc(t('programar'))}</span></button>`;
        if (prog || !R.asap) {
            // "Hoy" según la fecha del LOCAL (la manda el server), no la del navegador. El resto
            // con su nombre ("vie 16"): "Mañana" chocaría con la franja Mañana.
            const hoy = S.menu.ahora.slice(0, 10);
            const nomDia = (f) => f === hoy ? t('hoy')
                : new Intl.DateTimeFormat(LOCALE[LANG], { weekday: 'short', day: 'numeric' }).format(new Date(f + 'T12:00'));
            html += `<div class="chips">${dias.map(d => `<button type="button" class="chip" aria-pressed="${d.fecha === S.diaElegido}" onclick="elegirDia('${d.fecha}')">${esc(nomDia(d.fecha))}</button>`).join('')}</div>`;
            const horas = (dias.find(d => d.fecha === S.diaElegido) || { horas: [] }).horas;
            const grupos = { manana: [], tarde: [], noche: [] };
            horas.forEach(h => grupos[franjaDe(h.slice(11))].push(h));
            const conLugar = ['manana', 'tarde', 'noche'].filter(f => grupos[f].length);
            if (!conLugar.includes(S.franja)) S.franja = conLugar[0];
            if (conLugar.length > 1) html += `<div class="chips">${conLugar.map(f => `<button type="button" class="chip" aria-pressed="${f === S.franja}" onclick="S.franja='${f}';pintarRetiro()">${esc(t('f_' + f))}</button>`).join('')}</div>`;

        }

// Las horas llegan en la hora del LOCAL sin desfase ('YYYY-MM-DDTHH:MM'): se muestran tal cual,

// está o se agotó). Si no, el siguiente "Pagar" mandaría el total viejo y volvería a fallar.
async function actualizarPreciosCarrito() {
    try {
        const m = await cargarMenu(CODIGO_SITIO);
        const porId = Object.fromEntries(m.productos.map(p => [p.id, p]));
        CARRITO.items = CARRITO.items.filter(i => porId[i.id] && !porId[i.id].agotado).map(i => {
            const p = porId[i.id];
            const extras = i.extras.map(e => p.extras.find(x => x.id === e.id)).filter(Boolean);
            return { ...i, nombre: p.nombre, extras, precio: p.precio + extras.reduce((a, e) => a + e.precio, 0) };
        });
        guardarCarrito(); pintarResumenCheckout();
    } catch (_) {}
}
function mostrarErrCo(msg) { const e = $('co-err'); e.textContent = msg; e.classList.remove('hidden'); }
function nuevaClave() { return (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)); }
async function confirmarPedido() {
    const email = $('co-email').value.trim();
    $('co-err').classList.add('hidden');
    if (!S.horaElegida || S.horaElegida === 'programar') return mostrarErrCo(t('err_retiro'));
    if (!email) return mostrarErrCo(t('err_email'));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return mostrarErrCo(t('err_email_mal'));
    if (!$('co-acepto').checked) return mostrarErrCo(t('err_acepto'));
    // Una clave por intento de compra: un doble clic o un reintento no crean dos pedidos.
    if (!S.claveIntento) S.claveIntento = nuevaClave();
    const btn = $('co-pagar'); btn.disabled = true;
    const reloj = setTimeout(() => { btn.innerHTML = '<span class="cp-orbit mini"></span>'; }, UMBRAL_ESPERA);
    try {
        const r = await api('/publico/takeaway/pedidos', { method: 'POST', body: JSON.stringify({
            items: CARRITO.items.map(i => ({ online_producto_id: i.id, cantidad: i.cantidad, extras: i.extras.map(e => e.id), notas: i.notas || null })),
            retiro: S.horaElegida === 'asap' ? { asap: true } : { asap: false, en: S.horaElegida },
            cliente: { email, acepta_publicidad: $('co-publi').checked },
            idioma: LANG, idempotency_key: S.claveIntento, total_visto: Math.round(totalCarrito() * 100) / 100,
            web: $('co-web').value || null,
        }) }, CARRITO.codigo);
        clearTimeout(reloj);
        _ls.set(CLAVE_PEDIDO, r.token);
        await api(`/publico/takeaway/pedidos/${encodeURIComponent(r.token)}/pagar`, { method: 'POST' }, CARRITO.codigo);
        CARRITO = { codigo: CODIGO_SITIO, items: [] }; guardarCarrito(); S.claveIntento = null;
        location.hash = `#pedido/${r.token}`;
    } catch (e) {
        clearTimeout(reloj);
        btn.disabled = false; pintarResumenCheckout();
        if (e.status === 409 && e.data && e.data.total != null) {
            // El server recalculó y el total no es el que vio el cliente: se refresca el menú
            // y se le pide que confirme de nuevo (nunca se cobra un importe que no vio).
            delete _menus[CARRITO.codigo]; S.claveIntento = null;
            await actualizarPreciosCarrito();
            return mostrarErrCo(t('err_precio', { t: dinero(e.data.total) }));
        }
        // El local perdió la conexión (servidor local caído): no se pueden tomar pedidos.
        if (e.status === 503) return mostrarErrCo(t('no_disponible'));
        if (e.status === 409 && e.data && e.data.retiro) { S.horaElegida = null; delete _menus[CARRITO.codigo]; pintarCheckout(); }
        mostrarErrCo((LANG === 'es' && e.data && typeof e.data.detail === 'string') ? e.data.detail : t('err_general'));
    }
}

// ══ Seguimiento ═══════════════════════════════════════════════════════════════
let _reloj = null;
async function pintarPedido(cod, token) {
    clearTimeout(_reloj);
    if (!cod || !token) { location.hash = '#home'; return; }
    let p;
    try { p = await api(`/publico/takeaway/pedidos/${encodeURIComponent(token)}`, {}, cod); }
    catch (e) { $('vista').innerHTML = `<section class="bloque"><div class="envase"><p class="nota">${esc(t('err_general'))}</p></div></section>`; return; }
    if (rutaActual().vista !== 'pedido') return;
    MONEDA = (p.moneda && p.moneda.codigo) || MONEDA;
    const pago = p.pago, coc = p.cocina;
    let cabeza, titulo, sub = '', acciones = '', cada = 0;
    const hora = p.retiro_en ? p.retiro_en.slice(11, 16) : '';
    if (pago === 'esperando') {
        cabeza = '<div class="pulso"><span></span><span></span><span></span></div>';
        titulo = t('esperando_pago'); sub = t('esperando_det'); cada = 3000;
        acciones = `<button class="btn btn-borde" onclick="cancelarPedido('${esc(cod)}','${esc(token)}')">${esc(t('cancelar_pedido'))}</button>`;
    } else if (pago === 'rechazado') {
        cabeza = '<span class="cp-dot sello" style="filter:grayscale(1);opacity:.5" aria-hidden="true"></span>';
        titulo = t('pago_rechazado');
        acciones = `<button class="btn btn-navy" onclick="reintentarPago('${esc(cod)}','${esc(token)}')">${esc(t('reintentar'))}</button>
            <button class="btn btn-borde" onclick="cancelarPedido('${esc(cod)}','${esc(token)}')">${esc(t('cancelar_pedido'))}</button>`;
    } else if (pago === 'cancelado' || pago === 'expirado' || coc === 'cancelado') {
        cabeza = '<span class="cp-dot sello" style="filter:grayscale(1);opacity:.5" aria-hidden="true"></span>';
        titulo = t('cancelado'); sub = pago === 'expirado' ? t('pago_vencido') : '';
        acciones = `<a class="btn btn-navy" href="#menu">${esc(t('volver_menu'))}</a>`;
        _ls.del(CLAVE_PEDIDO);
    } else if (coc === 'lista') {
        cabeza = '<span class="cp-dot sello vivo" aria-hidden="true"></span>'; titulo = t('listo'); cada = 15000;
    } else if (coc === 'entregado') {
        cabeza = '<span class="cp-dot sello" aria-hidden="true"></span>'; titulo = t('entregado');
        _ls.del(CLAVE_PEDIDO);
    } else if (coc === 'programado') {
        cabeza = '<span class="cp-dot sello" aria-hidden="true"></span>'; titulo = t('recibido'); sub = t('programado', { h: hora }); cada = 30000;
    } else {
        cabeza = '<div class="pulso"><span></span><span></span><span></span></div>'; titulo = t('en_prep'); cada = 10000;
    }
    const orden = ['pago', 'prep', 'listo', 'entregado'];
    const idx = pago !== 'aprobado' ? -1 : (coc === 'entregado' ? 3 : coc === 'lista' ? 2 : 1);
    const pasos = pago === 'aprobado' ? `<div class="pasos">${orden.map((k, i) =>
        `<div class="paso${i < idx ? ' hecho' : (i === idx ? ' actual' : '')}"><span class="m"></span>${esc(t('p_' + k))}</div>`).join('')}</div>` : '';
    const mapa = p.local && (urlSegura(p.local.mapa_url) || (p.local.direccion ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.local.direccion) : null));
    const corto = p.numero_corto || String((p.numero || 0) % 1000).padStart(3, '0');
    const numeroHtml = pago === 'aprobado' ? `<div class="numero-pedido">
            <span class="t">${esc(t('tu_numero'))}</span><b>${esc(corto)}</b>
            <span class="d">${esc(t('tu_numero_det'))}</span></div>` : '';
    $('vista').innerHTML = `<section class="seguimiento">
        ${cabeza}
        <h1>${esc(titulo)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
        ${numeroHtml}
        ${pasos}
        <div class="talon">
            <div class="li"><span>${esc(t('pedido_n', { n: p.numero }))}</span><b>${esc(dinero(p.total))}</b></div>
            <div class="li"><span>${esc(t('local'))}</span><b>${esc(p.local ? p.local.nombre : '')}</b></div>
            <div class="li"><span>${esc(t('retira'))}</span><b>${esc(p.retiro_asap ? t('asap') : retiroTxt(p.retiro_en))}</b></div>
            ${(p.items || []).map(i => `<div class="li"><span>${i.cantidad} × ${esc(i.nombre)}</span><b>${esc(dinero(i.total))}</b></div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
            ${acciones}
            ${pago === 'aprobado' && mapa ? `<a class="btn btn-borde" href="${esc(mapa)}" target="_blank" rel="noopener">${svg.pin}${esc(t('como_llegar'))}</a>` : ''}
            ${urlSegura(p.ticket_url) ? `<a class="btn btn-borde" href="${esc(p.ticket_url)}" target="_blank" rel="noopener">${esc(t('ver_ticket'))}</a>` : ''}
        </div>
    </section>` + pieHtml();
    if (cada) _reloj = setTimeout(() => { if (rutaActual().vista === 'pedido') pintarPedido(cod, token); }, cada);
}
async function cancelarPedido(cod, token) {
    try { await api(`/publico/takeaway/pedidos/${encodeURIComponent(token)}/cancelar`, { method: 'POST' }, cod); } catch (_) {}
    pintarPedido(cod, token);
}
async function reintentarPago(cod, token) {
    try { await api(`/publico/takeaway/pedidos/${encodeURIComponent(token)}/pagar`, { method: 'POST' }, cod); } catch (_) {}
    pintarPedido(cod, token);
}

// ══ Arranque ══════════════════════════════════════════════════════════════════
async function init() {
    LANG = elegirIdioma(); aplicarTextos();
    if (!CODIGO_SITIO) { $('vista').innerHTML = `<section class="bloque"><div class="envase"><p class="nota">${esc(t('sin_sitio'))}</p></div></section>`; return; }
    try { S.sitio = await conEspera($('carga-inicial'), api('/publico/takeaway/local/' + encodeURIComponent(CODIGO_SITIO))); }
    catch (e) { $('vista').innerHTML = `<section class="bloque"><div class="envase"><p class="nota">${esc(t('sin_sitio'))}</p></div></section>`; return; }
    const h = S.sitio.home || {};
    if (Array.isArray(h.idiomas) && h.idiomas.length) { IDIOMAS = h.idiomas.filter(c => TXT[c]); LANG = elegirIdioma(); }
    const nombre = S.sitio.local.nombre;
    MONEDA = (S.sitio.local.moneda && S.sitio.local.moneda.codigo) || MONEDA;
    $('marca-nom').textContent = nombre;
    if (urlSegura(h.logo_url)) $('marca').innerHTML = `<img src="${esc(h.logo_url)}" alt=""><span>${esc(nombre)}</span>`;
    document.title = nombre;
    aplicarTextos();
    // Volver al pedido en curso si quedó uno abierto (recargar la página no lo pierde).
    if (!location.hash) {
        const tok = _ls.get(CLAVE_PEDIDO);
        if (tok) { location.hash = `#pedido/${tok}`; return; }
    }
    render();
}
init();
</script>
