<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante — Mensajes</title>
<script id="tema-boot">try{var s=localStorage.getItem('token'),k='@anon';if(s){var p=JSON.parse(atob(s.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));k=(p.admin_override||p.rol==='superadmin')?'@super':(p.sub||'@anon');}var t=localStorage.getItem('tema::'+k)||localStorage.getItem('tema_ultimo')||'auto';document.documentElement.dataset.tema=(t==='auto')?(matchMedia('(prefers-color-scheme:dark)').matches?'oscuro':'claro'):t;}catch(e){}</script>
<link rel="stylesheet" href="css/tema.css?v=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--sup-app, #f0f2f5); min-height: 100vh; }
        .navbar { background: #1a1a2e; color: white; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .navbar-brand { font-size: 18px; font-weight: 700; }
        .navbar-links { display: flex; gap: 16px; align-items: center; }
        .btn-logout { background: transparent; border: 1px solid var(--ac, #4f46e5); color: var(--nav-tx, #a5b4fc); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-logout:hover { background: var(--ac, #4f46e5); color: var(--tx-inv, white); }
        .content { margin-top: 60px; padding: 32px; max-width: 900px; margin-left: auto; margin-right: auto; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 700; color: var(--tx, #1a1a2e); }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 4px; background: var(--sup, white); border-radius: 10px; padding: 4px; box-shadow: var(--sh-1, 0 2px 8px rgba(0,0,0,0.06)); margin-bottom: 20px; width: fit-content; }
        .tab-btn { padding: 8px 20px; border: none; border-radius: 7px; background: transparent; color: var(--tx-3, #6b7280); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; }
        .tab-btn:hover { background: var(--sup-3, #f3f4f6); color: var(--tx-2, #374151); }
        .tab-btn.active { background: var(--ac, #4f46e5); color: var(--tx-inv, white); }
        .tab-badge { background: var(--pel, #dc2626); color: var(--tx-inv, white); border-radius: 10px; font-size: 10px; font-weight: 800; padding: 1px 6px; min-width: 18px; text-align: center; }
        .tab-btn.active .tab-badge { background: rgba(255,255,255,0.3); }
        /* Filtro por categoría (chips) */
        .cat-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
        .cat-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--bd, #e5e7eb); background: var(--sup, white); color: var(--tx-3, #6b7280); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .12s; }
        .cat-chip:hover { border-color: var(--ac-bd, #c7d2fe); color: var(--tx-ac, #4f46e5); }
        .cat-chip.active { background: var(--ac, #4f46e5); border-color: var(--ac, #4f46e5); color: var(--tx-inv, white); }
        .cat-chip .cat-count { background: var(--pel, #dc2626); color: var(--tx-inv, white); border-radius: 10px; font-size: 10px; font-weight: 800; padding: 0 6px; min-width: 16px; text-align: center; }
        .cat-chip.active .cat-count { background: rgba(255,255,255,0.35); }
        .msg-cat-badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; white-space: nowrap; margin-top: 4px; }
        .cat-chip.esp.active { background: #b45309; border-color: #b45309; }

        /* ── Toolbar: búsqueda + cantidad ── */
        .msg-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .msg-buscar-wrap { position: relative; flex: 1; min-width: 220px; }
        .msg-buscar-wrap .lupa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--tx-4, #9ca3af); pointer-events: none; }
        #msg-buscar { width: 100%; border: 1.5px solid var(--bd-2, #e0e0e0); border-radius: 8px; padding: 9px 34px 9px 34px; font-size: 13px; outline: none; transition: border-color .15s; background: var(--sup, white); color: var(--tx, #1a1a2e); }
        #msg-buscar:focus { border-color: var(--ac, #4f46e5); }
        .msg-buscar-x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--tx-4, #9ca3af); font-size: 13px; padding: 2px 4px; display: none; }
        .msg-buscar-x:hover { color: var(--tx-2, #374151); }
        .msg-max-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx-3, #6b7280); font-weight: 600; }
        #msg-max { border: 1.5px solid var(--bd-2, #e0e0e0); border-radius: 8px; padding: 8px 8px; font-size: 12.5px; background: var(--sup, white); color: var(--tx-2, #374151); cursor: pointer; outline: none; }

        /* ── Acciones por tarjeta ── */
        .msg-acciones { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
        .msg-card:hover .msg-acciones { opacity: 1; }
        @media (hover: none) { .msg-acciones { opacity: 1; } }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 3px 5px; border-radius: 6px; line-height: 1; filter: grayscale(1); opacity: .55; transition: all .12s; }
        .icon-btn:hover { background: var(--sup-3, #f3f4f6); filter: none; opacity: 1; }
        .icon-btn.fav-on { filter: none; opacity: 1; }
        .msg-adj-ind { font-size: 11px; color: var(--tx-3, #6b7280); }

        /* ── Botón "Mostrar más" ── */
        .btn-mas { background: var(--sup, white); color: var(--tx-ac, #4f46e5); border: 1.5px dashed var(--ac-bd, #c7d2fe); padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all .15s; }
        .btn-mas:hover { background: var(--ac-sf, #f0f0ff); border-style: solid; }

        /* ── Adjuntos (compose) ── */
        .adj-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .adj-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sup-3, #f3f4f6); border: 1px solid var(--bd, #e5e7eb); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--tx-2, #374151); max-width: 100%; }
        .adj-chip .adj-nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
        .adj-chip button { background: none; border: none; cursor: pointer; color: var(--tx-4, #9ca3af); font-size: 11px; padding: 0 1px; line-height: 1; }
        .adj-chip button:hover { color: var(--pel-tx-2, #dc2626); }
        .btn-adjuntar { background: var(--sup, white); color: var(--tx-3, #6b7280); border: 1.5px dashed var(--bd-3, #d1d5db); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; width: fit-content; transition: all .15s; }
        .btn-adjuntar:hover { border-color: var(--ac, #4f46e5); color: var(--tx-ac, #4f46e5); }

        /* ── Adjuntos (ver mensaje) ── */
        .adj-view { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--bd-4, #f0f0f0); padding-top: 12px; }
        .adj-view-titulo { font-size: 11px; font-weight: 700; color: var(--tx-4, #9ca3af); text-transform: uppercase; letter-spacing: .5px; }
        .adj-view img { max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid var(--bd-4, #eee); object-fit: contain; align-self: flex-start; }
        .adj-file { display: inline-flex; align-items: center; gap: 6px; background: var(--sup-2, #f8f8ff); border: 1px solid var(--bd-5, #e0e0f5); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--tx-ac, #4f46e5); font-weight: 600; text-decoration: none; width: fit-content; max-width: 100%; }
        .adj-file:hover { background: var(--ac-sf-2, #ede9fe); }

        /* ── Etiqueta y acciones en el modal ver ── */
        .det-etiqueta-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .det-etiqueta-wrap label { font-size: 11.5px; color: var(--tx-3, #6b7280); font-weight: 700; }
        #det-etiqueta { border: 1.5px solid var(--bd-2, #e0e0e0); border-radius: 7px; padding: 6px 8px; font-size: 12.5px; color: var(--tx-2, #374151); background: var(--sup, white); cursor: pointer; outline: none; }

        /* ── Modal confirmación de eliminación (mensaje sin leer) ── */
        .modal-alerta { background: var(--sup, white); border-radius: 14px; width: 420px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); overflow: hidden; }
        .alerta-head { background: var(--pel-sf-2, #fef2f2); padding: 18px 22px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--pel-bd, #fecaca); }
        .alerta-head .alerta-icono { font-size: 24px; }
        .alerta-head h3 { font-size: 15px; font-weight: 800; color: var(--pel-tx, #b91c1c); }
        .alerta-body { padding: 18px 22px; font-size: 13.5px; color: var(--tx-2, #374151); line-height: 1.6; }
        .alerta-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--bd-4, #f0f0f0); }
        .btn-eliminar-rojo { background: var(--pel, #dc2626); color: var(--tx-inv, white); border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .btn-eliminar-rojo:hover { background: #b91c1c; }

        /* ── Mensaje lista ── */
        .mensajes-lista { display: flex; flex-direction: column; gap: 8px; }
        .msg-card {
            background: var(--sup, white); border-radius: 10px; padding: 14px 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer;
            border-left: 3px solid transparent; transition: all .15s;
            display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
        }
        .msg-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
        .msg-card.no-leido { border-left-color: var(--ac, #4f46e5); background: var(--sup-2, #fafaff); }
        .msg-card.no-leido .msg-asunto { font-weight: 800; }
        .msg-card.es-cc .msg-asunto { color: var(--tx-3, #6b7280); }
        .msg-from { font-size: 12px; color: var(--tx-3, #6b7280); margin-bottom: 3px; }
        .msg-from strong { color: var(--tx-2, #374151); }
        .msg-asunto { font-size: 14px; font-weight: 600; color: var(--tx, #1a1a2e); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-preview { font-size: 12px; color: var(--tx-4, #9ca3af); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .msg-fecha { font-size: 11px; color: var(--tx-4, #9ca3af); white-space: nowrap; }
        .msg-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac, #4f46e5); }
        .badge-cc { font-size: 10px; background: #f3f4f6; color: #6b7280; border-radius: 4px; padding: 1px 5px; font-weight: 700; }

        /* ── Empty / Loading ── */
        .empty-state { text-align: center; padding: 56px 24px; color: var(--tx-4, #9ca3af); font-size: 14px; background: var(--sup, white); border-radius: 12px; box-shadow: var(--sh-1, 0 2px 8px rgba(0,0,0,0.06)); }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .loading { text-align: center; padding: 40px; color: var(--tx-4, #9ca3af); font-size: 14px; }

        /* ── Botón nuevo mensaje ── */
        .btn-nuevo { background: var(--ac, #4f46e5); color: var(--tx-inv, white); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: background .15s; }
        .btn-nuevo:hover { background: var(--ac-h, #4338ca); }

        /* ── Modal base ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.open { display: flex; }

        /* ── Modal ver mensaje ── */
        .modal-msg { background: var(--sup, white); border-radius: 14px; width: 600px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 14px; border-bottom: 1px solid var(--bd-4, #f0f0f0); gap: 12px; }
        .modal-head-info { flex: 1; min-width: 0; }
        .modal-asunto { font-size: 17px; font-weight: 700; color: var(--tx, #1a1a2e); margin-bottom: 6px; word-break: break-word; }
        .modal-meta { font-size: 12px; color: var(--tx-3, #6b7280); line-height: 1.6; }
        .modal-meta strong { color: var(--tx-2, #374151); }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--tx-4, #9ca3af); padding: 4px; border-radius: 4px; flex-shrink: 0; }
        .modal-close:hover { color: var(--tx-2, #374151); }
        .modal-body { padding: 20px 24px; flex: 1; }
        .modal-cuerpo { font-size: 14px; color: var(--tx-2, #374151); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .modal-foot { display: flex; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--bd-4, #f0f0f0); }
        .btn-responder { background: var(--ac-sf, #f0f0ff); color: var(--tx-ac, #4f46e5); border: 1.5px solid var(--ac-bd, #c7d2fe); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all .15s; }
        .btn-responder:hover { background: var(--ac, #4f46e5); color: var(--tx-inv, white); }

        /* ── Cita en respuesta ── */
        .cita-original { margin-top: 16px; padding: 12px 14px; background: var(--sup-2, #f8f8f8); border-left: 3px solid var(--ac-bd, #c7d2fe); border-radius: 0 6px 6px 0; }
        .cita-header { font-size: 11px; color: var(--tx-4, #9ca3af); font-weight: 600; margin-bottom: 8px; }
        .cita-texto { font-size: 13px; color: var(--tx-3, #6b7280); white-space: pre-wrap; word-break: break-word; }

        /* ── Modal compose ── */
        .modal-compose { background: var(--sup, white); border-radius: 14px; width: 600px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .compose-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px; border-bottom: 1px solid var(--bd-4, #f0f0f0); flex-shrink: 0; }
        .compose-head h3 { font-size: 16px; font-weight: 700; color: var(--tx, #1a1a2e); }
        .compose-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--tx-3, #6b7280); text-transform: uppercase; letter-spacing: .5px; }
        .form-group input,
        .form-group textarea { border: 1.5px solid var(--bd-2, #e0e0e0); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; color: var(--tx, #1a1a2e); resize: vertical; }
        .form-group input:focus,
        .form-group textarea:focus { border-color: var(--ac, #4f46e5); }
        .form-group textarea { min-height: 130px; }
        .compose-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--bd-4, #f0f0f0); flex-shrink: 0; }
        .btn-cancel { background: var(--sup, white); color: var(--tx-10, #444); border: 1.5px solid var(--bd-2, #e0e0e0); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-cancel:hover { border-color: var(--ac, #4f46e5); color: var(--tx-ac, #4f46e5); }
        .btn-send { background: var(--ac, #4f46e5); color: var(--tx-inv, white); border: none; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .btn-send:hover { background: var(--ac-h, #4338ca); }
        .btn-send:disabled { opacity: .6; cursor: not-allowed; }

        /* ── Tags de destinatarios ── */
        .tags-input-wrap {
            border: 1.5px solid var(--bd-2, #e0e0e0); border-radius: 8px; padding: 6px 8px;
            display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
            min-height: 42px; transition: border-color .15s; cursor: text;
        }
        .tags-input-wrap:focus-within { border-color: var(--ac, #4f46e5); }
        .dest-tag {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--ac-sf-2, #ede9fe); color: var(--tx-ac, #4f46e5); border-radius: 6px;
            padding: 3px 8px; font-size: 12px; font-weight: 600;
        }
        .dest-tag.cc { background: var(--av-sf, #fef3c7); color: var(--av-tx, #92400e); }
        .dest-tag button {
            background: none; border: none; cursor: pointer; color: inherit;
            font-size: 11px; padding: 0 1px; line-height: 1; opacity: .7;
        }
        .dest-tag button:hover { opacity: 1; }
        .tags-add-sel {
            border: none; outline: none; font-size: 12px; color: var(--tx-4, #9ca3af);
            background: transparent; cursor: pointer; padding: 2px 4px;
            min-width: 160px; flex: 1;
        }
        .tags-empty { font-size: 12px; color: #c4b5fd; font-style: italic; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content" style="margin-top:92px;">
    <div class="page-header">
        <h2>💬 Mensajes</h2>
        <button class="btn-nuevo" onclick="abrirCompose()">✉️ Nuevo mensaje</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-recibidos" onclick="setTab('recibidos')">
            📥 Recibidos
            <span class="tab-badge" id="badge-noLeidos" style="display:none;">0</span>
        </button>
        <button class="tab-btn" id="tab-enviados" onclick="setTab('enviados')">
            📤 Enviados
        </button>
        <button class="tab-btn" id="tab-papelera" onclick="setTab('papelera')"
                title="Mensajes eliminados — se guardan 30 días y se pueden recuperar">
            🗑 Eliminados
        </button>
        <button class="tab-btn" id="tab-cadena" onclick="toggleCadena()" style="display:none; margin-left:auto;"
                title="Ver tus mensajes recibidos de todos tus restaurantes">
            🌐 Todos mis locales
        </button>
    </div>

    <!-- Búsqueda + cantidad máxima -->
    <div class="msg-toolbar" id="msg-toolbar">
        <div class="msg-buscar-wrap">
            <span class="lupa">🔍</span>
            <input type="text" id="msg-buscar" placeholder="Buscar por asunto, contenido o persona..."
                   oninput="buscarMensajes(this.value)">
            <button class="msg-buscar-x" id="msg-buscar-x" onclick="limpiarBusqueda()" title="Limpiar búsqueda">✕</button>
        </div>
        <div class="msg-max-wrap">
            <span>Mostrar</span>
            <select id="msg-max" onchange="cambiarMax(this.value)">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>

    <!-- Filtro por categoría (solo en recibidos) -->
    <div class="cat-filtros" id="cat-filtros" style="display:none;"></div>

    <!-- Lista -->
    <div class="mensajes-lista" id="mensajes-lista">
        <div class="loading">Cargando...</div>
    </div>
</div>

<!-- Modal: ver mensaje -->
<div class="modal-overlay" id="modal-ver">
    <div class="modal-msg">
        <div class="modal-head">
            <div class="modal-head-info">
                <div class="modal-asunto" id="det-asunto">—</div>
                <div class="modal-meta" id="det-meta">—</div>
            </div>
            <button class="modal-close" onclick="cerrarVer()">✕</button>
        </div>
        <div class="modal-body">
            <div class="modal-cuerpo" id="det-cuerpo">—</div>
        </div>
        <div class="modal-foot" id="modal-ver-foot" style="display:none; align-items:center; flex-wrap:wrap;">
            <button class="btn-responder" id="det-responder" onclick="responderOReenviar()">↩️ Responder</button>
            <button class="icon-btn" id="det-fav" style="font-size:17px;" onclick="toggleFavoritoModal()" title="Favorito">☆</button>
            <button class="icon-btn" id="det-arch" style="font-size:16px;" onclick="toggleArchivadoModal()" title="Archivar">🗂️</button>
            <button class="icon-btn" style="font-size:16px;" onclick="eliminarDesdeModal()" title="Eliminar">🗑️</button>
            <div class="det-etiqueta-wrap" id="det-etiqueta-wrap">
                <label>🏷️ Etiqueta</label>
                <select id="det-etiqueta" onchange="cambiarEtiqueta(this.value)"></select>
            </div>
        </div>
        <div class="modal-foot" id="modal-ver-foot-pap" style="display:none; align-items:center; gap:10px;">
            <button class="btn-responder" onclick="recuperarDesdeModal()">♻️ Recuperar</button>
            <button class="icon-btn" style="font-size:16px;" onclick="eliminarDefDesdeModal()" title="Eliminar definitivamente">🗑️</button>
            <span id="det-pap-info" style="font-size:12px;color: var(--av-tx, #92400e);font-weight:600;"></span>
        </div>
    </div>
</div>

<!-- Modal: confirmar eliminación de mensaje SIN LEER -->
<div class="modal-overlay" id="modal-confirm-del">
    <div class="modal-alerta">
        <div class="alerta-head">
            <span class="alerta-icono">⚠️</span>
            <h3>Mensaje sin leer</h3>
        </div>
        <div class="alerta-body">
            Estás por eliminar un mensaje que <strong>todavía no leíste</strong>.<br>
            ¿Querés eliminarlo de todas formas?
        </div>
        <div class="alerta-foot">
            <button class="btn-cancel" onclick="cerrarConfirmDel()">Cancelar</button>
            <button class="btn-eliminar-rojo" onclick="confirmarEliminacion()">🗑️ Eliminar igual</button>
        </div>
    </div>
</div>

<!-- Modal: componer -->
<div class="modal-overlay" id="modal-compose">
    <div class="modal-compose">
        <div class="compose-head">
            <h3 id="compose-titulo">✉️ Nuevo mensaje</h3>
            <button class="modal-close" onclick="cerrarCompose()">✕</button>
        </div>
        <div class="compose-body">

            <!-- Para (multi-tag) -->
            <div class="form-group">
                <label>Para <span style="font-weight:400;color: var(--tx-4, #9ca3af);text-transform:none;font-size:11px;">— destinatarios principales</span></label>
                <div class="tags-input-wrap" id="para-wrap" onclick="document.getElementById('para-add').focus()">
                    <div id="para-tags" style="display:contents;"></div>
                    <select class="tags-add-sel" id="para-add" onchange="addDest('para',this)">
                        <option value="">+ Añadir destinatario...</option>
                    </select>
                </div>
            </div>

            <!-- CC (multi-tag) -->
            <div class="form-group">
                <label>CC <span style="font-weight:400;color: var(--tx-4, #9ca3af);text-transform:none;font-size:11px;">— en copia (opcional)</span></label>
                <div class="tags-input-wrap" id="cc-wrap" onclick="document.getElementById('cc-add').focus()">
                    <div id="cc-tags" style="display:contents;"></div>
                    <select class="tags-add-sel" id="cc-add" onchange="addDest('cc',this)">
                        <option value="">+ Añadir en copia...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Asunto</label>
                <input type="text" id="compose-asunto" placeholder="Asunto del mensaje" maxlength="200">
            </div>
            <div class="form-group">
                <label>Mensaje</label>
                <textarea id="compose-cuerpo" placeholder="Escribí tu mensaje..."></textarea>
            </div>

            <!-- Adjuntos (Cloudinary) -->
            <div class="form-group">
                <label>Adjuntos <span style="font-weight:400;color: var(--tx-4, #9ca3af);text-transform:none;font-size:11px;">— opcional, máx 15 MB c/u</span></label>
                <input type="file" id="compose-files" multiple style="display:none;" onchange="filesElegidos(this)">
                <div class="adj-chips" id="adj-chips" style="display:none;"></div>
                <button type="button" class="btn-adjuntar" onclick="document.getElementById('compose-files').click()">📎 Adjuntar archivos</button>
            </div>
        </div>
        <div class="compose-foot">
            <button class="btn-cancel" onclick="cerrarCompose()">Cancelar</button>
            <button class="btn-send" id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

// Empleado de cadena (contexto cuenta): bandeja AGREGADA de sus locales, solo lectura
// (reutiliza la vista "cadena"). Enviar se hace entrando a un restaurante puntual.
const _emp = (typeof esEmpleadoCadena === 'function' && esEmpleadoCadena()
              && (typeof enCuenta !== 'function' || enCuenta()));

let _tabActual   = "recibidos";
let _cadena      = false;   // ver recibidos de todos mis locales
let _misLocales  = [];
let _mensajes    = [];
let _catFiltro   = "_nuevos"; // filtro por categoría — por defecto NUEVOS (no leídos); "_fav"/"_arch" especiales
let _busqueda    = "";        // filtro de búsqueda (asunto/cuerpo/persona)
let _maxMostrar  = parseInt(localStorage.getItem("msg_max") || "25", 10) || 25;  // cantidad por página
let _mostrando   = _maxMostrar;   // cuántos se están mostrando (crece con "Mostrar más")
let _delPendiente = null;     // id del mensaje sin leer esperando confirmación de borrado
let _archivosAdj  = [];       // File[] elegidos en el compose (se suben al enviar)

// Metadata de categorías (según de qué servicio parte el mensaje).
const _CAT_INFO = {
    horarios:   { label: "Horarios",   icono: "📅", bg: "#dbeafe", fg: "#1e40af" },
    social:     { label: "Social",     icono: "📣", bg: "#ede9fe", fg: "#6d28d9" },
    personal:   { label: "Personal",   icono: "👥", bg: "#f3f4f6", fg: "#4b5563" },
    documentos: { label: "Documentos", icono: "📁", bg: "#fef3c7", fg: "#92400e" },
    tareas:     { label: "Tareas",     icono: "📋", bg: "#dcfce7", fg: "#166534" },
    stock:      { label: "Control de Stock", icono: "📦", bg: "#fee2e2", fg: "#b91c1c" },
};
function _catDe(m) { return _CAT_INFO[m.categoria] ? m.categoria : "personal"; }
let _usuariosMap = {};   // id → {id, username, rol}
let _msgActual   = null; // mensaje abierto actualmente en el modal-ver

// Estado del compose
let _paraDests = [];  // [{id, username}]
let _ccDests   = [];

// ── Init ──────────────────────────────────────────────────────
async function init() {
    const selMax = document.getElementById("msg-max");
    if (selMax) selMax.value = String(_maxMostrar);
    if (_emp) {
        if (typeof volverACuenta === 'function') volverACuenta();
        const h2 = document.querySelector('.page-header h2'); if (h2) h2.textContent = '💬 Mis mensajes';
        document.querySelector('.btn-nuevo')?.style.setProperty('display', 'none');
        document.querySelector('.tabs')?.style.setProperty('display', 'none');
        _cadena = true; _tabActual = 'recibidos';   // vista agregada read-only
        await cargarMensajes();
        return;
    }
    await cargarUsuarios();
    try {
        _misLocales = await apiFetch('/auth/mis-locales');
        if (_misLocales && _misLocales.length > 1) document.getElementById('tab-cadena').style.display = '';
    } catch (e) {}
    await cargarMensajes();
}

async function cargarUsuarios() {
    try {
        const lista = await apiFetch("/mensajes/usuarios");
        _usuariosMap = {};
        for (const u of lista) {
            _usuariosMap[u.id] = u;
        }
        _poblarSelectsUsuarios();
    } catch(e) {
        console.warn("No se pudieron cargar usuarios:", e);
    }
}

function _poblarSelectsUsuarios() {
    ["para-add", "cc-add"].forEach(selId => {
        const sel = document.getElementById(selId);
        const placeholder = selId === "para-add"
            ? "+ Añadir destinatario..."
            : "+ Añadir en copia...";
        sel.innerHTML = `<option value="">${placeholder}</option>`;
        for (const u of Object.values(_usuariosMap)) {
            const opt = document.createElement("option");
            opt.value       = u.id;
            opt.textContent = displayName(u) + (u.rol ? ` (${u.rol})` : "");
            sel.appendChild(opt);
        }
    });
    _actualizarSelectsDisponibles();
}

async function cargarMensajes() {
    const lista = document.getElementById("mensajes-lista");
    lista.innerHTML = '<div class="loading">Cargando...</div>';
    try {
        if (_emp) { _mensajes = await apiFetch('/empleado/mensajes', { token: getEmpToken() }); renderLista(); return; }
        const endpoint = _cadena ? "/mensajes/recibidos-cadena"
                       : (_tabActual === "papelera" ? "/mensajes/papelera"
                       : (_tabActual === "recibidos" ? "/mensajes/recibidos" : "/mensajes/enviados"));
        _mensajes = await apiFetch(endpoint);
        renderLista();
        if (!_cadena && _tabActual === "recibidos") actualizarBadge();
    } catch(e) {
        lista.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div>Error al cargar mensajes</div>`;
    }
}

// El filtro por categoría solo aplica en la bandeja de recibidos (propios o de cadena).
function _mostrarFiltroCat() {
    return _tabActual === "recibidos";
}

function renderChipsCat() {
    const cont = document.getElementById("cat-filtros");
    if (!cont) return;
    if (!_mostrarFiltroCat()) { cont.style.display = "none"; return; }
    // Contar NO leídos por categoría (sin archivados: no molestan en la bandeja)
    const noLeidos = {};
    let totalNoLeidos = 0, nFav = 0, nArch = 0;
    _mensajes.forEach(m => {
        if (m.favorito) nFav++;
        if (m.archivado) { nArch++; return; }
        if (m.leido) return;
        const c = _catDe(m);
        noLeidos[c] = (noLeidos[c] || 0) + 1;
        totalNoLeidos++;
    });
    // Categorías a mostrar: siempre Horarios/Social/Personal; Documentos/Tareas solo si hay.
    const cats = ["horarios", "social", "personal"];
    if (_mensajes.some(m => _catDe(m) === "documentos")) cats.push("documentos");
    if (_mensajes.some(m => _catDe(m) === "tareas")) cats.push("tareas");
    if (_mensajes.some(m => _catDe(m) === "stock")) cats.push("stock");
    const chip = (key, label, icono, count, esp) => {
        const cnt = count ? `<span class="cat-count">${count}</span>` : "";
        return `<button class="cat-chip ${esp ? "esp" : ""} ${_catFiltro === key ? "active" : ""}" onclick="filtrarCat('${key}')">${icono ? icono + " " : ""}${label}${cnt}</button>`;
    };
    // Vista compacta (2026-07-19): visibles solo Nuevos / Todos / Favoritos / 📂 Categorías.
    // "Categorías" despliega el resto (las categorías + Archivados). Si el filtro activo
    // es uno de los ocultos, el desplegable queda abierto solo.
    const ocultas = [...cats, "_arch"];
    if (ocultas.includes(_catFiltro)) _catsAbiertas = true;
    const noLeidosCats = cats.reduce((s, c) => s + (noLeidos[c] || 0), 0);
    let html = chip("_nuevos", "Nuevos", "🆕", totalNoLeidos);
    html += chip("todos", "Todos", "", 0);
    // Favoritos (los flags viven en la copia del destinatario; no en modo empleado-cadena)
    if (!_emp) html += chip("_fav", "Favoritos", "⭐", 0, true);
    const cntCats = noLeidosCats ? `<span class="cat-count">${noLeidosCats}</span>` : "";
    html += `<button class="cat-chip ${_catsAbiertas || ocultas.includes(_catFiltro) ? "active" : ""}"
                     onclick="toggleCatsDesplegable()">📂 Categorías${cntCats} ${_catsAbiertas ? "▴" : "▾"}</button>`;
    if (_catsAbiertas) {
        cats.forEach(c => { const i = _CAT_INFO[c]; html += chip(c, i.label, i.icono, noLeidos[c] || 0); });
        if (!_emp) html += chip("_arch", `Archivados${nArch ? ` (${nArch})` : ""}`, "🗂️", 0, true);
    }
    cont.innerHTML = html;
    cont.style.display = "flex";
}

let _catsAbiertas = false;
function toggleCatsDesplegable() {
    _catsAbiertas = !_catsAbiertas;
    // Al cerrar el desplegable con un filtro oculto activo, volver a "Nuevos"
    if (!_catsAbiertas) {
        const ocultas = ["horarios", "social", "personal", "documentos", "tareas", "stock", "_arch"];
        if (ocultas.includes(_catFiltro)) { _catFiltro = "_nuevos"; renderLista(); return; }
    }
    renderChipsCat();
}

function filtrarCat(cat) {
    _catFiltro = cat;
    _mostrando = _maxMostrar;
    renderLista();
}

// ── Búsqueda / cantidad ───────────────────────────────────────
function buscarMensajes(txt) {
    _busqueda = (txt || "").trim().toLowerCase();
    _mostrando = _maxMostrar;
    const x = document.getElementById("msg-buscar-x");
    if (x) x.style.display = _busqueda ? "block" : "none";
    renderLista();
}

function limpiarBusqueda() {
    const inp = document.getElementById("msg-buscar");
    if (inp) inp.value = "";
    buscarMensajes("");
}

function cambiarMax(v) {
    _maxMostrar = parseInt(v, 10) || 25;
    localStorage.setItem("msg_max", String(_maxMostrar));
    _mostrando = _maxMostrar;
    renderLista();
}

function mostrarMas() {
    _mostrando += _maxMostrar;
    renderLista();
}

function _porId(id) { return _mensajes.find(m => m.id === id); }

function _mensajesFiltrados() {
    let visibles = _mensajes;
    if (_mostrarFiltroCat()) {
        if (_catFiltro === "_arch")     visibles = visibles.filter(m => m.archivado);
        else {
            visibles = visibles.filter(m => !m.archivado);   // archivados fuera de la bandeja
            if (_catFiltro === "_nuevos")        visibles = visibles.filter(m => !m.leido);
            else if (_catFiltro === "_fav")      visibles = visibles.filter(m => m.favorito);
            else if (_catFiltro !== "todos")     visibles = visibles.filter(m => _catDe(m) === _catFiltro);
        }
    }
    if (_busqueda) {
        visibles = visibles.filter(m => {
            const nombre = _tabActual === "recibidos" ? (m.de_nombre_display || m.de_username || "Sistema") : (m.para_nombre_display || m.para_username || "");
            return (m.asunto || "").toLowerCase().includes(_busqueda)
                || (m.cuerpo || "").toLowerCase().includes(_busqueda)
                || nombre.toLowerCase().includes(_busqueda)
                || (m.restaurante || "").toLowerCase().includes(_busqueda);
        });
    }
    return visibles;
}

function renderLista() {
    renderChipsCat();
    const lista = document.getElementById("mensajes-lista");
    const visibles = _mensajesFiltrados();

    if (!visibles.length) {
        const filtrando = _busqueda || (_mostrarFiltroCat() && _catFiltro !== "todos");
        const etq = { _fav: "favoritos", _arch: "archivados", _nuevos: "nuevos" }[_catFiltro] || (_CAT_INFO[_catFiltro]?.label);
        lista.innerHTML = `<div class="empty-state">
            <div class="empty-icon">${_busqueda ? "🔍" : (_tabActual === "papelera" ? "🗑" : (_catFiltro === "_arch" ? "🗂️" : (_tabActual === "recibidos" ? "📭" : "📤")))}</div>
            ${_busqueda
                ? `Sin resultados para "${_esc(_busqueda)}"`
                : _tabActual === "papelera"
                    ? `No hay mensajes eliminados.<div style="font-size:12px;color: var(--tx-4, #9ca3af);margin-top:6px;">Los mensajes que elimines se guardan acá 30 días y después se borran del sistema.</div>`
                    : _catFiltro === "_nuevos" && !_busqueda
                        ? `No tenés mensajes nuevos ✔<div style="font-size:12px;color: var(--tx-4, #9ca3af);margin-top:6px;">Los ya leídos están en Todos.</div>`
                    : filtrando
                        ? `No tenés mensajes ${_catFiltro === "_fav" || _catFiltro === "_arch" ? etq : "de " + etq}`
                        : `No tenés ${_tabActual === "recibidos" ? "mensajes recibidos" : "mensajes enviados"}`}
        </div>`;
        return;
    }

    const esPap = _tabActual === "papelera";
    const recorte = visibles.slice(0, _mostrando);
    let html = recorte.map(m => {
        const i       = _mensajes.indexOf(m);   // índice real en _mensajes (para verMensaje)
        const ladoM   = esPap ? (m.lado || "recibido") : _tabActual;
        const esCC    = ladoM === "recibidos" && (m.asunto || "").startsWith("[CC] ");
        const noLeido = _tabActual === "recibidos" && !m.leido;
        const esRec   = ladoM === "recibido" || ladoM === "recibidos";
        const nombre  = esRec
            ? (m.de_nombre_display || m.de_username || "Sistema")
            : (m.para_nombre_display || m.para_username || "—");
        const prefijo = esRec ? "De" : "Para";
        const fecha   = _formatFecha(m.creado_en);
        const asuntoMostrar = esCC ? (m.asunto || "").slice(5) : (m.asunto || "(sin asunto)");
        const preview = (m.cuerpo || "").replace(/\n/g, " ").slice(0, 80);
        const tieneAdj = (m.adjuntos && m.adjuntos.length) ? ' <span class="msg-adj-ind" title="Con adjuntos">📎</span>' : "";
        // Badge de categoría (solo en recibidos) / de retención (papelera)
        let catBadge = "";
        if (_tabActual === "recibidos") {
            const ci = _CAT_INFO[_catDe(m)];
            catBadge = `<div><span class="msg-cat-badge" style="background:${ci.bg};color:${ci.fg};">${ci.icono} ${ci.label}</span>${m.archivado && _catFiltro !== "_arch" ? ' <span class="msg-cat-badge" style="background: var(--av-sf, #fef3c7);color: var(--av-tx, #92400e);">🗂️ Archivado</span>' : ""}</div>`;
        } else if (esPap) {
            catBadge = `<div><span class="msg-cat-badge" style="background: var(--av-sf, #fef3c7);color: var(--av-tx, #92400e);">🗑 ${esRec ? "Recibido" : "Enviado"} · se borra en ${m.dias_restantes} día${m.dias_restantes === 1 ? "" : "s"}</span></div>`;
        }
        // Acciones (no en vista de cadena / modo empleado: solo lectura)
        let acciones = "";
        if (esPap) {
            acciones = `<div class="msg-acciones">
                       <button class="icon-btn" title="Recuperar" onclick="event.stopPropagation();recuperarMensaje(${m.id},'${ladoM}')">♻️</button>
                       <button class="icon-btn" title="Eliminar definitivamente" onclick="event.stopPropagation();eliminarDefinitivo(${m.id},'${ladoM}')">🗑️</button>
                   </div>`;
        } else if (!_cadena && !_emp) {
            acciones = _tabActual === "recibidos"
                ? `<div class="msg-acciones">
                       <button class="icon-btn ${m.favorito ? "fav-on" : ""}" title="${m.favorito ? "Quitar de favoritos" : "Marcar favorito"}" onclick="event.stopPropagation();toggleFavorito(${m.id})">${m.favorito ? "⭐" : "☆"}</button>
                       <button class="icon-btn" title="${m.archivado ? "Desarchivar" : "Archivar"}" onclick="event.stopPropagation();toggleArchivado(${m.id})">${m.archivado ? "📥" : "🗂️"}</button>
                       <button class="icon-btn" title="Eliminar" onclick="event.stopPropagation();eliminarMensaje(${m.id})">🗑️</button>
                   </div>`
                : `<div class="msg-acciones">
                       <button class="icon-btn" title="Eliminar de enviados" onclick="event.stopPropagation();eliminarMensaje(${m.id})">🗑️</button>
                   </div>`;
        }

        return `<div class="msg-card ${noLeido ? "no-leido" : ""} ${esCC ? "es-cc" : ""}" onclick="verMensaje(${i})">
            <div style="min-width:0;">
                <div class="msg-from">${prefijo}: <strong>${_esc(nombre)}</strong>${esCC ? ' <span class="badge-cc">CC</span>' : ""}${m.favorito && _tabActual === "recibidos" ? " ⭐" : ""}${_cadena && m.restaurante ? ` <span style="background: var(--ac-sf, #eef2ff);color:#4338ca;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;">🏠 ${_esc(m.restaurante)}</span>` : ""}</div>
                <div class="msg-asunto">${_esc(asuntoMostrar)}${tieneAdj}</div>
                <div class="msg-preview">${_esc(preview)}</div>
                ${catBadge}
            </div>
            <div class="msg-meta">
                <span class="msg-fecha">${fecha}</span>
                ${noLeido ? '<span class="msg-dot"></span>' : ""}
                ${acciones}
            </div>
        </div>`;
    }).join("");

    if (visibles.length > _mostrando) {
        html += `<button class="btn-mas" onclick="mostrarMas()">▼ Mostrar más (${visibles.length - _mostrando} restantes)</button>`;
    }
    lista.innerHTML = html;
}

// ── Favorito / Archivar / Eliminar ────────────────────────────
async function toggleFavorito(id) {
    const m = _porId(id);
    if (!m) return;
    const nuevo = !m.favorito;
    try {
        await apiFetch(`/mensajes/${id}`, { method: "PATCH", body: JSON.stringify({ favorito: nuevo }) });
        m.favorito = nuevo;
        renderLista();
        if (_msgActual && _msgActual.id === id) _syncFootModal();
    } catch (e) { alert("Error: " + (e.message || e)); }
}

async function toggleArchivado(id) {
    const m = _porId(id);
    if (!m) return;
    const nuevo = !m.archivado;
    try {
        await apiFetch(`/mensajes/${id}`, { method: "PATCH", body: JSON.stringify({ archivado: nuevo }) });
        m.archivado = nuevo;
        renderLista();
        actualizarBadge();
        _toast(nuevo ? "Mensaje archivado 🗂️" : "Mensaje devuelto a la bandeja");
        if (_msgActual && _msgActual.id === id) _syncFootModal();
    } catch (e) { alert("Error: " + (e.message || e)); }
}

function eliminarMensaje(id) {
    const m = _porId(id);
    if (!m) return;
    // Alarma SOLO si es un recibido sin leer; los leídos (y los enviados) van directo.
    if (_tabActual === "recibidos" && !m.leido) {
        _delPendiente = id;
        document.getElementById("modal-confirm-del").classList.add("open");
        return;
    }
    _eliminarConfirmado(id);
}

function cerrarConfirmDel() {
    _delPendiente = null;
    document.getElementById("modal-confirm-del").classList.remove("open");
}

function confirmarEliminacion() {
    const id = _delPendiente;
    cerrarConfirmDel();
    if (id != null) _eliminarConfirmado(id);
}

async function _eliminarConfirmado(id) {
    const lado = _tabActual === "recibidos" ? "recibido" : "enviado";
    try {
        await apiFetch(`/mensajes/${id}?lado=${lado}`, { method: "DELETE" });
        const idx = _mensajes.findIndex(m => m.id === id);
        if (idx !== -1) _mensajes.splice(idx, 1);
        if (_msgActual && _msgActual.id === id) cerrarVer();
        renderLista();
        actualizarBadge();
        _toast("Mensaje eliminado 🗑️");
    } catch (e) { alert("Error al eliminar: " + (e.message || e)); }
}

async function eliminarDefinitivo(id, lado) {
    if (!confirm("¿Eliminar este mensaje definitivamente? No se podrá recuperar.")) return;
    try {
        await apiFetch(`/mensajes/${id}/definitivo?lado=${lado}`, { method: "DELETE" });
        const idx = _mensajes.findIndex(m => m.id === id);
        if (idx !== -1) _mensajes.splice(idx, 1);
        if (_msgActual && _msgActual.id === id) cerrarVer();
        renderLista();

}

async function reactivarDesdeMensaje() {
    const m = _msgActual;
    if (!m || !m.accion) return;
    let acc = null;
    try { acc = typeof m.accion === "string" ? JSON.parse(m.accion) : m.accion; } catch (_) { return; }
    const pass = prompt(`Para reactivar a ${acc.nombre || "este usuario"}, confirmá con TU contraseña:`);
    if (!pass) return;
    try {
        const body = { password: pass };
        if (acc.tipo === "reactivar_usuario") body.usuario_id = acc.usuario_id;
        else body.empleado_id = acc.empleado_id;
        const r = await apiFetch("/auth/usuarios/reactivar-bloqueo", {
            method: "POST", body: JSON.stringify(body) });
        alert((r && r.mensaje) || "Usuario reactivado ✔");
    } catch (e) {
        alert(e.message || "No se pudo reactivar.");
    }
}

async function verMensaje(idx) {
    const m = _mensajes[idx];
    if (!m) return;
    _msgActual = m;

    const esPap   = _tabActual === "papelera";
    const ladoM   = esPap ? (m.lado || "recibido") : _tabActual;
    const esRec   = ladoM === "recibido" || ladoM === "recibidos";
    const esCC    = esRec && (m.asunto || "").startsWith("[CC] ");
    const nombre  = esRec
        ? (m.de_nombre_display || m.de_username || "Sistema")
        : (m.para_nombre_display || m.para_username || "—");
    const prefijo = esRec ? "De" : "Para";
    const asuntoMostrar = esCC ? (m.asunto || "").slice(5) : (m.asunto || "(sin asunto)");

    document.getElementById("det-asunto").textContent = asuntoMostrar;

    let metaHtml = `${prefijo}: <strong>${_esc(nombre)}</strong>`;
    if (esCC) metaHtml += ` &nbsp;<span class="badge-cc">Recibiste este mensaje como copia</span>`;
    metaHtml += ` &nbsp;·&nbsp; ${_formatFechaFull(m.creado_en)}`;
    document.getElementById("det-meta").innerHTML = metaHtml;

    // Cuerpo: separar texto propio de cita si es respuesta
    const cuerpoEl = document.getElementById("det-cuerpo");
    const SEP = "\n\n---\n";
    const sepIdx = m.cuerpo ? m.cuerpo.indexOf(SEP) : -1;
    if (sepIdx !== -1) {
        const textoPropio = m.cuerpo.slice(0, sepIdx);
        const citaRaw     = m.cuerpo.slice(sepIdx + SEP.length);
        // Parsear cabecera de cita: primera línea es "Mensaje de X (fecha):"
        const primerSalto = citaRaw.indexOf("\n");
        const citaHeader  = primerSalto !== -1 ? citaRaw.slice(0, primerSalto) : "";
        const citaTexto   = primerSalto !== -1 ? citaRaw.slice(primerSalto + 1) : citaRaw;
        cuerpoEl.innerHTML =
            `<div>${_linkify(textoPropio)}</div>
             <div class="cita-original">
               <div class="cita-header">${_esc(citaHeader)}</div>
               <div class="cita-texto">${_esc(citaTexto)}</div>
             </div>`;
    } else {
        cuerpoEl.innerHTML = _linkify(m.cuerpo || "");
    }
    if (m.solicitud_id) { cuerpoEl.innerHTML += _tarjetaSolicitud(m); _rellenarInfoSolicitud(m); }

    // Acción embebida: aviso de bloqueo por 3 intentos → botón Reactivar (pide
    // re-ingresar TU contraseña para confirmar; el backend valida el permiso).
    let _accion = null;
    try { _accion = m.accion ? (typeof m.accion === "string" ? JSON.parse(m.accion) : m.accion) : null; } catch (_) {}
    if (_accion && ["reactivar_usuario", "reactivar_empleado"].includes(_accion.tipo) && !_cadena && !esPap) {
        cuerpoEl.innerHTML += `
            <button class="btn-responder" style="width:100%;margin-top:16px;justify-content:center;"
                    onclick="reactivarDesdeMensaje()">🔓 Reactivar usuario${_accion.nombre ? " — " + _esc(_accion.nombre) : ""}</button>`;
    }

    // Adjuntos: imágenes inline, el resto como link de descarga (URLs absolutas de Cloudinary)
    if (m.adjuntos && m.adjuntos.length) {
        cuerpoEl.innerHTML += `<div class="adj-view">
            <div class="adj-view-titulo">📎 Adjuntos (${m.adjuntos.length})</div>
            ${m.adjuntos.map(a => a.tipo === "imagen"
                ? `<a href="${_esc(a.url)}" target="_blank" rel="noopener"><img src="${_esc(a.url)}" alt="${_esc(a.nombre)}" loading="lazy"></a>`
                : `<a class="adj-file" href="${_esc(a.url)}" target="_blank" rel="noopener">📎 ${_esc(a.nombre || "archivo")}</a>`
            ).join("")}
        </div>`;
    }

    // Pie con acciones: recibidos propios (fav/archivar/eliminar/responder), o papelera
    // (recuperar / eliminar definitivo). En cadena/enviados: sin pie.
    const foot = document.getElementById("modal-ver-foot");
    const footPap = document.getElementById("modal-ver-foot-pap");
    foot.style.display = (!_cadena && !esPap && _tabActual === "recibidos") ? "flex" : "none";
    if (footPap) {
        footPap.style.display = esPap ? "flex" : "none";
        const info = document.getElementById("det-pap-info");
        if (info && esPap) info.textContent = `Se borra definitivamente en ${m.dias_restantes} día${m.dias_restantes === 1 ? "" : "s"}`;
    }
    _syncFootModal();

    document.getElementById("modal-ver").classList.add("open");

    // Marcar como leído. En modo empleado (token de cuenta) va por /empleado con el
    // restaurante_id del mensaje; en el tenant normal, por /mensajes/{id}/leer. La vista
    // de cadena de un token de LOCAL (no empleado) es solo lectura → no marca.
    if (!esPap && _tabActual === "recibidos" && !m.leido && (_emp || !_cadena)) {
        try {
            if (_emp && m.restaurante_id != null) {
                await apiFetch(`/empleado/mensajes/leer/${m.restaurante_id}/${m.id}`,
                               { method: "POST", body: "{}", token: getEmpToken() });
            } else if (!_emp) {
                await apiFetch(`/mensajes/${m.id}/leer`, { method: "PATCH" });
            } else {
                throw new Error("sin restaurante_id");
            }
            m.leido = true;
            renderLista();
            actualizarBadge();
        } catch(e) { /* ignorar */ }
    }
}

function _tarjetaSolicitud(m){
    if(!m.solicitud_id) return '';
    _solCss();
    const st=m.solicitud_estado;
    const esOferta = m.solicitud_tipo==='oferta';
    const esAbierto = m.solicitud_tipo==='abierto';
    const estadoTxt = ({ prop_receptor:'Pendiente de tu respuesta',
                         prop_solicitante:'Contrapropuesta — pendiente de tu respuesta',
                         disponible:'Disponible', abierta:'Disponible', asignada:'✔ Asignado',
                         pend_confirmacion:'Pendiente de confirmación',
                         aprobada:'✔ Aprobado', denegada:'Denegado',
                         rechazada:'Rechazado', cancelada:'Cancelado' })[st] || st;
    let btns='';
    if(st==='prop_receptor' || st==='prop_solicitante')
        btns = _bs(m,'aceptar','Aceptar','prim') + _bs(m,'rechazar','Rechazar','rej');
    else if(st==='pend_confirmacion')
        btns = _bs(m,'confirmar','Confirmar','prim') + _bs(m,'denegar','Denegar','rej');
    const hint = (st==='prop_receptor'||st==='prop_solicitante')
        ? '<div class="sol-hint">Para contraproponer otro turno, usá la grilla de horarios.</div>' : '';
    const rid = (m.restaurante_id!=null) ? m.restaurante_id : '';
    // "Ver en la grilla" es la herramienta del editor para confirmar mirando el personal del día.
    const verGrilla = (st==='pend_confirmacion')
        ? `<a class="b-sol" href="horarios.html?solicitud=${m.solicitud_id}${rid!==''?('&restaurante_id='+rid):''}">Ver en la grilla</a>` : '';
    const titulo = esAbierto ? '⊕ Turno abierto' : (esOferta ? '📣 Oferta de turno' : '🔁 Intercambio de turno');
    return `<div class="sol-card"><div class="sol-st">${titulo} · ${estadoTxt}</div>`
         + `<div class="sol-info" id="sol-info-${m.solicitud_id}">Cargando detalle…</div>`
         + `<div class="sol-btns">${btns}${verGrilla}</div>` + hint + `</div>`;
}
function _fmtFranjasTxt(jsonStr){
    try{ return (JSON.parse(jsonStr||'[]')||[]).map(f=>`${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}`).join(', '); }
    catch(e){ return ''; }
}
async function _rellenarInfoSolicitud(m){
    const el = document.getElementById('sol-info-'+m.solicitud_id);
    if(!el) return;
    try{
        const q = (m.restaurante_id!=null) ? ('?restaurante_id='+m.restaurante_id) : '';
        const opts = {}; if(_emp && typeof getEmpToken==='function') opts.token = getEmpToken();
        const d = await apiFetch(`/horarios/solicitudes/${m.solicitud_id}${q}`, opts);
        if(d.tipo==='abierto'){
            const rid = (m.restaurante_id!=null) ? ('&restaurante_id='+m.restaurante_id) : '';
            const href = `horarios.html?fecha=${d.origen_fecha||''}${rid}`;
            let h = `<div class="sol-row">⊕ Turno: <b>${d.origen_fecha||'—'}</b> · ${_fmtFranjasTxt(d.origen_franjas)||'—'}${d.origen_rol?(' · '+_esc(d.origen_rol)):''}</div>`;
            if(d.tomado_username) h += `<div class="sol-row">Asignado a: <b>${_esc(d.tomado_username)}</b></div>`;
            h += `<div style="margin-top:8px;"><a class="b-sol prim" style="text-decoration:none;display:inline-block;" href="${href}">📅 Ir a la grilla</a></div>`;
            el.innerHTML = h; return;
        }
        const fmt = t => `${t.fecha||'—'} · ${_fmtFranjasTxt(t.franjas)||'—'}`;
        const da = (d.turnos||[]).filter(t=>t.lado==='da');
        const re = (d.turnos||[]).filter(t=>t.lado==='recibe');
        const verbo = (d.tipo==='oferta') ? 'ofrece' : 'da';
        let html = '';
        if(da.length) html += `<div class="sol-row"><b>${_esc(d.creador_username||'—')}</b> ${verbo}: ${da.map(fmt).join('  |  ')}</div>`;
        else          html += `<div class="sol-row"><b>${_esc(d.creador_username||'—')}</b> ${verbo}: ${d.origen_fecha||'—'} · ${_fmtFranjasTxt(d.origen_franjas)||'—'}</div>`;
        if(d.tipo!=='oferta'){
            if(re.length)                 html += `<div class="sol-row"><b>${_esc(d.destino_username||'—')}</b> da: ${re.map(fmt).join('  |  ')}</div>`;
            else if(d.destino_horario_id) html += `<div class="sol-row"><b>${_esc(d.destino_username||'—')}</b> da: ${d.destino_fecha||'—'} · ${_fmtFranjasTxt(d.destino_franjas)||'—'}</div>`;
            else                          html += `<div class="sol-row"><b>${_esc(d.destino_username||'—')}</b>: sin turno a cambio</div>`;
        }
        if(d.tipo==='oferta' && d.tomado_username)
            html += `<div class="sol-row">✋ Quiere tomarlo: <b>${_esc(d.tomado_username)}</b></div>`;
        el.innerHTML = html;
    }catch(e){ el.textContent = 'No se pudo cargar el detalle.'; }
}
function _bs(m, accion, label, kind){
    const rid = (m.restaurante_id!=null) ? m.restaurante_id : 'null';
    return `<button class="b-sol ${kind}" onclick="accionSolicitud(${m.solicitud_id},'${accion}',${rid})">${label}</button>`;
}
async function accionSolicitud(id, accion, restauranteId, permitir){
    const tk = (_emp && typeof getEmpToken === 'function') ? getEmpToken() : null;
    // Aviso al aceptar un intercambio: si ya tenés un turno el día que recibirías.
    if(accion==='aceptar'){
        try{
            const q = (restauranteId!=null) ? ('?restaurante_id='+restauranteId) : '';
            const d = await apiFetch(`/horarios/solicitudes/${id}${q}`, tk?{token:tk}:{});
            if(d && d.mi_conflicto && !confirm('Ya tenés un turno ese día. ¿Aceptar igual?')) return;
        }catch(_){ /* si no se puede chequear, seguimos igual */ }
    }
    const body = (restauranteId!=null) ? { restaurante_id: restauranteId } : {};
    if(permitir) body.permitir_conflicto = true;
    const opts = { method:'POST', body: JSON.stringify(body) };
    if(tk) opts.token = tk;
    try{
        await apiFetch(`/horarios/solicitudes/${id}/${accion}`, opts);
        cerrarVer();
        await cargarMensajes();
    }catch(e){
        // Editor confirmando pese a que un empleado ya tiene turno ese día → ofrecer turno doble.
        if(accion==='confirmar' && !permitir && String(e.message||'').includes('conflicto_dia')){
            if(confirm('Un empleado ya tiene un turno ese día. ¿Confirmar igual (turno doble)?')) return accionSolicitud(id, accion, restauranteId, true);
            return;
        }
        alert('Error: '+(e.message||e));
    }
}

    document.getElementById("modal-ver").classList.remove("open");

// Mensajes del SISTEMA (avisos automáticos): nadie lee esa casilla → no se
// responden; se REENVÍAN a otra persona (consulta/confirmación).
function responderOReenviar() {
    if (!_msgActual) return;
    if ((_msgActual.de_username || "") === "sistema") reenviarMensaje();
    else responderMensaje();
}

function reenviarMensaje() {
    const m = _msgActual;
    if (!m) return;
    cerrarVer();
    const asuntoBase = (m.asunto || "").startsWith("[CC] ") ? (m.asunto || "").slice(5) : (m.asunto || "");
    const asunto = asuntoBase.startsWith("RV: ") ? asuntoBase : `RV: ${asuntoBase}`;
    const citaHeader = `Mensaje de ${m.de_nombre_display || m.de_username || "Sistema"} (${_formatFechaFull(m.creado_en)}):`;
    abrirCompose([], asunto, `\n\n---\n${citaHeader}\n${m.cuerpo || ""}`, /* cursorAlInicio */ true);
}

function responderMensaje() {
    if (!_msgActual) return;
    const m = _msgActual;
    cerrarVer();

    // Asunto: "Re: {asunto original}" (sin duplicar Re:)
    const asuntoBase = (m.asunto || "").startsWith("[CC] ")
        ? (m.asunto || "").slice(5)
        : (m.asunto || "");
    const asunto = asuntoBase.startsWith("Re: ") ? asuntoBase : `Re: ${asuntoBase}`;

    // Cuerpo: espacio para escribir + cita del original
    const citaHeader = `Mensaje de ${m.de_nombre_display || m.de_username || "Sistema"} (${_formatFechaFull(m.creado_en)}):`;
    const cuerpoBase = `\n\n---\n${citaHeader}\n${m.cuerpo || ""}`;

    abrirCompose([m.de_usuario_id], asunto, cuerpoBase, /* cursorAlInicio */ true);
}

// ── Compose: gestión de tags ──────────────────────────────────

function addDest(tipo, sel) {
    const id = parseInt(sel.value);
    sel.value = "";
    if (!id) return;
    const u = _usuariosMap[id];
    if (!u) return;

    const arr   = tipo === "para" ? _paraDests : _ccDests;
    const other = tipo === "para" ? _ccDests   : _paraDests;

    // Si ya está en este grupo, no duplicar
    if (arr.find(x => x.id === id)) return;

    // Si está en el otro grupo, moverlo
    const enOtro = other.findIndex(x => x.id === id);
    if (enOtro !== -1) {
        other.splice(enOtro, 1);
        renderDestTags(tipo === "para" ? "cc" : "para");
    }

    arr.push({ id, username: displayName(u) });
    renderDestTags(tipo);
    _actualizarSelectsDisponibles();
}

function removeDest(tipo, id) {
    const arr = tipo === "para" ? _paraDests : _ccDests;
    const idx = arr.findIndex(x => x.id === id);
    if (idx !== -1) arr.splice(idx, 1);
    renderDestTags(tipo);
    _actualizarSelectsDisponibles();
}

function renderDestTags(tipo) {
    const arr     = tipo === "para" ? _paraDests : _ccDests;
    const wrapId  = tipo === "para" ? "para-tags" : "cc-tags";
    const wrap    = document.getElementById(wrapId);
    if (!wrap) return;
    wrap.innerHTML = arr.map(u =>
        `<span class="dest-tag ${tipo === "cc" ? "cc" : ""}">
            ${_esc(displayName(u))}
            <button onclick="removeDest('${tipo}',${u.id})" type="button">✕</button>
        </span>`
    ).join("");
}

function _actualizarSelectsDisponibles() {
    const tomados = new Set([..._paraDests, ..._ccDests].map(x => x.id));
    ["para-add", "cc-add"].forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        Array.from(sel.options).forEach(opt => {
            if (!opt.value) return;
            opt.disabled = tomados.has(parseInt(opt.value));
        });
    });
}

// ── Compose: abrir / cerrar ───────────────────────────────────

function abrirCompose(paraIds = [], asunto = "", cuerpo = "", cursorAlInicio = false) {
    // Resetear estado
    _paraDests = [];
    _ccDests   = [];

    // Pre-poblar destinatarios
    for (const id of paraIds) {
        const u = _usuariosMap[id];
        if (u) _paraDests.push({ id: u.id, username: displayName(u) });
    }

    renderDestTags("para");
    renderDestTags("cc");
    _actualizarSelectsDisponibles();

    document.getElementById("compose-asunto").value = asunto;
    document.getElementById("compose-cuerpo").value = cuerpo;
    document.getElementById("btn-enviar").disabled  = false;
    document.getElementById("btn-enviar").textContent = "Enviar";

    const esRespuesta = asunto.startsWith("Re: ");
    document.getElementById("compose-titulo").textContent =
        esRespuesta ? "↩️ Responder" : "✉️ Nuevo mensaje";

    document.getElementById("modal-compose").classList.add("open");

    setTimeout(() => {
        if (cursorAlInicio) {
            const ta = document.getElementById("compose-cuerpo");
            ta.focus();
            ta.setSelectionRange(0, 0);
            ta.scrollTop = 0;
        } else if (paraIds.length === 0) {
            document.getElementById("para-add").focus();
        } else {
            document.getElementById("compose-asunto").focus();
        }
    }, 80);
}

function cerrarCompose() {
    document.getElementById("modal-compose").classList.remove("open");
    _paraDests = [];
    _ccDests   = [];
    renderDestTags("para");
    renderDestTags("cc");
    _archivosAdj = [];
    renderAdjChips();
}

// ── Compose: adjuntos ─────────────────────────────────────────
function filesElegidos(input) {
    const MAX_MB = 15, MAX_FILES = 10;
    for (const f of input.files || []) {
        if (_archivosAdj.length >= MAX_FILES) { alert(`Máximo ${MAX_FILES} adjuntos por mensaje`); break; }
        if (f.size > MAX_MB * 1024 * 1024)    { alert(`"${f.name}" supera los ${MAX_MB} MB`); continue; }
        if (_archivosAdj.some(x => x.name === f.name && x.size === f.size)) continue;   // repetido
        _archivosAdj.push(f);
    }
    input.value = "";   // permitir volver a elegir el mismo archivo
    renderAdjChips();
}

function quitarArchivo(idx) {
    _archivosAdj.splice(idx, 1);
    renderAdjChips();
}

function renderAdjChips() {
    const cont = document.getElementById("adj-chips");
    if (!cont) return;
    if (!_archivosAdj.length) { cont.style.display = "none"; cont.innerHTML = ""; return; }
    cont.style.display = "flex";
    cont.innerHTML = _archivosAdj.map((f, i) => {
        const esImg = (f.type || "").startsWith("image/");
        const kb = f.size > 1024 * 1024 ? (f.size / 1048576).toFixed(1) + " MB" : Math.ceil(f.size / 1024) + " KB";
        return `<span class="adj-chip">${esImg ? "🖼️" : "📄"} <span class="adj-nombre">${_esc(f.name)}</span>
                <span style="color: var(--tx-4, #9ca3af);">${kb}</span>
                <button type="button" onclick="quitarArchivo(${i})" title="Quitar">✕</button></span>`;
    }).join("");
}

// ── Enviar ────────────────────────────────────────────────────

async function enviarMensaje() {
    if (_paraDests.length === 0) {
        alert("Agregá al menos un destinatario en el campo Para");
        return;
    }
    const asunto = document.getElementById("compose-asunto").value.trim();
    const cuerpo = document.getElementById("compose-cuerpo").value.trim();

    if (!asunto) { alert("Escribí un asunto"); return; }
    if (!cuerpo) { alert("Escribí el mensaje"); return; }

    const btn = document.getElementById("btn-enviar");
    btn.disabled    = true;

    try {
        // 1) Subir adjuntos a Cloudinary (si hay); 2) enviar el mensaje con las URLs
        let adjuntos = [];
        if (_archivosAdj.length) {
            btn.textContent = `Subiendo adjuntos (${_archivosAdj.length})...`;
            const fd = new FormData();
            _archivosAdj.forEach(f => fd.append("files", f));
            adjuntos = await apiFetch("/mensajes/adjuntos", { method: "POST", body: fd });
        }
        btn.textContent = "Enviando...";
        await apiFetch("/mensajes/", {
            method: "POST",
            body: JSON.stringify({
                para_usuario_ids: _paraDests.map(u => u.id),
                cc_usuario_ids:   _ccDests.map(u => u.id),
                asunto,
                cuerpo,
                adjuntos,
            }),
        });
        cerrarCompose();
        if (_tabActual === "enviados") cargarMensajes();
        else _toast("Mensaje enviado ✓");
    } catch(e) {
        alert("Error al enviar: " + (e.message || e));
        btn.disabled    = false;
        btn.textContent = "Enviar";
    }
}

// ── Helpers ───────────────────────────────────────────────────
function _esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// Escapa y convierte URLs / links a páginas (.html?…) en enlaces clicables
function _linkify(s) {
    return _esc(s).replace(/(https?:\/\/[^\s]+|[\w./-]+\.html(?:\?[^\s]*)?)/g,
        m => `<a href="${m}" target="_blank" rel="noopener" style="color: var(--tx-ac, #4f46e5);font-weight:600;">${m}</a>`);
}

function _formatFecha(ts) {
    if (!ts) return "—";
    const d = new Date(ts);
    const hoy  = new Date();
    const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
    const pad  = n => String(n).padStart(2, "0");
    const hora = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.toDateString() === hoy.toDateString())  return `Hoy ${hora}`;
    if (d.toDateString() === ayer.toDateString()) return `Ayer ${hora}`;
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${hora}`;
}

function _formatFechaFull(ts) {
    if (!ts) return "—";
    const d   = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function _toast(msg) {
    const t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = `position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:white;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:1;transition:opacity .4s`;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 400); }, 2200);
}

// Cerrar modales con Escape (la alarma de borrado primero, sin arrastrar los demás)
document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        if (document.getElementById("modal-confirm-del").classList.contains("open")) {
            cerrarConfirmDel();
            return;
        }
        cerrarVer();
        cerrarCompose();
    }
});

init();
</script>
