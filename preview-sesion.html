<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa — Estado del restaurante</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* ── Navbar ── */
.navbar {
    background:#1a1a2e; color:white;
    padding:0 28px; height:56px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-left { display:flex; align-items:center; gap:12px; }
.navbar-brand { font-size:17px; font-weight:700; }
.navbar-sub { font-size:12px; color:#a5b4fc; }
.btn-logout-final {
    background:#dc2626; color:white; border:none;
    padding:8px 20px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:background .2s;
}
.btn-logout-final:hover { background:#b91c1c; }
.btn-refresh {
    background:rgba(255,255,255,0.1); color:#a5b4fc; border:1px solid rgba(255,255,255,0.2);
    padding:7px 14px; border-radius:8px;
    font-size:12px; cursor:pointer; transition:background .2s;
}
.btn-refresh:hover { background:rgba(255,255,255,0.2); }

/* ── Content ── */
.content { margin-top:56px; padding:28px; }

/* ── Section title ── */
.section-title {
    font-size:11px; font-weight:800; color:#9ca3af;
    text-transform:uppercase; letter-spacing:.8px;
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
}

/* ── Sala cards ── */
.salas-grid { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:32px; }
.sala-card {
    background:white; border-radius:12px; padding:18px 22px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-top:3px solid #4f46e5; min-width:180px;
}
.sala-nombre { font-size:14px; font-weight:700; color:#1a1a2e; margin-bottom:10px; }
.sala-stats { display:flex; gap:16px; }
.sala-stat { text-align:center; }
.sala-stat-val { font-size:22px; font-weight:700; color:#1a1a2e; }
.sala-stat-val.ocupadas { color:#dc2626; }
.sala-stat-val.libres   { color:#16a34a; }
.sala-stat-lbl { font-size:10px; color:#9ca3af; text-transform:uppercase; letter-spacing:.5px; }
.sala-bar { margin-top:12px; height:6px; border-radius:3px; background:#f0f0f0; overflow:hidden; }
.sala-bar-fill { height:100%; border-radius:3px; background:#4f46e5; transition:width .4s; }
.sala-bar-fill.llena  { background:#dc2626; }
.sala-bar-fill.media  { background:#f59e0b; }
.sala-bar-fill.libre  { background:#16a34a; }

/* ── Mesa pills ── */
.mesas-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.mesa-pill {
    font-size:11px; font-weight:600; padding:3px 10px;
    border-radius:20px; border:1px solid;
}
.mesa-pill.ocupada { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
.mesa-pill.libre   { background:#f0fdf4; color:#16a34a; border-color:#bbf7d0; }
.mesa-pill.bloq    { background:#fef3c7; color:#92400e; border-color:#fde68a; }

/* ── Cocina ── */
.areas-grid { display:flex; flex-wrap:wrap; gap:14px; }
.area-card {
    background:white; border-radius:12px; padding:18px 22px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-top:3px solid #0891b2; min-width:240px; flex:1; max-width:420px;
}
.area-nombre { font-size:14px; font-weight:700; color:#1a1a2e; margin-bottom:12px; }
.area-empty { font-size:13px; color:#9ca3af; font-style:italic; }

.orden-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid #f3f4f6; gap:10px;
}
.orden-row:last-child { border-bottom:none; }
.orden-num { font-size:11px; font-weight:700; color:#6366f1; min-width:28px; }
.orden-mesa { font-size:12px; color:#374151; font-weight:600; }
.orden-items { font-size:11px; color:#6b7280; flex:1; }
.orden-estado {
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
    white-space:nowrap;
}
.estado-en_preparacion { background:#dbeafe; color:#1d4ed8; }
.estado-listo          { background:#dcfce7; color:#15803d; }
.estado-pendiente      { background:#fef9c3; color:#854d0e; }

/* ── Spinner / cargando ── */
.loading { text-align:center; color:#9ca3af; font-size:13px; padding:32px; }
.spinner-sm {
    display:inline-block; width:16px; height:16px;
    border:2px solid #e0e0e0; border-top-color:#4f46e5;
    border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Banner ── */
.preview-banner {
    background:#eff6ff; border:1px solid #bfdbfe;
    border-radius:10px; padding:12px 18px;
    font-size:13px; color:#1e40af; margin-bottom:24px;
    display:flex; align-items:center; gap:10px;
}
.preview-banner strong { font-size:14px; }

/* ── Update hint ── */
.update-hint { font-size:11px; color:#9ca3af; }
</style>
</head>
<body>

<div class="navbar">
    <div class="navbar-left">
        <div class="navbar-brand">🍽️ Vista de cierre</div>
        <div class="navbar-sub" id="usuario-label"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
        <span class="update-hint" id="update-hint"></span>
        <button class="btn-refresh" onclick="cargarDatos()">↺ Actualizar</button>
        <button class="btn-logout-final" onclick="cerrarSesion()">Cerrar sesión →</button>
    </div>
</div>

<div class="content">

    <div class="preview-banner">
        <span style="font-size:20px;">👁️</span>
        <div>
            <strong>Vista previa del estado del restaurante</strong><br>
            Esta pantalla es de solo lectura. Tocá <strong>Cerrar sesión</strong> cuando termines.
        </div>
    </div>

    <!-- Salas -->
    <div class="section-title">🗺️ Salas y mesas</div>
    <div class="salas-grid" id="salas-grid">
        <div class="loading"><span class="spinner-sm"></span>Cargando salas…</div>
    </div>

    <!-- Cocina por área -->
    <div class="section-title">🍳 Cocina — órdenes activas</div>
    <div class="areas-grid" id="areas-grid">
        <div class="loading"><span class="spinner-sm"></span>Cargando cocina…</div>
    </div>

</div>

<script src="js/api.js"></script>
<script>
// Verificar sesión activa
if (!getToken()) {
    window.location.href = 'index.html';
}

const u = JSON.parse(localStorage.getItem('user') || '{}');
document.getElementById('usuario-label').textContent = u.username ? `Sesión: ${u.username}` : '';

let _lastUpdate = null;

async function cargarDatos() {
    _lastUpdate = new Date();
    document.getElementById('update-hint').textContent = 'Actualizando…';
    await Promise.all([cargarSalas(), cargarCocina()]);
    document.getElementById('update-hint').textContent =
        `Actualizado a las ${_lastUpdate.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;
}

// ── SALAS ────────────────────────────────────────────────────────────────────

async function cargarSalas() {
    const el = document.getElementById('salas-grid');
    try {
        const [salas, mesas] = await Promise.all([
            apiFetch('/mesas/salas'),
            apiFetch('/mesas/'),
        ]);

        if (!salas.length) {
            el.innerHTML = '<div class="loading">Sin salas configuradas.</div>';
            return;
        }

        el.innerHTML = salas.map(sala => {
            const mesasSala = mesas.filter(m => m.sala_id === sala.id);
            const ocupadas  = mesasSala.filter(m => m.pedido_activo_id);
            const bloq      = mesasSala.filter(m => m.bloqueada_por);
            const libres    = mesasSala.filter(m => !m.pedido_activo_id && !m.bloqueada_por);
            const total     = mesasSala.length;
            const pct       = total ? Math.round((ocupadas.length / total) * 100) : 0;
            const fillClass = pct >= 80 ? 'llena' : pct >= 40 ? 'media' : 'libre';

            const pillsHtml = mesasSala.map(m => {
                const cls = m.pedido_activo_id ? 'ocupada' : m.bloqueada_por ? 'bloq' : 'libre';
                return `<span class="mesa-pill ${cls}">${m.nombre || `M${m.id}`}</span>`;
            }).join('');

            return `
                <div class="sala-card">
                    <div class="sala-nombre">${sala.nombre}</div>
                    <div class="sala-stats">
                        <div class="sala-stat">
                            <div class="sala-stat-val ocupadas">${ocupadas.length}</div>
                            <div class="sala-stat-lbl">ocupadas</div>
                        </div>
                        <div class="sala-stat">
                            <div class="sala-stat-val libres">${libres.length}</div>
                            <div class="sala-stat-lbl">libres</div>
                        </div>
                        ${bloq.length ? `
                        <div class="sala-stat">
                            <div class="sala-stat-val" style="color:#92400e;">${bloq.length}</div>
                            <div class="sala-stat-lbl">bloq.</div>
                        </div>` : ''}
                        <div class="sala-stat">
                            <div class="sala-stat-val" style="font-size:16px;color:#6b7280;">${total}</div>
                            <div class="sala-stat-lbl">total</div>
                        </div>
                    </div>
                    <div class="sala-bar">
                        <div class="sala-bar-fill ${fillClass}" style="width:${pct}%"></div>
                    </div>
                    <div class="mesas-row">${pillsHtml}</div>
                </div>
            `;
        }).join('');

    } catch (e) {
        el.innerHTML = `<div class="loading">Error al cargar salas: ${e.message || e}</div>`;
    }
}

// ── COCINA ───────────────────────────────────────────────────────────────────

async function cargarCocina() {
    const el = document.getElementById('areas-grid');
    try {
        const areas = await apiFetch('/productos/areas');
        if (!areas.length) {
            el.innerHTML = '<div class="loading">Sin áreas de cocina configuradas.</div>';
            return;
        }

        const ordenesPorArea = await Promise.all(
            areas.map(a => apiFetch(`/pedidos/ordenes/area/${a.id}`).catch(() => []))
        );

        el.innerHTML = areas.map((area, i) => {
            const ordenes = ordenesPorArea[i] || [];
            const activas = ordenes.filter(o => ['en_preparacion','listo','pendiente'].includes(o.estado));

            const ordenesHtml = activas.length
                ? activas.map(o => `
                    <div class="orden-row">
                        <span class="orden-num">#${o.numero_orden || o.id}</span>
                        <span class="orden-mesa">${o.mesa_nombre || `Mesa ${o.mesa_id || '—'}`}</span>
                        <span class="orden-items">${(o.items||[]).map(it => it.nombre || it.producto_nombre || '').filter(Boolean).join(', ') || '—'}</span>
                        <span class="orden-estado estado-${o.estado}">${estadoLabel(o.estado)}</span>
                    </div>
                `).join('')
                : '<div class="area-empty">Sin órdenes activas</div>';

            return `
                <div class="area-card">
                    <div class="area-nombre">
                        ${area.nombre}
                        ${activas.length ? `<span style="font-size:12px;font-weight:400;color:#6b7280;margin-left:6px;">(${activas.length} activa${activas.length !== 1 ? 's' : ''})</span>` : ''}
                    </div>
                    ${ordenesHtml}
                </div>
            `;
        }).join('');

    } catch (e) {
        el.innerHTML = `<div class="loading">Error al cargar cocina: ${e.message || e}</div>`;
    }
}

function estadoLabel(estado) {
    const m = { en_preparacion: 'En prep.', listo: 'Listo ✓', pendiente: 'Pendiente' };
    return m[estado] || estado;
}

// ── CERRAR SESIÓN ─────────────────────────────────────────────────────────────

function cerrarSesion() {
    _doLogout();
}

// ── ARRANCAR ──────────────────────────────────────────────────────────────────

cargarDatos();
// Auto-refresh cada 60 segundos
setInterval(cargarDatos, 60000);
</script>
</body>
</html>
