<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* NAVBAR */
.navbar { background:#1a1a2e; color:white; padding:0 32px; height:60px; display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0; z-index:300; }
.navbar-brand { font-size:18px; font-weight:700; letter-spacing:.5px; }
.navbar-user { display:flex; align-items:center; gap:12px; font-size:14px; color:#a5b4fc; }
.btn-config { background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.4); color:#a5b4fc; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px; transition:all .2s; }
.btn-config:hover { background:rgba(99,102,241,.35); color:white; }
.btn-logout { background:transparent; border:1px solid #4f46e5; color:#a5b4fc; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s; }
.btn-logout:hover { background:#4f46e5; color:white; }

/* CONTENT */
.content { margin-top:60px; padding:28px 32px; margin-right:0; transition:margin-right .3s cubic-bezier(.4,0,.2,1); }
body.config-open .content { margin-right:390px; }
.welcome { margin-bottom:22px; }
.welcome h2 { font-size:22px; color:#1a1a2e; font-weight:700; }
.welcome p  { color:#888; margin-top:4px; font-size:14px; }

/* 6-COL GRID */
.dash-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:18px; align-items:start; }
.span-1 { grid-column:span 1; }
.span-2 { grid-column:span 2; }
.span-3 { grid-column:span 3; }
.span-6 { grid-column:span 6; }

/* Block wrapper */
.db-block { position:relative; cursor:default; }
.db-block.dragging { opacity:.35; pointer-events:none; }
.db-block.drop-before { box-shadow: -4px 0 0 #4f46e5; }
.db-block.drop-after  { box-shadow:  4px 0 0 #4f46e5; }

.block-label { font-size:10px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:flex; align-items:center; gap:6px; user-select:none; }
.block-drag { cursor:grab; color:#c4b5fd; font-size:16px; padding:2px 4px; border-radius:4px; line-height:1; display:none; }
.block-drag:active { cursor:grabbing; }
.block-drag:hover { background:rgba(196,181,253,.15); }
body.config-open .block-drag { display:inline; }

/* RESUMEN PERIODOS — bloque fijo span-3, 4 solapas de igual ancho */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:900px) { .stats-row { grid-template-columns:repeat(2,1fr); } }
@media(max-width:500px) { .stats-row { width:100%; grid-template-columns:1fr; } }

.sum-card { background:white; border-radius:12px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.06);
            border-top:3px solid #e5e7eb; }
.sum-card.hoy    { border-top-color:#16a34a; }
.sum-card.semana { border-top-color:#4f46e5; }
.sum-card.mes    { border-top-color:#7c3aed; }
.sum-card.anio   { border-top-color:#d97706; }

.sum-title    { font-size:13px; font-weight:700; color:#1a1a2e; margin-bottom:1px; }
.sum-subtitle { font-size:10px; color:#9ca3af; margin-bottom:8px; }
.sum-total    { font-size:26px; font-weight:800; color:#1a1a2e; text-align:right; line-height:1; margin-bottom:10px; }
.sum-sym      { font-size:13px; font-weight:400; color:#9ca3af; vertical-align:baseline; margin-right:2px; line-height:1; }
.sum-hr       { border:none; border-top:1px solid #f0f0f0; margin:8px 0; }
.sum-row      { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#6b7280; margin-bottom:3px; }
.sum-row span:last-child { font-weight:700; color:#374151; }
.sum-gap      { margin-top:6px; }

/* MODULE CARD */
.module-card { background:white; border-radius:12px; padding:20px 16px; cursor:pointer; transition:all .2s; box-shadow:0 2px 8px rgba(0,0,0,.06); text-decoration:none; color:inherit; display:flex; flex-direction:column; border:2px solid transparent; height:100%; }
.module-card:hover { border-color:#4f46e5; transform:translateY(-2px); box-shadow:0 6px 20px rgba(79,70,229,.12); }
.module-icon  { font-size:28px; margin-bottom:10px; }
.module-title { font-size:13px; font-weight:700; color:#1a1a2e; margin-bottom:4px; }
.module-desc  { font-size:11px; color:#888; line-height:1.4; }
.modules-grid { display:grid; gap:14px; }
.modules-cols-1 { grid-template-columns:1fr; }
.modules-cols-2 { grid-template-columns:repeat(2,1fr); }
.modules-cols-3 { grid-template-columns:repeat(3,1fr); }
.modules-cols-6 { grid-template-columns:repeat(6,1fr); }

/* RESERVAS WIDGET */
.reservas-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; display:flex; flex-direction:column; height:300px; }
.reservas-card .res-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#e2e8f0 transparent; cursor:grab; user-select:none; }
.reservas-card .res-scroll.dragging { cursor:grabbing; }
.reservas-card .res-scroll::-webkit-scrollbar { width:4px; }
.reservas-card .res-scroll::-webkit-scrollbar-thumb { background:#e2e8f0; border-radius:4px; }
.widget-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0; }
.widget-title { font-size:13px; font-weight:700; color:#1a1a2e; display:flex; align-items:center; gap:6px; text-decoration:none; }
.widget-title:hover { color:#4f46e5; }
.res-summary { display:flex; align-items:center; gap:8px; }
.res-badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.res-badge.prog     { background:#fff7ed; color:#92400e; }
.res-badge.espera   { background:#ecfeff; color:#0e7490; }
.res-badge.sentado  { background:#fef2f2; color:#991b1b; }
.res-badge.terminada{ background:#f3f4f6; color:#6b7280; }
.res-badge.wl       { background:#f5f3ff; color:#5b21b6; }
.reservas-slots { display:flex; flex-direction:column; gap:5px; }
.reservas-book { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.reservas-col  { display:flex; flex-direction:column; gap:5px; }
.res-slot { display:flex; align-items:flex-start; gap:8px; padding:6px 9px; border-radius:7px; font-size:12px; flex-shrink:0; }
.res-slot.programada { background:#fff7ed; border-left:3px solid #f59e0b; }
.res-slot.en_espera  { background:#ecfeff; border-left:3px solid #06b6d4; }
.res-slot.sentado    { background:#fef2f2; border-left:3px solid #ef4444; }
.res-slot.terminada  { background:#f9fafb; border-left:3px solid #d1d5db; opacity:.7; }
.res-slot.cancelada  { background:#f9fafb; border-left:3px solid #d1d5db; opacity:.5; }
.res-slot.bloq       { background:#fff7ed; border-left:3px solid #f59e0b; }
.res-hora   { font-weight:700; min-width:38px; flex-shrink:0; }
.res-info   { flex:1; min-width:0; }
.res-nombre { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.res-sub    { font-size:11px; color:#888; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.res-tags   { display:flex; gap:4px; margin-top:3px; flex-wrap:wrap; }
.res-tag    { font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; }
.res-tag.alerg { background:#fef3c7; color:#92400e; }
.res-tag.nota  { background:#ede9fe; color:#5b21b6; }
.res-empty { text-align:center; padding:28px 16px; color:#9ca3af; font-size:13px; }

/* STOCK WIDGET */
.stock-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.stock-row  { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f3f4f6; font-size:13px; }
.stock-row:last-child { border-bottom:none; }
.stock-dot  { width:10px; height:10px; border-radius:50%; }
.dot-ok   { background:#16a34a; }
.dot-warn { background:#f59e0b; }
.dot-red  { background:#dc2626; }
.stock-num { font-size:22px; font-weight:700; }

/* CAJA WIDGET */
.caja-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.caja-status { font-size:20px; font-weight:800; margin:10px 0 2px; }
.caja-sub { font-size:12px; color:#9ca3af; margin-bottom:2px; }
.caja-stat-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; color:#6b7280; border-bottom:1px solid #f3f4f6; }
.caja-stat-row:last-child { border-bottom:none; }
.caja-stat-row strong { color:#1a1a2e; font-size:14px; font-weight:700; }

/* MENSAJES WIDGET */
.msg-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.msg-list { display:flex; flex-direction:column; margin-top:8px; }
.msg-row { display:flex; gap:8px; align-items:flex-start; padding:9px 0; border-bottom:1px solid #f3f4f6; text-decoration:none; color:inherit; }
.msg-row:last-child { border-bottom:none; }
.msg-row:hover { background:#fafafe; }
.msg-dot { width:8px; height:8px; border-radius:50%; background:#4f46e5; flex-shrink:0; margin-top:6px; }
.msg-main { flex:1; min-width:0; }
.msg-top { display:flex; justify-content:space-between; gap:8px; }
.msg-de { font-size:13px; font-weight:700; color:#1a1a2e; }
.msg-fecha { font-size:11px; color:#9ca3af; flex-shrink:0; }
.msg-asunto { font-size:12px; font-weight:600; color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.msg-cuerpo { font-size:12px; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* HORARIOS DE LA SEMANA WIDGET */
.hs-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.hs-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:10px; }
.hs-dia { border:1px solid #eef0f3; border-radius:10px; padding:8px 6px; min-height:74px; display:flex; flex-direction:column; gap:6px; background:#fafafe; }
.hs-dia.hs-hoy { border-color:#4f46e5; background:#eef2ff; }
.hs-dia-lbl { font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; text-align:center; }
.hs-turnos { display:flex; flex-direction:column; gap:4px; align-items:center; }
.hs-turno { font-size:12px; font-weight:700; color:#3730a3; background:#e0e7ff; border-radius:6px; padding:3px 6px; white-space:nowrap; }
.hs-libre { font-size:11px; color:#cbd0d8; }
@media (max-width:720px) { .hs-grid { grid-template-columns:repeat(7,minmax(64px,1fr)); overflow-x:auto; } }

/* SOCIAL WIDGET (preview, ~4 filas de alto) */
.social-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; height:360px; display:flex; flex-direction:column; }
.sw-tabs { display:flex; gap:14px; overflow-x:auto; border-bottom:1px solid #eef0f3; margin-top:8px; flex-shrink:0; }
.sw-tab { font-size:12px; font-weight:600; color:#9ca3af; cursor:pointer; padding:6px 1px; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.sw-tab:hover { color:#4b5563; }
.sw-tab.active { color:#1a1a2e; font-weight:800; border-bottom-color:#4f46e5; }
.social-list { flex:1; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
.social-item { border-bottom:1px solid #f3f4f6; padding-bottom:9px; }
.social-item:last-child { border-bottom:none; }
.social-item-top { display:flex; align-items:center; gap:7px; }
.social-item-av { width:24px; height:24px; border-radius:50%; background:#4f46e5; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.social-item-user { font-size:12px; font-weight:700; color:#1a1a2e; }
.social-item-txt { font-size:12px; color:#4b5563; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.social-item-img { width:100%; height:auto; display:block; border-radius:8px; margin-top:6px; background:#f3f4f6; }

/* PERSONAL EN TURNO */
.personal-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.turno-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #f3f4f6; }
.turno-row:last-child { border-bottom:none; }
.turno-ini { width:32px; height:32px; border-radius:50%; color:white; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.turno-info { flex:1; min-width:0; }
.turno-name { font-size:13px; font-weight:600; color:#1a1a2e; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.turno-rol  { font-size:11px; color:#9ca3af; }
.turno-hora { font-size:12px; color:#6b7280; font-weight:600; flex-shrink:0; }

/* ESTADO DEL SALÓN */
.mesas-sal-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.sala-row { margin-top:10px; }
.sala-row-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; font-size:12px; }
.sala-row-name  { font-weight:700; color:#374151; }
.sala-row-stats { color:#6b7280; font-size:11px; display:flex; gap:6px; }
.sala-bar-bg   { height:6px; background:#f3f4f6; border-radius:3px; overflow:hidden; }
.sala-bar-fill { height:100%; border-radius:3px; transition:width .4s; }

/* ÓRDENES EN COCINA */
.cocina-ord-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.cocina-area { margin-top:12px; }
.cocina-area:first-child { margin-top:8px; }
.cocina-area-name { font-size:11px; font-weight:800; color:#374151; text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.cocina-badges { display:flex; flex-wrap:wrap; gap:6px; }

/* TENDENCIA DE VENTAS */
.trend-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.trend-bars { display:flex; align-items:flex-end; gap:6px; height:110px; margin-top:14px; }
.trend-day  { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; min-width:0; }
.trend-bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; padding:0 1px; }
.trend-bar  { width:100%; background:#c4b5fd; border-radius:4px 4px 0 0; min-height:4px; transition:height .35s; }
.trend-day.trend-hoy .trend-bar { background:#4f46e5; }
.trend-label { font-size:10px; color:#9ca3af; margin-top:4px; white-space:nowrap; }
.trend-day.trend-hoy .trend-label { color:#4f46e5; font-weight:700; }
.trend-val  { font-size:9px; color:#6b7280; text-align:center; white-space:nowrap; overflow:hidden; max-width:100%; }

/* CONFIG PANEL */
.cfg-overlay { display:none; }
.cfg-panel { position:fixed; top:0; right:0; width:390px; height:100%; background:white; z-index:401; box-shadow:-4px 0 24px rgba(0,0,0,.15); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); }
.cfg-panel.open { transform:translateX(0); }
/* Indicador visual de modo edición */
body.config-open .dash-grid { outline:2px dashed #c4b5fd; outline-offset:8px; border-radius:8px; }
.cfg-head { padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.cfg-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.cfg-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.cfg-body { flex:1; overflow-y:auto; padding:16px 20px; }
.cfg-sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6366f1; margin-bottom:6px; }
.cfg-hint { font-size:12px; color:#9ca3af; margin-bottom:12px; }

.cblock { background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:8px; overflow:hidden; }
.cblock-head { display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; user-select:none; }
.cblock-drag { color:#c4b5fd; font-size:15px; cursor:grab; }
.cblock-name { flex:1; font-size:13px; font-weight:600; color:#374151; }
.span-badge { font-size:11px; background:#ede9fe; color:#5b21b6; border-radius:12px; padding:2px 7px; white-space:nowrap; }
.tsw { position:relative; width:34px; height:19px; flex-shrink:0; }
.tsw input { opacity:0; width:0; height:0; }
.tsl { position:absolute; inset:0; background:#d1d5db; border-radius:20px; cursor:pointer; transition:.2s; }
.tsl::before { content:''; position:absolute; width:13px; height:13px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .tsl { background:#4f46e5; }
input:checked + .tsl::before { transform:translateX(14px); }
.cblock-opts { padding:2px 12px 10px; border-top:1px solid #e5e7eb; background:white; }
.opt-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:12px; color:#6b7280; border-bottom:1px solid #f3f4f6; }
.opt-row:last-child { border-bottom:none; }
.span-btns { display:flex; gap:4px; }
.span-btn { padding:3px 9px; border:1px solid #d1d5db; border-radius:5px; background:white; font-size:11px; cursor:pointer; color:#6b7280; transition:all .15s; }
.span-btn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
.sub-lbl { font-size:11px; color:#9ca3af; margin:8px 0 2px; font-weight:600; }
.mi-item { display:flex; align-items:center; gap:7px; padding:5px 4px; border-radius:6px; font-size:12px; color:#374151; }
.mi-item:hover { background:#f3f4f6; }
.mi-name { flex:1; }
.mi-del { background:none; border:none; color:#f87171; cursor:pointer; font-size:16px; line-height:1; padding:0 2px; }

.cfg-add-btn { width:100%; padding:8px; background:#f5f3ff; color:#6d28d9; border:1.5px dashed #c4b5fd; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; margin-top:4px; transition:all .15s; }
.cfg-add-btn:hover { background:#ede9fe; }
.cfg-save-btn  { width:100%; padding:11px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; margin-top:14px; }
.cfg-save-btn:hover { background:#4338ca; }
.cfg-reset-btn { width:100%; padding:9px; background:none; color:#9ca3af; border:1px solid #e5e7eb; border-radius:8px; font-size:13px; cursor:pointer; margin-top:7px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-user">
        <span id="nav-username"></span>
        <button class="btn-config" onclick="abrirConfig()">⚙️ Personalizar</button>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="welcome">
        <h2 id="welcome-msg">Bienvenido</h2>
        <p>Panel de administración y gerencia</p>
    </div>
    <div class="dash-grid" id="dash-grid"></div>
</div>

<div class="cfg-overlay" id="cfg-overlay"></div>
<div class="cfg-panel" id="cfg-panel">
    <div class="cfg-head">
        <h3>⚙️ Personalizar dashboard</h3>
        <button class="cfg-close" onclick="cerrarConfig()">✕</button>
    </div>
    <div class="cfg-body">
        <div class="cfg-sec-title">Bloques</div>
        <p class="cfg-hint">Arrastrá ⠿ para reordenar. Expandí para configurar.</p>
        <div id="cfg-blocks-list"></div>
        <button class="cfg-add-btn" onclick="agregarAccesoRapido()">＋ Agregar acceso rápido</button>
        <button class="cfg-save-btn" onclick="guardarConfig()">Guardar configuración</button>
        <button class="cfg-reset-btn" onclick="resetConfig()">Restablecer por defecto</button>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script src="js/moneda.js"></script>
<script>
requireAuth();

const user = getUser();
document.getElementById("nav-username").textContent = user.username;
document.getElementById("welcome-msg").textContent = `Bienvenido, ${user.username}`;

// ── MÓDULOS DISPONIBLES ──────────────────────────────────────
const ALL_MODULES = [
    { id:"mesas",              icon:"🪑", title:"Salas y mesas",       desc:"Distribución del local",        href:"mesas.html",                perm:"edicion_sala" },
    { id:"reservas",           icon:"📅", title:"Reservas",             desc:"Asignación de mesas",           href:"reservas.html",             perm:["gestion_reservas","ver_reservas"] },

function _moduloHabilitado(mod) {

// Fusiona una config guardada (del backend) con las definiciones de bloques de
// DEFAULT_CONFIG: respeta visibilidad/orden/columnas/módulos de lo guardado y
// agrega los bloques faltantes como ocultos (así el panel ofrece TODAS las widgets).
function _mergeConfig(saved) {
    let base = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if (!saved || !Array.isArray(saved.blocks)) {
        return base;   // null → default completo (admin/gerente sin config propia)
    }
    const mergedIds = new Set();
    const merged = saved.blocks.map(ob => {
        const nb = base.blocks.find(b => b.id === ob.id);
        if (nb) { mergedIds.add(ob.id); return { ...nb, ...ob }; }
        return ob;   // accesos rápidos (quick) personalizados
    });
    base.blocks.forEach(nb => {
        if (!mergedIds.has(nb.id)) merged.push({ ...nb, visible: false });
    });
    base.blocks = merged;
    return base;
}

// Lunes y domingo (YYYY-MM-DD, hora local) de la semana en curso.
function _semanaActual() {
    const hoy = new Date();
    const diaSem = hoy.getDay() === 0 ? 6 : hoy.getDay() - 1;   // 0 = lunes
    const lunes = new Date(hoy); lunes.setDate(hoy.getDate() - diaSem);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return { lunes: fmt(lunes), domingo: fmt(domingo), lunesDate: lunes, fmt };
}

// ── PAGINACIÓN RESERVAS ──────────────────────────────────────
// La paginación opera solo sobre reservas NO terminadas (ni canceladas).
function _reservasVisibles() {
    return reservasHoy.filter(r => {
        const est = (r.estado || "programada").toLowerCase();
        return est !== "terminada" && est !== "cancelada";
    });
}
function ppag(span) { return span === 6 ? 8 : 4; }
function totalPags(span) { return Math.max(1, Math.ceil(_reservasVisibles().length / ppag(span))); }
function calcPaginaActual() {
    const b = config.blocks.find(b => b.type === "reservas");
    const span = b ? b.span : 3;
    const pp   = ppag(span);
    const vis  = _reservasVisibles();
    const hora = new Date();
    const hStr = `${String(hora.getHours()).padStart(2,"0")}:${String(hora.getMinutes()).padStart(2,"0")}`;
    const idx  = vis.findIndex(r => (r.hora_inicio||"") >= hStr);
    const pivot = idx === -1 ? Math.max(vis.length-1,0) : Math.max(idx-1,0);
    resPag = Math.floor(pivot / pp);
}
function cambiarPagRes(dir) {
    const b = config.blocks.find(b => b.type === "reservas");
    const total = totalPags(b ? b.span : 3);
    resPag = Math.max(0, Math.min(total-1, resPag+dir));
    renderDash();
}

// ── RENDER DASHBOARD ─────────────────────────────────────────
function renderDash() {
    const grid = document.getElementById("dash-grid");
    grid.innerHTML = "";
    config.blocks.forEach(block => {
        if (!block.visible) return;
        if (!_bloqueHabilitado(block)) return;   // módulo no habilitado en este restaurante
        const el = document.createElement("div");
        el.className = `db-block span-${block.span}`;
        el.dataset.id = block.id;
        el.innerHTML = buildBlock(block);
        grid.appendChild(el);
    });
    initDrag();
    _initScrollDrag();
}

function _initScrollDrag() {
    document.querySelectorAll('.res-scroll').forEach(el => {
        let startY = 0, startScroll = 0, dragging = false;
        el.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            dragging = true; startY = e.clientY; startScroll = el.scrollTop;
            el.classList.add('dragging'); e.preventDefault();
        });
        el.addEventListener('mousemove', e => {
            if (!dragging) return;
            el.scrollTop = startScroll - (e.clientY - startY);
        });
        const stop = () => { dragging = false; el.classList.remove('dragging'); };
        el.addEventListener('mouseup', stop);
        el.addEventListener('mouseleave', stop);
        // Touch
        el.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY; startScroll = el.scrollTop;
        }, {passive:true});
        el.addEventListener('touchmove', e => {
            el.scrollTop = startScroll - (e.touches[0].clientY - startY);
        }, {passive:true});
    });
}

function buildBlock(b) {
    if (b.type === "stats")          return buildStats(b);
    if (b.type === "reservas")       return buildReservas(b);
    if (b.type === "accesos")        return buildAccesos(b);
    if (b.type === "stock")          return buildStock(b);
    if (b.type === "quick")          return buildQuick(b);
    if (b.type === "caja-estado")    return buildCajaEstado(b);
    if (b.type === "personal-turno") return buildPersonalTurno(b);
    if (b.type === "mesas-estado")   return buildMesasEstado(b);
    if (b.type === "ordenes-cocina") return buildOrdenesCocina(b);
    if (b.type === "ventas-7dias")   return buildVentas7Dias(b);
    if (b.type === "mensajes")        return buildMensajes(b);
    if (b.type === "horarios-semana") return buildHorariosSemana(b);
    if (b.type === "social")          return buildSocial(b);
    return "";
}

function buildSocial(b) {
    const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
    const ini = n => (n || '?').substring(0, 2).toUpperCase();
    const grupos = (socialGruposData && socialGruposData.grupos) || [];
    const tabs = [`<span class="sw-tab ${_socialWidgetGrupo === null ? 'active' : ''}" onclick="socialWidgetTab(null)">General</span>`]
        .concat(grupos.map(g => `<span class="sw-tab ${_socialWidgetGrupo === g.id ? 'active' : ''}" onclick="socialWidgetTab(${g.id})">${esc(g.nombre)}</span>`))
        .join('');
    const posts = (socialData || []).slice(0, 6);
    let inner;
    if (!posts.length) {
        inner = `<div class="res-empty">Sin publicaciones</div>`;
    } else {
        inner = posts.map(p => {
            const img = (p.adjuntos || []).find(a => a.tipo === 'imagen');
            const imgHtml = img ? `<img class="social-item-img" src="${esc(img.url)}" alt="" loading="lazy">` : '';
            const txt = p.contenido ? `<div class="social-item-txt">${esc(p.contenido)}</div>` : '';
            return `<div class="social-item" style="cursor:pointer" onclick="location.href='social.html?post=${p.id}'">
                <div class="social-item-top">
                    <div class="social-item-av">${esc(ini(p.username))}</div>
                    <span class="social-item-user">${esc(p.username)}</span>
                </div>
                ${txt}${imgHtml}
            </div>`;
        }).join("");
    }
    return `${blockHeader("")}
    <div class="social-card">
        <a href="social.html" class="widget-title">📣 Social</a>
        <div class="sw-tabs">${tabs}</div>
        <div class="social-list">${inner}</div>

}

// ── WIDGET: mis horarios de la semana (general, barra de 7 días) ──
function buildHorariosSemana(b) {
    const { lunesDate, fmt } = _semanaActual();
    const dias = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
    const byFecha = {};
    (horariosSemanaData || []).forEach(h => { byFecha[h.fecha] = h; });
    const hoyStr = fmt(new Date());
    let celdas = "";
    for (let i = 0; i < 7; i++) {
        const d = new Date(lunesDate); d.setDate(lunesDate.getDate() + i);
        const key = fmt(d);
        const h = byFecha[key];
        const franjas = (h && Array.isArray(h.franjas)) ? h.franjas : [];
        const turnos = franjas.length
            ? franjas.map(f => `<div class="hs-turno">${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}</div>`).join("")
            : `<div class="hs-libre">Libre</div>`;
        celdas += `<div class="hs-dia ${key === hoyStr ? 'hs-hoy' : ''}">
            <div class="hs-dia-lbl">${dias[i]} ${d.getDate()}</div>
            <div class="hs-turnos">${turnos}</div>
        </div>`;
    }
    return `${blockHeader("")}
    <div class="hs-card">
        <a href="horarios.html" class="widget-title">📅 Mis horarios de la semana</a>
        <div class="hs-grid">${celdas}</div>
    </div>`;
}

function blockHeader(label) {

function buildStats(b) {
    const sym = _monedaSim;

    function fmtTotal(v) {
        if (v === null || v === undefined) return "—";
        if (v === 0) return "0";
        const [ent, dec] = v.toFixed(2).split(".");
        const miles = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return `<span class="sum-sym">${sym}</span>${miles},${dec}`;
    }
    function fmtNum(v) {
        return (v ?? "—").toLocaleString ? Number(v).toLocaleString("es-AR") : v;
    }
    function fmtProm(v) {
        if (!v || v === 0) return "—";
        return `${sym} ${v.toFixed(2)}`;
    }

    const meta = periodos?.meta || {};
    const defs = [
        {
            cls:   "hoy",
            title: "Total hoy",
            sub:   meta.fecha_hoy || "—",
            data:  periodos?.hoy,
        },
        {
            cls:   "semana",
            title: "Total semana en curso",
            sub:   meta.num_semana ? `Semana ${meta.num_semana}` : "—",
            data:  periodos?.semana,
        },
        {
            cls:   "mes",
            title: "Total mes en curso",
            sub:   meta.nombre_mes && meta.anio ? `${meta.nombre_mes} ${meta.anio}` : "—",
            data:  periodos?.mes,
        },
        {
            cls:   "anio",
            title: "Total año en curso",
            sub:   meta.anio ? String(meta.anio) : "—",
            data:  periodos?.anio,
        },
    ];

    const cards = defs.map(d => {
        const v = d.data;
        return `
        <div class="sum-card ${d.cls}">
            <div class="sum-title">${d.title}</div>
            <div class="sum-subtitle">${d.sub}</div>
            <div class="sum-total">${v ? fmtTotal(v.total) : "—"}</div>
            ${v && v.total_neto != null ? `<div style="font-size:12px;color:#9ca3af;margin-top:-4px;text-align:right;">${fmtTotal(v.total_neto)} sin imp.</div>` : ""}
            <hr class="sum-hr">
            <div class="sum-row"><span>Mesas cerradas</span><span>${v ? fmtNum(v.mesas) : "—"}</span></div>
            <div class="sum-row"><span>Promedio por mesa</span><span>${v ? fmtProm(v.promedio_mesa) : "—"}</span></div>
            <div class="sum-gap"></div>
            <div class="sum-row"><span>Clientes totales</span><span>${v ? fmtNum(v.comensales) : "—"}</span></div>
            <div class="sum-row"><span>Promedio por cliente</span><span>${v ? fmtProm(v.promedio_comensal) : "—"}</span></div>
        </div>`;
    }).join("");

    return `${blockHeader("Resumen de facturación")}
    <div class="stats-row">${cards}</div>`;
}

function estadoReserva(r) {
    if (!r) return "cad";
    if (r.tipo === "bloqueo" || r.bloqueo) return "bloq";
    const now = new Date();
    const [hh, mm] = (r.hora_inicio || "00:00").split(":").map(Number);
    const hi = new Date(now); hi.setHours(hh, mm, 0, 0);
    let hf;
    if (r.hora_fin) {
        const [eh, em] = r.hora_fin.split(":").map(Number);
        hf = new Date(now); hf.setHours(eh, em, 0, 0);
        if (hf <= hi) hf = new Date(hf.getTime() + 86400000);
    } else {
        hf = new Date(hi.getTime() + 60 * 60000);
    }
    const fin_real = new Date(hf.getTime() - 15 * 60000);
    const alerta   = new Date(fin_real.getTime() - 15 * 60000);
    if (now >= hf)       return "cad";
    if (now >= fin_real) return "post";
    if (now >= alerta)   return "warn";
    if (now >= hi)       return "actual";
    return "prox";
}

function buildReservas(b) {
    const span   = b.span;

    // Resumen global — contadores por estado (terminadas solo como número)
    let nProg = 0, nEspera = 0, nSentado = 0, nTerminada = 0;
    reservasHoy.forEach(r => {
        if (r.tipo === "bloqueo" || r.bloqueo) return;
        const est = (r.estado || "programada").toLowerCase();
        if      (est === "sentado")   nSentado++;
        else if (est === "en_espera") nEspera++;
        else if (est === "terminada") nTerminada++;
        else if (est !== "cancelada") nProg++;
    });

    function slotHtml(r) {
        if (!r) return "";
        const bloq = r.tipo === "bloqueo" || r.bloqueo;
        if (bloq) {
            const mot = r.motivo || "Bloqueo";
            return `<div class="res-slot bloq">

                <div class="res-info">

        }
        const est    = (r.estado || "programada").toLowerCase();

// ── DRAG & DROP BLOQUES ──────────────────────────────────────
function initDrag() {
    const grid = document.getElementById("dash-grid");
    let dragging = null;
    let canDrag  = false;

    grid.querySelectorAll(".db-block").forEach(block => {
        // Solo arrastrar si el config está abierto Y el mousedown fue sobre el handle
        block.addEventListener("mousedown", e => {
            const cfgOpen = document.body.classList.contains("config-open");
            canDrag = cfgOpen && !!e.target.closest(".block-drag");
            block.setAttribute("draggable", canDrag ? "true" : "false");
        });
        document.addEventListener("mouseup", () => {
            block.setAttribute("draggable","false");
        }, { once: false });

        block.addEventListener("dragstart", e => {
            if (!canDrag) { e.preventDefault(); return; }
            dragging = block;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", block.dataset.id);
            setTimeout(() => { if (dragging) dragging.classList.add("dragging"); }, 0);
        });

        block.addEventListener("dragend", () => {
            if (dragging) dragging.classList.remove("dragging");
            dragging = null; canDrag = false;
            grid.querySelectorAll(".db-block").forEach(b => b.classList.remove("drop-before","drop-after"));
            // Sync order to config
            syncOrder();
        });

        block.addEventListener("dragover", e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            if (!dragging || dragging === block) return;
            const rect = block.getBoundingClientRect();
            grid.querySelectorAll(".db-block").forEach(b => b.classList.remove("drop-before","drop-after"));
            block.classList.add(e.clientX < rect.left + rect.width/2 ? "drop-before" : "drop-after");
        });

        block.addEventListener("dragleave", e => {
            if (!block.contains(e.relatedTarget)) block.classList.remove("drop-before","drop-after");
        });

        block.addEventListener("drop", e => {
            e.preventDefault();
            if (!dragging || dragging === block) return;
            const before = block.classList.contains("drop-before");
            block.classList.remove("drop-before","drop-after");
            grid.insertBefore(dragging, before ? block : block.nextSibling);
            syncOrder();
        });
    });
}

function syncOrder() {
    const ids = [...document.querySelectorAll(".db-block")].map(b => b.dataset.id);
    config.blocks.sort((a,b) => {
        const ai = ids.indexOf(a.id), bi = ids.indexOf(b.id);
        return (ai<0?999:ai)-(bi<0?999:bi);
    });
}

function renderConfigPanel() {
    // La lista del panel va en orden ESTABLE (catálogo), independiente del orden de
    // las widgets en pantalla. Los controles operan por id (no por índice), así que
    // reordenar las widgets no descoloca el activar/desactivar.
    document.getElementById("cfg-blocks-list").innerHTML =
        _ordenSidebar().map(b => (b.type === "accesos" || _bloqueHabilitado(b)) ? buildCblock(b) : "").join("");
}

// Orden fijo del panel lateral: el del catálogo (DEFAULT_CONFIG); los bloques que no
// estén en el catálogo (p.ej. accesos rápidos personalizados) van al final.
function _ordenSidebar() {
    const porId = new Map(config.blocks.map(b => [b.id, b]));
    const out = [];
    DEFAULT_CONFIG.blocks.forEach(d => { const b = porId.get(d.id); if (b) { out.push(b); porId.delete(d.id); } });
    porId.forEach(b => out.push(b));
    return out;
}

    // Accesos rápidos múltiples: lista de módulos
    if (b.type === "accesos") {
        const items = ALL_MODULES.filter(m => _moduloHabilitado(_MOD_ACCESO[m.id])).map(m => {
            const on = (b.modules||[]).includes(m.id);

                <label class="tsw"><input type="checkbox" ${on?"checked":""} onchange="toggleModAcceso('${id}','${m.id}',this.checked)"><span class="tsl"></span></label>
            </div>`;
        }).join("");
        opts += `<div class="sub-lbl">Módulos visibles</div><div>${items}</div>`;
    }

    const canDelete = b.type === "quick";
    // Badge "Nuevo" para widgets recién agregados
    const isNuevo = TIPOS_NUEVOS.has(b.type);
    const nuevoBadge = isNuevo

        : "";

    return `<div class="cblock">
        <div class="cblock-head" onclick="toggleOpts('${id}')">
            <span class="cblock-drag">⠿</span>
            <span class="cblock-name">${b.label} ${nuevoBadge}</span>
            <span class="span-badge">${spanLabel}</span>
            ${canDelete ? `<button class="mi-del" onclick="event.stopPropagation();eliminarBloque('${id}')">✕</button>` : ""}
            <label class="tsw" onclick="event.stopPropagation()">
                <input type="checkbox" ${b.visible?"checked":""} onchange="toggleVisible('${id}',this.checked)">
                <span class="tsl"></span>
            </label>
        </div>
        <div id="cblock-opts-${id}" class="cblock-opts" style="display:none">${opts}</div>
    </div>`;
}

// Los controles del panel operan por ID (no por índice), así reordenar las widgets
// en pantalla nunca descoloca activar/desactivar/columnas del bloque correcto.
function _bloquePorId(id) { return config.blocks.find(b => b.id === id); }

function toggleOpts(id) {
    const el = document.getElementById(`cblock-opts-${id}`);
    if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}
function toggleVisible(id, val) {
    const b = _bloquePorId(id);
    if (!b) return;
    b.visible = val;
    renderDash();
}
function setSpan(id, span) {
    const b = _bloquePorId(id);
    if (!b) return;
    b.span = span;
    if (b.type === "reservas") calcPaginaActual();
    renderDash();
    renderConfigPanel();
    setTimeout(() => {
        const el = document.getElementById(`cblock-opts-${id}`);
        if (el) el.style.display = "block";
    }, 10);
}
function toggleModAcceso(id, moduleId, val) {
    const b = _bloquePorId(id);
    if (!b) return;
    let mods = [...(b.modules || [])];
    if (val && !mods.includes(moduleId)) mods.push(moduleId);
    else if (!val) mods = mods.filter(m => m !== moduleId);
    b.modules = mods;
    renderDash();
}
function setQuickModule(id, moduleId) {
    const b = _bloquePorId(id);
    if (!b) return;
    b.moduleId = moduleId;
    const m = getMod(moduleId);
    if (m) b.label = m.title;
    renderDash();
    renderConfigPanel();
    setTimeout(() => {
        const el = document.getElementById(`cblock-opts-${id}`);
        if (el) el.style.display = "block";
    }, 10);
}
function eliminarBloque(id) {
    const i = config.blocks.findIndex(b => b.id === id);
    if (i < 0) return;
    config.blocks.splice(i, 1);
    renderDash();
    renderConfigPanel();
}

let _quickCounter = 0;
function agregarAccesoRapido() {
    const defaultMod = ALL_MODULES[0];
    config.blocks.push({
        id: `quick-${Date.now()}-${_quickCounter++}`,
        type: "quick",
        label: defaultMod.title,
        visible: true,
        span: 1,
        moduleId: defaultMod.id
    });
    renderDash();
    renderConfigPanel();
    // Scroll al fondo del panel
    const body = document.querySelector(".cfg-body");
    if (body) body.scrollTop = body.scrollHeight;
}

async function guardarConfig() {
    syncOrder();
    try {
        if (_saveTarget === 'mio') {
            await apiFetch('/dashboards/mio', { method: 'PUT', body: JSON.stringify({ config }) });
        } else if (_saveTarget && _saveTarget.tpl) {
            await apiFetch(`/dashboards/templates/${_saveTarget.tpl}`, { method: 'PATCH', body: JSON.stringify({ config }) });
        } else if (_saveTarget && _saveTarget.user) {
            const nombre = prompt('Guardar dashboard como (nombre de la plantilla):', _saveTarget.nombre || '');
            if (nombre === null) return;                       // canceló: seguir editando
            if (!nombre.trim()) { alert('Tenés que ponerle un nombre.'); return; }
            await apiFetch(`/dashboards/usuario/${_saveTarget.user}/guardar`,
                { method: 'POST', body: JSON.stringify({ nombre: nombre.trim(), config }) });
        }
    } catch (e) {
        alert('No se pudo guardar el dashboard: ' + (e.message || e));
        return;
    }
    cerrarConfig();
    if (_modoEditor) window.location.href = 'configuracion.html#dashboard';  // volver a Configuración
}

function resetConfig() {
    if (!confirm("¿Restablecer este dashboard?")) return;
    // En un editor admin → mínimo (accesos). En el propio (admin/gerente) → default completo.
    config = _mergeConfig(_modoEditor ? MINIMAL_CONFIG : null);
    resPag = 0;
    renderDash();
    renderConfigPanel();
}

// ── INIT ─────────────────────────────────────────────────────
// Empleado de cadena: el dashboard es su HUB. Arriba, un PANEL GENERAL fijo (datos
// de todos sus locales vía /empleado/*, contexto cuenta): horarios + mensajes [+ muro].
// Debajo, una SOLAPA por restaurante; al activarla se "entra" al local y se carga su
// dashboard REAL (config + datos del local) reusando cargarDatos()/renderDash().
function _empInjectCss() {
    if (document.getElementById('emp-dash-css')) return;
    const st = document.createElement('style'); st.id = 'emp-dash-css';
    st.textContent = `
        .emp-sec-title { font-size:13px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.5px; margin:20px 4px 10px; }
        .emp-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
        .emp-tab { background:white; border:1.5px solid #e5e7eb; color:#374151; border-radius:10px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.05); transition:all .15s; }
        .emp-tab:hover { border-color:#a5b4fc; color:#4338ca; }
        .emp-tab.active { background:#4f46e5; border-color:#4f46e5; color:white; }
    `;
    document.head.appendChild(st);
}

function _empBuildLayout() {
    if (document.getElementById('emp-general')) return;
    const content = document.querySelector('.content');
    const grid = document.getElementById('dash-grid');
    const frag = document.createElement('div');
    frag.innerHTML = `
        <div class="emp-sec-title">General</div>
        <div class="dash-grid" id="emp-general"></div>
        <div class="emp-sec-title" id="emp-tabs-title" style="display:none;">Mis restaurantes</div>
        <div class="emp-tabs" id="emp-tabs"></div>
    `;
    while (frag.firstChild) content.insertBefore(frag.firstChild, grid);
}

let _empMuroData = [];
function _empBuildMuro() {
    const esc = s => (s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
    const posts = (_empMuroData || []).slice(0, 8);
    const inner = posts.length ? posts.map(p => {
        const img = (p.adjuntos || []).find(a => a.tipo === 'imagen');
        const imgHtml = img ? `<img class="social-item-img" src="${esc(img.url)}" alt="" loading="lazy">` : '';
        const txt = p.contenido ? `<div class="social-item-txt">${esc(p.contenido)}</div>` : '';
        const tag = p.restaurante ? `<span style="margin-left:auto;font-size:9px;font-weight:700;color:#4338ca;background:#eef2ff;border-radius:4px;padding:1px 5px;">${esc(p.restaurante)}</span>` : '';
        const href = `social.html?post=${p.id}${p.restaurante_id!=null?('&rest='+p.restaurante_id):''}`;
        return `<div class="social-item" style="cursor:pointer" onclick="location.href='${href}'"><div class="social-item-top"><div class="social-item-av">${esc((p.username || '?').substring(0,2).toUpperCase())}</div><span class="social-item-user">${esc(p.username)}</span>${tag}</div>${txt}${imgHtml}</div>`;
    }).join('') : '<div class="res-empty">Sin publicaciones</div>';
    return `${blockHeader("")}
    <div class="social-card">
        <a href="social.html" class="widget-title">📣 Muro</a>
        <div class="social-list">${inner}</div>
    </div>`;
}

function _empRenderGeneral() {
    const cont = document.getElementById('emp-general');
    if (!cont) return;
    // Panel general del empleado: horarios + mensajes (renderers existentes con datos del
    // empleado en las vars globales) + muro (Social agregado de sus locales).
    cont.innerHTML =
        `<div class="db-block span-6" data-id="horarios-semana">${buildBlock({ type:'horarios-semana' })}</div>` +
        `<div class="db-block span-3" data-id="mensajes">${buildBlock({ type:'mensajes' })}</div>` +
        `<div class="db-block span-3" data-id="muro">${_empBuildMuro()}</div>`;
    // En modo empleado, "Mis horarios" va a la grilla agregada (no al editor de 1 restaurante)
    cont.querySelectorAll('a[href="cuadrante.html"]').forEach(a => { a.href = 'horarios.html'; });
}

function _empRenderTabs(rests) {
    const bar = document.getElementById('emp-tabs');
    const title = document.getElementById('emp-tabs-title');
    if (!bar) return;
    if (!rests.length) { bar.innerHTML = ''; if (title) title.style.display = 'none'; return; }
    if (title) title.style.display = '';
    const cur = sessionStorage.getItem('emp_dash');
    const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    bar.innerHTML = rests.map(r => {
        const active = String(r.restaurante_id) === cur ? ' active' : '';
        return `<button class="emp-tab${active}" data-rid="${r.restaurante_id}" onclick="_empSelectResto(${r.restaurante_id})">🍽️ ${esc(r.restaurante)}</button>`;
    }).join('');
}

async function _empSelectResto(rid) {
    sessionStorage.setItem('emp_dash', String(rid));
    document.querySelectorAll('#emp-tabs .emp-tab').forEach(t => t.classList.toggle('active', String(t.dataset.rid) === String(rid)));
    const grid = document.getElementById('dash-grid');
    if (window.UI) UI.skeletonCards(grid, 6); else grid.innerHTML = '<div class="res-empty" style="padding:30px;">Cargando…</div>';
    try { await entrarRestaurante(rid); }
    catch (e) { grid.innerHTML = `<div class="res-empty" style="padding:30px;">No se pudo abrir el restaurante: ${(e.message||e)}</div>`; return; }
    // Dashboard REAL del local (su config resuelta en backend; el empleado no lo edita acá)
    let resp = null;
    try { resp = await api.get('/dashboards/mio'); } catch (e) {}
    config = _mergeConfig((resp && resp.config) || MINIMAL_CONFIG);
    // Sacar de la solapa los widgets que ya están en el panel general (no duplicar).
    const _GEN = new Set(['horarios-semana', 'mensajes', 'social']);
    config.blocks = (config.blocks || []).filter(b => !_GEN.has(b.type) && !_GEN.has(b.id));
    _canEditDash = false;
    await cargarDatos();   // usa el token del local; renderiza en #dash-grid
}
window._empSelectResto = _empSelectResto;

async function initDashboardEmpleado() {
    // Restaura contexto "cuenta" y pide el panel general con el emp_token explícito.
    if (typeof volverACuenta === 'function') volverACuenta();
    const _emp = (typeof getEmpToken === 'function') ? getEmpToken() : null;
    _canEditDash = false;
    const btnCfg = document.querySelector('.btn-config'); if (btnCfg) btnCfg.style.display = 'none';

    _empInjectCss();
    _empBuildLayout();

    // 1) Panel general (datos del empleado, todos sus locales)
    try {
        const wk = _semanaActual();
        const dDom = new Date(wk.lunesDate); dDom.setDate(wk.lunesDate.getDate() + 6);
        horariosSemanaData = await apiFetch(`/empleado/horarios?desde=${wk.fmt(wk.lunesDate)}&hasta=${wk.fmt(dDom)}`, { token: _emp }) || [];
    } catch (e) { horariosSemanaData = []; }
    try { mensajesData = await apiFetch('/empleado/mensajes', { token: _emp }) || []; } catch (e) { mensajesData = []; }
    try { _empMuroData = await apiFetch('/empleado/social', { token: _emp }) || []; } catch (e) { _empMuroData = []; }
    _empRenderGeneral();

    // 2) Solapas por restaurante + dashboard real del seleccionado
    let rests = [];
    try { rests = await apiFetch('/empleado/mis-restaurantes', { token: _emp }) || []; } catch (e) { rests = []; }
    _empRenderTabs(rests);
    if (!rests.length) {
        document.getElementById('dash-grid').innerHTML = '<div class="res-empty" style="padding:30px;">No estás asignado a ningún restaurante todavía.</div>';
        return;
    }
    const saved = sessionStorage.getItem('emp_dash');
    const rid = (saved && rests.some(r => String(r.restaurante_id) === saved)) ? parseInt(saved) : rests[0].restaurante_id;
    await _empSelectResto(rid);
}

async function initDashboard() {
    // Empleado de cadena: el dashboard es SIEMPRE su hub, aunque haya quedado activo un
    // token de restaurante tras visitar una pantalla común (initDashboardEmpleado
    // restaura el contexto "cuenta").
    if (typeof esEmpleadoCadena === 'function' && esEmpleadoCadena()) {
        await initDashboardEmpleado();
        return;
    }
    const params = new URLSearchParams(window.location.search);
    const editar = params.get('editar');   // 'user:<uid>' (personalizar usuario) | '<tplId>' (plantilla)

    if (editar && editar.startsWith('user:')) {
        // MODO EDITOR de usuario: parte de la plantilla que le aplica; el nombre se pide al guardar
        const uid = editar.slice(5);
        _modoEditor = true; _canEditDash = true;
        let data = null;
        try { data = await api.get(`/dashboards/usuario/${uid}/editor`); } catch (e) {}
        _saveTarget = { user: uid, nombre: (data && data.nombre) || '' };
        const cfg = (data && data.config && Array.isArray(data.config.blocks) && data.config.blocks.length)
            ? data.config : MINIMAL_CONFIG;
        config = _mergeConfig(cfg);
        document.body.classList.add('modo-editor');
        const wm = document.getElementById('welcome-msg');
        if (wm) wm.textContent = `Personalizando dashboard de: ${(data && data.username) || 'usuario'}`;
    } else if (editar) {
        // MODO EDITOR de plantilla (rol o del pool)
        _modoEditor = true; _canEditDash = true;
        _editorTplId = editar;
        _saveTarget  = { tpl: editar };
        let tplCfg = null, tplNom = '';
        try {
            const tpl = await api.get(`/dashboards/templates/${editar}`);
            tplNom = tpl.nombre || '';
            tplCfg = (tpl.config && Array.isArray(tpl.config.blocks) && tpl.config.blocks.length)
                ? tpl.config : MINIMAL_CONFIG;
        } catch (e) { tplCfg = MINIMAL_CONFIG; }
        config = _mergeConfig(tplCfg);
        document.body.classList.add('modo-editor');
        const wm = document.getElementById('welcome-msg');
        if (wm) wm.textContent = `Editando dashboard: ${tplNom}`;
    } else {
        // MODO RUNTIME: el usuario ve su dashboard resuelto en el backend
        let resp = null;
        try { resp = await api.get('/dashboards/mio'); } catch (e) {}
        _canEditDash = !!(resp && resp.can_edit);
        _saveTarget  = _canEditDash ? 'mio' : null;
        let saved = resp && resp.config;
        if (!saved) saved = _canEditDash ? null : MINIMAL_CONFIG;  // admin/gerente=completo; resto=accesos
        config = _mergeConfig(saved);
    }

    // El botón "Personalizar" solo aparece si este dashboard es editable
    const btnCfg = document.querySelector('.btn-config');
    if (btnCfg) btnCfg.style.display = _canEditDash ? '' : 'none';

    await cargarDatos();              // trae datos y renderiza
    if (_modoEditor) abrirConfig();   // en el editor, abrir el panel de widgets
}

initDashboard();
</script>
