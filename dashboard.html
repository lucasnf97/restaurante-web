<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* NAVBAR */
.navbar { background:#1a1a2e; color:white; padding:0 32px; height:60px; display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0; z-index:300; }
.navbar-brand { font-size:18px; font-weight:700; letter-spacing:.5px; }
.navbar-user { display:flex; align-items:center; gap:12px; font-size:14px; color:#a5b4fc; }
.btn-config { background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.4); color:#a5b4fc; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px; transition:all .2s; }
.btn-config:hover { background:rgba(99,102,241,.35); color:white; }
.btn-logout { background:transparent; border:1px solid #4f46e5; color:#a5b4fc; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s; }
.btn-logout:hover { background:#4f46e5; color:white; }

/* CONTENT */
.content { margin-top:60px; padding:28px 32px; margin-right:0; transition:margin-right .3s cubic-bezier(.4,0,.2,1); }
body.config-open .content { margin-right:390px; }
.welcome { margin-bottom:22px; }
.welcome h2 { font-size:22px; color:#1a1a2e; font-weight:700; }
.welcome p  { color:#888; margin-top:4px; font-size:14px; }

/* 6-COL GRID */
.dash-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:18px; align-items:start; }
.span-1 { grid-column:span 1; }
.span-2 { grid-column:span 2; }
.span-3 { grid-column:span 3; }
.span-6 { grid-column:span 6; }

/* Block wrapper */
.db-block { position:relative; cursor:default; }
.db-block.dragging { opacity:.35; pointer-events:none; }
.db-block.drop-before { box-shadow: -4px 0 0 #4f46e5; }
.db-block.drop-after  { box-shadow:  4px 0 0 #4f46e5; }

.block-label { font-size:10px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:flex; align-items:center; gap:6px; user-select:none; }
.block-drag { cursor:grab; color:#c4b5fd; font-size:16px; padding:2px 4px; border-radius:4px; line-height:1; display:none; }
.block-drag:active { cursor:grabbing; }
.block-drag:hover { background:rgba(196,181,253,.15); }
body.config-open .block-drag { display:inline; }

/* STAT CARDS */
.stats-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
.stat-card { background:white; border-radius:12px; padding:18px 22px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.stat-label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.stat-value { font-size:26px; font-weight:700; color:#1a1a2e; }
.stat-value.green  { color:#16a34a; }
.stat-value.blue   { color:#4f46e5; }
.stat-value.orange { color:#d97706; }

/* MODULE CARD */
.module-card { background:white; border-radius:12px; padding:20px 16px; cursor:pointer; transition:all .2s; box-shadow:0 2px 8px rgba(0,0,0,.06); text-decoration:none; color:inherit; display:flex; flex-direction:column; border:2px solid transparent; height:100%; }
.module-card:hover { border-color:#4f46e5; transform:translateY(-2px); box-shadow:0 6px 20px rgba(79,70,229,.12); }
.module-icon  { font-size:28px; margin-bottom:10px; }
.module-title { font-size:13px; font-weight:700; color:#1a1a2e; margin-bottom:4px; }
.module-desc  { font-size:11px; color:#888; line-height:1.4; }
.modules-grid { display:grid; gap:14px; }
.modules-cols-1 { grid-template-columns:1fr; }
.modules-cols-2 { grid-template-columns:repeat(2,1fr); }
.modules-cols-3 { grid-template-columns:repeat(3,1fr); }
.modules-cols-6 { grid-template-columns:repeat(6,1fr); }

/* RESERVAS WIDGET */
.reservas-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; display:flex; flex-direction:column; height:300px; }
.widget-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0; }
.widget-title { font-size:13px; font-weight:700; color:#1a1a2e; display:flex; align-items:center; gap:6px; text-decoration:none; }
.widget-title:hover { color:#4f46e5; }
.res-summary { display:flex; align-items:center; gap:8px; }
.res-badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.res-badge.cad  { background:#f3f4f6; color:#6b7280; }
.res-badge.act  { background:#f0fdf4; color:#16a34a; }
.res-badge.prox { background:#ede9fe; color:#7c3aed; }
.reservas-slots { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:5px; }
.reservas-book { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; flex:1; overflow:hidden; }
.reservas-col  { display:flex; flex-direction:column; gap:5px; overflow:hidden; }
.res-slot { display:flex; align-items:flex-start; gap:8px; padding:6px 9px; border-radius:7px; font-size:12px; flex-shrink:0; }
.res-slot.prox   { background:#ede9fe; border-left:3px solid #7c3aed; }
.res-slot.actual { background:#f0fdf4; border-left:3px solid #22c55e; }
.res-slot.warn   { background:#fffbeb; border-left:3px solid #f59e0b; }
.res-slot.post   { background:#fef2f2; border-left:3px solid #ef4444; }
.res-slot.cad    { background:#f9fafb; border-left:3px solid #d1d5db; opacity:.65; }
.res-slot.bloq   { background:#fff7ed; border-left:3px solid #f59e0b; }
.res-hora { font-weight:700; min-width:38px; flex-shrink:0; }
.res-info { flex:1; min-width:0; }
.res-nombre { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.res-sub  { font-size:11px; color:#888; margin-top:1px; }
.res-empty { text-align:center; padding:28px 16px; color:#9ca3af; font-size:13px; }
.res-pager { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; flex-shrink:0; }
.res-pag-btn { background:#f3f4f6; border:none; border-radius:6px; width:26px; height:26px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.res-pag-btn:hover:not(:disabled) { background:#e0e7ff; }
.res-pag-btn:disabled { opacity:.3; cursor:not-allowed; }
.res-pag-info { font-size:11px; color:#9ca3af; }

/* STOCK WIDGET */
.stock-card { background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); padding:16px 18px; }
.stock-row  { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f3f4f6; font-size:13px; }
.stock-row:last-child { border-bottom:none; }
.stock-dot  { width:10px; height:10px; border-radius:50%; }
.dot-ok   { background:#16a34a; }
.dot-warn { background:#f59e0b; }
.dot-red  { background:#dc2626; }
.stock-num { font-size:22px; font-weight:700; }

/* CONFIG PANEL */
.cfg-overlay { display:none; }
.cfg-panel { position:fixed; top:0; right:0; width:390px; height:100%; background:white; z-index:401; box-shadow:-4px 0 24px rgba(0,0,0,.15); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); }
.cfg-panel.open { transform:translateX(0); }
/* Indicador visual de modo edición */
body.config-open .dash-grid { outline:2px dashed #c4b5fd; outline-offset:8px; border-radius:8px; }
.cfg-head { padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.cfg-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.cfg-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.cfg-body { flex:1; overflow-y:auto; padding:16px 20px; }
.cfg-sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6366f1; margin-bottom:6px; }
.cfg-hint { font-size:12px; color:#9ca3af; margin-bottom:12px; }

.cblock { background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:8px; overflow:hidden; }
.cblock-head { display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; user-select:none; }
.cblock-drag { color:#c4b5fd; font-size:15px; cursor:grab; }
.cblock-name { flex:1; font-size:13px; font-weight:600; color:#374151; }
.span-badge { font-size:11px; background:#ede9fe; color:#5b21b6; border-radius:12px; padding:2px 7px; white-space:nowrap; }
.tsw { position:relative; width:34px; height:19px; flex-shrink:0; }
.tsw input { opacity:0; width:0; height:0; }
.tsl { position:absolute; inset:0; background:#d1d5db; border-radius:20px; cursor:pointer; transition:.2s; }
.tsl::before { content:''; position:absolute; width:13px; height:13px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .tsl { background:#4f46e5; }
input:checked + .tsl::before { transform:translateX(14px); }
.cblock-opts { padding:2px 12px 10px; border-top:1px solid #e5e7eb; background:white; }
.opt-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:12px; color:#6b7280; border-bottom:1px solid #f3f4f6; }
.opt-row:last-child { border-bottom:none; }
.span-btns { display:flex; gap:4px; }
.span-btn { padding:3px 9px; border:1px solid #d1d5db; border-radius:5px; background:white; font-size:11px; cursor:pointer; color:#6b7280; transition:all .15s; }
.span-btn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
.sub-lbl { font-size:11px; color:#9ca3af; margin:8px 0 2px; font-weight:600; }
.mi-item { display:flex; align-items:center; gap:7px; padding:5px 4px; border-radius:6px; font-size:12px; color:#374151; }
.mi-item:hover { background:#f3f4f6; }
.mi-name { flex:1; }
.mi-del { background:none; border:none; color:#f87171; cursor:pointer; font-size:16px; line-height:1; padding:0 2px; }

.cfg-add-btn { width:100%; padding:8px; background:#f5f3ff; color:#6d28d9; border:1.5px dashed #c4b5fd; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; margin-top:4px; transition:all .15s; }
.cfg-add-btn:hover { background:#ede9fe; }
.cfg-save-btn  { width:100%; padding:11px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; margin-top:14px; }
.cfg-save-btn:hover { background:#4338ca; }
.cfg-reset-btn { width:100%; padding:9px; background:none; color:#9ca3af; border:1px solid #e5e7eb; border-radius:8px; font-size:13px; cursor:pointer; margin-top:7px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-user">
        <span id="nav-username"></span>
        <button class="btn-config" onclick="abrirConfig()">⚙️ Personalizar</button>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="welcome">
        <h2 id="welcome-msg">Bienvenido</h2>
        <p>Panel de administración y gerencia</p>
    </div>
    <div class="dash-grid" id="dash-grid"></div>
</div>

<div class="cfg-overlay" id="cfg-overlay" onclick="cerrarConfig()"></div>
<div class="cfg-panel" id="cfg-panel">
    <div class="cfg-head">
        <h3>⚙️ Personalizar dashboard</h3>
        <button class="cfg-close" onclick="cerrarConfig()">✕</button>
    </div>
    <div class="cfg-body">
        <div class="cfg-sec-title">Bloques</div>
        <p class="cfg-hint">Arrastrá ⠿ para reordenar. Expandí para configurar.</p>
        <div id="cfg-blocks-list"></div>
        <button class="cfg-add-btn" onclick="agregarAccesoRapido()">＋ Agregar acceso rápido</button>
        <button class="cfg-save-btn" onclick="guardarConfig()">Guardar configuración</button>
        <button class="cfg-reset-btn" onclick="resetConfig()">Restablecer por defecto</button>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();
requireRol("admin","gerente");

const user = getUser();
document.getElementById("nav-username").textContent = user.username;
document.getElementById("welcome-msg").textContent = `Bienvenido, ${user.username}`;

// ── MÓDULOS DISPONIBLES ──────────────────────────────────────
const ALL_MODULES = [
    { id:"mesas",     icon:"🪑", title:"Salas y mesas",    desc:"Distribución del local",        href:"mesas.html" },
    { id:"reservas",  icon:"📅", title:"Reservas",          desc:"Asignación de mesas",           href:"reservas.html" },
    { id:"productos", icon:"🍕", title:"Carta y productos", desc:"Menú, precios y categorías",    href:"productos.html" },
    { id:"caja",      icon:"💰", title:"Caja e historial",  desc:"Abrí y cerrá caja",             href:"caja.html" },
    { id:"fichajes",  icon:"🕐", title:"Fichajes",          desc:"Entrada y salida del personal",  href:"fichajes.html" },
    { id:"usuarios",  icon:"👥", title:"Usuarios",          desc:"Personal y roles de acceso",    href:"usuarios.html" },
    { id:"stock",     icon:"📦", title:"Stock",             desc:"Control de insumos",            href:"stock.html" },
    { id:"facturas",  icon:"📄", title:"Facturas",          desc:"Carga con IA y proveedores",    href:"facturas.html" },
];
function getMod(id) { return ALL_MODULES.find(m => m.id === id); }

// ── CONFIG POR DEFECTO ───────────────────────────────────────
const DEFAULT_CONFIG = { blocks: [
    { id:"stats",        type:"stats",   label:"Resumen del día",   visible:true, span:6 },
    { id:"reservas",     type:"reservas",label:"Reservas del día",  visible:true, span:3 },
    { id:"accesos",      type:"accesos", label:"Accesos rápidos",   visible:true, span:6,
      modules:["mesas","productos","caja","fichajes","usuarios","stock","facturas"] },
    { id:"stock-status", type:"stock",   label:"Estado del stock",  visible:true, span:3 },
]};

// ── LOAD / SAVE ──────────────────────────────────────────────
function loadConfig() {
    try { const s = localStorage.getItem("dash_cfg_v3"); if (s) return JSON.parse(s); } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}
function saveConfig() { localStorage.setItem("dash_cfg_v3", JSON.stringify(config)); }

let config = loadConfig();

// ── DATOS ────────────────────────────────────────────────────
let statsData   = { pedidos:"—", total:"—", mesas:"—", reservas:"—" };
let reservasHoy = [];
let stockData   = { ok:0, warn:0, agotado:0 };
let resPag      = 0;

async function cargarDatos() {
    try {
        const r = await api.get("/caja/resumen/hoy");
        statsData.pedidos = r.pedidos_cobrados;
        statsData.total   = `$${r.total_hoy.toFixed(2)}`;
    } catch(e) {}
    try {
        const m = await api.get("/mesas/?estado=ocupada");
        statsData.mesas = m.length;
    } catch(e) {}
    try {
        const hoy = new Date().toISOString().split("T")[0];
        const rv  = await api.get(`/reservas/?fecha=${hoy}`);
        statsData.reservas = rv.length;
        reservasHoy = rv.sort((a,b) => (a.hora||"").localeCompare(b.hora||""));
        calcPaginaActual();
    } catch(e) {}
    try {
        const ins = await api.get("/stock/insumos");
        stockData = { ok:0, warn:0, agotado:0 };
        ins.forEach(i => {
            if (i.agotado) stockData.agotado++;
            else if (i.en_advertencia) stockData.warn++;
            else stockData.ok++;
        });
    } catch(e) {}
    renderDash();
}

// ── PAGINACIÓN RESERVAS ──────────────────────────────────────
function ppag(span) { return span === 6 ? 6 : 4; }
function totalPags(span) { return Math.max(1, Math.ceil(reservasHoy.length / ppag(span))); }
function calcPaginaActual() {
    const b = config.blocks.find(b => b.type === "reservas");
    const span = b ? b.span : 3;
    const pp   = ppag(span);
    const hora = new Date();
    const hStr = `${String(hora.getHours()).padStart(2,"0")}:${String(hora.getMinutes()).padStart(2,"0")}`;
    const idx  = reservasHoy.findIndex(r => (r.hora_inicio||"") >= hStr);
    const pivot = idx === -1 ? Math.max(reservasHoy.length-1,0) : Math.max(idx-1,0);
    resPag = Math.floor(pivot / pp);
}
function cambiarPagRes(dir) {
    const b = config.blocks.find(b => b.type === "reservas");
    const total = totalPags(b ? b.span : 3);
    resPag = Math.max(0, Math.min(total-1, resPag+dir));
    renderDash();
}

// ── RENDER DASHBOARD ─────────────────────────────────────────
function renderDash() {
    const grid = document.getElementById("dash-grid");
    grid.innerHTML = "";
    config.blocks.forEach(block => {
        if (!block.visible) return;
        const el = document.createElement("div");
        el.className = `db-block span-${block.span}`;
        el.dataset.id = block.id;
        el.innerHTML = buildBlock(block);
        grid.appendChild(el);
    });
    initDrag();
}

function buildBlock(b) {
    if (b.type === "stats") return buildStats(b);
    if (b.type === "reservas") return buildReservas(b);
    if (b.type === "accesos")  return buildAccesos(b);
    if (b.type === "stock")    return buildStock(b);
    if (b.type === "quick")    return buildQuick(b);
    return "";
}

function blockHeader(label) {
    return `<div class="block-label"><span class="block-drag">⠿</span>${label}</div>`;
}

function buildStats(b) {
    return `${blockHeader("Resumen del día")}
    <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Pedidos hoy</div><div class="stat-value blue">${statsData.pedidos}</div></div>
        <div class="stat-card"><div class="stat-label">Total hoy</div><div class="stat-value green">${statsData.total}</div></div>
        <div class="stat-card"><div class="stat-label">Mesas ocupadas</div><div class="stat-value">${statsData.mesas}</div></div>
        <div class="stat-card"><div class="stat-label">Reservas hoy</div><div class="stat-value orange">${statsData.reservas}</div></div>
    </div>`;
}

function estadoReserva(r) {
    if (!r) return "cad";
    if (r.tipo === "bloqueo" || r.bloqueo) return "bloq";
    const now = new Date();
    const [hh, mm] = (r.hora_inicio || "00:00").split(":").map(Number);
    const hi = new Date(now); hi.setHours(hh, mm, 0, 0);
    let hf;
    if (r.hora_fin) {
        const [eh, em] = r.hora_fin.split(":").map(Number);
        hf = new Date(now); hf.setHours(eh, em, 0, 0);
        if (hf <= hi) hf = new Date(hf.getTime() + 86400000);
    } else {
        hf = new Date(hi.getTime() + 60 * 60000);
    }
    const fin_real = new Date(hf.getTime() - 15 * 60000);
    const alerta   = new Date(fin_real.getTime() - 15 * 60000);
    if (now >= hf)       return "cad";
    if (now >= fin_real) return "post";
    if (now >= alerta)   return "warn";
    if (now >= hi)       return "actual";
    return "prox";
}

function buildReservas(b) {
    const span   = b.span;
    const pp     = ppag(span);
    const total  = totalPags(span);
    const inicio = resPag * pp;
    const slots  = reservasHoy.slice(inicio, inicio + pp);

    // Resumen global
    let nCad = 0, nAct = 0, nProx = 0;
    reservasHoy.forEach(r => {
        const bloq = r.tipo === "bloqueo" || r.bloqueo;
        if (!bloq) {
            const e = estadoReserva(r);
            if (e === "cad") nCad++;
            else if (e === "prox") nProx++;
            else nAct++;   // actual, warn, post
        }
    });

    function slotHtml(r) {
        if (!r) return "";
        const cls  = estadoReserva(r);
        const bloq = cls === "bloq";
        const nom  = bloq ? `🔒 ${r.motivo||"Bloqueo"}` : (r.nombre_cliente||r.cliente||"—");
        const sub  = bloq
            ? (r.mesas_bloqueadas ? `Mesas: ${r.mesas_bloqueadas}` : "")
            : `👥 ${r.personas||"?"} · Mesa ${r.mesa_numero||r.mesa_id||"?"}`;
        return `<div class="res-slot ${cls}">
            <span class="res-hora">${r.hora_inicio||"—"}</span>
            <div class="res-info">
                <div class="res-nombre">${nom}</div>
                <div class="res-sub">${sub}</div>
            </div>
        </div>`;
    }

    let body = "";
    if (!reservasHoy.length) {
        body = `<div class="reservas-slots"><div class="res-empty">Sin reservas para hoy</div></div>`;
    } else if (span === 6) {
        const c1 = slots.slice(0,3), c2 = slots.slice(3,6);
        body = `<div class="reservas-book">
            <div class="reservas-col">${c1.map(slotHtml).join("")}</div>
            <div class="reservas-col">${c2.map(slotHtml).join("")}</div>
        </div>`;
    } else {
        body = `<div class="reservas-slots">${slots.map(slotHtml).join("")}</div>`;
    }

    const pager = total > 1 ? `<div class="res-pager">
        <span class="res-pag-info">Pág. ${resPag+1}/${total}</span>
        <button class="res-pag-btn" onclick="cambiarPagRes(-1)" ${resPag===0?"disabled":""}>◀</button>
        <button class="res-pag-btn" onclick="cambiarPagRes(1)"  ${resPag>=total-1?"disabled":""}>▶</button>
    </div>` : "";

    return `${blockHeader("")}
    <div class="reservas-card">
        <div class="widget-head">
            <a href="reservas.html" class="widget-title">📅 Reservas de hoy</a>
            <div class="res-summary">
                <span class="res-badge cad">✓ ${nCad} caducadas</span>
                <span class="res-badge act">● ${nAct} activas</span>
                <span class="res-badge prox">◷ ${nProx} próximas</span>
            </div>
        </div>
        ${body}${pager}
    </div>`;
}

function buildAccesos(b) {
    const mods = (b.modules||[]).map(getMod).filter(Boolean);
    const cn   = span2cols(b.span);
    const cards = mods.map(m => `
        <a href="${m.href}" class="module-card">
            <div class="module-icon">${m.icon}</div>
            <div class="module-title">${m.title}</div>
            <div class="module-desc">${m.desc}</div>
        </a>`).join("");
    return `${blockHeader("Accesos rápidos")}<div class="modules-grid modules-cols-${cn}">${cards}</div>`;
}

function buildStock(b) {
    return `${blockHeader("")}
    <div class="stock-card">
        <a href="stock.html" class="widget-title">📦 Estado del stock</a>
        <div class="stock-row"><div style="display:flex;align-items:center;gap:8px;"><div class="stock-dot dot-ok"></div><span>OK</span></div><div class="stock-num" style="color:#16a34a;">${stockData.ok}</div></div>
        <div class="stock-row"><div style="display:flex;align-items:center;gap:8px;"><div class="stock-dot dot-warn"></div><span>Advertencia</span></div><div class="stock-num" style="color:#d97706;">${stockData.warn}</div></div>
        <div class="stock-row"><div style="display:flex;align-items:center;gap:8px;"><div class="stock-dot dot-red"></div><span>Agotados</span></div><div class="stock-num" style="color:#dc2626;">${stockData.agotado}</div></div>
    </div>`;
}

function buildQuick(b) {
    const m = getMod(b.moduleId);
    if (!m) return `${blockHeader("Acceso rápido")}<div style="background:white;border-radius:12px;padding:16px;text-align:center;color:#9ca3af;font-size:12px;">Sin módulo</div>`;
    return `${blockHeader("")}
    <a href="${m.href}" class="module-card" style="min-height:120px;">
        <div class="module-icon">${m.icon}</div>
        <div class="module-title">${m.title}</div>
        <div class="module-desc">${m.desc}</div>
    </a>`;
}

function span2cols(span) {
    return span === 1 ? 1 : span === 2 ? 2 : span === 3 ? 3 : 6;
}

// ── DRAG & DROP BLOQUES ──────────────────────────────────────
function initDrag() {
    const grid = document.getElementById("dash-grid");
    let dragging = null;
    let canDrag  = false;

    grid.querySelectorAll(".db-block").forEach(block => {
        // Solo arrastrar si el config está abierto Y el mousedown fue sobre el handle
        block.addEventListener("mousedown", e => {
            const cfgOpen = document.body.classList.contains("config-open");
            canDrag = cfgOpen && !!e.target.closest(".block-drag");
            block.setAttribute("draggable", canDrag ? "true" : "false");
        });
        document.addEventListener("mouseup", () => {
            block.setAttribute("draggable","false");
        }, { once: false });

        block.addEventListener("dragstart", e => {
            if (!canDrag) { e.preventDefault(); return; }
            dragging = block;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", block.dataset.id);
            setTimeout(() => { if (dragging) dragging.classList.add("dragging"); }, 0);
        });

        block.addEventListener("dragend", () => {
            if (dragging) dragging.classList.remove("dragging");
            dragging = null; canDrag = false;
            grid.querySelectorAll(".db-block").forEach(b => b.classList.remove("drop-before","drop-after"));
            // Sync order to config
            syncOrder();
        });

        block.addEventListener("dragover", e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            if (!dragging || dragging === block) return;
            const rect = block.getBoundingClientRect();
            grid.querySelectorAll(".db-block").forEach(b => b.classList.remove("drop-before","drop-after"));
            block.classList.add(e.clientX < rect.left + rect.width/2 ? "drop-before" : "drop-after");
        });

        block.addEventListener("dragleave", e => {
            if (!block.contains(e.relatedTarget)) block.classList.remove("drop-before","drop-after");
        });

        block.addEventListener("drop", e => {
            e.preventDefault();
            if (!dragging || dragging === block) return;
            const before = block.classList.contains("drop-before");
            block.classList.remove("drop-before","drop-after");
            grid.insertBefore(dragging, before ? block : block.nextSibling);
            syncOrder();
        });
    });
}

function syncOrder() {
    const ids = [...document.querySelectorAll(".db-block")].map(b => b.dataset.id);
    config.blocks.sort((a,b) => {
        const ai = ids.indexOf(a.id), bi = ids.indexOf(b.id);
        return (ai<0?999:ai)-(bi<0?999:bi);
    });
}

// ── PANEL DE CONFIG ──────────────────────────────────────────
function abrirConfig() {
    renderConfigPanel();
    document.getElementById("cfg-overlay").classList.add("open");
    document.getElementById("cfg-panel").classList.add("open");
    document.body.classList.add("config-open");
}
function cerrarConfig() {
    document.getElementById("cfg-overlay").classList.remove("open");
    document.getElementById("cfg-panel").classList.remove("open");
    document.body.classList.remove("config-open");
}

function renderConfigPanel() {
    document.getElementById("cfg-blocks-list").innerHTML =
        config.blocks.map((b,i) => buildCblock(b,i)).join("");
}

function buildCblock(b, i) {
    const spanLabel = `${b.span} col${b.span===1?"":"s"}`;
    let opts = "";

    // Span selector: todos tienen esto
    const spanOpts = [1,2,3,6].map(s =>
        `<button class="span-btn ${b.span===s?"active":""}" onclick="setSpan(${i},${s})">${s}</button>`
    ).join("");
    opts += `<div class="opt-row"><span>Columnas</span><div class="span-btns">${spanOpts}</div></div>`;

    // Accesos rápidos: selector de módulo
    if (b.type === "quick") {
        const modOptions = ALL_MODULES.map(m =>
            `<option value="${m.id}" ${b.moduleId===m.id?"selected":""}>${m.icon} ${m.title}</option>`
        ).join("");
        opts += `<div class="opt-row"><span>Módulo</span>
            <select onchange="setQuickModule(${i},this.value)" style="padding:3px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;">
                ${modOptions}
            </select></div>`;
    }

    // Accesos: lista de módulos
    if (b.type === "accesos") {
        const items = ALL_MODULES.map(m => {
            const on = (b.modules||[]).includes(m.id);
            return `<div class="mi-item">
                <span>${m.icon}</span><span class="mi-name">${m.title}</span>
                <label class="tsw"><input type="checkbox" ${on?"checked":""} onchange="toggleModAcceso(${i},'${m.id}',this.checked)"><span class="tsl"></span></label>
            </div>`;
        }).join("");
        opts += `<div class="sub-lbl">Módulos visibles</div><div>${items}</div>`;
    }

    const canDelete = b.type === "quick";
    return `<div class="cblock">
        <div class="cblock-head" onclick="toggleOpts(${i})">
            <span class="cblock-drag">⠿</span>
            <span class="cblock-name">${b.label}</span>
            <span class="span-badge">${spanLabel}</span>
            ${canDelete ? `<button class="mi-del" onclick="event.stopPropagation();eliminarBloque(${i})">✕</button>` : ""}
            <label class="tsw" onclick="event.stopPropagation()">
                <input type="checkbox" ${b.visible?"checked":""} onchange="toggleVisible(${i},this.checked)">
                <span class="tsl"></span>
            </label>
        </div>
        <div id="cblock-opts-${i}" class="cblock-opts" style="display:none">${opts}</div>
    </div>`;
}

function toggleOpts(i) {
    const el = document.getElementById(`cblock-opts-${i}`);
    if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}
function toggleVisible(i, val) {
    config.blocks[i].visible = val;
    renderDash();
}
function setSpan(i, span) {
    config.blocks[i].span = span;
    if (config.blocks[i].type === "reservas") calcPaginaActual();
    renderDash();
    renderConfigPanel();
    setTimeout(() => {
        const el = document.getElementById(`cblock-opts-${i}`);
        if (el) el.style.display = "block";
    }, 10);
}
function toggleModAcceso(i, moduleId, val) {
    let mods = [...(config.blocks[i].modules || [])];
    if (val && !mods.includes(moduleId)) mods.push(moduleId);
    else if (!val) mods = mods.filter(m => m !== moduleId);
    config.blocks[i].modules = mods;
    renderDash();
}
function setQuickModule(i, moduleId) {
    config.blocks[i].moduleId = moduleId;
    const m = getMod(moduleId);
    if (m) config.blocks[i].label = m.title;
    renderDash();
    renderConfigPanel();
    setTimeout(() => {
        const el = document.getElementById(`cblock-opts-${i}`);
        if (el) el.style.display = "block";
    }, 10);
}
function eliminarBloque(i) {
    config.blocks.splice(i, 1);
    renderDash();
    renderConfigPanel();
}

let _quickCounter = 0;
function agregarAccesoRapido() {
    const defaultMod = ALL_MODULES[0];
    config.blocks.push({
        id: `quick-${Date.now()}-${_quickCounter++}`,
        type: "quick",
        label: defaultMod.title,
        visible: true,
        span: 1,
        moduleId: defaultMod.id
    });
    renderDash();
    renderConfigPanel();
    // Scroll al fondo del panel
    const body = document.querySelector(".cfg-body");
    if (body) body.scrollTop = body.scrollHeight;
}

function guardarConfig() {
    syncOrder();
    saveConfig();
    cerrarConfig();
}

function resetConfig() {
    if (!confirm("¿Restablecer la configuración por defecto?")) return;
    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    saveConfig();
    resPag = 0;
    renderDash();
    renderConfigPanel();
}

// ── INIT ─────────────────────────────────────────────────────
renderDash();
cargarDatos();
</script>
