<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante — Fichajes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .navbar { background: #1a1a2e; color: white; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .navbar-brand { font-size: 18px; font-weight: 700; }
        .navbar-links { display: flex; gap: 16px; align-items: center; }
        .btn-logout { background: transparent; border: 1px solid #4f46e5; color: #a5b4fc; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-logout:hover { background: #4f46e5; color: white; }
        .content { margin-top: 60px; padding: 32px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .btn-secondary { background: white; color: #444; border: 1.5px solid #e0e0e0; }
        .btn-secondary:hover { border-color: #4f46e5; color: #4f46e5; }

        /* ── Stats ── */
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-value { font-size: 26px; font-weight: 700; color: #1a1a2e; }
        .stat-value.green { color: #16a34a; }
        .stat-value.blue  { color: #4f46e5; }

        /* ── Activos ── */
        .activos-section { background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .activos-section h3 { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 14px; }
        .globos-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .globo { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .globo-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: white; }
        .globo-name { font-size: 11px; color: #64748b; text-align: center; max-width: 70px; }
        .globo-time { font-size: 10px; color: #94a3b8; }
        .sin-activos { color: #94a3b8; font-size: 13px; }

        /* ── Filtros ── */
        .filtros { background: white; border-radius: 12px; padding: 16px 20px; display: flex; gap: 12px; align-items: center; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); flex-wrap: wrap; }
        .filtros label { font-size: 13px; color: #666; font-weight: 500; }
        .filtros input, .filtros select { padding: 7px 11px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; transition: border-color .15s; }
        .filtros input:focus, .filtros select:focus { border-color: #4f46e5; }
        .filtros select:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── Cards agrupadas por usuario ── */
        .fichajes-list { display: flex; flex-direction: column; gap: 12px; }
        .user-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }

        /* Fila resumen del usuario */
        .user-summary {
            display: grid;
            grid-template-columns: 220px 1fr 1fr 1fr 120px 56px;
            align-items: center; padding: 14px 20px; cursor: pointer;
            transition: background .15s; gap: 8px; user-select: none;
        }
        .user-summary:hover { background: #fafafa; }
        .user-summary.expanded { border-bottom: 1px solid #f0f0f0; background: #f8f9ff; }

        .user-summary-name { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
        .user-name-text { font-size: 14px; font-weight: 700; color: #1a1a2e; }
        .user-rol-badge { font-size: 10px; color: #6b7280; margin-top: 1px; }

        .summary-col { display: flex; flex-direction: column; gap: 2px; }
        .summary-col-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
        .summary-col-value { font-size: 15px; font-weight: 700; color: #1a1a2e; }

        .diff-pos { color: #16a34a; font-weight: 700; }
        .diff-neg { color: #dc2626; font-weight: 700; }
        .diff-neu { color: #94a3b8; }

        .expand-btn { color: #9ca3af; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
        .user-summary.expanded .expand-btn { transform: rotate(180deg); }

        /* Tabla interna */
        .user-detail { display: none; }
        .user-detail.open { display: block; }

        .detail-table { width: 100%; border-collapse: collapse; }
        .detail-table th {
            background: #f8f9fa; padding: 9px 16px; text-align: left;
            font-size: 11px; font-weight: 700; color: #9ca3af;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .detail-table td { padding: 10px 16px; border-top: 1px solid #f0f0f0; font-size: 13px; color: #374151; vertical-align: middle; }

        /* ── Filas de grupo por día ── */
        .day-group-row { cursor: pointer; user-select: none; transition: background .12s; }
        .day-group-row:hover td { background: #f5f6ff; }
        .day-group-row.expanded td { background: #f8f9ff; }

        .day-expand-cell { text-align: center; width: 28px; padding: 0 8px !important; }
        .day-expand-arrow { color: #9ca3af; font-size: 11px; display: inline-block; transition: transform .2s; }

        /* ── Sub-filas (fichajes individuales del día) ── */
        .sub-container-td { padding: 0 !important; background: #f9fafb !important; border-bottom: 2px solid #e9eaf0 !important; }
        .sub-fichaje-row { display: flex; align-items: center; gap: 14px; padding: 7px 20px 7px 36px; border-bottom: 1px solid #eef0f3; font-size: 12px; }
        .sub-fichaje-row:last-child { border-bottom: none; }
        .sub-arrow { color: #cbd5e1; font-size: 12px; flex-shrink: 0; }
        .sub-times { color: #374151; font-weight: 600; letter-spacing: .2px; }
        .sub-dur { color: #6b7280; background: #e5e7eb; padding: 1px 7px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
        .sub-activo { color: #16a34a; font-style: italic; font-size: 11px; }
        .sub-nota-area { flex: 1; min-width: 0; }
        .sub-nota-txt { color: #6b7280; font-style: italic; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; display: inline-block; vertical-align: middle; }

        /* Estado badges */
        .badge { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .badge-green  { background: #dcfce7; color: #16a34a; }
        .badge-gray   { background: #f3f4f6; color: #666; }
        .badge-amber  { background: #fef3c7; color: #92400e; }

        .franja-tag { display: inline-block; font-size: 11px; color: #555; background: #f3f4f6; border-radius: 4px; padding: 1px 5px; margin: 1px 0; white-space: nowrap; }

        /* Notas inline */
        .nota-text  { font-size: 12px; color: #374151; }
        .nota-empty { font-size: 12px; color: #d1d5db; font-style: italic; }
        .btn-nota-edit { background: none; border: none; cursor: pointer; color: #cbd5e1; font-size: 13px; padding: 1px 4px; border-radius: 4px; transition: color .15s; vertical-align: middle; }
        .btn-nota-edit:hover { color: #4f46e5; }
        .nota-edit-wrap { display: flex; align-items: center; gap: 4px; }
        .nota-input { border: 1.5px solid #4f46e5; border-radius: 6px; padding: 4px 8px; font-size: 12px; width: 180px; outline: none; }
        .btn-nota-save   { background: #4f46e5; color: white; border: none; border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
        .btn-nota-save:hover { background: #4338ca; }
        .btn-nota-cancel { background: #f3f4f6; color: #666; border: none; border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; }

        /* Botón revisar */
        .btn-revisar { background: none; border: none; cursor: pointer; color: #cbd5e1; font-size: 15px; padding: 2px 5px; border-radius: 4px; transition: color .15s; }
        .btn-revisar:hover { color: #4f46e5; }
        .btn-revisar.ok { color: #16a34a; cursor: default; font-size: 13px; }

        /* Indicador de pendiente en resumen de usuario */
        .alerta-pendiente {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; background: #f59e0b; color: white;
            border-radius: 50%; font-size: 11px; font-weight: 800;
            margin-right: 5px; flex-shrink: 0; vertical-align: middle;
        }

        .empty { text-align: center; padding: 48px; color: #888; font-size: 14px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        /* ── Modal de revisión ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-rev { background: white; border-radius: 14px; width: 520px; max-width: 96vw; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-rev-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 16px; border-bottom: 1px solid #f0f0f0; }
        .modal-rev-head h3 { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 18px; color: #9ca3af; padding: 4px; border-radius: 4px; transition: color .15s; }
        .modal-close:hover { color: #374151; }
        .modal-rev-body { padding: 20px 24px; }
        .info-grid { background: #f8f9fa; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
        .info-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #eee; gap: 12px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; flex-shrink: 0; }
        .info-val { font-weight: 600; color: #1a1a2e; text-align: right; }
        .notas-box { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
        .notas-box-label { font-size: 11px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
        .notas-box-text { font-size: 13px; color: #374151; line-height: 1.5; }
        /* Edición inline de hora */
        .info-val-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
        .btn-editar-hora { background: none; border: none; cursor: pointer; color: #cbd5e1; font-size: 13px; padding: 2px 4px; border-radius: 4px; transition: color .15s; line-height: 1; }
        .btn-editar-hora:hover { color: #4f46e5; }
        .hora-input { border: 1.5px solid #4f46e5; border-radius: 6px; padding: 3px 7px; font-size: 13px; font-weight: 600; color: #1a1a2e; outline: none; background: white; }
        .btn-hora-save   { background: #4f46e5; color: white; border: none; border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .btn-hora-save:hover { background: #4338ca; }
        .btn-hora-cancel { background: #f3f4f6; color: #666; border: none; border-radius: 5px; padding: 3px 8px; font-size: 12px; cursor: pointer; }

        /* Lista de fichajes del día en modal de revisión */
        .rev-fich-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
        .rev-fich-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; border-radius: 8px; border: 1.5px solid #e0e0e0;
            font-size: 13px; cursor: pointer; transition: all .15s; background: white;
        }
        .rev-fich-item:hover { border-color: #a5b4fc; background: #f8f8ff; }
        .rev-fich-item.active { border-color: #4f46e5; background: #f0f0ff; }
        .rev-fich-item .fich-n { font-size: 11px; color: #9ca3af; font-weight: 700; min-width: 18px; }
        .rev-fich-item .fich-times { flex: 1; font-weight: 600; color: #1a1a2e; }
        .rev-fich-item .fich-dur { color: #6b7280; font-size: 12px; font-weight: 600; }
        .rev-fich-item .fich-hint { font-size: 10px; color: #a5b4fc; margin-left: 4px; }
        .rev-fich-item.active .fich-hint { color: #4f46e5; }
        .rev-section-label { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
        .rev-day-info { background: #f8f9fa; border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; }
        .rev-edit-box { background: #f8f9fa; border-radius: 10px; padding: 10px 16px; margin-bottom: 10px; border: 1.5px solid #e0e7ff; }

        /* Anular diferencia toggle */
        .anular-section { margin-bottom: 16px; }
        .anular-btn {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid #e0e0e0;
            background: white; color: #6b7280; font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all .18s;
        }
        .anular-btn:hover { border-color: #f59e0b; color: #92400e; }
        .anular-btn.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
        .anular-btn .check-icon { font-size: 16px; }

        .modal-rev-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #f0f0f0; }
        .btn-rev-cancel { background: white; color: #444; border: 1.5px solid #e0e0e0; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-rev-cancel:hover { border-color: #4f46e5; color: #4f46e5; }
        .btn-rev-ok { background: #4f46e5; color: white; border: none; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .btn-rev-ok:hover { background: #4338ca; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="page-header"><h2>🕐 Fichajes de turno</h2></div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Activos ahora</div>
            <div class="stat-value green" id="stat-activos">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Empleados en período</div>
            <div class="stat-value blue" id="stat-empleados">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Días con fichaje</div>
            <div class="stat-value" id="stat-fichajes">—</div>
        </div>
    </div>

    <!-- Activos ahora -->
    <div class="activos-section">
        <h3>👥 Turno activo ahora</h3>
        <div class="globos-wrap" id="globos-activos">
            <span class="sin-activos">Cargando...</span>
        </div>
    </div>

    <!-- Filtros -->
    <div class="filtros">
        <label>Desde:</label>
        <input type="date" id="filtro-desde" onchange="cargarHistorial()">
        <label>Hasta:</label>
        <input type="date" id="filtro-hasta" onchange="cargarHistorial()">
        <label id="lbl-usuario" style="display:none;">Usuario:</label>
        <select id="filtro-usuario" style="display:none;" onchange="cargarHistorial()">
            <option value="">Todos</option>
        </select>
        <button class="btn btn-secondary" onclick="limpiarFiltros()">Limpiar</button>
    </div>

    <!-- Lista agrupada por usuario -->
    <div id="fichajes-container">
        <div class="empty">Cargando...</div>
    </div>
</div>

<!-- Modal revisión -->
<div class="modal-overlay" id="modal-revision">
    <div class="modal-rev">
        <div class="modal-rev-head">
            <h3 id="rev-titulo">Revisión del fichaje</h3>
            <button class="modal-close" onclick="cerrarRevision()">✕</button>
        </div>
        <div class="modal-rev-body">
            <!-- Lista de fichajes del día (visible solo si hay más de 1) -->
            <div id="rev-fich-list-section" style="display:none;">
                <div class="rev-section-label">Fichajes del día</div>
                <div class="rev-fich-list" id="rev-fich-list"></div>
            </div>

            <!-- Box de edición del fichaje seleccionado -->
            <div class="rev-edit-box">
                <div class="info-row">
                    <span class="info-label">Entrada</span>
                    <div class="info-val-wrap" id="rev-entrada-wrap">
                        <span class="info-val" id="rev-entrada">—</span>
                        <button class="btn-editar-hora" title="Editar hora de entrada" onclick="toggleEditHora('entrada')">✏️</button>
                    </div>
                </div>
                <div class="info-row" id="rev-entrada-edit-row" style="display:none;">
                    <span class="info-label" style="opacity:0;">_</span>
                    <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">
                        <input type="datetime-local" class="hora-input" id="rev-entrada-input" step="60">
                        <button class="btn-hora-save" onclick="guardarHora('entrada')">✓</button>
                        <button class="btn-hora-cancel" onclick="cancelarEditHora('entrada')">✕</button>
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">Salida</span>
                    <div class="info-val-wrap" id="rev-salida-wrap">
                        <span class="info-val" id="rev-salida">—</span>
                        <button class="btn-editar-hora" title="Editar hora de salida" onclick="toggleEditHora('salida')">✏️</button>
                    </div>
                </div>
                <div class="info-row" id="rev-salida-edit-row" style="display:none;">
                    <span class="info-label" style="opacity:0;">_</span>
                    <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">
                        <input type="datetime-local" class="hora-input" id="rev-salida-input" step="60">
                        <button class="btn-hora-save" onclick="guardarHora('salida')">✓</button>
                        <button class="btn-hora-cancel" onclick="cancelarEditHora('salida')">✕</button>
                    </div>
                </div>
                <div class="info-row" style="border-bottom:none;padding-bottom:0;">
                    <span class="info-label">Duración bruta</span>
                    <span class="info-val" id="rev-duracion">—</span>
                </div>
            </div>

            <!-- Info del día (descanso, horario, horas asignadas) -->
            <div class="rev-day-info">
                <div class="info-row">
                    <span class="info-label">Descanso</span>
                    <span class="info-val" id="rev-descanso">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Horario asignado</span>
                    <span class="info-val" id="rev-horario">—</span>
                </div>
                <div class="info-row" style="border-bottom:none;padding-bottom:0;">
                    <span class="info-label">Horas asignadas</span>
                    <span class="info-val" id="rev-asignadas">—</span>
                </div>
            </div>

            <div class="notas-box">
                <div class="notas-box-label">📝 Nota del empleado</div>
                <div class="notas-box-text" id="rev-notas">—</div>
            </div>
            <div class="anular-section">
                <button class="anular-btn" id="btn-anular-dif" onclick="toggleAnularDif()">
                    <span class="check-icon" id="anular-check-icon">○</span>
                    Anular diferencia (igualar horas fichadas con asignadas)
                </button>
            </div>
        </div>
        <div class="modal-rev-foot">
            <button class="btn-rev-cancel" onclick="cerrarRevision()">Cancelar</button>
            <button class="btn-rev-ok" onclick="confirmarRevision()">✓ Confirmar revisión</button>
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();
requirePermiso('ver_fichajes', 'edicion_fichajes');

const COLORES = ["#4f46e5","#16a34a","#dc2626","#ca8a04","#0891b2","#7c3aed","#be185d","#0f766e"];

// ── Datos globales ────────────────────────────────────────────
let _fichajesData = {};   // id → fichaje completo

// ── Permisos ─────────────────────────────────────────────────
function currentUser() {
    try { return JSON.parse(localStorage.getItem("user") || "{}"); } catch { return {}; }
}
function hasEdicionFichajes() {
    const u = currentUser();
    return u.rol === "admin" || u.rol === "gerente" || !!u.edicion_fichajes;
}
function hasVerFichajes() {
    const u = currentUser();
    return !!u.ver_fichajes || hasEdicionFichajes();
}
function canEditNota(fichaje) {
    if (hasEdicionFichajes()) return true;
    if (hasVerFichajes() && fichaje.usuario_id == currentUser().id) return true;
    return false;
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
    // Cargar configuración (hora de corte de turno) primero
    try {
        const cfg = await api.get("/config/sistema");
        if (cfg.hora_corte_turno != null) HORA_CORTE_TURNO = cfg.hora_corte_turno;
    } catch(e) { console.warn("No se pudo cargar config:", e); }

    // Leer parámetros de URL (acceso directo desde revisión de salarios)
    const _params   = new URLSearchParams(window.location.search);
    const _pDesde   = _params.get("desde");
    const _pHasta   = _params.get("hasta");
    const _pUsuario = _params.get("usuario");

    if (_pDesde && _pHasta) {
        document.getElementById("filtro-desde").value = _pDesde;
        document.getElementById("filtro-hasta").value = _pHasta;
    } else {
        const hoy    = new Date();
        const diaSem = hoy.getDay() === 0 ? 6 : hoy.getDay() - 1;
        const lunes  = new Date(hoy); lunes.setDate(hoy.getDate() - diaSem);
        const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
        const fmt = d => d.toISOString().split("T")[0];
        document.getElementById("filtro-desde").value = fmt(lunes);
        document.getElementById("filtro-hasta").value = fmt(domingo);
    }

    if (hasEdicionFichajes()) {
        document.getElementById("lbl-usuario").style.display = "inline";
        const sel = document.getElementById("filtro-usuario");
        sel.style.display = "inline";
        await cargarUsuariosFiltro();
        // Pre-seleccionar usuario si viene en la URL
        if (_pUsuario) {
            const opt = Array.from(sel.options).find(o => o.value === _pUsuario);
            if (opt) sel.value = _pUsuario;
        }
    }
    await Promise.all([cargarActivos(), cargarHistorial()]);
}

async function cargarActivos() {
    try {
        const activos = await api.get("/turnos/activos");
        document.getElementById("stat-activos").textContent = activos.length;
        const wrap = document.getElementById("globos-activos");
        if (!activos.length) {
            wrap.innerHTML = '<span class="sin-activos">Sin empleados en turno ahora.</span>';
            return;
        }
        wrap.innerHTML = activos.map((t, i) => {
            const iniciales = t.iniciales || t.username.substring(0, 3).toUpperCase();
            const color = COLORES[i % COLORES.length];
            return `<div class="globo">
                <div class="globo-circle" style="background:${color};">${iniciales}</div>
                <div class="globo-name">${t.username}</div>
                <div class="globo-time">desde ${formatHoraTs(t.ts_entrada)}</div>
            </div>`;
        }).join("");
    } catch(e) { console.error(e); }
}

async function cargarUsuariosFiltro() {
    try {
        const usuarios = await api.get("/auth/usuarios");
        const sel = document.getElementById("filtro-usuario");
        usuarios.forEach(u => {
            sel.innerHTML += `<option value="${u.username}">${u.username}</option>`;
        });
    } catch(e) {}
}

// ── Cargar historial ──────────────────────────────────────────
async function cargarHistorial() {
    const desde   = document.getElementById("filtro-desde").value;
    const hasta   = document.getElementById("filtro-hasta").value;
    const usuario = hasEdicionFichajes()
        ? document.getElementById("filtro-usuario").value : "";

    let url = "/turnos/historial?";
    if (desde) url += `desde=${desde}T00:00:00&`;
    if (hasta) url += `hasta=${hasta}T23:59:59&`;

    const container = document.getElementById("fichajes-container");
    container.innerHTML = '<div class="empty">Cargando...</div>';

    try {
        let fichajes = await api.get(url);
        if (usuario) fichajes = fichajes.filter(f => f.username === usuario);

        _fichajesData = {};
        fichajes.forEach(f => { _fichajesData[f.id] = f; });

        if (!fichajes.length) {
            document.getElementById("stat-empleados").textContent = "0";
            document.getElementById("stat-fichajes").textContent  = "0";
            container.innerHTML = '<div class="empty">Sin fichajes en el período seleccionado</div>';
            return;
        }

        // Agrupar por usuario
        const grupos = {};
        fichajes.forEach(f => {
            if (!grupos[f.username]) {
                grupos[f.username] = {
                    username:   f.username,
                    usuario_id: f.usuario_id,
                    fichajes:   [],
                    colorIdx:   Object.keys(grupos).length,
                };
            }
            grupos[f.username].fichajes.push(f);
        });

        document.getElementById("stat-empleados").textContent = Object.keys(grupos).length;

        // Contar días únicos totales
        const diasUnicos = new Set(fichajes.map(f => `${f.usuario_id}-${fechaTurno(f.ts_entrada)}`)).size;
        document.getElementById("stat-fichajes").textContent = diasUnicos;

        container.innerHTML = '<div class="fichajes-list">' +
            Object.values(grupos).map(g => renderUserCard(g)).join("") +
            '</div>';

    } catch(e) {
        console.error(e);
        container.innerHTML = '<div class="empty">Error al cargar fichajes</div>';
    }
}

function limpiarFiltros() {
    document.getElementById("filtro-desde").value = "";
    document.getElementById("filtro-hasta").value = "";
    if (hasEdicionFichajes()) document.getElementById("filtro-usuario").value = "";
    cargarHistorial();
}

// ── Agrupación por fecha ──────────────────────────────────────
/**
 * Agrupa los fichajes de un usuario por fecha local (de ts_entrada).
 * Las horas asignadas y break_mins se toman de UN solo fichaje por día
 * (el primero que tenga horario asignado), evitando así duplicar las
 * horas asignadas cuando hay varios fichajes en el mismo turno.
 */
function agruparPorFecha(fichajes) {
    const map = {};
    fichajes.forEach(f => {
        const fecha = fechaTurno(f.ts_entrada);
        if (!map[fecha]) {
            map[fecha] = {
                fecha,
                fichajes:         [],
                franjas_asignadas: null,
                break_mins:        0,
                ajuste_horas:      0,
            };
        }
        map[fecha].fichajes.push(f);

        // Tomar franjas del primer fichaje publicado que las tenga
        if (!map[fecha].franjas_asignadas &&
            f.franjas_asignadas && f.franjas_asignadas.length) {
            map[fecha].franjas_asignadas = f.franjas_asignadas;
        }
        // break_mins es compartido por día (horarios_personales); tomar el primer valor > 0
        if (!map[fecha].break_mins && f.break_mins) {
            map[fecha].break_mins = f.break_mins;
        }
        // Sumar ajustes de todos los fichajes del día
        map[fecha].ajuste_horas += (f.ajuste_horas || 0);
    });

    // Ordenar por fecha descendente
    return Object.values(map).sort((a, b) => b.fecha.localeCompare(a.fecha));
}

// ── Render card por usuario ───────────────────────────────────
function renderUserCard(g) {
    const color     = COLORES[g.colorIdx % COLORES.length];
    const iniciales = g.username.substring(0, 2).toUpperCase();

    const dayGroups = agruparPorFecha(g.fichajes);

    // Totales a nivel usuario
    // break se descuenta de fichadas; asignadas = solo franjas del horario
    let totalFichadasMins = 0, totalAsignadasMins = 0, totalBreakMins = 0, tieneAsignadas = false;
    dayGroups.forEach(dg => {
        dg.fichajes.forEach(f => { totalFichadasMins += (f.horas || 0) * 60; });
        totalBreakMins += (dg.break_mins || 0);
        const ha = calcHorasAsignadas(dg.franjas_asignadas, dg.ajuste_horas);
        if (ha !== null) { totalAsignadasMins += ha * 60; tieneAsignadas = true; }
    });

    const fichadasStr    = formatMins(totalFichadasMins);
    const asignadasStr   = tieneAsignadas ? formatMins(totalAsignadasMins) : "—";
    const efectivasMins  = totalFichadasMins - totalBreakMins;
    const diffHtml       = tieneAsignadas
        ? renderDiffMins(efectivasMins - totalAsignadasMins)
        : (totalBreakMins > 0
            ? renderDiffMins(efectivasMins)
            : '<span class="diff-neu">—</span>');

    const hayActivo    = g.fichajes.some(f => !f.ts_salida);
    const hayPendiente = hasEdicionFichajes() &&
        g.fichajes.some(f => !f.activo && !f.revisado);

    const numDias     = dayGroups.length;
    const numFichajes = g.fichajes.length;
    const subLabel    = `${numDias} día${numDias !== 1 ? 's' : ''}`
        + (numFichajes > numDias ? ` · ${numFichajes} fichajes` : '')
        + (hayActivo ? ' · <span style="color:#16a34a;font-weight:600;">En turno</span>' : '');

    const cardId   = `card-${g.usuario_id}`;
    const detailId = `detail-${g.usuario_id}`;

    return `
    <div class="user-card" id="${cardId}">
        <div class="user-summary" onclick="toggleCard(${g.usuario_id})">
            <div class="user-summary-name">
                <div class="user-avatar" style="background:${color};">${iniciales}</div>
                <div>
                    <div class="user-name-text">${g.username}</div>
                    <div class="user-rol-badge">${subLabel}</div>
                </div>
            </div>
            <div class="summary-col">
                <div class="summary-col-label">Horas fichadas</div>
                <div class="summary-col-value">${fichadasStr}</div>
            </div>
            <div class="summary-col">
                <div class="summary-col-label">Horas asignadas</div>
                <div class="summary-col-value">${asignadasStr}</div>
            </div>
            <div class="summary-col">
                <div class="summary-col-label">Diferencia</div>
                <div class="summary-col-value">${diffHtml}</div>
            </div>
            <div></div>
            <div class="expand-btn">
                <span class="alerta-pendiente" id="alerta-${g.usuario_id}"
                      style="display:${hayPendiente ? 'inline-flex' : 'none'};"
                      title="Hay fichajes pendientes de revisión">!</span>▼
            </div>
        </div>
        <div class="user-detail" id="${detailId}">
            <table class="detail-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Duración</th>
                        <th>Horario asignado</th>
                        <th>Descanso</th>
                        <th>Diferencia</th>
                        <th>Estado</th>
                        <th>Notas</th>
                        <th>Revisión</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    ${dayGroups.map(dg => renderDayGroup(dg, g.usuario_id)).join("")}
                </tbody>
            </table>
        </div>
    </div>`;
}

function toggleCard(usuarioId) {
    const summary = document.querySelector(`#card-${usuarioId} .user-summary`);
    const detail  = document.getElementById(`detail-${usuarioId}`);
    summary.classList.toggle("expanded");
    detail.classList.toggle("open");
}

// ── Render grupo por día ──────────────────────────────────────
function renderDayGroup(dg, usuarioId) {
    const dayKey      = `${usuarioId}-${dg.fecha}`;
    const horasFich   = dg.fichajes.reduce((s, f) => s + (f.horas || 0), 0);
    const horasAsig   = calcHorasAsignadas(dg.franjas_asignadas, dg.ajuste_horas);
    const hayActivo   = dg.fichajes.some(f => f.activo);
    const pendiente   = !hayActivo && dg.fichajes.some(f => !f.revisado);

    // Estado del día
    let badgeCls, badgeText;
    if (hayActivo)       { badgeCls = "badge-green"; badgeText = "En turno"; }
    else if (pendiente)  { badgeCls = "badge-amber"; badgeText = "Pendiente de aprobación"; }
    else                 { badgeCls = "badge-gray";  badgeText = "Finalizado"; }

    // Notas del día (todas concatenadas)
    const todasNotas   = dg.fichajes.map(f => f.notas).filter(Boolean).join(" · ");
    // Fichaje editable = el último no activo (el más reciente cerrado)
    const fichajeEdit  = [...dg.fichajes].reverse().find(f => !f.activo);

    // Botón de revisión (por el primer fichaje pendiente del día)
    const fPendiente   = dg.fichajes.find(f => !f.activo && !f.revisado);
    let revBtn = "";
    if (hasEdicionFichajes() && !hayActivo) {
        if (fPendiente) {
            revBtn = `<button class="btn-revisar" id="revbtn-day-${dayKey}"
                             onclick="event.stopPropagation();abrirRevision(${fPendiente.id})"
                             title="Pendiente de revisión">📋</button>`;
        } else {
            revBtn = `<button class="btn-revisar ok" id="revbtn-day-${dayKey}"
                             title="Sin cambios pendientes" disabled>✓</button>`;
        }
    }

    // Nota HTML
    const notaTxt = todasNotas
        ? `<span class="nota-text">${todasNotas.replace(/</g, "&lt;")}</span>`
        : `<span class="nota-empty">—</span>`;
    const notaEditBtn = fichajeEdit && canEditNota(fichajeEdit)
        ? `<button class="btn-nota-edit"
                   onclick="event.stopPropagation();editarNota(${fichajeEdit.id})"
                   title="Editar nota">✏️</button>`
        : "";

    // Descanso (con botón de edición inline en la columna de la tabla)
    const descansoStr = dg.break_mins ? `${dg.break_mins} min` : "—";
    const descansoEditBtn = fichajeEdit && hasEdicionFichajes()
        ? `<button class="btn-nota-edit"
               onclick="event.stopPropagation();editarDescansoInline(${fichajeEdit.id},'${dayKey}')"
               title="Editar descanso">✏️</button>`
        : "";

    // Sub-filas (fichajes individuales del día)
    const subRows = dg.fichajes.map(f => {
        const entrada   = formatHoraTs(f.ts_entrada);
        const salidaTxt = f.ts_salida
            ? formatHoraTs(f.ts_salida)
            : `<span class="sub-activo">En turno</span>`;
        const durTxt  = f.horas != null ? formatHoras(f.horas) : "—";
        const editBtn = hasEdicionFichajes() && !f.activo
            ? `<button class="btn-nota-edit"
                  onclick="event.stopPropagation();abrirEditInlineFichaje(${f.id})"
                  title="Editar entrada/salida">✏️</button>`
            : "";
        const notaBtn = !f.activo
            ? `<button class="btn-nota-edit"
                  onclick="event.stopPropagation();editarNotaSubrow(${f.id})"
                  title="${f.notas ? 'Ver/editar nota' : 'Agregar nota'}">📝</button>`
            : "";
        const notaTxt = f.notas
            ? `<span class="sub-nota-txt" title="${f.notas.replace(/"/g,'&quot;')}">${f.notas}</span>`
            : "";
        return `<div class="sub-fichaje-row" id="sub-fich-${f.id}">
            <span class="sub-arrow">↳</span>
            <span class="sub-times">${entrada} → ${salidaTxt}</span>
            <span class="sub-dur">${durTxt}</span>
            ${editBtn}${notaBtn}
            <span class="sub-nota-area" id="nota-sub-${f.id}">${notaTxt}</span>
        </div>`;
    }).join("");

    return `
        <tr class="day-group-row" onclick="toggleDayGroup('${dayKey}')">
            <td><strong>${formatFechaShort(dg.fecha)}</strong></td>
            <td><strong>${formatHoras(horasFich)}</strong></td>
            <td>${renderFranjas(dg.franjas_asignadas)}</td>
            <td id="descanso-td-day-${dayKey}">${descansoStr}${descansoEditBtn}</td>
            <td>${renderDiff(horasFich, horasAsig, dg.break_mins)}</td>
            <td><span class="badge ${badgeCls}" id="status-day-${dayKey}">${badgeText}</span></td>
            <td id="nota-td-day-${dayKey}" data-uid="${usuarioId}" data-edit-id="${fichajeEdit ? fichajeEdit.id : ''}">${notaTxt}${notaEditBtn}</td>
            <td>${revBtn}</td>
            <td class="day-expand-cell">
                <span class="day-expand-arrow" id="arrow-day-${dayKey}">▼</span>
            </td>
        </tr>
        <tr class="sub-rows-container" id="sub-${dayKey}" style="display:none;">
            <td colspan="9" class="sub-container-td">${subRows}</td>
        </tr>`;
}

function toggleDayGroup(dayKey) {
    const subEl   = document.getElementById(`sub-${dayKey}`);
    const arrowEl = document.getElementById(`arrow-day-${dayKey}`);
    const rowEl   = subEl ? subEl.previousElementSibling : null;
    if (!subEl) return;
    const isOpen = subEl.style.display !== "none";
    subEl.style.display = isOpen ? "none" : "table-row";
    if (arrowEl) arrowEl.style.transform = isOpen ? "" : "rotate(180deg)";
    if (rowEl)   rowEl.classList.toggle("expanded", !isOpen);
}

// ── Actualizar day-group en DOM (sin recargar) ────────────────
function _parseDayKey(dayKey) {
    // dayKey = "${usuarioId}-YYYY-MM-DD"  (fecha siempre 10 chars al final)
    const fecha = dayKey.slice(-10);
    const uid   = parseInt(dayKey.slice(0, dayKey.length - 11));
    return { uid, fecha };
}

function _getDayFichajes(dayKey) {
    const { uid, fecha } = _parseDayKey(dayKey);
    return Object.values(_fichajesData).filter(f =>
        f.usuario_id === uid && fechaTurno(f.ts_entrada) === fecha
    );
}

function _actualizarDayGroup(dayKey) {
    const fichajes = _getDayFichajes(dayKey);
    if (!fichajes.length) return;

    const hayActivo  = fichajes.some(f => f.activo);
    const { uid }    = _parseDayKey(dayKey);

    // Badge de estado
    const badgeEl = document.getElementById(`status-day-${dayKey}`);
    if (badgeEl) {
        let cls, txt;
        if (hayActivo) { cls = "badge-green"; txt = "En turno"; }
        else if (fichajes.some(f => !f.revisado)) { cls = "badge-amber"; txt = "Pendiente de aprobación"; }
        else { cls = "badge-gray"; txt = "Finalizado"; }
        badgeEl.className  = `badge ${cls}`;
        badgeEl.textContent = txt;
    }

    // Nota td
    const notaTd = document.getElementById(`nota-td-day-${dayKey}`);
    if (notaTd) {
        const todasNotas  = fichajes.map(f => f.notas).filter(Boolean).join(" · ");
        const fichajeEdit = [...fichajes].reverse().find(f => !f.activo);
        const txt = todasNotas
            ? `<span class="nota-text">${todasNotas.replace(/</g, "&lt;")}</span>`
            : `<span class="nota-empty">—</span>`;
        const editBtn = fichajeEdit && canEditNota(fichajeEdit)
            ? `<button class="btn-nota-edit"
                       onclick="event.stopPropagation();editarNota(${fichajeEdit.id})"
                       title="Editar nota">✏️</button>`
            : "";
        notaTd.innerHTML = txt + editBtn;
    }

    // Botón revisión
    const revBtn = document.getElementById(`revbtn-day-${dayKey}`);
    if (revBtn && hasEdicionFichajes() && !hayActivo) {
        const fPend = fichajes.find(f => !f.activo && !f.revisado);
        if (fPend) {
            revBtn.className  = "btn-revisar";
            revBtn.textContent = "📋";
            revBtn.title      = "Pendiente de revisión";
            revBtn.disabled   = false;
            revBtn.onclick    = (e) => { e.stopPropagation(); abrirRevision(fPend.id); };
        } else {
            revBtn.className  = "btn-revisar ok";
            revBtn.textContent = "✓";
            revBtn.title      = "Sin cambios pendientes";
            revBtn.disabled   = true;
            revBtn.onclick    = null;
        }
    }

    // Alerta en resumen de usuario
    _actualizarAlertaUsuario(uid);
}

/**
 * Re-renderiza la card de un usuario a partir de los datos locales (_fichajesData)
 * SIN recargar la página, conservando el estado abierto/cerrado de la card y
 * de cada sub-grupo de día.
 */
function _refreshAfterEdit(fichajeId) {
    const f = _fichajesData[fichajeId];
    if (!f) return;
    const uid          = f.usuario_id;
    const existingCard = document.getElementById(`card-${uid}`);
    if (!existingCard) return;

    // ── 1. Guardar estado de apertura ──────────────────────────
    const cardOpen   = document.getElementById(`detail-${uid}`)?.classList.contains("open");
    const openSubKeys = new Set();
    existingCard.querySelectorAll('tr[id^="sub-"]').forEach(el => {
        if (el.style.display !== "none") openSubKeys.add(el.id.slice(4));
    });

    // ── 2. Determinar colorIdx por posición en la lista ────────
    const lista      = existingCard.parentElement;
    const colorIdx   = lista
        ? Array.from(lista.children).findIndex(el => el.id === `card-${uid}`)
        : uid % COLORES.length;

    // ── 3. Reconstruir grupo desde _fichajesData ───────────────
    const fichajes = Object.values(_fichajesData).filter(f2 => f2.usuario_id === uid);
    const g = {
        username:   f.username,
        usuario_id: uid,
        fichajes,
        colorIdx:   colorIdx >= 0 ? colorIdx : uid % COLORES.length,
    };

    // ── 4. Reemplazar el HTML de la card ───────────────────────
    const tmp = document.createElement("div");
    tmp.innerHTML = renderUserCard(g);
    const newCard = tmp.firstElementChild;
    existingCard.replaceWith(newCard);

    // ── 5. Restaurar estado de apertura ───────────────────────
    if (cardOpen) {
        newCard.querySelector(".user-summary")?.classList.add("expanded");
        document.getElementById(`detail-${uid}`)?.classList.add("open");
    }
    openSubKeys.forEach(key => {
        const subEl   = document.getElementById(`sub-${key}`);
        const arrowEl = document.getElementById(`arrow-day-${key}`);
        if (subEl) {
            subEl.style.display = "table-row";
            if (arrowEl) arrowEl.style.transform = "rotate(180deg)";
            subEl.previousElementSibling?.classList.add("expanded");
        }
    });
}

// ── Notas inline ─────────────────────────────────────────────
function editarNota(id) {
    const f = _fichajesData[id];
    if (!f) return;
    const dayKey = _dayKey(f);
    const td = document.getElementById(`nota-td-day-${dayKey}`);
    if (!td) return;
    const cur = f.notas || "";
    td.innerHTML = `
        <div class="nota-edit-wrap">
            <input class="nota-input" id="nota-inp-${id}"
                   type="text" value="${cur.replace(/"/g, "&quot;")}"
                   placeholder="Agregar nota..." maxlength="200">
            <button class="btn-nota-save"   onclick="event.stopPropagation();guardarNota(${id})">✓</button>
            <button class="btn-nota-cancel" onclick="event.stopPropagation();cancelarNota(${id})">✗</button>
        </div>`;
    const inp = document.getElementById(`nota-inp-${id}`);
    if (inp) {
        inp.focus();
        inp.addEventListener("keydown", e => {
            e.stopPropagation();
            if (e.key === "Enter")  guardarNota(id);
            if (e.key === "Escape") cancelarNota(id);
        });
    }
}

async function guardarNota(id) {
    const inp = document.getElementById(`nota-inp-${id}`);
    if (!inp) return;
    const notas = inp.value.trim() || null;
    try {
        await apiFetch(`/turnos/${id}/notas`, {
            method: "PATCH",
            body: JSON.stringify({ notas })
        });
        if (_fichajesData[id]) {

// ── Modal de revisión ─────────────────────────────────────────
let _revFichajeId   = null;
let _revDayFichajes = [];    // todos los fichajes del día en revisión
let _anularDif      = false; // toggle "Anular diferencia"

function abrirRevision(id) {
    const f = _fichajesData[id];
    if (!f) return;

    // Recopilar todos los fichajes cerrados del mismo día
    const fecha = fechaTurno(f.ts_entrada);
    const uid   = f.usuario_id;
    _revDayFichajes = Object.values(_fichajesData)
        .filter(fi => fi.usuario_id === uid && fechaTurno(fi.ts_entrada) === fecha && !fi.activo)
        .sort((a, b) => new Date(a.ts_entrada) - new Date(b.ts_entrada));

    _revFichajeId = id;
    _anularDif    = false;

    document.getElementById("rev-titulo").textContent =
        `Revisión — ${f.username} · ${formatFechaShort(fecha)}`;

    // Lista de fichajes (solo visible si hay más de 1)
    const listSection = document.getElementById("rev-fich-list-section");
    listSection.style.display = _revDayFichajes.length > 1 ? "" : "none";
    _renderRevFichajesList();

    // Info del día (descanso, horario, horas asignadas)
    const fConHorario = _revDayFichajes.find(fi => fi.franjas_asignadas && fi.franjas_asignadas.length) || f;
    const breakMins   = fConHorario.break_mins || 0;
    const horasAsigBase = calcHorasAsignadas(fConHorario.franjas_asignadas, 0);
    document.getElementById("rev-descanso").textContent =
        breakMins > 0 ? `${breakMins} min` : "Sin descanso";
    document.getElementById("rev-horario").innerHTML = renderFranjas(fConHorario.franjas_asignadas);
    document.getElementById("rev-asignadas").textContent =
        horasAsigBase != null ? formatHoras(horasAsigBase) : "Sin horario asignado";

    // Seleccionar el fichaje inicial (el que se pasó como argumento)
    _selectRevFichaje(id);

    // Reset toggle anular diferencia
    _setAnularDif(false);

    document.getElementById("modal-revision").classList.add("open");
}

/** Renderiza los ítems de la lista de fichajes del día en el modal */
function _renderRevFichajesList() {
    const listEl = document.getElementById("rev-fich-list");
    if (!listEl) return;
    listEl.innerHTML = _revDayFichajes.map((fi, idx) => {
        const entrada  = formatTs(fi.ts_entrada);
        const salida   = fi.ts_salida ? formatTs(fi.ts_salida) : "En turno";
        const dur      = fi.horas != null ? formatHoras(fi.horas) : "—";
        const activo   = fi.id === _revFichajeId;
        return `<div class="rev-fich-item${activo ? ' active' : ''}"
                     data-id="${fi.id}"
                     onclick="_selectRevFichaje(${fi.id})">
            <span class="fich-n">#${idx + 1}</span>
            <span class="fich-times">${entrada} → ${salida}</span>
            <span class="fich-dur">${dur}</span>
            <span class="fich-hint">${activo ? '✏️' : ''}</span>
        </div>`;
    }).join("");
}

/** Selecciona un fichaje de la lista y actualiza la sección de edición */
function _selectRevFichaje(id) {
    _revFichajeId = id;
    const f = _fichajesData[id];
    if (!f) return;

    // Actualizar estado activo en la lista
    document.querySelectorAll('.rev-fich-item').forEach(el => {
        const isActive = parseInt(el.dataset.id) === id;
        el.classList.toggle('active', isActive);
        el.querySelector('.fich-hint').textContent = isActive ? '✏️' : '';
    });

    // Rellenar campos del fichaje seleccionado
    document.getElementById("rev-entrada").textContent  = formatTs(f.ts_entrada);
    document.getElementById("rev-salida").textContent   = f.ts_salida ? formatTs(f.ts_salida) : "En turno";
    document.getElementById("rev-duracion").textContent = f.horas != null ? formatHoras(f.horas) : "—";

    const notaEl = document.getElementById("rev-notas");
    notaEl.textContent = f.notas || "(sin notas)";
    notaEl.style.color = f.notas ? "#374151" : "#9ca3af";

    // Mostrar/ocultar lápiz de salida según si tiene hora de salida
    const btnSalida = document.querySelector("[onclick=\"toggleEditHora('salida')\"]");
    if (btnSalida) btnSalida.style.display = f.ts_salida ? "" : "none";

    cancelarEditHora("entrada");
    cancelarEditHora("salida");

/** Convierte un timestamp ISO al formato requerido por datetime-local: "YYYY-MM-DDTHH:MM" */

    if (!ts) return "";
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function guardarHora(campo) {
    if (!_revFichajeId) return;
    const input  = document.getElementById(`rev-${campo}-input`);
    const newVal = input.value;  // "YYYY-MM-DDTHH:MM" en hora LOCAL del navegador
    if (!newVal) { alert("Ingresá una hora válida"); return; }

    // Convertir la hora local del input a UTC para el backend.
    // datetime-local da hora local; sin esta conversión el backend (Railway/UTC)
    // lo almacena desfasado y al recargar la página se ve una hora distinta.
    const dateObj   = new Date(newVal);              // Date en epoch correcto
    const isoUtc    = dateObj.toISOString();         // "YYYY-MM-DDTHH:MM:SS.mmmZ"
    const isoApiStr = isoUtc.slice(0, 19);           // "YYYY-MM-DDTHH:MM:SS" para el backend

    // ── Validación de superposición ───────────────────────────
    const f = _fichajesData[_revFichajeId];
    if (f) {
        const nuevaEntrada = campo === "entrada" ? dateObj : new Date(f.ts_entrada);
        const nuevaSalida  = campo === "salida"  ? dateObj
                           : (f.ts_salida ? new Date(f.ts_salida) : null);

        // Entrada debe ser anterior a salida
        if (nuevaSalida && nuevaEntrada >= nuevaSalida) {
            alert("⚠️ La hora de entrada debe ser anterior a la hora de salida.");
            return;
        }

        // Verificar superposición con otros fichajes del mismo usuario
        if (nuevaSalida) {
            const solapados = Object.values(_fichajesData).filter(other => {
                if (other.id === _revFichajeId || other.usuario_id !== f.usuario_id) return false;
                if (!other.ts_salida) return false;
                const oEnt = new Date(other.ts_entrada);
                const oSal = new Date(other.ts_salida);
                return nuevaEntrada < oSal && oEnt < nuevaSalida;
            });
            if (solapados.length > 0) {
                const otro = solapados[0];
                const rango = `${formatTs(otro.ts_entrada)} – ${formatTs(otro.ts_salida)}`;
                const ok = confirm(
                    `⚠️ El horario se superpone con otro fichaje del mismo empleado:\n${rango}\n\n¿Guardarlo de todos modos?`
                );
                if (!ok) return;
            }
        }
    }

    const body = campo === "entrada"
        ? { ts_entrada: isoApiStr }
        : { ts_salida:  isoApiStr };

    try {
        const res = await apiFetch(`/turnos/${_revFichajeId}/editar-horario`, {
            method: "PATCH",
            body:   JSON.stringify(body),
        });

        // Actualizar datos locales con el ISO UTC (incluye Z) para que
        // formatTs lo muestre correctamente en hora local
        const f = _fichajesData[_revFichajeId];
        if (f) {
            if (campo === "entrada") {
                f.ts_entrada = isoUtc;
                document.getElementById("rev-entrada").textContent = formatTs(f.ts_entrada);
            } else {
                f.ts_salida = isoUtc;
                document.getElementById("rev-salida").textContent = formatTs(f.ts_salida);
            }
            // Recalcular horas localmente desde los timestamps actualizados
            if (f.ts_entrada && f.ts_salida) {
                f.horas = (new Date(f.ts_salida) - new Date(f.ts_entrada)) / 3600000;
            } else if (res.horas != null) {
                f.horas = res.horas;
            }
            document.getElementById("rev-duracion").textContent =
                f.horas != null ? formatHoras(f.horas) : "—";
            // Invalidar ajuste forzado y marcar como pendiente de revisión
            f.ajuste_horas = 0;
            f.revisado     = false;
        }
        cancelarEditHora(campo);
        _refreshAfterEdit(_revFichajeId);
    } catch(e) {
        alert("Error al guardar: " + (e.message || e));
    }
}

function cerrarRevision() {
    document.getElementById("modal-revision").classList.remove("open");
    _revFichajeId   = null;
    _revDayFichajes = [];
    _anularDif      = false;
    cancelarEditHora("entrada");
    cancelarEditHora("salida");
}

async function confirmarRevision() {
    if (!_revFichajeId || !_revDayFichajes.length) return;

    // Calcular ajuste solo si se marcó "Anular diferencia".
    // La lógica: almacenar en UN fichaje del día un ajuste_horas tal que
    // calcHorasAsignadas() devuelva exactamente las horas efectivas del día,
    // con lo que renderDiff() dará 0.
    //   efectivas = totalFichadas − break
    //   si hay franjas : ajuste = efectivas − sum(franjas)
    //   si no hay franjas: ajuste = efectivas   (calcHorasAsig devuelve el ajuste directamente)
    let ajusteTotal     = 0;
    let fichajeAjusteId = null;
    if (_anularDif) {
        const totalFichadasH = _revDayFichajes.reduce((s, fi) => s + (fi.horas || 0), 0);
        // break_mins es único por día (horarios_personales), no sumar por fichaje
        const dayBreakH  = (_revDayFichajes[0]?.break_mins || 0) / 60;
        const efectivasH = totalFichadasH - dayBreakH;

        const fConHorario = _revDayFichajes.find(fi => fi.franjas_asignadas && fi.franjas_asignadas.length);
        if (fConHorario) {
            const horasAsigBase = calcHorasAsignadas(fConHorario.franjas_asignadas, 0) || 0;
            ajusteTotal     = efectivasH - horasAsigBase;
            fichajeAjusteId = fConHorario.id;
        } else {
            // Sin franjas: ajuste = efectivas para que calcHorasAsig devuelva efectivas
            ajusteTotal     = efectivasH;
            fichajeAjusteId = _revDayFichajes[0].id;
        }
    }

    try {
        // Marcar TODOS los fichajes del día como revisados
        for (const fi of _revDayFichajes) {
            const adj = (_anularDif && fi.id === fichajeAjusteId) ? ajusteTotal : 0;
            await apiFetch(`/turnos/${fi.id}/revisar`, {
                method: "PATCH",
                body:   JSON.stringify({ ajuste_horas: adj }),
            });
            if (_fichajesData[fi.id]) {
                _fichajesData[fi.id].revisado     = true;
                _fichajesData[fi.id].ajuste_horas = adj;
            }
        }
        const idParaRefresh = _revFichajeId;
        cerrarRevision();
        _refreshAfterEdit(idParaRefresh);
    } catch(e) {
        alert("Error al confirmar revisión: " + (e.message || e));
    }
}

async function guardarEditInlineFichaje(fichajeId) {
    const entInp = document.getElementById(`ei-ent-${fichajeId}`);
    const salInp = document.getElementById(`ei-sal-${fichajeId}`);
    if (!entInp) return;
    const f = _fichajesData[fichajeId];
    if (!f) return;

    const body = {};
    if (entInp.value) {
        const isoApi = new Date(entInp.value).toISOString().slice(0, 19);
        if (isoApi !== (f.ts_entrada || "").slice(0, 19)) body.ts_entrada = isoApi;
    }
    if (salInp && salInp.value) {
        const isoApi = new Date(salInp.value).toISOString().slice(0, 19);
        if (isoApi !== (f.ts_salida || "").slice(0, 19)) body.ts_salida = isoApi;
    }

    if (!Object.keys(body).length) { _refreshAfterEdit(fichajeId); return; }

    // Validación básica
    const nuevaEnt = body.ts_entrada ? new Date(entInp.value) : new Date(f.ts_entrada);
    const nuevaSal = body.ts_salida  ? new Date(salInp.value) : (f.ts_salida ? new Date(f.ts_salida) : null);
    if (nuevaSal && nuevaEnt >= nuevaSal) {
        alert("⚠️ La hora de entrada debe ser anterior a la hora de salida.");
        return;
    }

    try {
        const res = await apiFetch(`/turnos/${fichajeId}/editar-horario`, {
            method: "PATCH",
            body:   JSON.stringify(body),
        });
        if (body.ts_entrada) f.ts_entrada = new Date(entInp.value).toISOString();
        if (body.ts_salida)  f.ts_salida  = new Date(salInp.value).toISOString();
        if (f.ts_entrada && f.ts_salida) {
            f.horas = (new Date(f.ts_salida) - new Date(f.ts_entrada)) / 3600000;
        } else if (res.horas != null) {
            f.horas = res.horas;
        }
        f.ajuste_horas = 0;
        f.revisado     = false;
        _refreshAfterEdit(fichajeId);
    } catch(e) {
        alert("Error al guardar: " + (e.message || e));
    }
}

// ── Helpers ───────────────────────────────────────────────────
/** Clave de día: "${usuarioId}-YYYY-MM-DD" usando fecha de turno (con umbral nocturno) */
function _dayKey(f) {
    return `${f.usuario_id}-${fechaTurno(f.ts_entrada)}`;
}

/** Fecha local en formato YYYY-MM-DD (fecha calendario real, sin ajuste de turno) */
function fechaLocal(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/**
 * Fecha de turno en formato YYYY-MM-DD.
 * Si la hora local es anterior a HORA_CORTE_TURNO (ej. 6am), el fichaje se
 * atribuye al día anterior, ya que pertenece al turno de noche de esa jornada.
 * Ejemplo: entrada a la 01:30 del domingo → turno del sábado.
 */
let HORA_CORTE_TURNO = 6; // hora local (0-23) — se sobreescribe al cargar config
function fechaTurno(ts) {
    const d = new Date(ts);
    if (d.getHours() < HORA_CORTE_TURNO) {
        d.setDate(d.getDate() - 1);
    }
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/**
 * Calcula las horas ASIGNADAS según el horario (franjas) + ajuste.
 * El descanso (break_mins) NO se suma aquí — se descuenta de las
 * horas fichadas en renderDiff para calcular la diferencia efectiva.
 */
function calcHorasAsignadas(franjas, ajusteHoras) {
    ajusteHoras = ajusteHoras || 0;
    if (!franjas || !franjas.length) {
        return ajusteHoras !== 0 ? ajusteHoras : null;
    }
    let total = 0;
    for (const f of franjas) {
        const [ih, im] = f.inicio.split(":").map(Number);
        const [fh, fm] = f.fin.split(":").map(Number);
        let ini = ih * 60 + im;
        let fin = fh * 60 + fm;
        if (fin <= ini) fin += 24 * 60;
        total += fin - ini;
    }
    return Math.max(0, total) / 60 + ajusteHoras;
}

/**
 * Renderiza la diferencia entre horas efectivas y asignadas.
 * efectivas = fichadas − break_mins (tiempo real trabajado)
 * diff = efectivas − asignadas
 * Cuando no hay asignadas pero hay break, muestra las horas efectivas.
 */
function renderDiff(horasReales, horasAsig, breakMins) {
    const efectivas = (horasReales || 0) - (breakMins || 0) / 60;
    if (horasAsig === null) {
        if (!(breakMins > 0)) return '<span class="diff-neu">—</span>';
        return renderDiffMins(efectivas * 60);
    }
    return renderDiffMins((efectivas - horasAsig) * 60);
}

function renderFranjas(franjas) {
    if (!franjas || !franjas.length) return "—";
    return franjas.map(f =>
        `<span class="franja-tag">${f.inicio}–${f.fin}</span>`
    ).join(" ");
}

function renderDiffMins(diffMins) {
    if (diffMins == null) return '<span class="diff-neu">—</span>';
    const abs = Math.abs(diffMins);
    const h   = Math.floor(abs / 60);
    const m   = Math.round(abs % 60);
    if (h === 0 && m === 0) return '<span class="diff-neu">0m</span>';
    const str = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
    if (diffMins > 0) return `<span class="diff-pos">+${str}</span>`;
    return `<span class="diff-neg">−${str}</span>`;
}

function formatMins(mins) {
    // Trabajar en minutos enteros para evitar "4h 60m" por punto flotante
    const total = Math.round(mins);
    const h = Math.floor(total / 60);
    const m = total % 60;
    if (h === 0) return `${m}m`;
    if (m === 0) return `${h}h`;
    return `${h}h ${m}m`;
}

function formatTs(ts) {
    if (!ts) return "—";
    return new Date(ts).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
}

function formatHoraTs(ts) {
    if (!ts) return "—";
    return new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function formatFechaShort(fechaStr) {
    // fechaStr = YYYY-MM-DD → usar mediodía para evitar problemas de TZ
    const d = new Date(fechaStr + "T12:00:00");
    return d.toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
}

function formatHoras(h) {
    if (h == null) return "—";
    // Trabajar en minutos enteros para evitar "6h 60m" por errores de punto flotante
    const sign      = h < 0 ? "−" : "";
    const totalMins = Math.round(Math.abs(h) * 60);
    const horas     = Math.floor(totalMins / 60);
    const mins      = totalMins % 60;
    let str = horas === 0 ? `${mins}m` : mins === 0 ? `${horas}h` : `${horas}h ${mins}m`;
    return sign + str;
}

init();
</script>
