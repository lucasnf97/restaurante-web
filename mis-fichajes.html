<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Mis fichajes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-brand { font-size:18px; font-weight:700; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

.content { margin-top:60px; padding:24px 32px; max-width:820px; }
.page-header { margin-bottom:20px; }
.page-header h2 { font-size:22px; font-weight:700; color:#1a1a2e; }
.page-header p  { font-size:13px; color:#9ca3af; margin-top:4px; }

.card {
    background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06);
    padding:8px 0; overflow:hidden;
}
table { width:100%; border-collapse:collapse; }
th, td { padding:12px 18px; text-align:left; font-size:13.5px; }
th { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#9ca3af; border-bottom:1px solid #eef0f3; }
tbody tr { border-bottom:1px solid #f3f4f6; }
tbody tr:last-child { border-bottom:none; }
.resto-tag {
    display:inline-block; background:#eef2ff; color:#4338ca; font-weight:600;
    font-size:11.5px; padding:3px 9px; border-radius:999px;
}
.en-curso { color:#16a34a; font-weight:700; }
.dur { color:#374151; font-weight:600; }
.empty { padding:40px; text-align:center; color:#9ca3af; font-size:14px; }
.loading { padding:30px; text-align:center; color:#9ca3af; font-size:14px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</nav>

<div class="content">
    <div class="page-header">
        <h2>🕐 Mis fichajes</h2>
        <p>Tus entradas y salidas en todos los restaurantes donde trabajás.</p>
    </div>
    <div class="card">
        <table>
            <thead>
                <tr><th>Restaurante</th><th>Entrada</th><th>Salida</th><th>Duración</th></tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="4" class="loading">Cargando…</td></tr>
            </tbody>
        </table>
        <div id="empty" class="empty" style="display:none;">Todavía no tenés fichajes registrados.</div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

function _esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function _fmt(ts){
    if (!ts) return null;
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return _esc(ts);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${dd}/${mm} ${hh}:${mi}`;
}

function _dur(a, b){
    if (!a || !b) return '';
    const da = new Date(a.replace(' ','T')), db = new Date(b.replace(' ','T'));
    if (isNaN(da) || isNaN(db)) return '';
    let mins = Math.round((db - da) / 60000);
    if (mins < 0) return '';
    const h = Math.floor(mins/60), m = mins%60;
    return h ? `${h}h ${m}m` : `${m}m`;
}

async function cargar(){
    const tb = document.getElementById('tbody');
    let rows = [];
    try {
        rows = await apiFetch('/empleado/fichajes', { token: getEmpToken() });
    } catch (e) {
        tb.innerHTML = `<tr><td colspan="4" class="empty">No se pudieron cargar tus fichajes: ${_esc(e.message||e)}</td></tr>`;
        return;
    }
    if (!rows || !rows.length){
        tb.innerHTML = '';
        document.getElementById('empty').style.display = 'block';
        return;
    }
    tb.innerHTML = rows.map(r => {
        const salida = r.ts_salida
            ? _fmt(r.ts_salida)
            : '<span class="en-curso">En curso</span>';
        const dur = r.ts_salida ? `<span class="dur">${_dur(r.ts_entrada, r.ts_salida)}</span>` : '—';
        return `<tr>
            <td><span class="resto-tag">${_esc(r.restaurante)}</span></td>
            <td>${_fmt(r.ts_entrada) || '—'}</td>
            <td>${salida}</td>
            <td>${dur}</td>
        </tr>`;
    }).join('');
}

cargar();
</script>
</body>
</html>
