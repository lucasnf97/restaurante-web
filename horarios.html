<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios de la cadena</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:#f0f2f5; color:#1e293b; }
    .navbar { background:#1a1a2e; color:#fff; height:60px; display:flex; align-items:center; padding:0 20px; gap:12px; position:sticky; top:0; z-index:40; }
    .navbar h1 { font-size:17px; font-weight:700; flex:1; }
    .navbar .who { font-size:13px; color:#a5b4fc; }
    .navbar button { background:transparent; border:1px solid #4f46e5; color:#a5b4fc; padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
    .navbar button:hover { background:#4f46e5; color:#fff; }
    .wrap { padding:14px 16px 10px; }

    .view-tabs { display:flex; justify-content:center; gap:8px; margin-bottom:10px; }
    .view-tab { background:#fff; border:1px solid #e5e7eb; color:#475569; padding:8px 18px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; }
    .view-tab:hover { background:#eef2ff; border-color:#c7d2fe; }
    .view-tab.active { background:#4f46e5; border-color:#4f46e5; color:#fff; }

    .nav-bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:10px; }
    .nav-bar .nav-btn { background:#fff; border:1px solid #e5e7eb; color:#1a1a2e; width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:16px; }
    .nav-bar .nav-btn:hover { background:#eef2ff; border-color:#c7d2fe; }
    .nav-label { font-size:15px; font-weight:700; color:#1a1a2e; min-width:250px; text-align:center; }
    .nav-bar .spacer { flex:1; }
    .search { padding:8px 12px; border:1px solid #e5e7eb; border-radius:9px; font-size:14px; outline:none; min-width:210px; }
    .search:focus { border-color:#4f46e5; }
    .btn-pub { background:#16a34a; color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-pub:hover { background:#15803d; }

    .filtros { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:9px 12px; margin-bottom:10px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
    .filtros .frow { display:flex; align-items:center; gap:10px; }
    .filtros .frow + .frow { margin-top:8px; }
    .filtros .flabel { font-size:10px; font-weight:800; color:#6366f1; text-transform:uppercase; letter-spacing:.7px; min-width:92px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .area-chip { padding:3px 12px; border-radius:20px; border:1.5px dashed #d1d5db; background:white; font-size:11px; font-weight:600; color:#6b7280; cursor:pointer; white-space:nowrap; transition:all .15s; user-select:none; }
    .area-chip:hover { opacity:.85; }
    .area-chip.active { border-style:solid; color:white; }
    .rchip { padding:4px 12px; border-radius:20px; border:1.5px solid #e5e7eb; background:#f8fafc; font-size:12px; font-weight:600; color:#475569; cursor:pointer; white-space:nowrap; user-select:none; }
    .rchip:hover { border-color:#c7d2fe; }
    .rchip.active { background:#4f46e5; border-color:#4f46e5; color:#fff; }

    .templates-bar { display:flex; align-items:center; gap:8px; height:48px; padding:0 12px; margin-bottom:10px; background:#faf5ff; border:1.5px solid #e9d5ff; border-radius:10px; overflow-x:auto; scrollbar-width:none; }
    .templates-bar::-webkit-scrollbar { display:none; }
    .tpl-bar-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:#7c3aed; flex-shrink:0; }
    .tpl-chips { display:flex; gap:6px; align-items:center; flex:1; overflow-x:auto; scrollbar-width:none; }
    .tpl-chips::-webkit-scrollbar { display:none; }
    .tpl-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; background:#fff; color:#6d28d9; border:1.5px solid #c4b5fd; font-size:12px; font-weight:600; cursor:grab; white-space:nowrap; user-select:none; transition:all .15s; flex-shrink:0; }
    .tpl-chip:hover { background:#ede9fe; }
    .tpl-chip.dragging { opacity:.45; cursor:grabbing; }
    .tpl-chip-times { font-size:10px; font-weight:500; color:#a78bfa; }
    .tpl-chip-del { background:none; border:none; color:#c4b5fd; cursor:pointer; font-size:12px; padding:0; line-height:1; margin-left:2px; }
    .tpl-chip-del:hover { color:#7c3aed; }
    .tpl-add-btn { background:none; border:1.5px dashed #c4b5fd; border-radius:20px; color:#7c3aed; font-size:12px; font-weight:600; padding:4px 12px; cursor:pointer; flex-shrink:0; }
    .tpl-add-btn:hover { background:#ede9fe; border-color:#7c3aed; }

    .grid-area { overflow:auto; max-height:calc(100vh - 300px); border-radius:10px; }
    .cq-table { border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.07); min-width:100%; table-layout:fixed; }
    body.view-semana .cq-table { width:100%; }
    .cq-table thead th { position:sticky; top:0; z-index:3; background:#fff; border:1px solid #e5e7eb; padding:0; }
    .th-user { position:sticky; left:0; z-index:5 !important; background:#fff; width:210px; min-width:210px; }
    .th-user-inner { padding:10px 12px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:#6366f1; }
    .td-user { position:sticky; left:0; z-index:2; background:#fff; width:210px; min-width:210px; border-right:2px solid #e5e7eb; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
    .td-user-inner { padding:8px 12px; display:flex; align-items:center; gap:8px; }
    .u-avatar-sm { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .u-info-col { display:flex; flex-direction:column; min-width:0; }
    .u-name-sm { font-size:12px; font-weight:600; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-area-tag { font-size:9px; color:#9ca3af; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-rest-tag { font-size:9px; font-weight:700; color:#4338ca; background:#eef2ff; border-radius:4px; padding:0 4px; margin-top:2px; align-self:flex-start; max-width:175px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-period-h { font-size:11px; color:#6366f1; font-weight:700; margin-top:2px; white-space:nowrap; }

    .th-day { min-width:90px; }
    body.view-dos_semanas .th-day { min-width:70px; }
    body.view-mes .th-day { min-width:58px; }
    .day-head-inner { padding:6px 4px; display:flex; flex-direction:column; align-items:center; gap:1px; }
    .dh-dn { font-size:9px; font-weight:700; text-transform:uppercase; color:#9ca3af; letter-spacing:.4px; }
    .dh-dd { font-size:15px; font-weight:800; color:#1a1a2e; line-height:1.2; }
    .dh-dm { font-size:9px; color:#9ca3af; }
    .th-day.col-hoy { background:#fafafe !important; }
    .th-day.col-hoy .dh-dn { color:#6366f1; }
    .th-day.col-hoy .dh-dd { color:#4f46e5; }
    .th-day.col-wknd .dh-dd { color:#9ca3af; }

    .td-day { border:1px solid #f3f4f6; vertical-align:top; min-height:52px; padding:4px; position:relative; cursor:pointer; }
    .td-day.col-hoy { background:#fafafe; }
    .td-day.col-wknd { background:#fafafa; }
    .td-day.drop-over { background:#ede9fe !important; outline:2px dashed #7c3aed; outline-offset:-2px; }

    .cell-content { width:100%; min-height:42px; border-radius:6px; padding:4px 6px; display:flex; flex-direction:column; gap:1px; cursor:pointer; transition:filter .15s; }
    .cell-content + .cell-content { margin-top:3px; }
    .cell-content:hover { filter:brightness(.96); }
    .cell-content.draft { border-style:dashed !important; border-width:2px !important; }
    .cell-content.published { border-style:solid !important; border-width:2px !important; }
    .franja-tag { font-size:10px; font-weight:700; color:inherit; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.35; }
    .shift-rest { font-size:9px; font-weight:700; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cell-total-h { font-size:9px; font-weight:600; opacity:.7; }
    .cell-rol-badge { font-size:9px; font-weight:700; opacity:.85; border-radius:3px; padding:0 3px; background:rgba(0,0,0,.08); display:inline-block; }
    .cell-break { font-size:9px; opacity:.7; }
    .cell-add { width:100%; min-height:42px; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1.5px dashed #e0e0e0; color:#d1d5db; font-size:18px; transition:all .15s; }
    .td-day:hover .cell-add { border-color:#a5b4fc; color:#a5b4fc; background:#f5f3ff; }
    .cell-add-mini { text-align:center; color:#cbd5e1; font-size:13px; margin-top:3px; }
    .td-day:hover .cell-add-mini { color:#a5b4fc; }

    .tr-summary td { background:#f8f9fa !important; border-top:2px solid #dde1e8; }
    .td-sum-label { position:sticky; left:0; z-index:2; width:210px; min-width:210px; border-right:2px solid #e5e7eb; }
    .sum-rol-row { padding:1px 5px 1px 6px; margin-bottom:2px; border-radius:0 3px 3px 0; }
    .sum-hours { font-size:11px; font-weight:800; color:#1a1a2e; display:block; }
    .sum-info { font-size:9px; color:#6b7280; display:block; }
    .grid-empty, .grid-loading { text-align:center; padding:60px; color:#9ca3af; font-size:14px; background:#fff; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.07); }

    .overlay { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:60; }
    .overlay.open { display:flex; }
    .modal { background:#fff; border-radius:16px; width:100%; max-width:430px; box-shadow:0 20px 50px rgba(0,0,0,.25); overflow:hidden; }
    .modal-head { padding:16px 18px; border-bottom:1px solid #eef2f7; display:flex; align-items:center; gap:10px; }
    .modal-head .mav { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; flex-shrink:0; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .modal-head .mt { font-size:16px; font-weight:700; color:#1a1a2e; }
    .modal-head .ms { font-size:12.5px; color:#94a3b8; margin-top:2px; }
    .modal-body { padding:16px 18px; }
    .fr-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .fr-row input[type=time], .fr-row input[type=text] { flex:1; padding:8px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; }
    .fr-del { background:#fef2f2; color:#dc2626; border:none; border-radius:7px; width:30px; height:34px; cursor:pointer; font-size:14px; }
    .add-fr { background:transparent; border:1px dashed #c7d2fe; color:#4f46e5; border-radius:8px; padding:7px; width:100%; cursor:pointer; font-size:13px; margin-top:2px; }
    .mfield { margin-top:14px; }
    .mfield label { display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:5px; }
    .mfield select, .mfield input { width:100%; padding:8px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; }
    .m-rest-field select { border-color:#c7d2fe; background:#f5f3ff; font-weight:600; }
    .mtotal { font-size:13px; color:#475569; margin-top:14px; }
    .mtotal b { color:#1a1a2e; }
    .modal-foot { padding:14px 18px; border-top:1px solid #eef2f7; display:flex; gap:10px; align-items:center; }
    .modal-foot .sp { flex:1; }
    .btn-del { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:9px; padding:9px 14px; font-weight:600; cursor:pointer; }
    .btn-save { background:#4f46e5; color:#fff; border:none; border-radius:9px; padding:9px 18px; font-weight:600; cursor:pointer; }
    .btn-cancel { background:#f1f5f9; color:#475569; border:none; border-radius:9px; padding:9px 14px; font-weight:600; cursor:pointer; }
</style>
</head>
<body class="view-semana">
    <div class="navbar">
        <span style="font-size:20px;">🕐</span>
        <h1>Horarios de la cadena</h1>
        <span class="who" id="who"></span>
        <button onclick="window.location.href='cadena.html'">← Volver</button>
        <button onclick="logout()">Salir</button>
    </div>

    <div class="wrap">
        <div class="view-tabs">
            <button class="view-tab active" id="tab-semana" onclick="setView('semana')">📅 Semana</button>
            <button class="view-tab" id="tab-dos_semanas" onclick="setView('dos_semanas')">📅 2 Semanas</button>
            <button class="view-tab" id="tab-mes" onclick="setView('mes')">🗓️ Mes</button>
        </div>

        <div class="nav-bar">
            <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0;">
                <input class="search" id="buscar" placeholder="🔍 Buscar empleado…" oninput="onFiltroNombre(this.value)">
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                <button class="nav-btn" onclick="navDate(-1)">◀</button>
                <span class="nav-label" id="nav-label">—</span>
                <button class="nav-btn" onclick="navDate(1)">▶</button>
            </div>
            <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;">
                <button class="btn-pub" onclick="publicarHorarios()">📤 Publicar</button>
            </div>
        </div>

        <div class="filtros">
            <div class="frow"><span class="flabel">Restaurante</span><div class="chips" id="chips-rest"></div></div>
            <div class="frow"><span class="flabel">Rol</span><div class="chips" id="chips-rol"></div></div>
        </div>

        <div class="templates-bar" id="templates-bar">
            <span class="tpl-bar-label">📋 Plantillas</span>
            <div class="tpl-chips" id="tpl-chips"></div>
            <button class="tpl-add-btn" onclick="abrirTplModal()">+ Nueva</button>
        </div>

        <div class="grid-area" id="grid-area"><div class="grid-loading">Cargando…</div></div>
    </div>

    <!-- Modal edición de turno -->
    <div class="overlay" id="overlay" onclick="if(event.target===this) cerrarModal()">
        <div class="modal">
            <div class="modal-head">
                <div class="mav" id="m-av">--</div>
                <div><div class="mt" id="m-emp">—</div><div class="ms" id="m-sub">—</div></div>
            </div>
            <div class="modal-body">
                <div class="mfield m-rest-field" style="margin-top:0"><label>Restaurante del turno</label><select id="m-rest" onchange="_modalLoadRest(this.value)"></select></div>
                <div class="mfield"><label>Franjas</label><div id="m-franjas"></div></div>
                <button class="add-fr" onclick="addFranja()">+ Agregar franja</button>
                <div class="mfield"><label>Rol del turno (opcional)</label><select id="m-rol"></select></div>
                <div class="mfield"><label>Descanso (minutos a descontar)</label><input type="number" id="m-break" min="0" step="5" value="0" oninput="recalcTotal()"></div>
                <div class="mtotal" id="m-total">Total: <b>0h</b></div>
            </div>
            <div class="modal-foot">
                <button class="btn-del" id="m-del" style="display:none" onclick="eliminarTurno()">🗑 Eliminar</button>
                <div class="sp"></div>
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-save" onclick="guardarTurno()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal plantilla -->
    <div class="overlay" id="tpl-overlay" onclick="if(event.target===this) cerrarTplModal()">
        <div class="modal">
            <div class="modal-head"><div><div class="mt" id="t-title">Nueva plantilla</div><div class="ms">Arrastrá la plantilla a una celda para aplicarla.</div></div></div>
            <div class="modal-body">
                <div class="mfield" style="margin-top:0"><label>Nombre</label><input type="text" id="t-nombre" placeholder="Ej: Apertura"></div>
                <div style="margin-top:12px" id="t-franjas"></div>
                <button class="add-fr" onclick="tplAddFranja()">+ Franja</button>
                <div class="mfield"><label>Descanso (min)</label><input type="number" id="t-break" min="0" step="5" value="0"></div>
            </div>
            <div class="modal-foot">
                <button class="btn-del" id="t-del" style="display:none" onclick="eliminarTemplate()">🗑 Eliminar</button>
                <div class="sp"></div>
                <button class="btn-cancel" onclick="cerrarTplModal()">Cancelar</button>
                <button class="btn-save" onclick="guardarTemplate()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
    requireAuth();
    const _user = getUser() || {};
    document.getElementById('who').textContent = _user.nombre || _user.username || '';

    // Actor de la grilla:
    //   gerente_cadena → /cadena/* (edita)         empleado_cadena → /empleado/* (solo lectura)
    //   usuario de un restaurante → "upgrade": si es gerente de la cadena del local, obtiene un
    //   token de cadena (solo para estas llamadas, sin pisar la sesión del local) y ve/edita la
    //   cadena entera; si no, edita SOLO este restaurante (grilla y guardado por /horarios-personal).
    let _RO = false, _TOK = null, _SINGLE = false, _EP_RESTS = '/cadena/restaurantes';
    let _epHorarios = (qs) => `/cadena/horarios?${qs}`;
    function _get(p){ return apiFetch(p, { token: _TOK }); }
    function _post(p,b){ return apiFetch(p, { method:'POST', body: JSON.stringify(b||{}), token: _TOK }); }
    function _del(p){ return apiFetch(p, { method:'DELETE', token: _TOK }); }
    // Guardar/eliminar/publicar: cadena (/cadena/horarios/*) vs un solo restaurante (/horarios-personal)
    function _saveTurno(b){ return _SINGLE
        ? _post('/horarios-personal', { usuario_id:b.usuario_id, fecha:b.fecha, franjas:b.franjas, rol_turno:b.rol_turno, break_mins:b.break_mins })
        : _post('/cadena/horarios/guardar', b); }
    function _delTurno(rid, eid){ return _SINGLE ? _del(`/horarios-personal/${eid}`) : _del(`/cadena/horarios/${rid}/${eid}`); }
    function _publicarTurnos(desde, hasta, ids){ return _SINGLE ? _post('/horarios-personal/publicar', { desde, hasta }) : _post('/cadena/horarios/publicar', { desde, hasta, restaurante_ids:ids }); }

    function _applyRO(){
        if(!_RO) return;
        const h1 = document.querySelector('.navbar h1'); if (h1) h1.textContent = 'Mis horarios';
        const volver = document.querySelector('.navbar button'); if (volver) volver.setAttribute('onclick', "window.location.href='dashboard.html'");
        const pub = document.querySelector('.btn-pub'); if (pub) pub.style.display = 'none';
        const tb = document.getElementById('templates-bar'); if (tb) tb.style.display = 'none';
        document.body.classList.add('solo-vista');
        const st = document.createElement('style');
        st.textContent = 'body.solo-vista .cell-add,body.solo-vista .cell-add-mini{display:none!important;} body.solo-vista .td-day{cursor:default!important;}';
        document.head.appendChild(st);
    }

    async function _bootstrap(){
        if (_user.rol === 'gerente_cadena') {
            _EP_RESTS='/cadena/restaurantes'; _epHorarios=(qs)=>`/cadena/horarios?${qs}`; _RO=false;
        } else if (_user.rol === 'empleado_cadena') {
            _EP_RESTS='/empleado/mis-restaurantes'; _epHorarios=(qs)=>`/empleado/horarios-grid?${qs}`; _RO=true;
        } else {
            // Usuario de un restaurante: ¿gerente de la cadena? → token de cadena (ve/edita la
            // cadena entera). Si no → un solo restaurante (este local): grilla y guardado por esquema.
            try {
                const up = await apiFetch('/cadena/upgrade', { method:'POST', body:'{}' });
                _TOK = up.access_token;
                _EP_RESTS='/cadena/restaurantes'; _epHorarios=(qs)=>`/cadena/horarios?${qs}`; _RO=false;
            } catch(e) {
                _SINGLE = true;
                _EP_RESTS='/horarios-personal/restaurante';
                _epHorarios=(qs)=>`/horarios-personal/grid?${qs}`;
                _RO = !hasPermiso('edicion_agenda');   // edita si tiene permiso; si no, solo lectura
            }
        }
        _applyRO();
        init();
    }

    // ── Constantes / colores ────────────────────────────────────
    const DIAS_CORTO = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const DIAS_LARGO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
    const MESES   = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const COLOR_PALETTE = ['#10b981','#3b82f6','#f59e0b','#ec4899','#14b8a6','#f97316','#8b5cf6','#84cc16','#ef4444','#06b6d4','#a78bfa','#fb923c'];
    const ROL_LABELS = { gerente:'Gerencia', empleado:'Personal', bartender:'Bartender', cocinero:'Cocina', camarero:'Sala' };
    let rolColorMap = {}, rolesDisponibles = [];
    function getRolColor(rol){ return rolColorMap[rol] || '#9ca3af'; }
    function getRolLabel(rol){ return ROL_LABELS[rol] || (rol ? rol.charAt(0).toUpperCase()+rol.slice(1) : 'Sin rol'); }
    function hexToRgba(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
    function buildRolColors(){
        const set = new Set();
        Object.values(_users).forEach(u=>u.memberships.forEach(m=>{ if(m.rol) set.add(m.rol); }));
        const orden = ['gerente','empleado','bartender','cocinero','camarero'];
        rolesDisponibles = [...orden.filter(r=>set.has(r)), ...[...set].filter(r=>!orden.includes(r)).sort()];
        rolColorMap = {};
        rolesDisponibles.forEach((rol,i)=>{ rolColorMap[rol]=COLOR_PALETTE[i%COLOR_PALETTE.length]; });
    }

    // ── Estado ──────────────────────────────────────────────────
    let viewMode = 'semana';
    let anchorDate = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();
    let _rests=[], _data=[], _users={};
    let _selRest=new Set(), rolesActivos=new Set(), filtroNombre='';
    let _modal=null;
    // Solicitudes de turnos (Fase 1: intercambio). Mi fila de la grilla = mi username.
    const _miKey = (_user.username||_user.nombre||'').toLowerCase();
    let _solicitudesSemana = {};   // `${restaurante_id}|${usuario_id}|${fechaISO}` -> solicitud activa
    let _desdeISO='', _hastaISO='';
    let _ixSel = null;             // modo "elegir turno del compañero desde la grilla"

    const addDays=(d,n)=>{ const r=new Date(d); r.setDate(r.getDate()+n); return r; };
    function getMondayOf(d){ const r=new Date(d); const j=r.getDay(); r.setDate(r.getDate()-(j===0?6:j-1)); return r; }
    function formatDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function isToday(d){ const t=new Date(); t.setHours(0,0,0,0); return d.getTime()===t.getTime(); }
    function jsDay2Api(d){ const j=d.getDay(); return j===0?6:j-1; }
    function _esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function _t2m(t){ if(!t) return 0; const [h,m]=String(t).slice(0,5).split(':').map(Number); return (h||0)*60+(m||0); }
    function _totMin(franjas){ let s=0; (franjas||[]).forEach(f=>{ let a=_t2m(f.inicio), b=_t2m(f.fin); if(b<=a) b+=1440; if(b>a) s+=b-a; }); return s; }
    function _netMin(e){ return Math.max(0,_totMin(e.franjas||[])-(e.break_mins||0)); }
    function _fmtH(m){ if(!m||m<=0) return ''; const h=Math.floor(m/60), mm=m%60; return mm?`${h}h ${mm}m`:`${h}h`; }
    function _ini(u){ return (u.iniciales || (u.nombre||'?').slice(0,2)).toUpperCase(); }

    // memberships del usuario, acotadas al filtro de restaurante (si hay)
    function userRests(u){ return _selRest.size ? u.memberships.filter(m=>_selRest.has(m.restaurante_id)) : u.memberships.slice(); }
    // rol representativo (para color/etiqueta del avatar)
    function userRol(u){
        if(_selRest.size===1){ const rid=[..._selRest][0]; const m=u.memberships.find(x=>x.restaurante_id===rid); if(m) return m.rol; }
        return (u.memberships[0]||{}).rol||'';
    }
    // turnos del usuario en una fecha, acotados al filtro de restaurante
    function userShifts(u, fecha){
        const allowed = new Set(userRests(u).map(m=>m.restaurante_id));
        return (u.shiftsByDate[fecha]||[]).filter(s=>allowed.has(s.restaurante_id));
    }

    // ── Vista ───────────────────────────────────────────────────
    function setView(mode){
        viewMode=mode;
        document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
        document.getElementById(`tab-${mode}`).classList.add('active');
        document.body.className = document.body.className.replace(/\bview-\S+/g,'').trim();
        document.body.classList.add(`view-${mode}`);
        cargarYRenderizar();
    }
    function navDate(dir){
        if(viewMode==='mes') anchorDate=new Date(anchorDate.getFullYear(), anchorDate.getMonth()+dir, 1);
        else anchorDate=addDays(anchorDate, dir*7);
        cargarYRenderizar();
    }
    function getDays(){
        if(viewMode==='semana'){ const mon=getMondayOf(anchorDate); return Array.from({length:7},(_,i)=>addDays(mon,i)); }
        if(viewMode==='dos_semanas'){ const mon=getMondayOf(anchorDate); return Array.from({length:14},(_,i)=>addDays(mon,i)); }
        const first=new Date(anchorDate.getFullYear(),anchorDate.getMonth(),1), last=new Date(anchorDate.getFullYear(),anchorDate.getMonth()+1,0), days=[];
        for(let d=new Date(first); d<=last; d=addDays(d,1)) days.push(new Date(d));
        return days;
    }
    function updateNavLabel(){
        const days=getDays(), a=days[0], z=days[days.length-1]; let lbl;
        if(viewMode==='semana') lbl=`Semana del ${a.getDate()} al ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`;
        else if(viewMode==='dos_semanas') lbl=a.getMonth()===z.getMonth()?`${a.getDate()} — ${z.getDate()} de ${MESES[z.getMonth()]} ${z.getFullYear()}`:`${a.getDate()} ${MESES_C[a.getMonth()]} — ${z.getDate()} ${MESES_C[z.getMonth()]} ${z.getFullYear()}`;
        else { const m=MESES[anchorDate.getMonth()]; lbl=m.charAt(0).toUpperCase()+m.slice(1)+' '+anchorDate.getFullYear(); }
        document.getElementById('nav-label').textContent=lbl;
    }

    // ── Carga ───────────────────────────────────────────────────
    async function init(){
        _injectIntercambioUI();
        try {
            const rs = await _get(_EP_RESTS);
            // Normalizar: /cadena/restaurantes da {id,nombre}; /empleado/mis-restaurantes da {restaurante_id,restaurante}
            _rests = (rs||[]).map(r => ({ id: (r.id != null ? r.id : r.restaurante_id), nombre: (r.nombre != null ? r.nombre : r.restaurante), codigo: r.codigo }));
        } catch(e){ _rests=[]; }
        renderRestChips();
        if (!_RO) renderTemplatesBar();
        await cargarYRenderizar();
        _chequearSolicitudURL();
    }
    async function cargarYRenderizar(){
        updateNavLabel();
        const days=getDays(), desde=formatDate(days[0]), hasta=formatDate(days[days.length-1]);
        const area=document.getElementById('grid-area');
        area.innerHTML='<div class="grid-loading">Cargando…</div>';
        try { _data = await _get(_epHorarios(`desde=${desde}&hasta=${hasta}`)); }
        catch(e){ area.innerHTML='<div class="grid-empty">Error cargando horarios.</div>'; return; }
        // Deduplicar por username: un usuario = una fila, con N membresías y turnos por restaurante.
        _users={};
        _data.forEach(r=>(r.empleados||[]).forEach(e=>{
            const k=(e.nombre||'').toLowerCase();
            if(!k) return;
            if(!_users[k]) _users[k]={ key:k, nombre:e.nombre||'', iniciales:e.iniciales||'', memberships:[], shiftsByDate:{} };
            const u=_users[k];
            if(!u.iniciales && e.iniciales) u.iniciales=e.iniciales;
            u.memberships.push({ restaurante_id:r.restaurante_id, restaurante:r.restaurante, usuario_id:e.usuario_id, rol:e.rol||'' });
            Object.entries(e.dias||{}).forEach(([date,entry])=>{
                if(entry && entry.franjas && entry.franjas.length){
                    (u.shiftsByDate[date]=u.shiftsByDate[date]||[]).push({ restaurante_id:r.restaurante_id, restaurante:r.restaurante, usuario_id:e.usuario_id, rol:e.rol||'', entry });
                }
            });
        }));
        buildRolColors();
        renderRolChips();
        _desdeISO=desde; _hastaISO=hasta;
        await _cargarSolicitudes(desde, hasta);
        renderGrid();
    }

    // Trae las solicitudes activas del rango y las indexa para pintar el marcador 🔁.
    // Single restaurante (token con schema): una sola llamada. Cadena: una por restaurante.
    async function _cargarSolicitudes(desde, hasta){
        _solicitudesSemana = {};
        const ctxs = _SINGLE ? [null] : _rests.map(r=>r.id);
        for (const rid of ctxs){
            try{
                const qs = new URLSearchParams({ desde, hasta });
                if (rid!=null) qs.set('restaurante_id', rid);
                const arr = await _get('/horarios/solicitudes?'+qs.toString());
                const R = (rid!=null) ? rid : ((_rests[0]||{}).id);
                (arr||[]).forEach(s=>{
                    if(['rechazada','denegada','cancelada','aprobada'].includes(s.estado)) return;
                    if(s.tipo!=='intercambio') return;
                    if(s.creado_por && s.origen_fecha)        _solicitudesSemana[`${R}|${s.creado_por}|${s.origen_fecha}`]=s;
                    if(s.destino_usuario_id && s.destino_fecha) _solicitudesSemana[`${R}|${s.destino_usuario_id}|${s.destino_fecha}`]=s;
                });
            }catch(e){ /* contexto sin acceso (p.ej. gerente_cadena): se ignora */ }
        }
    }

    // ── Filtros ─────────────────────────────────────────────────
    function renderRestChips(){
        document.getElementById('chips-rest').innerHTML = _rests.map(r=>
            `<span class="rchip ${_selRest.has(r.id)?'active':''}" onclick="toggleRest(${r.id})">${_esc(r.nombre||'—')}</span>`).join('')
            || '<span style="color:#9ca3af;font-size:12px;">Sin restaurantes.</span>';
    }
    function toggleRest(id){ if(_selRest.has(id)) _selRest.delete(id); else _selRest.add(id); renderRestChips(); renderGrid(); }
    function renderRolChips(){
        document.getElementById('chips-rol').innerHTML = rolesDisponibles.map(rol=>{
            const active=rolesActivos.has(rol), col=getRolColor(rol);
            const style=active?`background:${col};border-color:${col};color:white;`:`border-color:${col};color:${col};`;
            return `<span class="area-chip${active?' active':''}" onclick="toggleRol('${_esc(rol)}')" style="${style}">${_esc(getRolLabel(rol))}</span>`;
        }).join('') || '<span style="color:#9ca3af;font-size:11px;">Sin roles</span>';
    }
    function toggleRol(rol){ if(rolesActivos.has(rol)) rolesActivos.delete(rol); else rolesActivos.add(rol); renderRolChips(); renderGrid(); }
    function onFiltroNombre(v){ filtroNombre=(v||'').trim().toLowerCase(); renderGrid(); }

    function getVisibleUsers(){
        let arr=Object.values(_users);
        // Restaurante: muestra los usuarios que pertenezcan a alguno de los seleccionados
        if(_selRest.size) arr=arr.filter(u=>u.memberships.some(m=>_selRest.has(m.restaurante_id)));
        if(filtroNombre) arr=arr.filter(u=>u.nombre.toLowerCase().includes(filtroNombre));
        // Rol: dentro de las membresías relevantes (acotadas por el filtro de restaurante)
        if(rolesActivos.size) arr=arr.filter(u=>userRests(u).some(m=>rolesActivos.has(m.rol)));
        arr.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'}));
        return arr;
    }

    // ── Grilla ──────────────────────────────────────────────────
    function periodMins(u, days){ let t=0; days.forEach(d=>{ userShifts(u,formatDate(d)).forEach(s=>t+=_netMin(s.entry)); }); return t; }

    function renderGrid(){
        const area=document.getElementById('grid-area');
        if(!Object.keys(_users).length){ area.innerHTML='<div class="grid-empty">No hay personal en tus restaurantes para este período.</div>'; return; }
        const users=getVisibleUsers();
        if(!users.length){ area.innerHTML='<div class="grid-empty">Ningún empleado coincide con los filtros.<br><small>Ajustá rol, restaurante o búsqueda.</small></div>'; return; }
        const days=getDays();

        const COLW = viewMode==='mes' ? 58 : (viewMode==='dos_semanas' ? 70 : 0);
        const tw = COLW ? ` style="width:${210 + days.length*COLW}px"` : '';
        let html=`<table class="cq-table"${tw}><thead><tr><th class="th-user"><div class="th-user-inner">👥 Personal</div></th>`;
        days.forEach(d=>{
            const cls=['th-day', isToday(d)?'col-hoy':'', (d.getDay()===0||d.getDay()===6)?'col-wknd':''].filter(Boolean).join(' ');
            html+=`<th class="${cls}"><div class="day-head-inner"><span class="dh-dn">${DIAS_CORTO[jsDay2Api(d)]}</span><span class="dh-dd">${d.getDate()}</span><span class="dh-dm">${MESES_C[d.getMonth()]}</span></div></th>`;
        });
        html+=`</tr></thead><tbody>`;

        const summary={}; days.forEach(d=>{ summary[formatDate(d)]={}; });

        users.forEach(u=>{
            const color=getRolColor(userRol(u)), ph=_fmtH(periodMins(u,days));
            const rests=userRests(u).map(m=>m.restaurante).join(', ');
            html+=`<tr><td class="td-user"><div class="td-user-inner"><div class="u-avatar-sm" style="background:${color}">${_esc(_ini(u))}</div><div class="u-info-col"><span class="u-name-sm">${_esc(u.nombre)}</span><span class="u-area-tag">${_esc(getRolLabel(userRol(u)))}</span><span class="u-rest-tag" title="${_esc(rests)}">${_esc(rests||'—')}</span>${ph?`<span class="u-period-h">⏱ ${ph}</span>`:'<span class="u-period-h" style="color:#d1d5db">Sin horas</span>'}</div></div></td>`;
            days.forEach(d=>{
                const key=formatDate(d);
                const cls=['td-day', isToday(d)?'col-hoy':'', (d.getDay()===0||d.getDay()===6)?'col-wknd':''].filter(Boolean).join(' ');
                const drop=`ondragover="event.preventDefault();this.classList.add('drop-over')" ondragleave="this.classList.remove('drop-over')" ondrop="handleTemplateDrop(event,'${u.key}','${key}')"`;
                const shifts=userShifts(u,key);
                html+=`<td class="${cls}" ${drop} onclick="abrirModal('${u.key}','${key}',null)">`;
                if(shifts.length){
                    shifts.forEach(s=>{
                        const e=s.entry, cc=getRolColor(e.rol_turno||s.rol);
                        const fr=e.franjas.map(f=>`<div class="franja-tag">${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}</div>`).join('');
                        const rolB=e.rol_turno?`<div class="cell-rol-badge">${_esc(getRolLabel(e.rol_turno))}</div>`:'';
                        const brk=e.break_mins>0?`<span class="cell-break">☕${e.break_mins}m</span>`:'';
                        const net=_netMin(e);
                        const esMio=(u.key===_miKey);
                        const _mk=_solicitudesSemana[`${s.restaurante_id}|${s.usuario_id}|${key}`]?'<span class="sol-mk" title="En intercambio">🔁</span>':'';
                        const _selable = _ixSel && u.key===_ixSel.destKey && s.restaurante_id===_ixSel.R;
                        let _click;
                        if(_selable)   _click=`event.stopPropagation();_ixSeleccionarTurno(${e.id})`;
                        else if(esMio) _click=`event.stopPropagation();abrirMenuTurno(event,'${u.key}','${key}',${s.restaurante_id},${e.id})`;
                        else           _click=`event.stopPropagation();abrirModal('${u.key}','${key}',${s.restaurante_id})`;
                        html+=`<div class="cell-content ${e.publicado?'published':'draft'}${_selable?' ix-selectable':''}" style="border-color:${cc};background:${hexToRgba(cc,.08)};color:${cc};" onclick="${_click}">${_mk}${rolB}${fr}<div class="shift-rest">— ${_esc(s.restaurante)}</div><div class="cell-total-h">${_fmtH(net)} ${brk}</div></div>`;
                        const rE=e.rol_turno||s.rol;
                        if(!summary[key][rE]) summary[key][rE]={mins:0,count:0};
                        summary[key][rE].mins+=net; summary[key][rE].count+=1;
                    });
                    html+=`<div class="cell-add-mini">＋</div>`;
                } else {
                    html+=`<div class="cell-add">+</div>`;
                }
                html+=`</td>`;
            });
            html+=`</tr>`;
        });

        html+=`<tr class="tr-summary"><td class="td-user td-sum-label"><div class="td-user-inner" style="justify-content:center;"><span style="font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase;letter-spacing:.7px;">📊 Total día</span></div></td>`;
        days.forEach(d=>{
            const key=formatDate(d);
            const cls=['td-day', isToday(d)?'col-hoy':'', (d.getDay()===0||d.getDay()===6)?'col-wknd':''].filter(Boolean).join(' ');
            const entries=Object.entries(summary[key]||{}).filter(([,v])=>v.count>0).sort(([a],[b])=>a.localeCompare(b));
            html+=`<td class="${cls}" style="vertical-align:top;padding:4px;cursor:default;">`;
            entries.forEach(([rol,data])=>{ const col=getRolColor(rol); html+=`<div class="sum-rol-row" style="border-left:3px solid ${col};background:${hexToRgba(col,.06)}"><span class="sum-hours">${_fmtH(data.mins)}</span><span class="sum-info">${data.count} ${_esc(getRolLabel(rol).toLowerCase())}</span></div>`; });
            html+=`</td>`;
        });
        html+=`</tr></tbody></table>`;
        area.innerHTML=html;
    }

    function cerrarMenuTurno(){ const e=document.getElementById('cell-menu'); if(e) e.remove(); }
    function abrirMenuTurno(ev, userKey, fecha, restauranteId, origenHorarioId){
        ev.stopPropagation(); cerrarMenuTurno();
        const m=document.createElement('div'); m.className='cell-menu'; m.id='cell-menu';
        let items=`<div class="it" onclick="abrirModalIntercambio(${restauranteId},'${fecha}',${origenHorarioId})">🔁 Proponer intercambio…</div>`;
        if(!_RO) items+=`<div class="it" onclick="cerrarMenuTurno();abrirModal('${userKey}','${fecha}',${restauranteId})">✏️ Editar turno</div>`;
        m.innerHTML=items; document.body.appendChild(m);
        const r=ev.currentTarget.getBoundingClientRect();
        m.style.left=(r.left+window.scrollX)+'px'; m.style.top=(r.bottom+window.scrollY+2)+'px';
        setTimeout(()=>document.addEventListener('click', cerrarMenuTurno, {once:true}), 0);
    }
    function _ixHoyISO(){ const t=new Date(); t.setHours(0,0,0,0); return formatDate(t); }
    function _ixTurnosDe(u, R){
        const hoy=_ixHoyISO(), out=[];
        Object.entries(u.shiftsByDate||{}).forEach(([date,arr])=>{
            (arr||[]).forEach(s=>{ if(s.restaurante_id===R && s.entry && s.entry.publicado && date>=hoy)
                out.push({ id:s.entry.id, date, franjas:(s.entry.franjas||[]).map(f=>`${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}`).join(', ') }); });
        });
        out.sort((a,b)=>a.date.localeCompare(b.date));
        return out;
    }
    function abrirModalIntercambio(R, fecha, origenHorarioId){
        cerrarMenuTurno(); _injectIntercambioUI();
        const yo=_users[_miKey];
        // Datos del turno propio (origen) para mostrar
        let oTxt=`${fecha}`;
        (yo&&yo.shiftsByDate[fecha]||[]).forEach(s=>{ if(s.restaurante_id===R && s.entry && s.entry.id===origenHorarioId){
            const fr=(s.entry.franjas||[]).map(f=>`${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}`).join(', ');
            oTxt=`<b>Tu turno:</b> ${fecha} · ${fr} · ${_esc(s.restaurante)}`; } });
        document.getElementById('ix-origen').innerHTML=oTxt;
        const ov=document.getElementById('modal-intercambio');
        ov.dataset.origen=origenHorarioId; ov.dataset.rest=R; ov.dataset.fecha=fecha;
        // Compañeros: usuarios (≠ yo) con membresía en este restaurante
        const colegas=Object.values(_users).filter(u=>u.key!==_miKey && u.memberships.some(m=>m.restaurante_id===R));
        const selC=document.getElementById('ix-companero');
        selC.innerHTML='<option value="">Elegí…</option>'+colegas.map(u=>{
            const m=u.memberships.find(x=>x.restaurante_id===R); return `<option value="${m.usuario_id}|${u.key}">${_esc(u.nombre)}</option>`;
        }).join('');
        document.getElementById('ix-turno').innerHTML='<option value="">Elegí compañero primero…</option>';
        ov.style.display='flex';
    }
    // Opciones del desplegable: "Sin turno a cambio" (default), turnos del compañero, y "Ver grilla".
    function _ixTurnoOpciones(turnos){
        return '<option value="" selected>Sin turno a cambio</option>'
             + turnos.map(t=>`<option value="${t.id}">${t.date} · ${t.franjas||'sin franjas'}</option>`).join('')
             + '<option value="__grid__">📅 Ver grilla…</option>';
    }
    function _ixPoblarTurnos(){
        const ov=document.getElementById('modal-intercambio'); const R=+ov.dataset.rest;
        const val=document.getElementById('ix-companero').value;
        const selT=document.getElementById('ix-turno');
        if(!val){ selT.innerHTML='<option value="">Elegí compañero primero…</option>'; return; }
        const uKey=val.split('|')[1]; const u=_users[uKey];
        const turnos=u?_ixTurnosDe(u,R):[];
        selT.innerHTML=_ixTurnoOpciones(turnos);
    }
    function _ixTurnoChange(){
        if(document.getElementById('ix-turno').value==='__grid__') _ixVerGrilla();
    }
    async function enviarIntercambio(){
        const ov=document.getElementById('modal-intercambio');
        const origen=+ov.dataset.origen, R=+ov.dataset.rest;
        const val=document.getElementById('ix-companero').value;
        if(!val){ alert('Elegí el compañero.'); return; }
        const tval=document.getElementById('ix-turno').value;
        if(tval==='__grid__'){ alert('Elegí un turno desde la grilla o "Sin turno a cambio".'); return; }
        const destUid=+val.split('|')[0];
        const body={ origen_horario_id:origen, destino_usuario_id:destUid, restaurante_id:R };
        if(tval!=='') body.destino_horario_id=+tval;   // vacío = sin turno a cambio (cesión)
        try{
            await _post('/horarios/solicitudes', body);
            cerrarIntercambio();
            alert(tval!=='' ? 'Solicitud de intercambio enviada.' : 'Cesión de turno enviada.');
            await _cargarSolicitudes(_desdeISO,_hastaISO); renderGrid();
        }catch(e){ alert('Error: '+(e.message||e)); }
    }
    // ── "Ver grilla": elegir el turno del compañero clickeándolo en la grilla ──
    function _ixVerGrilla(){
        const ov=document.getElementById('modal-intercambio');
        const val=document.getElementById('ix-companero').value;
        if(!val){ alert('Elegí primero el compañero.'); document.getElementById('ix-turno').value=''; return; }
        const [destUid, destKey]=val.split('|');
        _ixSel={ origen:+ov.dataset.origen, R:+ov.dataset.rest, fecha:ov.dataset.fecha, destUid:+destUid, destKey };
        cerrarIntercambio();
        // Filtro: solo este restaurante + nombre del compañero, para ver sus turnos.
        _selRest=new Set([_ixSel.R]);
        const comp=_users[destKey]; const nom=comp?comp.nombre:'';
        filtroNombre=(nom||'').toLowerCase();
        const inp=document.getElementById('buscar'); if(inp) inp.value=nom;
        renderRestChips();
        _ixBanner(nom);
        renderGrid();
    }
    function _ixSeleccionarTurno(hid){
        if(!_ixSel) return;
        const sel=_ixSel; _ixSel=null; _ixClearBanner();
        abrirModalIntercambio(sel.R, sel.fecha, sel.origen);
        const c=document.getElementById('ix-companero'); c.value=`${sel.destUid}|${sel.destKey}`;
        _ixPoblarTurnos();
        const t=document.getElementById('ix-turno'); t.value=String(hid);
    }
    function _ixBanner(nombre){
        _ixClearBanner();
        const b=document.createElement('div'); b.id='ix-banner';
        b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9600;background:#1d4ed8;color:#fff;padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.2);';
        b.innerHTML=`📅 Elegí un turno de <b style="margin:0 4px;">${_esc(nombre||'tu compañero')}</b> para recibir a cambio (tocá una celda) <button onclick="_ixCancelarSel()" title="Cancelar y volver al intercambio" style="background:#fff;color:#1d4ed8;border:0;border-radius:6px;padding:4px 11px;font-weight:700;cursor:pointer;">✕ Cancelar</button>`;
        document.body.appendChild(b);
    }
    function _ixClearBanner(){ const b=document.getElementById('ix-banner'); if(b) b.remove(); }
    // Cancela la selección por grilla y vuelve al modal de intercambio (con el compañero
    // reseteado) para poder elegir otro empleado.
    function _ixCancelarSel(){
        const sel=_ixSel; _ixSel=null; _ixClearBanner();
        if(sel) abrirModalIntercambio(sel.R, sel.fecha, sel.origen);
    }
    function cerrarIntercambio(){ const ov=document.getElementById('modal-intercambio'); if(ov) ov.style.display='none'; }

    // ── Deep-link desde Mensajes/Muro: ?solicitud=<id>&restaurante_id=<rid> ──
    // Muestra una ventanita fija abajo-izquierda con la info y Confirmar/Denegar,
    // dejando navegar la grilla con normalidad para revisar el personal del día.
    async function _chequearSolicitudURL(){
        const p = new URLSearchParams(location.search);
        const sid = p.get('solicitud'); if(!sid) return;
        const rid = p.get('restaurante_id');
        try{
            const q = rid ? ('?restaurante_id='+rid) : '';
            const d = await _get(`/horarios/solicitudes/${sid}${q}`);
            _mostrarWidgetSolicitud(d, rid);
        }catch(e){ console.warn('No se pudo cargar la solicitud del deep-link:', e); }
    }
    function _swFmt(j){ try{ return (JSON.parse(j||'[]')||[]).map(f=>`${(f.inicio||'').slice(0,5)}–${(f.fin||'').slice(0,5)}`).join(', '); }catch(_){ return ''; } }
    function _mostrarWidgetSolicitud(d, rid){
        if(!d.puede_editar) return;   // solo quien puede confirmar (no los empleados involucrados)
        let el=document.getElementById('sol-widget');
        if(!el){
            const st=document.createElement('style'); st.textContent=`
              #sol-widget{ position:fixed; left:16px; bottom:16px; z-index:9500; width:330px; max-width:92vw; background:#fff; border:1px solid #d1d5db; border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.22); padding:14px 16px; }
              #sol-widget h4{ margin:0 0 8px; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
              #sol-widget .sw-x{ cursor:pointer; color:#9ca3af; font-weight:700; }
              #sol-widget .sw-row{ font-size:12.5px; color:#374151; padding:3px 0; }
              #sol-widget .sw-acts{ display:flex; gap:8px; margin-top:12px; }
              #sol-widget .sw-b{ flex:1; padding:8px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
              #sol-widget .sw-b.ok{ background:#2563eb; color:#fff; } #sol-widget .sw-b.no{ background:#fff; color:#b91c1c; border-color:#fecaca; }
              #sol-widget .sw-state{ font-size:12px; font-weight:700; color:#6b7280; margin-top:10px; }`;
            document.head.appendChild(st);
            el=document.createElement('div'); el.id='sol-widget'; document.body.appendChild(el);
        }
        const pend = d.estado==='pend_confirmacion';
        const ridArg = (rid!=null && rid!=='') ? rid : 'null';
        const acts = pend
            ? `<div class="sw-acts"><button class="sw-b ok" onclick="_resolverSolicitud(${d.id},'confirmar',${ridArg})">Confirmar</button><button class="sw-b no" onclick="_resolverSolicitud(${d.id},'denegar',${ridArg})">Denegar</button></div>`
            : `<div class="sw-state">Estado: ${_esc(d.estado)}</div>`;
        let info = `<div class="sw-row"><b>${_esc(d.creador_username||'—')}</b> da: ${d.origen_fecha||'—'} · ${_swFmt(d.origen_franjas)||'—'}</div>`;
        info += d.destino_horario_id
            ? `<div class="sw-row"><b>${_esc(d.destino_username||'—')}</b> da: ${d.destino_fecha||'—'} · ${_swFmt(d.destino_franjas)||'—'}</div>`
            : `<div class="sw-row"><b>${_esc(d.destino_username||'—')}</b>: sin turno a cambio</div>`;
        el.innerHTML = `<h4>🔁 Intercambio de turno <span class="sw-x" onclick="document.getElementById('sol-widget').remove()">✕</span></h4>${info}${acts}`;
        el.style.display='block';
    }
    async function _resolverSolicitud(id, accion, rid){
        const body = (rid!=null) ? { restaurante_id: rid } : {};
        try{
            await _post(`/horarios/solicitudes/${id}/${accion}`, body);
            alert(accion==='confirmar' ? 'Intercambio aprobado.' : 'Intercambio denegado.');
            const w=document.getElementById('sol-widget'); if(w) w.remove();
            await cargarYRenderizar();   // re-trae la grilla (los turnos ya quedaron intercambiados) + marcadores
        }catch(e){ alert('Error: '+(e.message||e)); }
    }

    // ── Modal turno ─────────────────────────────────────────────
    function abrirModal(userKey, fecha, preRestId){
        if(_RO) return;   // empleado: grilla de solo lectura
        const u=_users[userKey]; if(!u) return;
        const allowed=userRests(u); if(!allowed.length) return;
        let restId=preRestId;
        if(restId==null){
            const conTurno=new Set((u.shiftsByDate[fecha]||[]).map(s=>s.restaurante_id));
            const libre=allowed.find(m=>!conTurno.has(m.restaurante_id));
            restId=libre?libre.restaurante_id:allowed[0].restaurante_id;
        }
        _modal={ userKey, fecha };
        const av=document.getElementById('m-av'); av.textContent=_ini(u); av.style.background=getRolColor(userRol(u));
        const d=new Date(fecha+'T00:00:00');
        document.getElementById('m-emp').textContent=u.nombre;
        document.getElementById('m-sub').textContent=`${DIAS_LARGO[jsDay2Api(d)]} ${d.getDate()} ${MESES_C[d.getMonth()]}`;
        // selector de restaurante (acotado al filtro)
        document.getElementById('m-rest').innerHTML=allowed.map(m=>`<option value="${m.restaurante_id}" ${m.restaurante_id===Number(restId)?'selected':''}>${_esc(m.restaurante)}</option>`).join('');
        _modalLoadRest(restId);
        document.getElementById('overlay').classList.add('open');
    }
    function _modalLoadRest(restId){
        restId=Number(restId);
        const u=_users[_modal.userKey];
        const m=u.memberships.find(x=>x.restaurante_id===restId);
        _modal.restaurante_id=restId; _modal.usuario_id=m?m.usuario_id:null;
        const s=(u.shiftsByDate[_modal.fecha]||[]).find(x=>x.restaurante_id===restId);
        const e=s?s.entry:null; _modal.entryId=e?e.id:null;
        const franjas=(e && e.franjas && e.franjas.length)?e.franjas:[{inicio:'09:00',fin:'17:00'}];
        document.getElementById('m-franjas').innerHTML=franjas.map(f=>franjaRow(f.inicio,f.fin)).join('');
        const rolEmp=m?m.rol:'';
        const sel=(e && e.rol_turno)||'';
        document.getElementById('m-rol').innerHTML=`<option value="">(rol del empleado: ${_esc(getRolLabel(rolEmp))})</option>`+rolesDisponibles.map(r=>`<option value="${_esc(r)}" ${r===sel?'selected':''}>${_esc(getRolLabel(r))}</option>`).join('');
        document.getElementById('m-break').value=(e && e.break_mins)||0;
        document.getElementById('m-del').style.display=_modal.entryId?'':'none';
        recalcTotal();
    }
    function franjaRow(ini,fin){ return `<div class="fr-row"><input type="time" value="${(ini||'').slice(0,5)}" oninput="recalcTotal()"><span style="color:#94a3b8;">a</span><input type="time" value="${(fin||'').slice(0,5)}" oninput="recalcTotal()"><button class="fr-del" onclick="this.closest('.fr-row').remove();recalcTotal()">✕</button></div>`; }
    function addFranja(){ document.getElementById('m-franjas').insertAdjacentHTML('beforeend', franjaRow('','')); }
    function _leerFranjas(){ const out=[]; document.querySelectorAll('#m-franjas .fr-row').forEach(r=>{ const t=r.querySelectorAll('input[type=time]'); if(t[0].value && t[1].value) out.push({inicio:t[0].value,fin:t[1].value}); }); return out; }
    function recalcTotal(){ const brk=parseInt(document.getElementById('m-break').value,10)||0; document.getElementById('m-total').innerHTML=`Total: <b>${_fmtH(Math.max(0,_totMin(_leerFranjas())-brk))||'0h'}</b>`; }
    function cerrarModal(){ document.getElementById('overlay').classList.remove('open'); _modal=null; }
    async function guardarTurno(){
        if(!_modal || !_modal.usuario_id) return;
        const franjas=_leerFranjas();
        try{
            if(!franjas.length){ if(_modal.entryId) await _delTurno(_modal.restaurante_id, _modal.entryId); }
            else await _saveTurno({ restaurante_id:_modal.restaurante_id, usuario_id:_modal.usuario_id, fecha:_modal.fecha, franjas, rol_turno:document.getElementById('m-rol').value||null, break_mins:parseInt(document.getElementById('m-break').value,10)||0 });
            cerrarModal(); await cargarYRenderizar();
        }catch(e){ alert('No se pudo guardar: '+(e.message||e)); }
    }
    async function eliminarTurno(){
        if(!_modal || !_modal.entryId){ cerrarModal(); return; }
        try{ await _delTurno(_modal.restaurante_id, _modal.entryId); cerrarModal(); await cargarYRenderizar(); }
        catch(e){ alert('No se pudo eliminar: '+(e.message||e)); }
    }

    // ── Publicar ────────────────────────────────────────────────
    async function publicarHorarios(){
        const days=getDays(), desde=formatDate(days[0]), hasta=formatDate(days[days.length-1]);
        const ids=_selRest.size?[..._selRest]:null;
        const quien=_SINGLE?'este restaurante':(ids?`${ids.length} restaurante(s) seleccionado(s)`:'TODOS tus restaurantes');
        if(!confirm(`¿Publicar los horarios en borrador del período ${desde} a ${hasta} para ${quien}?`)) return;
        try{ const r=await _publicarTurnos(desde, hasta, ids); alert(`Publicados: ${r.publicados||0} horario(s).`); await cargarYRenderizar(); }
        catch(e){ alert('No se pudo publicar: '+(e.message||e)); }
    }

    // ── Plantillas (localStorage, drag&drop) ────────────────────
    const TPL_KEY='horarios_templates_v1';
    function loadTemplates(){
        try{ const raw=localStorage.getItem(TPL_KEY); if(raw) return JSON.parse(raw); }catch(e){}
        return [
            { id:'tpl_apertura', nombre:'Apertura', franjas:[{inicio:'08:00',fin:'16:00'}], break_mins:30 },
            { id:'tpl_tarde', nombre:'Tarde', franjas:[{inicio:'14:00',fin:'22:00'}], break_mins:30 },
            { id:'tpl_cierre', nombre:'Cierre', franjas:[{inicio:'16:00',fin:'00:00'}], break_mins:30 },
        ];
    }
    function saveTemplates(){ localStorage.setItem(TPL_KEY, JSON.stringify(_templates)); }
    let _templates=loadTemplates();
    function renderTemplatesBar(){
        const c=document.getElementById('tpl-chips');
        if(!_templates.length){ c.innerHTML='<span style="font-size:11px;color:#a78bfa;">Sin plantillas — creá la primera</span>'; return; }
        c.innerHTML=_templates.map(t=>{
            const tiempos=t.franjas.map(f=>`${f.inicio}–${f.fin}`).join(', ');
            const brk=t.break_mins>0?` ☕${t.break_mins}m`:'';
            return `<span class="tpl-chip" draggable="true" ondragstart="tplDragStart(event,'${t.id}')" ondragend="tplDragEnd(event)" onclick="abrirTplModal('${t.id}')">${_esc(t.nombre)}<span class="tpl-chip-times">${_esc(tiempos)}${brk}</span><button class="tpl-chip-del" onclick="event.stopPropagation();confirmarEliminarTpl('${t.id}')">✕</button></span>`;
        }).join('');
    }
    let _dragTplId=null;
    function tplDragStart(e,id){ _dragTplId=id; e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='copy'; e.currentTarget.classList.add('dragging'); }
    function tplDragEnd(e){ e.currentTarget.classList.remove('dragging'); _dragTplId=null; }
    async function handleTemplateDrop(e, userKey, fecha){
        e.preventDefault(); e.currentTarget.classList.remove('drop-over');
        if(!_dragTplId) return;
        const tpl=_templates.find(t=>t.id===_dragTplId); _dragTplId=null; if(!tpl) return;
        const u=_users[userKey]; if(!u) return;
        const allowed=userRests(u);
        let restId = _selRest.size===1 ? [..._selRest][0] : (allowed.length===1 ? allowed[0].restaurante_id : null);
        const m = allowed.find(x=>x.restaurante_id===restId);
        if(restId==null || !m){ alert('Este usuario pertenece a varios restaurantes.\nFiltrá por un restaurante (o usá el modal de la celda) para aplicar la plantilla.'); return; }
        try{ await _saveTurno({ restaurante_id:restId, usuario_id:m.usuario_id, fecha, franjas:tpl.franjas, rol_turno:null, break_mins:tpl.break_mins||0 }); await cargarYRenderizar(); }
        catch(err){ alert('Error al aplicar plantilla: '+(err.message||err)); }
    }
    let _editingTplId=null;
    function abrirTplModal(id){
        _editingTplId=id||null;
        const tpl=id?_templates.find(t=>t.id===id):null;
        document.getElementById('t-title').textContent=tpl?'Editar plantilla':'Nueva plantilla';
        document.getElementById('t-nombre').value=tpl?tpl.nombre:'';
        document.getElementById('t-break').value=tpl?(tpl.break_mins||0):0;
        const franjas=tpl?tpl.franjas:[{inicio:'09:00',fin:'17:00'}];
        document.getElementById('t-franjas').innerHTML=franjas.map(f=>tplFranjaRow(f.inicio,f.fin)).join('');
        document.getElementById('t-del').style.display=tpl?'':'none';
        document.getElementById('tpl-overlay').classList.add('open');
    }
    function cerrarTplModal(){ document.getElementById('tpl-overlay').classList.remove('open'); _editingTplId=null; }
    function tplFranjaRow(ini,fin){ return `<div class="fr-row"><input type="time" value="${(ini||'').slice(0,5)}"><span style="color:#94a3b8;">a</span><input type="time" value="${(fin||'').slice(0,5)}"><button class="fr-del" onclick="this.closest('.fr-row').remove()">✕</button></div>`; }
    function tplAddFranja(){ document.getElementById('t-franjas').insertAdjacentHTML('beforeend', tplFranjaRow('','')); }
    function guardarTemplate(){
        const nombre=document.getElementById('t-nombre').value.trim();
        if(!nombre){ alert('Poné un nombre a la plantilla.'); return; }
        const franjas=[];
        document.querySelectorAll('#t-franjas .fr-row').forEach(r=>{ const t=r.querySelectorAll('input[type=time]'); if(t[0].value && t[1].value) franjas.push({inicio:t[0].value,fin:t[1].value}); });
        if(!franjas.length){ alert('Agregá al menos una franja.'); return; }
        const brk=parseInt(document.getElementById('t-break').value,10)||0;
        if(_editingTplId){ const t=_templates.find(x=>x.id===_editingTplId); if(t){ t.nombre=nombre; t.franjas=franjas; t.break_mins=brk; } }
        else _templates.push({ id:'tpl_'+Date.now(), nombre, franjas, break_mins:brk });
        saveTemplates(); renderTemplatesBar(); cerrarTplModal();
    }
    function confirmarEliminarTpl(id){ if(confirm('¿Eliminar esta plantilla?')){ _templates=_templates.filter(t=>t.id!==id); saveTemplates(); renderTemplatesBar(); } }
    function eliminarTemplate(){ if(_editingTplId){ confirmarEliminarTpl(_editingTplId); cerrarTplModal(); } }

    _bootstrap();
    </script>
</body>
</html>
