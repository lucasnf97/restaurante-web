<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante — Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>🍽️ Gestión</h1>
            <p>Panel de gerencia</p>
        </div>

        <!-- Empleado: login por email (sin código) -->
        <div class="form-group" id="grp-email">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com" autocomplete="username">
        </div>

        <!-- Gerente / administración: con código + usuario (oculto por defecto) -->
        <div class="form-group" id="grp-codigo" style="display:none">
            <label for="codigo">N° de restaurante / cadena</label>
            <input type="text" id="codigo" placeholder="Código" autocomplete="off">
        </div>
        <div class="form-group" id="grp-username" style="display:none">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Tu usuario" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
        </div>

        <button id="btn-login" onclick="handleLogin()">Ingresar</button>

        <div style="text-align:center;margin-top:14px;">
            <a href="#" id="toggle-modo" onclick="toggleModo(event)" style="font-size:13px;color:#4f46e5;text-decoration:none;">Ingresar con código (gerente / administración)</a>
        </div>

        <div class="error" id="error-msg"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Si ya está logueado, ir a la pantalla de inicio de la web.
        // OJO: `pantalla_default` configura SOLO el ejecutable (PyQt). En la web
        // todos los usuarios entran al dashboard y ven lo que sus permisos habilitan.
        function _destino(rol) {
            return rol === 'superadmin' ? 'restaurantes.html'
                 : rol === 'gerente_cadena' ? 'cadena.html'
                 : rol === 'empleado_cadena' ? 'mi-portal.html'
                 : 'dashboard.html';
        }

        if (getToken()) {
            const _u = JSON.parse(localStorage.getItem('user') || '{}');
            window.location.href = _destino(_u.rol);
        }

        // Modo: false = empleado (email); true = con código (gerente/admin/terminal)
        let _modoCodigo = false;
        function toggleModo(e) {
            if (e) e.preventDefault();
            _modoCodigo = !_modoCodigo;
            document.getElementById('grp-email').style.display    = _modoCodigo ? 'none' : '';
            document.getElementById('grp-codigo').style.display   = _modoCodigo ? '' : 'none';
            document.getElementById('grp-username').style.display = _modoCodigo ? '' : 'none';
            document.getElementById('toggle-modo').textContent = _modoCodigo
                ? 'Soy empleado — ingresar con email'
                : 'Ingresar con código (gerente / administración)';
            document.getElementById('error-msg').style.display = 'none';
        }

        // Permitir login con Enter
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleLogin();
        });

        async function handleLogin() {
            const password = document.getElementById("password").value;
            const btn = document.getElementById("btn-login");
            document.getElementById("error-msg").style.display = "none";

            let userArg, codigoArg;
            if (_modoCodigo) {
                userArg   = document.getElementById("username").value.trim();
                codigoArg = document.getElementById("codigo").value.trim();
                if (!userArg || !password) { mostrarError("Completá usuario y contraseña."); return; }
            } else {
                userArg   = document.getElementById("email").value.trim();
                codigoArg = "";
                if (!userArg || !password) { mostrarError("Completá email y contraseña."); return; }
            }

            btn.disabled = true;
            btn.textContent = "Ingresando...";
            try {
                await login(userArg, password, codigoArg);
                const _u2 = JSON.parse(localStorage.getItem('user') || '{}');
                window.location.href = _destino(_u2.rol);
            } catch (err) {
                mostrarError(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Ingresar";
            }
        }

        function mostrarError(msg) {
            const div = document.getElementById("error-msg");
            div.textContent = msg;
            div.style.display = "block";
        }
    </script>
</body>
</html>
