<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dividir la cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Dividir la cuenta con QR ─────────────────────────────────────────────────
   El comensal escanea el QR que le muestra el camarero en el pago dividido, entra como
   "Cliente N" y se asigna lo que consumió (o comparte un ítem que ya tiene otro). Todo
   en vivo: la pantalla de cobro ve lo mismo. Marca Chief Point (mismos tokens que
   takeaway.html): sin sombras en reposo, texto ≥ 14 px, grises con contraste ≥ 7:1. */
:root{
    --navy:#1B1B33; --navy-2:#2A2A4A; --lime:#C9FF1F; --r4:#4C5A15;
    --fondo:#F6F6F9; --sup:#FFFFFF; --sup-2:#F0F0F4;
    --tx:#1B1B33; --tx-2:#4A4A60; --bd:#E3E3EA;
    --mio-sf:#F4F9DD; --mio-bd:#B4E025; --mio-tx:#3A4510;
    --otro-sf:#EEF0F8; --otro-tx:#2A2A4A;
    --pel:#B42336; --pel-sf:#FDF2F3; --ok:#3A4510;
    color-scheme: light;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --fondo:#121222; --sup:#1B1B33; --sup-2:#25253F;
        --tx:#F2F2F7; --tx-2:#C4C4D4; --bd:#34345A;
        --mio-sf:#28331A; --mio-bd:#93BE1E; --mio-tx:#DDF59A;
        --otro-sf:#2A2A4A; --otro-tx:#DADAF0;
        --pel:#FF8A98; --pel-sf:#3A1A22; --ok:#DDF59A;
        color-scheme: dark;
    }
}
:root[data-theme="dark"]{
    --fondo:#121222; --sup:#1B1B33; --sup-2:#25253F;
    --tx:#F2F2F7; --tx-2:#C4C4D4; --bd:#34345A;
    --mio-sf:#28331A; --mio-bd:#93BE1E; --mio-tx:#DDF59A;
    --otro-sf:#2A2A4A; --otro-tx:#DADAF0;
    --pel:#FF8A98; --pel-sf:#3A1A22; --ok:#DDF59A;
    color-scheme: dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:Figtree,system-ui,sans-serif; color:var(--tx); background:var(--fondo); line-height:1.45;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh; }
button,input{ font:inherit; color:inherit; }
.hidden{ display:none !important; }
h1,h2,h3{ font-family:Poppins,sans-serif; font-weight:600; letter-spacing:-.02em; margin:0; text-wrap:balance; }
.envase{ max-width:560px; margin:0 auto; padding:0 16px; }

/* Barra */
.barra{ background:var(--navy); color:#fff; padding:max(12px, env(safe-area-inset-top)) 0 12px; }
.barra .envase{ display:flex; align-items:center; gap:12px; }
.barra .local{ font-family:Poppins,sans-serif; font-weight:600; font-size:17px; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.idiomas{ display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--navy-2); }
.idiomas button{ min-width:36px; min-height:32px; border:none; border-radius:999px; background:transparent;
    color:#C4C4D4; font-size:12.5px; font-weight:600; letter-spacing:.06em; cursor:pointer; }
.idiomas button[aria-pressed=true]{ background:var(--lime); color:var(--navy); }

/* Tarjetas */
.tarjeta{ background:var(--sup); border:1px solid var(--bd); border-radius:18px; padding:18px; margin-top:14px; }
.yo{ display:flex; align-items:center; gap:14px; }
.yo .num{ width:52px; height:52px; border-radius:50%; background:var(--navy); color:var(--lime); flex:none;
    display:flex; align-items:center; justify-content:center; font-family:Poppins,sans-serif; font-weight:600; font-size:20px;
    box-shadow:0 0 0 3px var(--r4); }
.yo .quien{ flex:1; min-width:0; }
.yo .quien .t{ font-size:14px; color:var(--tx-2); }
.yo .quien input{ width:100%; border:none; border-bottom:1.5px solid var(--bd); background:transparent; padding:4px 0;
    font-size:17px; font-weight:600; outline:none; }
.yo .quien input:focus{ border-bottom-color:var(--mio-bd); }
.yo .total{ text-align:right; }
.yo .total .t{ font-size:14px; color:var(--tx-2); }
.yo .total .m{ font-family:Poppins,sans-serif; font-weight:600; font-size:24px; white-space:nowrap; }
.pagado{ display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--ok); }

.ayuda{ font-size:14.5px; color:var(--tx-2); margin:16px 2px 6px; }

/* Ítems */
.lista{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.pieza{ display:flex; align-items:center; gap:12px; background:var(--sup); border:1.5px solid var(--bd);
    border-radius:14px; padding:12px 12px 12px 14px; min-height:64px; }
.pieza.mia{ background:var(--mio-sf); border-color:var(--mio-bd); }
.pieza .info{ flex:1; min-width:0; }
.pieza .nom{ font-weight:600; font-size:15.5px; overflow-wrap:anywhere; }
.pieza .sub{ font-size:14px; color:var(--tx-2); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-top:2px; }
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; padding:2px 9px;
    border-radius:999px; background:var(--otro-sf); color:var(--otro-tx); }
.chip.yo-chip{ background:var(--navy); color:var(--lime); }
.pieza .precio{ font-weight:600; white-space:nowrap; font-size:15px; }
.acc{ border:none; border-radius:999px; min-height:44px; padding:0 16px; font-weight:600; font-size:14.5px; cursor:pointer; white-space:nowrap; }
.acc.tomar{ background:var(--lime); color:var(--navy); }
.acc.compartir{ background:var(--navy); color:#fff; }
:root[data-theme="dark"] .acc.compartir{ background:var(--sup-2); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .acc.compartir{ background:var(--sup-2); } }
.acc.soltar{ background:transparent; color:var(--tx); border:1.5px solid var(--bd); }
.acc:disabled{ opacity:.55; cursor:default; }
.cerrado-lbl{ font-size:13.5px; font-weight:600; color:var(--tx-2); }

/* Clientes */
.clientes{ display:flex; flex-direction:column; gap:6px; }
.cli{ display:flex; align-items:center; gap:10px; font-size:15px; }
.cli .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cli .m{ font-weight:600; white-space:nowrap; }

/* Barra inferior: lo que falta */
.pie{ position:sticky; bottom:0; margin-top:18px; background:var(--sup); border-top:1px solid var(--bd);
    padding:12px 0 calc(12px + env(safe-area-inset-bottom)); }
.pie .envase{ display:flex; align-items:center; gap:12px; }
.pie .falta{ flex:1; font-size:14.5px; }
.pie .falta b{ font-size:16px; }
.barra-prog{ height:6px; border-radius:999px; background:var(--sup-2); overflow:hidden; margin-top:6px; }
.barra-prog i{ display:block; height:100%; background:var(--mio-bd); transition:width .3s; }

/* Entrada / estados */
.portada{ text-align:center; padding:40px 8px 10px; }
.portada h1{ font-size:26px; }
.portada p{ color:var(--tx-2); font-size:15.5px; margin:10px auto 0; max-width:420px; }
.campo{ margin-top:18px; text-align:left; }
.campo label{ display:block; font-size:14px; font-weight:600; color:var(--tx-2); margin-bottom:6px; }
.campo input{ width:100%; height:52px; border-radius:14px; border:1.5px solid var(--bd); background:var(--sup);
    padding:0 14px; font-size:16px; outline:none; }
.campo input:focus{ border-color:var(--mio-bd); }
.btn{ display:flex; width:100%; align-items:center; justify-content:center; border:none; cursor:pointer;
    border-radius:999px; font-weight:600; font-size:16px; height:54px; margin-top:16px; }
.btn-lima{ background:var(--lime); color:var(--navy); }
.aviso{ border-radius:14px; padding:12px 14px; margin-top:14px; font-size:14.5px; font-weight:500; }
.aviso.pel{ background:var(--pel-sf); color:var(--pel); }
.aviso.info{ background:var(--otro-sf); color:var(--otro-tx); }
.toast{ position:fixed; left:50%; top:calc(68px + env(safe-area-inset-top)); transform:translateX(-50%);
    background:var(--navy); color:#fff; border-radius:14px; padding:12px 16px; font-size:14.5px; z-index:50;
    max-width:min(92vw, 420px); box-shadow:0 8px 30px rgba(0,0,0,.25); }
.final{ text-align:center; padding:56px 8px; }
.final .ico{ width:72px; height:72px; margin:0 auto 16px; border-radius:50%; background:var(--navy); color:var(--lime);
    display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 0 0 4px var(--r4); }
.final p{ color:var(--tx-2); }
.final .auto{ font-size:13px; margin-top:14px; }
/* Código de la mesa (últimos 3 dígitos del Nº de cuenta del ticket) */
.cod-ej{ display:inline-block; margin-top:14px; padding:8px 14px; border:1px dashed var(--bd); border-radius:10px;
         font-family:'Courier New',monospace; font-size:15px; color:var(--tx-2); }
.cod-ej b{ font-size:22px; color:var(--tx); }
.cod-in{ display:block; width:170px; margin:18px auto 8px; padding:10px 8px; font-size:34px; font-weight:800;
         text-align:center; letter-spacing:12px; border:2px solid var(--bd); border-radius:14px;
         background:var(--sup); color:var(--tx); font-family:inherit; }
.cod-in:focus{ outline:none; border-color:var(--lime); }
.final .msg-falta{ margin:4px 0 10px; }
/* Elegir para otra persona (sin celular) */
.para .t{ font-size:14px; color:var(--tx-2); margin-bottom:8px; }
.chips-para{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-para{ border:1.5px solid var(--bd); background:var(--sup); color:var(--tx); border-radius:999px;
    min-height:42px; padding:0 14px; font-weight:600; font-size:14.5px; cursor:pointer; }
.chip-para.on{ background:var(--navy); color:var(--lime); border-color:var(--navy); }
.chip-para.mas{ border-style:dashed; color:var(--tx-2); }
.para .fila-para{ display:flex; gap:8px; align-items:center; margin-top:12px; }
.para .fila-para input{ flex:1; min-width:0; height:46px; border-radius:12px; border:1.5px solid var(--bd);
    background:var(--sup); padding:0 12px; font-size:16px; outline:none; }
.para .fila-para input:focus{ border-color:var(--mio-bd); }
.para .nota{ font-size:13.5px; color:var(--tx-2); margin-top:8px; }
.chip.sel-chip{ background:var(--mio-bd); color:var(--navy); }
.nombre-txt{ font-size:17px; font-weight:600; overflow-wrap:anywhere; }
.link-nombre{ border:none; background:none; padding:4px 0; margin-top:2px; color:var(--tx-2); font-weight:600;
    font-size:14px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:32px; }
.edit-nombre{ display:flex; gap:8px; align-items:center; margin-top:12px; }
.edit-nombre input{ flex:1; min-width:0; height:46px; border-radius:12px; border:1.5px solid var(--mio-bd);
    background:var(--sup); padding:0 12px; font-size:16px; outline:none; }
/* En oscuro la tarjeta ya es navy: lo elegido / "vos" pasa a lima para distinguirse. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip-para.on,
    :root:not([data-theme="light"]) .chip.yo-chip{ background:var(--lime); color:var(--navy); border-color:var(--lime); } }
:root[data-theme="dark"] .chip-para.on, :root[data-theme="dark"] .chip.yo-chip{ background:var(--lime); color:var(--navy); border-color:var(--lime); }
/* Pagar desde el celular */
.pagar .t{ font-size:14px; color:var(--tx-2); }
.pagar h3{ font-size:18px; margin-bottom:4px; }
.pagar .linea{ display:flex; justify-content:space-between; font-size:15px; margin-top:6px; }
.pagar .linea.total{ font-family:Poppins,sans-serif; font-weight:600; font-size:20px; margin-top:12px;
    padding-top:10px; border-top:1px solid var(--bd); }
.propinas{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.medios{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
.medios span{ font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--sup-2); color:var(--tx-2); }
.esperando-pago{ display:flex; align-items:center; gap:12px; margin-top:12px; padding:14px; border-radius:14px; background:var(--otro-sf); color:var(--otro-tx); }
.esperando-pago .pulso{ display:flex; gap:5px; }
.esperando-pago .pulso i{ width:9px; height:9px; border-radius:50%; background:currentColor; animation:latido 1.4s ease-in-out infinite; }
.esperando-pago .pulso i:nth-child(2){ animation-delay:.2s; } .esperando-pago .pulso i:nth-child(3){ animation-delay:.4s; }
/* Recibo por correo (cuenta pagada) */
.recibo{ text-align:left; margin-top:22px; }
.recibo .campo{ margin-top:0; }
.check{ display:flex; gap:12px; align-items:flex-start; margin-top:14px; font-size:10.5px; color:var(--tx); cursor:pointer; }
.check input{ width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:var(--mio-bd); }
.check small{ display:block; color:var(--tx-2); font-size:9.5px; margin-top:2px; }
/* Campos obligatorios: asterisco rojo fijo + leyenda; si falta algo al enviar, aviso arriba */
.ast{ color:var(--pel); font-weight:700; margin-left:3px; }
.leyenda-oblig{ font-size:12px; color:var(--tx-2); margin:8px 2px 0; }
.leyenda-oblig .ast{ margin:0 3px 0 0; }
.aviso-oblig{ color:var(--pel); font-size:13.5px; font-weight:600; margin:-6px 0 12px; }
.msg-falta{ color:var(--pel); font-size:13px; font-weight:600; margin-top:6px; }
.btn-lima:disabled{ opacity:.5; cursor:default; }
.ok-envio{ margin-top:18px; border-radius:14px; padding:14px; background:var(--mio-sf); color:var(--mio-tx); font-weight:600; }
/* Latido = en vivo (animación con significado de la marca) */
.vivo{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#C4C4D4; }
.vivo i{ width:8px; height:8px; border-radius:50%; background:var(--lime); animation:latido 1.6s ease-in-out infinite; }
@keyframes latido{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(.8); } }
@media (prefers-reduced-motion: reduce){ .vivo i{ animation:none; } }
</style>
</head>

    const b = new Uint8Array(18); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256);

async function resolverSala() {
    clearTimeout(_timer);
    if (!CODIGO) { ERROR = 'no_existe'; render(); return; }
    try {
        const r = await pedir(urlSala());
        SIN_RED = false; SALA_INFO = r;
        if (!r.ocupada) {
            const cambio = !VACIA || PIDE_COD;
            VACIA = true; PIDE_COD = false; S = null;
            if (cambio || !$('app').querySelector('.sala-vacia')) render();
        } else {
            VACIA = false;
            const c = codGuardado();
            if (c) {

async function pedir(url, opts = {}) {

    try {
        const v = (S && S.version != null && S.estado === 'abierta') ? `&v=${S.version}` : '';
        const r = await pedir(`${RUTA}?d=${encodeURIComponent(DISP)}${v}`);

            if (SALA) _ls.set(CLAVE_PAGADO, JSON.stringify({ url, t: Date.now(), local: r.local || '' }));

    S = null; await consultar();
}
function pagoHTML(yo, sel) {
    const po = S.pago_online || {};
    if (!po.disponible || S.estado !== 'abierta') return '';
    const titulo = sel.num === yo.num ? t('pagar_t') : esc(t('pagar_t_otro', { n: nombreDe(sel) }));
    if (sel.pagado) return `<div class="tarjeta pagar"><h3>${titulo}</h3><div class="pagado" style="margin-top:6px;">${t('pagado_ok')} · ${dinero(sel.importe)}</div></div>`;
    if (sel.pagando) return `<div class="tarjeta pagar"><h3>${titulo}</h3>
        <div class="esperando-pago"><span class="pulso"><i></i><i></i><i></i></span><span>${t('esperando_pago')}</span></div>
        ${po.demo ? `<p class="t" style="margin-top:8px;">${t('demo_nota')}</p>` : ''}
        <button class="btn" style="background:transparent;border:1.5px solid var(--bd);color:var(--tx);" onclick="cancelarPago()">${t('cancelar_pago')}</button></div>`;
    if (!(sel.importe > 0)) return `<div class="tarjeta pagar"><h3>${titulo}</h3><p class="t" style="margin-top:6px;">${t('pagar_nada')}</p></div>`;
    const prop = propinaDe(sel.importe), total = Math.round((sel.importe + prop) * 100) / 100;
    return `<div class="tarjeta pagar"><h3>${titulo}</h3>
        <div class="linea"><span>${t('su_parte_l')}</span><b>${dinero(sel.importe)}</b></div>
        <div class="t" style="margin-top:12px;">${t('propina')}</div>
        <div class="propinas">${PROPINAS.map(p => `<button class="chip-para ${PROPINA_PCT === p ? 'on' : ''}" onclick="elegirPropina(${p})">${p ? p + ' %' : t('sin_propina')}</button>`).join('')}</div>
        ${prop > 0 ? `<div class="linea"><span>${t('propina')} ${PROPINA_PCT} %</span><b>${dinero(prop)}</b></div>` : ''}
        <div class="linea total"><span>${t('total_pagar')}</span><span>${dinero(total)}</span></div>
        <button class="btn btn-lima" onclick="pagarParte()" ${PAGANDO || OCUPADO ? 'disabled' : ''}>${esc(t('pagar_btn', { m: dinero(total) }))}</button>
        <div class="medios"><span>Apple Pay</span><span>Google Pay</span><span>MobilePay</span><span>${LANG === 'da' ? 'Kort' : LANG === 'en' ? 'Card' : 'Tarjeta'}</span></div>
        <p class="t" style="margin-top:10px;">${po.demo ? t('demo_nota') + ' ' : ''}${t('medios_nota')}</p></div>`;
}

// ── Pintar ──
function etiquetaCliente(c) { return t('cliente') + ' ' + c.num + (c.nombre ? ' · ' + c.nombre : ''); }
function render(soloPie) {
    $('vivo').classList.toggle('hidden', !(S && S.estado === 'abierta' && !SIN_RED));
    const local = (S && S.local) || (SALA_INFO && SALA_INFO.local);
    if (local) {
        $('local').textContent = local + (SALA_INFO ? ' · ' + t('sala', { n: SALA_INFO.sala }) : '');
        document.title = t('titulo') + ' · ' + local;
    }
    const app = $('app');
    if (ERROR === 'no_existe') {
        $('pie').classList.add('hidden'); $('local').textContent = '';
        app.innerHTML = `<div class="final"><div class="ico">?</div><h2>${t('no_existe_t')}</h2><p>${t('no_existe_p')}</p></div>`;
        return;
    }
    if (YA_PAGO) {
        $('pie').classList.add('hidden');
        if (YA_PAGO.local) $('local').textContent = YA_PAGO.local;
        app.innerHTML = `<div class="final"><div class="ico">✓</div><h2>${t('ya_pago_t')}</h2><p>${t('ya_pago_p')}</p>
            <button class="btn btn-lima" style="margin-top:18px;" onclick="location.href=YA_PAGO.url">${t('ver_recibo')}</button></div>`;
        return;
    }
    if (RECIBO_TOK && S && S.vencido) {
        $('pie').classList.add('hidden');
        app.innerHTML = `<div class="final"><div class="ico">·</div><h2>${t('cobrada_t')}</h2><p>${t('recibo_vencido')}</p></div>`;
        return;
    }
    if (PIDE_COD && !S) {
        $('pie').classList.add('hidden');
        app.innerHTML = `<div class="final codigo"><div class="ico">#</div>
            <h2>${t('cod_t')}</h2><p>${t('cod_p')}</p>
            <div class="cod-ej">${t('cod_ej')}: Nº 13<b>457</b></div>
            <input id="cod-in" class="cod-in" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"
                aria-label="${esc(t('cod_t'))}" placeholder="···" value="${esc(COD_VAL)}"
                oninput="COD_VAL=this.value.replace(/\\D/g,'').slice(0,3);this.value=COD_VAL"
                onkeydown="if(event.key==='Enter')enviarCodigo()">
            ${COD_ERR ? `<p class="msg-falta" id="cod-err">${esc(COD_ERR)}</p>` : ''}
            <button class="btn btn-lima" id="cod-entrar" onclick="enviarCodigo()" ${COD_ENVIANDO ? 'disabled' : ''}>${t('cod_entrar')}</button>
            ${SIN_RED ? `<p class="auto">${t('sin_red')}</p>` : ''}</div>`;
        return;
    }
    if (VACIA && !S) {
        $('pie').classList.add('hidden');
        app.innerHTML = `<div class="final sala-vacia"><div class="ico">…</div>
            <h2>${t('vacia_t', { n: SALA_INFO ? SALA_INFO.sala : '' })}</h2><p>${t('vacia_p')}</p>
            <p class="auto">${SIN_RED ? t('sin_red') : t('vacia_auto')}</p></div>`;
        return;
    }
    if (!S) { app.innerHTML = ''; return; }
    if (S.estado === 'cobrada') { pintarCobrada(app); return; }
    if (S.estado === 'cerrada') {
        $('pie').classList.add('hidden');
        app.innerHTML = `<div class="final"><div class="ico">·</div><h2>${t('cerrada_t')}</h2><p>${t('cerrada_p')}</p></div>`;
        return;
    }
    const yo = S.yo ? (S.clientes || []).find(c => c.num === S.yo) : null;
    pintarPie();
    if (soloPie && yo && app.querySelector('.lista')) {
        app.querySelectorAll('.acc').forEach(b => b.disabled = OCUPADO || !!(yo && yo.pagado) || S.estado !== 'abierta');
        return;
    }
    const avisos = (SIN_RED ? `<div class="aviso pel">${t('sin_red')}</div>` : '')
        + (S.estado === 'en_cambio' ? `<div class="aviso info">${t('cambio')}</div>` : '')
        + (S.pagado_previo > 0 ? `<div class="aviso info">${t('previo', { m: dinero(S.pagado_previo) })}</div>` : '');
    if (!yo) {
        // Entrada: sólo el botón. El número (Cliente N, por orden de llegada) y el nombre
        // opcional ("✏️ Poner mi nombre") aparecen recién después de unirse.
        app.innerHTML = `<div class="portada"><h1>${t('titulo')}</h1><p>${t('intro')}</p>
            <button class="btn btn-lima" id="btn-unirse" onclick="unirse()" ${OCUPADO || S.estado !== 'abierta' ? 'disabled' : ''}>${t('entrar')}</button>
            ${avisos}</div>` + listaHTML(null, true);
        return;
    }
    if ((EDIT !== null || AGREGANDO) && app.querySelector('#edit-nombre, #para-nuevo') && !OCUPADO) {
        return;   // escribiendo un nombre: la actualización en vivo espera a que termine
    }
    const sel = objetivo(yo);
    const mios = (S.clientes || []).filter(c => c.gestor === yo.num);
    const bloqueoPara = OCUPADO || yo.pagado || S.estado !== 'abierta';
    const selector = yo.pagado ? '' : `<div class="tarjeta para">
            <div class="t">${t('eligiendo')}</div>
            <div class="chips-para">
                <button class="chip-para ${sel.num === yo.num ? 'on' : ''}" onclick="elegirPara(null)">${t('vos')}</button>
                ${mios.map(c => `<button class="chip-para ${sel.num === c.num ? 'on' : ''}" onclick="elegirPara(${c.num})">${esc(nombreDe(c))}${c.pagado ? ' ✓' : ''}</button>`).join('')}
                ${AGREGANDO ? '' : `<button class="chip-para mas" onclick="verAgregar(true)" ${bloqueoPara ? 'disabled' : ''}>${t('agregar_persona')}</button>`}
            </div>
            ${AGREGANDO ? `<div class="fila-para"><input id="para-nuevo" maxlength="30" placeholder="${esc(t('nombre_persona'))}"
                    onkeydown="if(event.key==='Enter')agregarPersona()">
                <button class="acc tomar" onclick="agregarPersona()" ${bloqueoPara ? 'disabled' : ''}>${t('agregar')}</button>
                <button class="acc soltar" onclick="verAgregar(false)">${t('cancelar')}</button></div>
                <div class="nota">${t('agregar_ayuda')}</div>` : ''}
            ${sel.num !== yo.num ? `<div class="fila-para">
                <div style="flex:1;min-width:0;"><div class="nombre-txt">${esc(nombreDe(sel))}</div>
                    ${sel.pagado || EDIT === sel.num ? '' : `<button class="link-nombre" onclick="editarNombre(${sel.num})">${t(sel.nombre ? 'cambiar_nombre' : 'poner_nombre_otro')}</button>`}</div>
                <div style="text-align:right;white-space:nowrap;"><div class="t" style="margin:0;">${t('su_parte')}</div>
                    <b style="font-size:18px;">${dinero(sel.importe)}</b></div>
                ${!sel.pagado && sel.importe <= 0 && !(S.piezas || []).some(p => p.clientes.includes(sel.num))
                    ? `<button class="acc soltar" onclick="quitarPersona(${sel.num})" ${bloqueoPara ? 'disabled' : ''}>${t('quitar')}</button>` : ''}
            </div>${EDIT === sel.num ? campoNombre(sel.nombre, t('nombre_persona')) : ''}` : ''}
        </div>`;
    app.innerHTML = `
        <div class="tarjeta yo">
            <div class="num">${yo.num}</div>
            <div class="quien"><div class="t">${t('sos')} ${t('cliente')} ${yo.num}</div>
                ${yo.nombre ? `<div class="nombre-txt">${esc(yo.nombre)}</div>` : ''}
                ${yo.pagado || EDIT === 'yo' ? '' : `<button class="link-nombre" onclick="editarNombre('yo')">${t(yo.nombre ? 'cambiar_nombre' : 'poner_nombre')}</button>`}</div>
            <div class="total"><div class="t">${t('tu_parte')}</div><div class="m">${dinero(yo.importe)}</div>
                ${yo.pagado ? `<div class="pagado">✓ ${t('pagado')}</div>` : ''}</div>
        </div>
        ${EDIT === 'yo' ? `<div class="tarjeta" style="margin-top:8px;padding-top:4px;">${campoNombre(yo.nombre, t('ph_nombre'))}</div>` : ''}
        ${avisos}
        ${selector}
        ${yo.pagado ? `<div class="aviso info">${t('ya_pagaste')}</div>`
            : `<p class="ayuda">${sel.num === yo.num ? t('ayuda') : esc(t('ayuda_para', { n: nombreDe(sel) }))}</p>`}
        ${listaHTML(yo, false, sel)}
        <div class="tarjeta"><h3 style="font-size:16px;margin-bottom:10px;">${t('en_la_mesa')}</h3>
            <div class="clientes">${(S.clientes || []).map(c => `<div class="cli">
                <span class="chip ${c.num === yo.num ? 'yo-chip' : ''}">${c.num}</span>
                <span class="n">${esc(etiquetaCliente(c))}${c.gestor ? ` <small style="color:var(--tx-2)">· ${esc(t('lo_elige', { n: nombreDe((S.clientes || []).find(x => x.num === c.gestor) || { num: c.gestor }) }))}</small>` : ''}</span>
                <span class="m">${c.pagado ? '✓ ' : ''}${c.importe > 0 ? dinero(c.importe) : t('nada_aun')}</span></div>`).join('')}</div></div>
        ${pagoHTML(yo, sel)}
        <div style="height:12px"></div>`;
}
// ── Cuenta pagada: recibo por correo (consentimiento RGPD; publicidad opt-in) ──
let RECIBO = { email: '', datos: false, publi: false, error: '', enviando: false, falta: {} };
function pintarCobrada(app) {
    $('pie').classList.add('hidden');
    const yo = S.yo ? (S.clientes || []).find(c => c.num === S.yo) : null;
    const local = esc(S.local || '');
    const enviado = S.recibo_enviado_a;
    // Si el usuario está escribiendo, no se re-pinta encima (perdería el foco).
    if (app.querySelector('#rc-email') && document.activeElement && app.contains(document.activeElement)) return;
    app.innerHTML = `<div class="final" style="padding-bottom:20px;"><div class="ico">✓</div>
            <h2>${t('cobrada_t')}</h2><p>${t('cobrada_p')}</p>
            ${yo && yo.importe > 0 ? `<p style="font-weight:600;color:var(--tx);">${t('tu_pagaste', { m: dinero(yo.importe) })}</p>` : ''}</div>
        <div class="tarjeta recibo">
            <h3 style="font-size:18px;margin-bottom:14px;">${t('recibo_t')}</h3>
            ${RECIBO.falta.email === t('falta_email') || RECIBO.falta.datos ? `<p class="aviso-oblig" id="rc-aviso-oblig">${t('completar_oblig')}</p>` : ''}
            ${enviado ? `<div class="ok-envio">${esc(t('enviado', { e: enviado }))}</div>` : ''}
            <div class="campo"><label for="rc-email">${t('email')}<span class="ast">*</span></label>
                <input id="rc-email" type="email" inputmode="email" autocomplete="email" maxlength="160"
                    aria-invalid="${!!RECIBO.falta.email}"
                    placeholder="${esc(t('ph_email'))}" value="${esc(RECIBO.email)}"
                    oninput="RECIBO.email=this.value;quitarFalta('email')" onkeydown="if(event.key==='Enter')enviarRecibo()">
                ${RECIBO.falta.email === t('email_mal') ? `<div class="msg-falta" id="rc-email-msg">${esc(RECIBO.falta.email)}</div>` : ''}</div>
            <label class="check" id="rc-datos-l"><input type="checkbox" id="rc-datos" ${RECIBO.datos ? 'checked' : ''}
                    onchange="RECIBO.datos=this.checked;quitarFalta('datos')">
                <span>${t('acepto_datos', { local })}<span class="ast">*</span></span></label>
            <label class="check"><input type="checkbox" id="rc-publi" ${RECIBO.publi ? 'checked' : ''}
                    onchange="RECIBO.publi=this.checked">
                <span>${t('acepto_publi', { local })}</span></label>
            ${RECIBO.error ? `<div class="aviso pel">${esc(RECIBO.error)}</div>` : ''}
            <button class="btn btn-lima" id="rc-enviar" onclick="enviarRecibo()">${t('enviar')}</button>
            <p class="leyenda-oblig"><span class="ast">*</span>${t('campo_oblig')}</p>
        </div><div style="height:24px"></div>`;
    pintarBotonRecibo();
}
// El botón siempre se puede tocar (salvo mientras envía): lo que falte se marca en rojo.
function pintarBotonRecibo() {
    const b = $('rc-enviar'); if (b) b.disabled = !!RECIBO.enviando;
}
function quitarFalta(k) {
    if (!RECIBO.falta[k]) return;
    delete RECIBO.falta[k];
    if (k === 'email') { const m = $('rc-email-msg'); if (m) m.remove(); }
    // Completó lo obligatorio que faltaba: se va el aviso de arriba.
    if (!(RECIBO.falta.email === t('falta_email') || RECIBO.falta.datos)) { const a = $('rc-aviso-oblig'); if (a) a.remove(); }
}
async function enviarRecibo() {
    const email = (RECIBO.email || '').trim();
    // Se marcan TODOS los obligatorios que falten a la vez (correo, primera casilla o ambos).
    const falta = {};
    if (!email) falta.email = t('falta_email');
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) falta.email = t('email_mal');
    if (!RECIBO.datos) falta.datos = true;
    if (Object.keys(falta).length) {
        RECIBO.falta = falta; RECIBO.error = '';
        if (document.activeElement) document.activeElement.blur();
        render();
        return;
    }
    RECIBO.falta = {};
    RECIBO.enviando = true; RECIBO.error = ''; pintarBotonRecibo();
    try {
        const r = RECIBO_TOK
            ? await pedir(`${API}/publico/reparto/${encodeURIComponent(CODIGO)}/recibo/${encodeURIComponent(RECIBO_TOK)}`,
                { method: 'POST', body: JSON.stringify({ email, acepta_datos: true, acepta_publicidad: !!RECIBO.publi }) })
            : await pedir(`${RUTA}/recibo`, { method: 'POST', body: JSON.stringify({
                dispositivo: DISP, email, acepta_datos: true, acepta_publicidad: !!RECIBO.publi }) });
        S.recibo_enviado_a = r.email; RECIBO.email = '';
    } catch (e) {
        RECIBO.error = (LANG === 'es' && e.data && typeof e.data.detail === 'string') ? e.data.detail : t('err');
    }
    RECIBO.enviando = false;
    if (document.activeElement) document.activeElement.blur();
    render();
}

function listaHTML(yo, soloLectura, sel) {
    sel = sel || yo;
    const porNum = Object.fromEntries((S.clientes || []).map(c => [c.num, c]));
    const bloqueado = OCUPADO || S.estado !== 'abierta' || (yo && yo.pagado) || (sel && sel.pagado);
    const otro = sel && yo && sel.num !== yo.num;
    return `<div class="lista">${(S.piezas || []).map(p => {
        const mia = sel && p.clientes.includes(sel.num);
        const chips = p.clientes.map(n => `<span class="chip ${yo && n === yo.num ? 'yo-chip' : (otro && n === sel.num ? 'sel-chip' : '')}">${esc(porNum[n] ? etiquetaCliente(porNum[n]) : t('cliente') + ' ' + n)}</span>`).join('');
        const sub = [p.combo ? t('combo') : (p.de > 1 ? t('de', { n: p.n, de: p.de }) : ''),
                     p.clientes.length > 1 ? t('compartido', { n: p.clientes.length }) : '',
                     !p.clientes.length ? t('libre') : ''].filter(Boolean).map(esc).join(' · ');
        let btn = '';
        if (!soloLectura) {
            if (p.congelada) btn = `<span class="cerrado-lbl">✓ ${t('pagado')}</span>`;
            else if (mia) btn = `<button class="acc soltar" onclick="asignar('${p.key}','soltar')" ${bloqueado ? 'disabled' : ''}>${t('soltar')}</button>`;
            else if (p.clientes.length) btn = `<button class="acc compartir" onclick="asignar('${p.key}','compartir')" ${bloqueado ? 'disabled' : ''}>${t('compartir')}</button>`;
            else btn = `<button class="acc tomar" onclick="asignar('${p.key}','tomar')" ${bloqueado ? 'disabled' : ''}>${otro ? esc(t('para_n', { n: nombreDe(sel) })) : t('es_mio')}</button>`;
        }
        return `<div class="pieza ${mia ? 'mia' : ''}">
            <div class="info"><div class="nom">${esc(p.nombre)}</div>
                <div class="sub">${sub ? `<span>${sub}</span>` : ''}${chips}</div></div>
            <div class="precio">${dinero(p.precio)}</div>${btn}</div>`;
    }).join('')}</div>`;
}
function pintarPie() {
    const pie = $('pie');
    if (!S || S.estado === 'cobrada' || S.estado === 'cerrada') { pie.classList.add('hidden'); return; }
    pie.classList.remove('hidden');
    const total = S.total || 0;
    const asignado = Math.max(total - (S.pendiente || 0), 0);
    $('prog').style.width = (total > 0 ? Math.round(asignado / total * 100) : 0) + '%';
    $('falta-txt').innerHTML = S.piezas_sin_asignar
        ? t('falta', { m: dinero(S.pendiente), n: S.piezas_sin_asignar })
        : `<b>${t('todo_asignado')}</b>`;
}

async function enviarCodigo() {
    if (COD_ENVIANDO) return;
    const c = (COD_VAL || '').replace(/\D/g, '');
    if (c.length !== 3) { COD_ERR = t('cod_3'); render(); return; }
    COD_ENVIANDO = true; COD_ERR = ''; render();
    try {
        const r = await pedir(urlSala(c));
        COD_ENVIANDO = false;
        if (r.reparto) {
            _ls.set(CLAVE_COD, JSON.stringify({ c, t: Date.now() }));
            COD_VAL = '';
            return entrarCon(r.reparto);
        }
        PIDE_COD = false; VACIA = true; S = null; render();   // la cuenta se cerró justo
    } catch (e) {
        COD_ENVIANDO = false;
        COD_ERR = e.status === 403 ? t('cod_mal') : e.status === 429 ? t('cod_muchos') : t('err');
        render();
        const i = $('cod-in'); if (i) { i.focus(); i.select(); }
    }
}

// La página del recibo: un solo pedido, sin sondeo ni sala.
async function cargarRecibo() {
    try {
        const r = await pedir(`${API}/publico/reparto/${encodeURIComponent(CODIGO)}/recibo/${encodeURIComponent(RECIBO_TOK)}`);
        MONEDA = r.moneda || MONEDA;
        S = { estado: 'cobrada', local: r.local, moneda: r.moneda, yo: r.yo, vencido: r.vencido,
              recibo_enviado_a: r.recibo_enviado_a, clientes: [{ num: r.yo, nombre: r.nombre, importe: r.importe }] };
    } catch (e) {
        if (e.status === 404) ERROR = 'no_existe'; else SIN_RED = true;
    }
    render();
}

limpiarViejos();
LANG = elegirIdioma();
aplicarTextos();
if (RECIBO_TOK) cargarRecibo();
else if (SALA && (YA_PAGO = yaPagoAca())) render();
else consultar();
</script>
