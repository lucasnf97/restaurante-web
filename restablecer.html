<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — Gestión Restaurante</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', system-ui, sans-serif; background:#0f0f1e; min-height:100vh;
           display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:#fff; border-radius:16px; width:400px; max-width:94vw; padding:30px 28px;
            box-shadow:0 18px 60px rgba(0,0,0,.4); }
    .brand { font-size:20px; font-weight:800; color:#1a1a2e; text-align:center; margin-bottom:6px; }
    h1 { font-size:18px; color:#1a1a2e; text-align:center; margin-bottom:16px; font-weight:700; }
    label { font-size:12px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; display:block; margin:12px 0 6px; }
    input { width:100%; padding:11px 13px; border:1.5px solid #d1d5db; border-radius:9px; font-size:15px; }
    input:focus { outline:none; border-color:#4f46e5; }
    button { width:100%; margin-top:18px; background:#4f46e5; color:#fff; border:none; border-radius:10px;
             padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { font-size:13.5px; margin-top:12px; text-align:center; min-height:18px; line-height:1.5; }
    .msg.err { color:#dc2626; } .msg.ok { color:#16a34a; }
    .foot { text-align:center; margin-top:18px; font-size:13px; }
    .foot a { color:#4f46e5; text-decoration:none; }
    .estado { text-align:center; color:#6b7280; font-size:14px; padding:10px 0; }
</style>
</head>
<body>
<div class="card">
    <div class="brand">🍽️ Gestión Restaurante</div>
    <h1>Restablecer contraseña</h1>
    <div id="form-wrap" style="display:none;">
        <label>Nueva contraseña</label>
        <input type="password" id="p1" placeholder="Nueva contraseña" autocomplete="new-password">
        <label>Confirmar contraseña</label>
        <input type="password" id="p2" placeholder="Repetir contraseña" autocomplete="new-password"
               onkeydown="if(event.key==='Enter') guardar()">
        <button id="btn" onclick="guardar()">Guardar contraseña</button>
        <div class="msg" id="msg"></div>
    </div>
    <div id="estado" class="estado">Verificando el enlace…</div>
    <div class="foot"><a href="index.html">← Volver al inicio de sesión</a></div>
</div>
<script>
const API_URL = "https://restaurante-backend-production-459b.up.railway.app";
const TOKEN = new URLSearchParams(location.search).get("token") || "";

(async function init(){
    const est = document.getElementById("estado");
    if (!TOKEN) { est.className="estado"; est.style.color="#dc2626"; est.textContent="Enlace inválido: falta el token."; return; }
    try {
        const r = await fetch(API_URL + "/auth/reset/validar?token=" + encodeURIComponent(TOKEN));
        const d = await r.json();
        if (d.valido) { est.style.display="none"; document.getElementById("form-wrap").style.display="block";
                        setTimeout(()=>document.getElementById("p1").focus(),60); }
        else { est.style.color="#dc2626"; est.innerHTML="Este enlace no es válido o ya venció.<br>Pedí uno nuevo desde «¿Olvidaste tu contraseña?»."; }
    } catch(e){ est.style.color="#dc2626"; est.textContent="No se pudo verificar el enlace. Probá de nuevo."; }
})();

async function guardar(){
    const p1=document.getElementById("p1").value, p2=document.getElementById("p2").value;
    const msg=document.getElementById("msg"), btn=document.getElementById("btn");
    if (p1.length < 4) { msg.className="msg err"; msg.textContent="La contraseña debe tener al menos 4 caracteres."; return; }
    if (p1 !== p2) { msg.className="msg err"; msg.textContent="Las contraseñas no coinciden."; return; }
    btn.disabled=true; btn.textContent="Guardando…"; msg.textContent="";
    try {
        const r = await fetch(API_URL + "/auth/reset/confirmar", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ token: TOKEN, password: p1 }) });
        const d = await r.json().catch(()=>({}));
        if (r.ok) {
            document.getElementById("form-wrap").style.display="none";
            const est=document.getElementById("estado");
            est.style.display="block"; est.className="estado"; est.style.color="#16a34a";
            est.textContent = d.mensaje || "Contraseña actualizada. Ya podés iniciar sesión.";
            setTimeout(()=>{ location.href="index.html"; }, 2200);
        } else {
            msg.className="msg err"; msg.textContent = d.detail || "No se pudo actualizar. Pedí un enlace nuevo.";
            btn.disabled=false; btn.textContent="Guardar contraseña";
        }
    } catch(e){ msg.className="msg err"; msg.textContent="Error de conexión. Probá de nuevo."; btn.disabled=false; btn.textContent="Guardar contraseña"; }
}
</script>
</body>
</html>
