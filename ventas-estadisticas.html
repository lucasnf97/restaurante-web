<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Estadísticas de Ventas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:100;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links { display:flex; gap:16px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

.content { margin-top:60px; padding:24px 32px; }

/* ── Page header ── */
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.page-header h2 { font-size:22px; font-weight:700; color:#1a1a2e; }
.btn-back {
    background:white; border:1.5px solid #e0e0e0; border-radius:8px;
    padding:7px 16px; font-size:13px; font-weight:600; color:#4f46e5;
    cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    transition:background .15s, border-color .15s;
}
.btn-back:hover { background:#f5f3ff; border-color:#c4b5fd; }

/* ── Placeholder card ── */
.pronto-wrap {
    display:flex; justify-content:center; align-items:center;
    min-height:calc(100vh - 160px);
}
.pronto-card {
    background:white; border-radius:16px; padding:48px 56px;
    box-shadow:0 4px 20px rgba(0,0,0,.07); text-align:center;
    max-width:440px; width:100%;
}
.pronto-icon { font-size:56px; margin-bottom:18px; }
.pronto-title { font-size:20px; font-weight:700; color:#1a1a2e; margin-bottom:10px; }
.pronto-desc { font-size:14px; color:#888; line-height:1.6; margin-bottom:24px; }
.pronto-badge {
    display:inline-block; background:#f3f4f6; color:#9ca3af;
    border:1.5px solid #e5e7eb; border-radius:20px;
    padding:6px 18px; font-size:12px; font-weight:700; letter-spacing:.4px;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">

    <div class="page-header">
        <h2>🛒 Estadísticas de Ventas</h2>
        <a href="estadisticas.html" class="btn-back">← Volver a Estadísticas</a>
    </div>

    <div class="pronto-wrap">
        <div class="pronto-card">
            <div class="pronto-icon">🛒</div>
            <div class="pronto-title">Próximamente disponible</div>
            <div class="pronto-desc">
                Esta sección incluirá análisis detallado de productos vendidos,
                horarios pico, tendencias de consumo y métricas avanzadas de ventas.
            </div>
            <span class="pronto-badge">EN DESARROLLO</span>
        </div>
    </div>

</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    requireAuth();
});
</script>
</body>
</html>
