<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Estadísticas de Ventas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:200;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links  { display:flex; gap:12px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

/* ── Content ─────────────────────────────────────────────────── */
.content { margin-top:60px; padding:24px 28px; }

/* ── Page header ─────────────────────────────────────────────── */
.page-header {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
}
.page-title { font-size:20px; font-weight:800; color:#1a1a2e; }
.btn-config {
    background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.3);
    color:#6366f1; padding:6px 14px; border-radius:8px; cursor:pointer;
    font-size:12px; font-weight:700; transition:all .15s;
    display:flex; align-items:center; gap:6px;
}
.btn-config:hover { background:rgba(99,102,241,.2); }

/* ── Widget Grid ─────────────────────────────────────────────── */
#hub-wgt-grid {
    display:grid; grid-template-columns:repeat(6,1fr); gap:20px;
}
.wgt-card {
    background:white; border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07); overflow:hidden;
}
.wgt-drag {
    cursor:grab; font-size:16px; color:#d1d5db; padding:0 4px;
    display:none; align-items:center; line-height:1; flex-shrink:0;
}
.wgt-drag:hover { color:#9ca3af; }
.wgt-drag:active { cursor:grabbing; }
body.config-open .wgt-drag { display:flex; }
.wgt-card.dragging { opacity:.4; }
.wgt-card.drag-over { outline:2px dashed #4f46e5; }

/* ── Top Ventas: estructura ─────────────────────────────────── */
.wgt-tv-header {
    display:flex; align-items:center; gap:8px;
    padding:13px 16px; border-bottom:1px solid #f3f4f6;
}
.wgt-tv-title { font-size:14px; font-weight:800; color:#1a1a2e; flex:1; }

/* Filtros */
.tv-filters {
    display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;
    padding:10px 16px 10px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.tv-fg { display:flex; flex-direction:column; gap:3px; }
.tv-fg label {
    font-size:10px; font-weight:700; color:#9ca3af;
    text-transform:uppercase; letter-spacing:.5px;
}
.tv-fg input, .tv-fg select {
    padding:5px 9px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-family:inherit; background:white; color:#374151; height:30px;
}
.tv-fg input:focus, .tv-fg select:focus { outline:none; border-color:#4f46e5; }
.tv-fg.fg-nombre input { width:130px; }
.tv-btn-buscar {
    padding:0 14px; height:30px; background:#4f46e5; color:white; border:none;
    border-radius:7px; font-size:12px; font-weight:700; cursor:pointer;
    transition:background .15s; align-self:flex-end; flex-shrink:0;
}
.tv-btn-buscar:hover { background:#4338ca; }
.tv-btn-buscar:disabled { background:#9ca3af; cursor:not-allowed; }

.tv-ver-mas {
    display:flex; align-items:center; justify-content:center;
    padding:10px; cursor:pointer; color:#6366f1; font-size:12px; font-weight:700;
    gap:4px; border-top:1px solid #f3f4f6; transition:background .12s;
}
.tv-ver-mas:hover { background:#f5f3ff; }
.tv-sin-datos  { text-align:center; padding:40px 16px; color:#9ca3af; font-size:13px; }
.tv-loading {
    text-align:center; padding:40px 16px; color:#9ca3af; font-size:13px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
}
.tv-spinner {
    width:22px; height:22px; border:3px solid #e5e7eb; border-top-color:#6366f1;
    border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Config Panel ─────────────────────────────────────────────── */
/* Sin fondo ni handler de cierre: su única función era de apilado. pointer-events:none
   para que NO bloquee el arrastre de los widgets (⠿) mientras el panel está abierto. */
.cfg-overlay { display:none; position:fixed; inset:0; z-index:350; pointer-events:none; }
.cfg-overlay.open { display:block; }
.cfg-panel {
    position:fixed; top:0; right:0; width:340px; height:100%;
    background:white; z-index:360; display:flex; flex-direction:column;
    box-shadow:-4px 0 24px rgba(0,0,0,.15);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.cfg-panel.open { transform:translateX(0); }
.cfg-head {
    padding:18px 20px; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.cfg-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.cfg-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.cfg-body { flex:1; overflow-y:auto; padding:16px 20px; }
.cfg-footer {
    padding:14px 20px; border-top:1px solid #e5e7eb;
    flex-shrink:0; display:flex; gap:8px;
}
.btn-cfg-save {
    flex:1; padding:10px; background:#4f46e5; color:white;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn-cfg-save:hover { background:#4338ca; }
.btn-cfg-cancel {
    padding:10px 14px; background:#f3f4f6; color:#6b7280;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}

.cblock { border:1.5px solid #e5e7eb; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.cblock-head {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.cblock-icon { font-size:16px; }
.cblock-name { flex:1; font-size:13px; font-weight:700; color:#374151; }
.cblock-body { padding:12px 14px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.span-btn {
    padding:5px 12px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-weight:700; color:#6b7280; cursor:pointer;
    background:white; transition:all .12s;
}
.span-btn:hover  { border-color:#a5b4fc; color:#4f46e5; }
.span-btn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
/* Toggle switch minimal */
.tsw-mini {
    position:relative; width:34px; height:19px; flex-shrink:0;
    display:inline-block;
}
.tsw-mini input { opacity:0; width:0; height:0; }
.tsw-mini .tsl {
    position:absolute; inset:0; background:#d1d5db; border-radius:20px;
    cursor:pointer; transition:.2s;
}
.tsw-mini .tsl::before {
    content:''; position:absolute; width:13px; height:13px;
    left:3px; top:3px; background:white; border-radius:50%; transition:.2s;
}
.tsw-mini input:checked + .tsl { background:#4f46e5; }
.tsw-mini input:checked + .tsl::before { transform:translateX(14px); }

/* ── Demanda: estructura general ────────────────────────────── */
.wgt-dem-header {
    display:flex; align-items:center; gap:8px;
    padding:13px 16px; border-bottom:1px solid #f3f4f6; flex-wrap:wrap;
}
.wgt-dem-title { font-size:14px; font-weight:800; color:#1a1a2e; flex:1; }
.dem-trend-badge {
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
}
.dem-trend-up   { background:#dcfce7; color:#166534; }
.dem-trend-down { background:#fee2e2; color:#991b1b; }
.dem-trend-flat { background:#f3f4f6; color:#6b7280; }

/* ── Demanda: selectores de período ─────────────────────────── */
.dem-period-bar {
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:10px 16px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.dem-period-group { display:flex; align-items:center; gap:6px; }
.dem-period-label { font-size:11px; font-weight:700; color:#9ca3af; white-space:nowrap; }
.dem-pbtn {
    padding:4px 11px; border:1.5px solid #e5e7eb; border-radius:20px;
    font-size:11px; font-weight:700; color:#6b7280; cursor:pointer;
    background:white; transition:all .12s;
}
.dem-pbtn:hover  { border-color:#a5b4fc; color:#4f46e5; }
.dem-pbtn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
.dem-period-sep { color:#e5e7eb; font-size:16px; }

/* ── Demanda: tarjetas resumen ──────────────────────────────── */
.dem-cards {
    display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap;
    border-bottom:1px solid #f3f4f6;
}
.dem-card {
    flex:1; min-width:80px; padding:10px 12px; border-radius:10px;
    cursor:pointer; border:2px solid transparent; transition:all .15s;
    display:flex; flex-direction:column; align-items:center; gap:2px;
}
.dem-card:hover   { transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.1); }
.dem-card.selected { border-color:currentColor; }
.dem-card-count { font-size:22px; font-weight:900; line-height:1; }
.dem-card-label { font-size:10px; font-weight:700; text-align:center; line-height:1.2; }
.dc-alta   { background:#dcfce7; color:#166534; }
.dc-normal { background:#dbeafe; color:#1e40af; }
.dc-obs    { background:#f3f4f6; color:#6b7280; }
.dc-baja   { background:#fef3c7; color:#92400e; }
.dc-caida  { background:#fee2e2; color:#991b1b; }

/* ── Demanda: filtros ───────────────────────────────────────── */
.dem-filter-bar {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:8px 16px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.dem-filter-bar select {
    padding:4px 8px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-family:inherit; background:white; color:#374151; height:28px;
}
.dem-filter-bar select:focus { outline:none; border-color:#4f46e5; }
.dem-chk { display:flex; align-items:center; gap:5px; font-size:12px; color:#6b7280; cursor:pointer; }
.dem-chk input { cursor:pointer; accent-color:#4f46e5; }
.dem-filter-bar .dem-spacer { flex:1; }

/* ── Demanda: tabla ─────────────────────────────────────────── */
.dem-table-wrap { overflow-x:auto; max-height:480px; overflow-y:auto; }
.dem-table {
    width:100%; border-collapse:collapse; font-size:12px;
}
.dem-table th {
    position:sticky; top:0; background:white; z-index:10;
    padding:8px 10px; text-align:left; font-size:11px; font-weight:700;
    color:#9ca3af; text-transform:uppercase; letter-spacing:.4px;
    border-bottom:2px solid #f3f4f6; white-space:nowrap; cursor:pointer;
    user-select:none;
}
.dem-table th:hover { color:#4f46e5; }
.dem-table th.sorted { color:#4f46e5; }
.dem-table th .sort-ico { margin-left:3px; opacity:.5; font-size:9px; }
.dem-table th.sorted .sort-ico { opacity:1; }
.dem-table td {
    padding:7px 10px; border-bottom:1px solid #f9fafb;
    color:#374151; vertical-align:middle;
}
.dem-table tr:last-child td { border-bottom:none; }
.dem-table tr:hover td { background:#fafafa; }
.dem-table td.td-nombre { font-weight:600; color:#1a1a2e; max-width:180px; }
.dem-table td.td-nombre span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dem-table .td-num { text-align:right; font-variant-numeric:tabular-nums; }
.dem-table .td-center { text-align:center; }

/* Badges de estado */
.dem-badge {
    display:inline-flex; align-items:center; gap:3px;
    padding:2px 8px; border-radius:12px; font-size:10px; font-weight:800;
    white-space:nowrap;
}
.db-alta   { background:#dcfce7; color:#166534; }
.db-normal { background:#dbeafe; color:#1e40af; }
.db-baja   { background:#fef3c7; color:#92400e; }
.db-caida  { background:#fee2e2; color:#991b1b; }
.db-obs    { background:#f3f4f6; color:#6b7280; }

/* Badges de tendencia */
.dem-tend { font-size:13px; }

/* Variación coloreada */
.var-pos { color:#16a34a; font-weight:700; }
.var-neg { color:#dc2626; font-weight:700; }
.var-neu { color:#6b7280; }

/* Sin datos / loading tabla */
.dem-empty { text-align:center; padding:40px; color:#9ca3af; font-size:13px; }
.dem-loading {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:40px; color:#9ca3af; font-size:13px;
}

/* Umbral config en panel */
.dem-umbral-row {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
}
.dem-umbral-label { font-size:12px; font-weight:700; flex:1; }
.dem-umbral-inp {
    width:60px; padding:4px 8px; border:1.5px solid #e5e7eb; border-radius:6px;
    font-size:13px; font-family:inherit; text-align:right;
}
.dem-umbral-inp:focus { outline:none; border-color:#4f46e5; }
.dem-umbral-unit { font-size:12px; color:#9ca3af; }
.dem-umbral-note { font-size:10px; color:#9ca3af; margin-top:2px; }

/* (El CSS del Mapa de Calor se movió a historicos.html junto con el widget.) */

/* ── Gráficos de barras ─────────────────────────────────────── */
.wgt-bar-header {
    display:flex; align-items:center; gap:8px;
    padding:14px 16px 12px; border-bottom:1px solid #f0f0f0;
}
.wgt-bar-title { font-size:14px; font-weight:800; color:#1a1a2e; flex:1; }

.bar-controls {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 16px; background:#fafafa; border-bottom:1px solid #f0f0f0;
}

/* Dropdown de período */
.bar-period-wrap { position:relative; }
.bar-period-btn {
    display:flex; align-items:center; gap:8px;
    padding:5px 12px; border:1.5px solid #e5e7eb; border-radius:8px;
    background:white; font-size:12px; font-weight:600; color:#374151;
    cursor:pointer; transition:border-color .12s; white-space:nowrap; user-select:none;
}
.bar-period-btn:hover, .bar-period-btn.open { border-color:#4f46e5; color:#4f46e5; }
.bar-period-arrow { font-size:9px; color:#9ca3af; transition:transform .15s; }
.bar-period-btn.open .bar-period-arrow { transform:rotate(180deg); }
.bar-period-list {
    position:absolute; top:calc(100% + 5px); left:0; min-width:170px;
    background:white; border:1.5px solid #e5e7eb; border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:100;
    overflow:hidden; display:none;
}
.bar-period-list.open { display:block; }
.bar-period-opt {
    padding:9px 16px; font-size:13px; color:#374151;
    cursor:pointer; transition:background .1s;
}
.bar-period-opt:hover  { background:#f5f3ff; color:#4f46e5; }
.bar-period-opt.active { background:#ede9fe; color:#4f46e5; font-weight:700; }

/* Checkbox impuesto */
.bar-chk { display:flex; align-items:center; gap:5px; font-size:12px; color:#6b7280; cursor:pointer; }
.bar-chk input { cursor:pointer; accent-color:#4f46e5; }
.bar-hint { margin-left:auto; font-size:11px; color:#9ca3af; cursor:help; white-space:nowrap; }

/* Área del gráfico */
.bar-chart-wrap {
    padding:14px 16px 16px; height:380px; position:relative;
}
.bar-empty   { text-align:center; padding:60px 20px; color:#9ca3af; font-size:13px; }
.bar-loading {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    justify-content:center; height:100%; color:#9ca3af; font-size:13px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">🛒 Estadísticas de Ventas</h1>
        <button class="btn-config" onclick="abrirConfig()">⚙️ Personalizar</button>
    </div>
    <div id="hub-wgt-grid"></div>
</div>

<!-- Config panel -->
<div class="cfg-overlay" id="cfg-overlay"></div>
<div class="cfg-panel" id="cfg-panel">
    <div class="cfg-head">
        <h3>⚙️ Personalizar widgets</h3>
        <button class="cfg-close" onclick="cerrarConfig()">✕</button>
    </div>
    <div class="cfg-body" id="cfg-body"></div>
    <div class="cfg-footer">
        <button class="btn-cfg-cancel" onclick="cerrarConfig()">Cancelar</button>
        <button class="btn-cfg-save"   onclick="guardarCfg()">Guardar</button>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script src="js/moneda.js"></script>
<script>
requireAuth();
requirePermiso('acceso_estadisticas', 'acceso_facturacion');

// ── Definición de widgets ────────────────────────────────────────
const CFG_KEY  = 'vest_cfg_v2';
// (El "Mapa de Calor — Mesas" se movió a historicos.html, junto al análisis de
//  ticket promedio y tiempo en mesa. cargarCfg ya filtra la key vieja del localStorage.)
const WGT_DEFS = [
    { key:'demanda',      icon:'📊', name:'Análisis de Demanda',        fixedSpan:6 },
    { key:'barras_prod',  icon:'📈', name:'Barras por Producto',        fixedSpan:6 },
    { key:'barras_cat',   icon:'📉', name:'Barras por Categoría',       fixedSpan:6 },
    { key:'rentabilidad', icon:'💹', name:'Rentabilidad y Análisis',    fixedSpan:6 },
];

// ── Estado global ────────────────────────────────────────────────
let cfg         = cargarCfg();
let categorias  = [];
let draggingKey = null;

// ── Estado gráficos de barras ────────────────────────────────────
const BAR_PERIODOS = [
    { label:'Hoy',              dias:0   },
    { label:'Última semana',    dias:7   },
    { label:'Últimos 30 días',  dias:30  },
    { label:'Últimos 90 días',  dias:90  },
    { label:'Últimos 365 días', dias:365 },
];
const barState = {
    // sortBy: 'rev' (facturación) | 'und' (unidades)  ·  solo: null | 'rev' | 'und'
    barras_prod: { dias:30, chart:null, raw:[], sortBy:'rev', solo:null },
    barras_cat:  { dias:30, chart:null, raw:[], sortBy:'rev', solo:null },
};

// ── Estado análisis de demanda ───────────────────────────────────
let demData    = null;
let demFiltros = { cat:'', estado:'', soloActivos:true, conDatos:false };
let demSort    = { col:'unid_actual', dir:'desc' };
const DEM_UMB_KEY = 'vest_dem_umbrales_v1';
function cargarUmbrales() {
    try { return JSON.parse(localStorage.getItem(DEM_UMB_KEY)||'null') || {alta:25,baja:-20,caida:-40}; }
    catch { return {alta:25,baja:-20,caida:-40}; }
}
let demUmbrales = cargarUmbrales();

// ── Persistencia de config ───────────────────────────────────────
function cfgDefault() {
    return WGT_DEFS.map(w => ({
        key: w.key, visible: true,
        span: w.spans ? w.spans[w.spans.length-1] : (w.fixedSpan||6),
    }));
}
function cargarCfg() {
    try {
        const raw = JSON.parse(localStorage.getItem(CFG_KEY)||'null');
        if (!raw) return cfgDefault();
        WGT_DEFS.forEach(w => {
            if (!raw.find(c => c.key === w.key))
                raw.push({ key:w.key, visible:true, span: w.spans?.[w.spans.length-1]||6 });
        });
        return raw.filter(c => WGT_DEFS.find(w => w.key === c.key));
    } catch { return cfgDefault(); }
}

// ── Helpers ──────────────────────────────────────────────────────
const fmt    = n => new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtInt = n => new Intl.NumberFormat('es-ES').format(n||0);
// esc(): global de api.js (escapa &<>"' — superset del local que había acá y
// chocaba con la declaración global → SyntaxError → página en blanco).

function getDesdeDefault() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function getHastaDefault() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Render de la cuadrícula ──────────────────────────────────────
function applyCfg() {
    const grid = document.getElementById('hub-wgt-grid');
    grid.innerHTML = '';
    cfg.forEach(c => {
        if (!c.visible) return;
        const def = WGT_DEFS.find(w => w.key === c.key);
        if (!def) return;
        const div = document.createElement('div');
        div.id = `wgt-${c.key}`;
        div.className = 'wgt-card';
        div.style.gridColumn = `span ${c.span}`;
        div.draggable = true;
        div.innerHTML = buildWgtInner(def);
        grid.appendChild(div);
    });
    initDrag();
    initWidgets();
}

function buildWgtInner(def) {

// ── Widget Rentabilidad y Análisis (POS + ventas importadas × costo) ─────────
const RENT_CLASE_COLOR = { estrella:'#16a34a', caballo:'#ca8a04', puzzle:'#4f46e5', perro:'#dc2626' };
const RENT_CLASE_LBL   = { estrella:'⭐ Estrella', caballo:'🐴 Caballo', puzzle:'🧩 Puzzle', perro:'🐶 Perro' };
const RENT_CLASE_BADGE = { estrella:'#dcfce7;color:#15803d', caballo:'#fef9c3;color:#a16207', puzzle:'#e0e7ff;color:#4338ca', perro:'#fee2e2;color:#b91c1c' };
let _rentCharts = {};

// ── Ingeniería de menú: scatter con filtro por categoría ─────────
function _rentCategoriasDe(prods) {
    return [...new Set(prods.filter(p => p.clasificacion).map(p => p.categoria || '').filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'es', { sensitivity:'base' }));
}
function _rentPoblarCatMenu() {
    const sel = document.getElementById('rent-menu-cat');
    if (!sel) return;
    const prev = sel.value;
    const cats = _rentCategoriasDe(_rentProds);
    sel.innerHTML = `<option value="">Todas las categorías</option>` +
        cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (prev && cats.includes(prev)) sel.value = prev;
}
function renderRentMenu() {
    const canvas = document.getElementById('rent-menu-canvas');
    if (!canvas) return;
    const cat = document.getElementById('rent-menu-cat')?.value || '';
    try { _rentCharts.menu?.destroy(); } catch(e){}
    // Se incluyen SIEMPRE todos los productos para que la escala de los ejes NO cambie al
    // filtrar; los que no son de la categoría elegida se "apagan" (radio 0, sin hover ni hit).
    const grupos = { estrella:[], caballo:[], puzzle:[], perro:[] };
    _rentProds.filter(p => p.clasificacion).forEach(p => {
        grupos[p.clasificacion].push({
            x:p.unidades, y:p.margen_unit, nombre:p.nombre,
            _vis: (!cat || (p.categoria || '') === cat),
        });
    });
    _rentCharts.menu = new Chart(canvas, {
        type:'scatter',
        data:{ datasets:Object.keys(grupos).map(k => ({
            label:RENT_CLASE_LBL[k], data:grupos[k], backgroundColor:RENT_CLASE_COLOR[k],
            pointRadius:      grupos[k].map(pt => pt._vis ? 5 : 0),
            pointHoverRadius: grupos[k].map(pt => pt._vis ? 6 : 0),
            pointHitRadius:   grupos[k].map(pt => pt._vis ? 5 : 0),
        })) },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw.nombre}: ${fmtInt(c.raw.x)} u, margen ${simboloMoneda()} ${fmt(c.raw.y)}`}}},
            scales:{ x:{title:{display:true,text:'Unidades'}}, y:{title:{display:true,text:'Margen unitario'}} } }
    });
}

// Estado de las tablas de Rentabilidad (orden por columna: 1er click desc, 2do asc).
let _rentProds = [], _rentConsumo = [];
let _rentDetSort = { col:null, dir:'desc' };
let _rentConSort = { col:null, dir:'desc' };
// Comparador genérico: numérico o texto; null/vacío siempre al final.
function _rentCmp(a, b, dir) {
    const an = (a === null || a === undefined || a === ''), bn = (b === null || b === undefined || b === '');
    if (an && bn) return 0;
    if (an) return 1;
    if (bn) return -1;
    let c = (typeof a === 'number' && typeof b === 'number')
        ? a - b
        : String(a).localeCompare(String(b), 'es', { numeric:true, sensitivity:'base' });
    return dir === 'asc' ? c : -c;
}
function _rentArrows(prefix, cols, s) {
    cols.forEach(col => {
        const el = document.getElementById(`rar-${prefix}-${col}`);
        if (!el) return;
        if (s.col === col) { el.textContent = s.dir === 'asc' ? '↑' : '↓'; el.classList.add('active'); }
        else { el.textContent = '↕'; el.classList.remove('active'); }
    });
}

const _RENT_DET_ACC = {
    nombre:        p => p.nombre,
    categoria:     p => p.categoria || '',
    unidades:      p => p.unidades,
    ingresos_neto: p => p.ingresos_neto,
    costo_total:   p => p.tiene_receta ? p.costo_total : null,
    margen_total:  p => p.tiene_receta ? p.margen_total : null,
    food_cost_pct: p => p.food_cost_pct,
    clasificacion: p => p.clasificacion || '',
};
function renderRentDetalle() {
    const tb = document.getElementById('rent-detalle');
    if (!tb) return;
    let rows = _rentProds.slice();
    const s = _rentDetSort;
    if (s.col && _RENT_DET_ACC[s.col]) rows.sort((a, b) => _rentCmp(_RENT_DET_ACC[s.col](a), _RENT_DET_ACC[s.col](b), s.dir));
    tb.innerHTML = rows.length ? rows.map(p => `<tr>
        <td><b>${esc(p.nombre)}</b></td><td>${esc(p.categoria||'—')}</td>
        <td style="text-align:right">${fmtInt(p.unidades)}</td>
        <td style="text-align:right">${simboloMoneda()} ${fmt(p.ingresos_neto)}<div style="font-size:10px;color:#9ca3af;text-align:right;">${simboloMoneda()} ${fmt(p.ingresos_inc)} c/imp</div></td>
        <td style="text-align:right">${p.tiene_receta?simboloMoneda()+' '+fmt(p.costo_total):'—'}</td>
        <td style="text-align:right;font-weight:600;color:${p.margen_total<0?'#dc2626':'#111827'}">${p.tiene_receta?simboloMoneda()+' '+fmt(p.margen_total):'—'}</td>
        <td style="text-align:right">${p.food_cost_pct==null?'—':p.food_cost_pct+'%'}</td>
        <td>${p.clasificacion?`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:${RENT_CLASE_BADGE[p.clasificacion]}">${RENT_CLASE_LBL[p.clasificacion]}</span>`:'<span style="color:#d1d5db">sin receta</span>'}</td>
    </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;color:#9ca3af;padding:16px;">Sin ventas en el período.</td></tr>';
    _rentArrows('det', Object.keys(_RENT_DET_ACC), s);
}
function sortRentDet(col) {
    const s = _rentDetSort;
    if (s.col === col) s.dir = (s.dir === 'desc') ? 'asc' : 'desc';
    else { s.col = col; s.dir = 'desc'; }
    renderRentDetalle();
}

const _RENT_CON_ACC = {
    nombre:       i => i.nombre,
    consumido:    i => i.consumido,
    unidad:       i => i.unidad || '',
    costo_total:  i => i.costo_total,

    _rentArrows('con', Object.keys(_RENT_CON_ACC), s);

function sortRentCon(col) {

function rentKpi(lbl, val){ return `<div style="background:#f8fafc;border:1px solid #eef2f7;border-radius:8px;padding:10px 12px;"><div style="font-size:11px;color:#6b7280;font-weight:600">${lbl}</div><div style="font-size:18px;font-weight:800;color:#111827;margin-top:3px">${val}</div></div>`; }

async function cargarRentabilidad() {
    const desde = document.getElementById('rent-desde')?.value || getDesdeDefault();
    const hasta = document.getElementById('rent-hasta')?.value || getHastaDefault();
    await cargarRentProductos();     // KPIs + scatter + margen + detalle por producto
    try {
        const cons = await api.get(`/ventas/consumo-insumos?desde=${desde}&hasta=${hasta}`);
        document.getElementById('rent-consumo-total').textContent = cons.insumos.length ? `· costo total ${simboloMoneda()} ${fmt(cons.costo_total)}` : '';
        _rentConsumo = cons.insumos || [];
        renderRentConsumo();
    } catch(e) { /* consumo opcional */ }
    await cargarRentCombos(desde, hasta);
}

// Solo productos (KPIs, scatter, margen, tabla): se re-llama al togglear "Incluir combos".
async function cargarRentProductos() {
    const desde = document.getElementById('rent-desde')?.value || getDesdeDefault();
    const hasta = document.getElementById('rent-hasta')?.value || getHastaDefault();
    const inc   = document.getElementById('rent-incluir-combos')?.checked ? 'true' : 'false';
    try { _rentCharts.menu?.destroy();  } catch(e){}
    try { _rentCharts.margen?.destroy(); } catch(e){}
    let d;
    try { d = await api.get(`/ventas/rentabilidad?desde=${desde}&hasta=${hasta}&incluir_combos=${inc}`); }
    catch(e) {
        document.getElementById('rent-detalle').innerHTML = `<tr><td colspan="8" style="text-align:center;color:#dc2626;padding:16px;">Error: ${esc(e.message)}</td></tr>`;
        return;
    }
    const r = d.resumen, prods = d.productos;
    document.getElementById('rent-kpis').innerHTML =
        rentKpi('Ingresos (neto)', `${simboloMoneda()} ${fmt(r.ingresos_neto)}<div style="font-size:11px;color:#9ca3af;font-weight:400;margin-top:1px;">${simboloMoneda()} ${fmt(r.ingresos_inc)} con imp.</div>`) +
        rentKpi('Ganancia bruta', simboloMoneda()+' '+fmt(r.ganancia_bruta)) +
        rentKpi('Food-cost', r.food_cost_pct==null?'—':r.food_cost_pct+'%') +
        rentKpi('Unidades', fmtInt(r.unidades)) +
        rentKpi('Con receta', r.n_con_receta+'/'+r.n_productos);

    _rentProds = prods || [];
    _rentPoblarCatMenu();
    renderRentMenu();

    const pm = prods.filter(p=>p.tiene_receta).slice().sort((a,b)=>b.margen_total-a.margen_total).slice(0,12);
    _rentCharts.margen = new Chart(document.getElementById('rent-margen-canvas'), {
        type:'bar',
        data:{ labels:pm.map(p=>p.nombre), datasets:[{ data:pm.map(p=>p.margen_total), backgroundColor:pm.map(p=>p.margen_total<0?'#dc2626':'#16a34a') }] },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
    });
    renderRentDetalle();
}

// ── Detalle por combo (filas expandibles con desglose por producto) ──────
let _rentCombos = [], _rentCombosOrden = [];
let _rentComboSort = { col:null, dir:'desc' };
let _rentComboExp  = new Set();   // claves de combo expandidas
const _rentComboKey = c => (c.combo_id != null ? 'id:' + c.combo_id : 'n:' + c.nombre);
const _RENT_COMBO_ACC = {
    nombre:        c => c.nombre,
    unidades:      c => c.unidades,
    ingreso_neto:  c => c.ingreso_neto,
    costo_prom:    c => c.costo_prom,
    margen_total:  c => c.margen_total,
    food_cost_pct: c => c.food_cost_pct,
};
async function cargarRentCombos(desde, hasta) {
    const tb = document.getElementById('rent-combos');
    try {
        const d = await api.get(`/ventas/rentabilidad-combos?desde=${desde}&hasta=${hasta}`);
        _rentCombos = d.combos || [];
    } catch(e) {
        _rentCombos = [];
        if (tb) tb.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#dc2626;padding:16px;">Error: ${esc(e.message)}</td></tr>`;
        return;
    }
    renderRentCombos();
}
function renderRentCombos() {
    const tb = document.getElementById('rent-combos');
    if (!tb) return;
    let rows = _rentCombos.slice();
    const s = _rentComboSort;
    if (s.col && _RENT_COMBO_ACC[s.col]) rows.sort((a, b) => _rentCmp(_RENT_COMBO_ACC[s.col](a), _RENT_COMBO_ACC[s.col](b), s.dir));
    _rentCombosOrden = rows;
    if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#9ca3af;padding:16px;">Sin combos vendidos en el período.</td></tr>';
        _rentArrows('combo', Object.keys(_RENT_COMBO_ACC), s);
        return;
    }
    tb.innerHTML = rows.map((c, i) => {
        const exp = _rentComboExp.has(_rentComboKey(c));
        const cab = `<tr style="cursor:pointer;background:#fafafa" onclick="toggleRentCombo(${i})">
            <td><b><span id="rcarrow-${i}" style="display:inline-block;width:12px;color:#6b7280">${exp?'▾':'▸'}</span> ${esc(c.nombre)}</b> <span style="color:#9ca3af;font-weight:400;font-size:11px">· ${c.productos.length} prod.</span></td>
            <td style="text-align:right">${fmtInt(c.unidades)}</td>
            <td style="text-align:right">${simboloMoneda()} ${fmt(c.ingreso_neto)}<div style="font-size:10px;color:#9ca3af">${simboloMoneda()} ${fmt(c.ingreso_inc)} c/imp</div></td>
            <td style="text-align:right">${simboloMoneda()} ${fmt(c.costo_prom)}</td>
            <td style="text-align:right;font-weight:600;color:${c.margen_total<0?'#dc2626':'#111827'}">${simboloMoneda()} ${fmt(c.margen_total)}</td>
            <td style="text-align:right">${c.food_cost_pct==null?'—':c.food_cost_pct+'%'}</td>
        </tr>`;
        const det = c.productos.map(p => `<tr class="rcd-${i}" style="${exp?'':'display:none;'}background:#fbfcfe">
            <td style="padding-left:26px;color:#475569">└ ${esc(p.nombre)}</td>
            <td style="text-align:right;color:#475569">${fmtInt(p.unidades)}</td>

        </tr>`).join('');
        return cab + det;
    }).join('');
    _rentArrows('combo', Object.keys(_RENT_COMBO_ACC), s);
}
function toggleRentCombo(i) {
    const c = _rentCombosOrden[i]; if (!c) return;

function sortRentCombo(col) {

// ── Inicializar demanda ──────────────────────────────────────────
function initDemanda() {
    // Poblar select de categorías
    const sel = document.getElementById('dem-f-cat');
    if (sel && sel.options.length <= 1) {
        categorias.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.nombre;
            sel.appendChild(opt);
        });
    }

    // Botones de período actual
    document.getElementById('dem-pa-btns')?.addEventListener('click', e => {
        const btn = e.target.closest('.dem-pbtn');
        if (!btn) return;
        document.querySelectorAll('#dem-pa-btns .dem-pbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });

    // Botones de período histórico
    document.getElementById('dem-ph-btns')?.addEventListener('click', e => {
        const btn = e.target.closest('.dem-pbtn');
        if (!btn) return;
        document.querySelectorAll('#dem-ph-btns .dem-pbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });

    cargarDemanda();
}

// ── API: cargar demanda ──────────────────────────────────────────
async function cargarDemanda() {
    const btn = document.getElementById('dem-buscar-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Cargando…'; }

    const pa = document.querySelector('#dem-pa-btns .dem-pbtn.active')?.dataset.val || '30';
    const ph = document.querySelector('#dem-ph-btns .dem-pbtn.active')?.dataset.val || '60';

    const catId = document.getElementById('dem-f-cat')?.value || '';
    const inAct = !(document.getElementById('dem-f-activos')?.checked ?? true);  // incluir_inactivos

    let url = `/ventas/demanda-productos?periodo_actual=${pa}&periodo_historico=${ph}&incluir_inactivos=${inAct}`;
    if (catId) url += `&categoria_id=${catId}`;

    try {
        demData = await api.get(url);
        renderDemanda();
    } catch(e) {
        const tbody = document.getElementById('dem-tbody');
        if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="dem-empty">⚠️ Error al cargar: ${esc(e.message)}</td></tr>`;
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🔄 Actualizar'; }
    }
}

// ── Reclasificar con umbrales locales ───────────────────────────
function reclasificar(r) {
    if (!r.datos_suficientes) return 'observacion';
    const adj = r.variacion_ajustada;
    if (adj === null || adj === undefined) return 'observacion';
    if (adj > demUmbrales.alta)  return 'alta';
    if (adj > demUmbrales.baja)  return 'normal';
    if (adj > demUmbrales.caida) return 'baja';
    return 'caida';
}

// ── Render principal ─────────────────────────────────────────────
function renderDemanda() {
    if (!demData) return;

    // Trend badge
    const badge = document.getElementById('dem-trend-badge');
    if (badge) {
        const t = demData.tendencia_general_pct;
        badge.style.display = '';
        if (t >= 5) {
            badge.className = 'dem-trend-badge dem-trend-up';
            badge.textContent = `↑ +${t.toFixed(1)}% tendencia general`;
        } else if (t <= -5) {
            badge.className = 'dem-trend-badge dem-trend-down';
            badge.textContent = `↓ ${t.toFixed(1)}% tendencia general`;
        } else {
            badge.className = 'dem-trend-badge dem-trend-flat';
            badge.textContent = `→ tendencia estable (${t >= 0 ? '+' : ''}${t.toFixed(1)}%)`;
        }
    }

    // Reclasificar con umbrales locales
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));

    // Cards resumen (siempre sobre todos los productos, sin filtros)
    const counts = { alta:0, normal:0, baja:0, caida:0, observacion:0 };
    prods.forEach(r => { if (counts[r.estadoLocal] !== undefined) counts[r.estadoLocal]++; });

    const cardsEl = document.getElementById('dem-cards');
    if (cardsEl) {
        const cardDefs = [
            { key:'alta',       cls:'dc-alta',   icon:'🚀', label:'Alta demanda' },
            { key:'normal',     cls:'dc-normal', icon:'✅', label:'Normal' },
            { key:'observacion',cls:'dc-obs',    icon:'👁', label:'Observación' },
            { key:'baja',       cls:'dc-baja',   icon:'⚠️', label:'Baja demanda' },
            { key:'caida',      cls:'dc-caida',  icon:'📉', label:'Caída fuerte' },
        ];
        cardsEl.innerHTML = cardDefs.map(cd => {
            const selCls = demFiltros.estado === cd.key ? ' selected' : '';
            return `<div class="dem-card ${cd.cls}${selCls}" onclick="filtrarPorCard('${cd.key}')">
                <div class="dem-card-count">${counts[cd.key]}</div>
                <div class="dem-card-label">${cd.icon} ${cd.label}</div>
            </div>`;
        }).join('');
    }

    // Renderizar tabla con filtros actuales
    _renderTabla(prods);
}

function filtrarPorCard(estado) {
    const sel = document.getElementById('dem-f-estado');
    if (demFiltros.estado === estado) {
        // desseleccionar
        demFiltros.estado = '';
        if (sel) sel.value = '';
    } else {
        demFiltros.estado = estado;
        if (sel) sel.value = estado;
    }
    renderDemanda();
}

function filtrarDemanda() {
    demFiltros.cat        = document.getElementById('dem-f-cat')?.value    || '';
    demFiltros.estado     = document.getElementById('dem-f-estado')?.value || '';
    demFiltros.soloActivos= document.getElementById('dem-f-activos')?.checked ?? true;
    demFiltros.conDatos   = document.getElementById('dem-f-obs')?.checked  ?? false;
    if (!demData) return;
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));
    _renderTabla(prods);
}

function sortDemanda(col) {
    if (demSort.col === col) {
        demSort.dir = demSort.dir === 'desc' ? 'asc' : 'desc';
    } else {
        demSort.col = col;
        demSort.dir = col === 'nombre' || col === 'categoria' ? 'asc' : 'desc';
    }
    // Update header highlights
    document.querySelectorAll('.dem-table th').forEach(th => {
        th.classList.remove('sorted');
        const ico = th.querySelector('.sort-ico');
        if (ico) ico.textContent = '↕';
    });
    const idx = ['nombre','categoria','unid_actual','hist_avg','variacion_ajustada','participacion_pct','tendencia','estado'].indexOf(col);
    const ths = document.querySelectorAll('.dem-table th');
    if (ths[idx]) {
        ths[idx].classList.add('sorted');
        const ico = ths[idx].querySelector('.sort-ico');
        if (ico) ico.textContent = demSort.dir === 'asc' ? '▲' : '▼';
    }
    if (!demData) return;
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));
    _renderTabla(prods);
}

function _renderTabla(prods) {
    // Aplicar filtros
    let rows = prods.filter(r => {
        if (demFiltros.soloActivos && !r.activo) return false;
        if (!demFiltros.conDatos && r.estadoLocal === 'observacion' && !demFiltros.estado) return false;
        if (demFiltros.cat && String(r.categoria_id) !== String(demFiltros.cat)) return false;
        if (demFiltros.estado && r.estadoLocal !== demFiltros.estado) return false;
        return true;
    });

    // Ordenar
    const dir = demSort.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
        let va = a[demSort.col] ?? -Infinity;
        let vb = b[demSort.col] ?? -Infinity;
        if (demSort.col === 'estado') { va = a.estadoLocal; vb = b.estadoLocal; }
        if (typeof va === 'string') return va.localeCompare(vb) * dir;
        return (va - vb) * dir;
    });

    const tbody = document.getElementById('dem-tbody');
    if (!tbody) return;

    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="dem-empty">📭 Sin productos con los filtros aplicados</td></tr>`;
        return;
    }

    const estadoInfo = {
        alta:        { cls:'db-alta',   icon:'🚀', label:'Alta demanda' },
        normal:      { cls:'db-normal', icon:'✅', label:'Normal' },
        baja:        { cls:'db-baja',   icon:'⚠️', label:'Baja demanda' },
        caida:       { cls:'db-caida',  icon:'📉', label:'Caída fuerte' },
        observacion: { cls:'db-obs',    icon:'👁', label:'Observación' },
    };
    const tendIcon = { subiendo:'↗️', bajando:'↘️', estable:'→' };

    tbody.innerHTML = rows.map(r => {
        const ei  = estadoInfo[r.estadoLocal] || estadoInfo.observacion;
        const varAdj = r.variacion_ajustada;
        const varTxt = varAdj === null || varAdj === undefined
            ? `<span class="var-neu">—</span>`
            : `<span class="${varAdj > 0 ? 'var-pos' : varAdj < 0 ? 'var-neg' : 'var-neu'}">${varAdj >= 0 ? '+' : ''}${varAdj.toFixed(1)}%</span>`;

        return `<tr>
            <td class="td-nombre"><span title="${esc(r.nombre)}">${esc(r.nombre)}</span>
                ${!r.activo ? '<span style="font-size:9px;color:#9ca3af;margin-left:4px">[inactivo]</span>' : ''}
            </td>
            <td>${esc(r.categoria||'—')}</td>
            <td class="td-num">${fmtInt(r.unid_actual)} uds</td>
            <td class="td-num">${r.hist_avg > 0 ? fmtInt(Math.round(r.hist_avg)) + ' uds' : '<span style="color:#9ca3af">—</span>'}</td>
            <td class="td-num">${varTxt}</td>
            <td class="td-num">${r.participacion_pct > 0 ? r.participacion_pct.toFixed(1) + '%' : '<span style="color:#9ca3af">—</span>'}</td>
            <td class="td-center dem-tend" title="${r.tendencia}">${tendIcon[r.tendencia] || '→'}</td>
            <td class="td-center">
                <span class="dem-badge ${ei.cls}">${ei.icon} ${ei.label}</span>
            </td>
        </tr>`;
    }).join('');
}

function toggleSpan(btn) {

}
function guardarCfg() {
    cfg = WGT_DEFS.map(def => {
        const c   = cfg.find(x => x.key === def.key) || {};
        const vis = document.getElementById(`cv-${def.key}`)?.checked ?? c.visible;
        const spanEl = document.querySelector(`.span-btn.active[data-key="${def.key}"]`);
        const span   = spanEl ? parseInt(spanEl.dataset.span) : (c.span || def.fixedSpan || 6);
        return { key:def.key, visible:vis, span };
    });
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

    // Guardar umbrales de demanda si están presentes
    const cA = parseFloat(document.getElementById('cu-alta')?.value);
    const cB = parseFloat(document.getElementById('cu-baja')?.value);
    const cC = parseFloat(document.getElementById('cu-caida')?.value);
    if (!isNaN(cA) && !isNaN(cB) && !isNaN(cC)) {
        demUmbrales = { alta:cA, baja:cB, caida:cC };
        localStorage.setItem(DEM_UMB_KEY, JSON.stringify(demUmbrales));
    }

    cerrarConfig();
    applyCfg();
}

/* Cierra todos los dropdowns de barras al hacer clic fuera */
document.addEventListener('click', e => {
    ['barras_prod','barras_cat'].forEach(key => {
        const btn  = document.getElementById(`${key}-period-btn`);
        const list = document.getElementById(`${key}-period-list`);
        if (btn && list && !btn.contains(e.target) && !list.contains(e.target)) {
            btn.classList.remove('open');
            list.classList.remove('open');
        }
    });

function barTogglePeriodo(key) {
    const btn  = document.getElementById(`${key}-period-btn`);
    const list = document.getElementById(`${key}-period-list`);
    if (!btn || !list) return;
    const open = list.classList.contains('open');
    /* Cerrar todos primero */
    ['barras_prod','barras_cat'].forEach(k => {
        document.getElementById(`${k}-period-btn`)?.classList.remove('open');
        document.getElementById(`${k}-period-list`)?.classList.remove('open');
    });
    if (!open) { btn.classList.add('open'); list.classList.add('open'); }
}

function barSetPeriodo(key, dias, label) {
    barState[key].dias = dias;
    const lbl  = document.getElementById(`${key}-period-lbl`);
    const btn  = document.getElementById(`${key}-period-btn`);
    const list = document.getElementById(`${key}-period-list`);
    if (lbl) lbl.textContent = label;
    btn?.classList.remove('open');
    list?.classList.remove('open');
    list?.querySelectorAll('.bar-period-opt').forEach(el => {
        el.classList.toggle('active', el.textContent.trim() === label);
    });
    barFetch(key);
}

function barGetDates(dias) {
    const hoy   = new Date();
    const hasta = hoy.toISOString().split('T')[0];
    const desde = new Date(hoy);
    if (dias === 0) {
        /* solo hoy */
    } else {
        desde.setDate(desde.getDate() - dias);
    }
    return { desde: desde.toISOString().split('T')[0], hasta };
}

async function barFetch(key) {
    const { dias } = barState[key];
    const { desde, hasta } = barGetDates(dias);
    const conImp  = document.getElementById(`${key}-impuesto`)?.checked || false;
    const wrap    = document.getElementById(`${key}-wrap`);
    if (!wrap) return;
    wrap.innerHTML = '<div class="bar-loading"><div class="tv-spinner"></div>Cargando…</div>';

    const endpoint = key === 'barras_cat' ? 'barras-categorias' : 'barras-productos';
    try {
        const data = await api.get(
            `/ventas/${endpoint}?desde=${desde}&hasta=${hasta}&con_impuesto=${conImp}`
        );
        barRender(key, data);
    } catch(e) {
        wrap.innerHTML = `<div class="bar-empty">⚠️ Error: ${esc(e.message)}</div>`;
    }
}

function barRender(key, data) {
    const wrap = document.getElementById(`${key}-wrap`);
    if (!wrap) return;

    /* Si llega `data`, es un fetch nuevo → reemplaza los datos crudos.
       Si no, es un re-dibujo (ordenar / aislar) sobre los datos ya cargados. */
    if (data !== undefined) barState[key].raw = data || [];
    const st  = barState[key];
    const raw = st.raw || [];

    /* Destruir gráfico anterior */
    if (st.chart) { st.chart.destroy(); st.chart = null; }

    if (!raw.length) {
        wrap.innerHTML = '<div class="bar-empty">Sin datos para el período seleccionado.</div>';
        return;
    }

    const isCateg = key === 'barras_cat';

    /* Ordenar de mayor a menor según el índice elegido (por defecto facturación). */
    const sorted = raw.slice().sort((a, b) =>
        st.sortBy === 'und' ? (b.cantidad - a.cantidad) : (b.ingresos - a.ingresos));

    const labels   = sorted.map(d => isCateg ? d.categoria : d.nombre);
    const revenues = sorted.map(d => d.ingresos);
    const counts   = sorted.map(d => d.cantidad);

    /* Aislamiento: si `solo` está seteado, se oculta el otro índice (y su eje). */
    const hideRev = st.solo === 'und';
    const hideUnd = st.solo === 'rev';

    wrap.innerHTML = `<canvas id="${key}-canvas"></canvas>`;
    const canvas = document.getElementById(`${key}-canvas`);
    const ctx    = canvas.getContext('2d');

    st.chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [
                {
                    label: 'Facturación',
                    data:  revenues,
                    backgroundColor: 'rgba(16,185,129,.85)',
                    borderRadius: 3,
                    yAxisID: 'yRev',
                    order: 1,
                    hidden: hideRev,
                },
                {
                    label: 'Unidades',
                    data:  counts,
                    backgroundColor: 'rgba(99,102,241,.75)',
                    borderRadius: 3,
                    yAxisID: 'yUnd',
                    order: 2,
                    hidden: hideUnd,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { font:{ size:11 }, boxWidth:14, padding:16 },
                    /* Clic izquierdo: ordenar de mayor a menor por ese índice. */
                    onClick: (e, item) => {
                        barState[key].sortBy = item.datasetIndex === 0 ? 'rev' : 'und';
                        barRender(key);
                    },
                },
                tooltip: {
                    callbacks: {
                        label: ctx => ctx.dataset.yAxisID === 'yRev'
                            ? ` ${fmt(ctx.raw)}`
                            : ` ${fmtInt(ctx.raw)} uds`,
                    },
                },
            },
            scales: {
                x: {
                    ticks: {
                        maxRotation: 40, minRotation: 30,
                        font: { size: 10 },
                        callback(val, idx) {
                            const s = this.getLabelForValue(idx);
                            return s.length > 15 ? s.slice(0, 14) + '…' : s;
                        },
                    },
                    grid: { display: false },
                },
                yRev: {
                    display: !hideRev,
                    position: 'left',
                    beginAtZero: true,           // ancla el eje en 0 (no se corre por descuentos)
                    ticks: {
                        font: { size: 10 },
                        callback: v => fmt(v),
                    },
                    title: {
                        display: true, text: 'Facturación',
                        font: { size: 10 }, color: '#9ca3af',
                    },
                },
                yUnd: {
                    display: !hideUnd,
                    position: 'right',
                    beginAtZero: true,
                    grid: { drawOnChartArea: false },
                    ticks: {
                        font: { size: 10 },
                        callback: v => fmtInt(v),
                    },
                    title: {
                        display: true, text: 'Unidades',
                        font: { size: 10 }, color: '#9ca3af',
                    },
                },
            },
        },
    });

    /* Clic derecho sobre un índice de la leyenda: mostrar solo ese índice
       (alterna). Si el clic no cae sobre la leyenda, se deja el menú normal. */
    canvas.addEventListener('contextmenu', e => {
        const chart = barState[key].chart;
        if (!chart || !chart.legend) return;
        const rect  = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const boxes = chart.legend.legendHitBoxes || [];
        let hit = -1;
        for (let i = 0; i < boxes.length; i++) {
            const b = boxes[i];
            if (x >= b.left && x <= b.left + b.width && y >= b.top && y <= b.top + b.height) { hit = i; break; }
        }
        if (hit < 0) return;                 // no fue sobre un índice
        e.preventDefault();
        const di = chart.legend.legendItems[hit].datasetIndex;
        const metric = di === 0 ? 'rev' : 'und';
        barState[key].solo = (barState[key].solo === metric) ? null : metric;
        barRender(key);
    });
}

// ── Drag & Drop ──────────────────────────────────────────────────
function initDrag() {
    document.querySelectorAll('.wgt-card').forEach(card => {
        let fromDragHandle = false;
        card.querySelector('.wgt-drag')?.addEventListener('mousedown', () => { fromDragHandle = true; });
        document.addEventListener('mouseup', () => { fromDragHandle = false; }, { once:false });

        card.addEventListener('dragstart', e => {
            if (!fromDragHandle) { e.preventDefault(); return; }
            draggingKey = card.id.replace('wgt-','');
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend',  () => {
            card.classList.remove('dragging');
            document.querySelectorAll('.wgt-card').forEach(c => c.classList.remove('drag-over'));
            draggingKey = null;
        });
        card.addEventListener('dragover', e => {
            e.preventDefault();
            if (card.id !== `wgt-${draggingKey}`) card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', e => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!draggingKey || card.id === `wgt-${draggingKey}`) return;
            const targetKey = card.id.replace('wgt-','');
            const fromIdx = cfg.findIndex(c => c.key === draggingKey);
            const toIdx   = cfg.findIndex(c => c.key === targetKey);
            if (fromIdx === -1 || toIdx === -1) return;
            const [moved] = cfg.splice(fromIdx, 1);
            cfg.splice(toIdx, 0, moved);
            localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
            applyCfg();
        });
    });
}

// ── Init ─────────────────────────────────────────────────────────
applyCfg();
</script>
