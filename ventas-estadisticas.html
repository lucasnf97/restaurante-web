<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Estadísticas de Ventas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100vh; }

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {
    background:#1a1a2e; color:white; padding:0 32px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    position:fixed; top:0; left:0; right:0; z-index:200;
}
.navbar-brand { font-size:18px; font-weight:700; }
.navbar-links  { display:flex; gap:12px; align-items:center; }
.btn-logout {
    background:transparent; border:1px solid #4f46e5; color:#a5b4fc;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
}
.btn-logout:hover { background:#4f46e5; color:white; }

/* ── Content ─────────────────────────────────────────────────── */
.content { margin-top:60px; padding:24px 28px; }

/* ── Page header ─────────────────────────────────────────────── */
.page-header {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
}
.page-title { font-size:20px; font-weight:800; color:#1a1a2e; }
.btn-config {
    background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.3);
    color:#6366f1; padding:6px 14px; border-radius:8px; cursor:pointer;
    font-size:12px; font-weight:700; transition:all .15s;
    display:flex; align-items:center; gap:6px;
}
.btn-config:hover { background:rgba(99,102,241,.2); }

/* ── Widget Grid ─────────────────────────────────────────────── */
#hub-wgt-grid {
    display:grid; grid-template-columns:repeat(6,1fr); gap:20px;
}
.wgt-card {
    background:white; border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07); overflow:hidden;
}
.wgt-drag {
    cursor:grab; font-size:16px; color:#d1d5db; padding:0 4px;
    display:none; align-items:center; line-height:1; flex-shrink:0;
}
.wgt-drag:hover { color:#9ca3af; }
.wgt-drag:active { cursor:grabbing; }
body.config-open .wgt-drag { display:flex; }
.wgt-card.dragging { opacity:.4; }
.wgt-card.drag-over { outline:2px dashed #4f46e5; }

/* ── Top Ventas: estructura ─────────────────────────────────── */
.wgt-tv-header {
    display:flex; align-items:center; gap:8px;
    padding:13px 16px; border-bottom:1px solid #f3f4f6;
}
.wgt-tv-title { font-size:14px; font-weight:800; color:#1a1a2e; flex:1; }

/* Filtros */
.tv-filters {
    display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;
    padding:10px 16px 10px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.tv-fg { display:flex; flex-direction:column; gap:3px; }
.tv-fg label {
    font-size:10px; font-weight:700; color:#9ca3af;
    text-transform:uppercase; letter-spacing:.5px;
}
.tv-fg input, .tv-fg select {
    padding:5px 9px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-family:inherit; background:white; color:#374151; height:30px;
}
.tv-fg input:focus, .tv-fg select:focus { outline:none; border-color:#4f46e5; }
.tv-fg.fg-nombre input { width:130px; }
.tv-btn-buscar {
    padding:0 14px; height:30px; background:#4f46e5; color:white; border:none;
    border-radius:7px; font-size:12px; font-weight:700; cursor:pointer;
    transition:background .15s; align-self:flex-end; flex-shrink:0;
}
.tv-btn-buscar:hover { background:#4338ca; }
.tv-btn-buscar:disabled { background:#9ca3af; cursor:not-allowed; }

/* Podio */
.podio-wrap {
    display:flex; align-items:flex-end; justify-content:center;
    gap:8px; padding:20px 16px 0;
}
.podio-slot { display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
.podio-info {
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:0 4px 8px; width:100%;
}
.podio-medal { font-size:22px; margin-bottom:5px; }
.podio-thumb {
    width:44px; height:44px; border-radius:50%; object-fit:cover;
    border:2px solid rgba(0,0,0,.08); margin-bottom:5px; background:#f3f4f6;
}
.podio-thumb-ph {
    width:44px; height:44px; border-radius:50%; background:#f3f4f6;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; margin-bottom:5px; border:2px solid rgba(0,0,0,.04);
}
.podio-name {
    font-size:12px; font-weight:700; color:#1a1a2e; line-height:1.3;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; margin-bottom:3px; max-width:100%;
}
.podio-qty { font-size:11px; color:#6b7280; }
.podio-rev { font-size:11px; font-weight:700; color:#4f46e5; }
.podio-platform {
    width:100%; border-radius:6px 6px 0 0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:900; color:rgba(255,255,255,.8);
}
.pp-1 { height:80px; background:linear-gradient(175deg,#fbbf24,#d97706); }
.pp-2 { height:56px; background:linear-gradient(175deg,#9ca3af,#6b7280); }
.pp-3 { height:40px; background:linear-gradient(175deg,#cd9566,#b45309); }

/* Separador */
.podio-base-line {
    height:2px;
    background:linear-gradient(90deg,#f0f2f5 0%,#e5e7eb 40%,#e5e7eb 60%,#f0f2f5 100%);
    margin:0 16px;
}

/* Ranking */
.tv-section-label {
    padding:10px 16px 2px; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.6px; color:#9ca3af;
}
.ranking-list { padding:2px 16px 6px; }
.ranking-item {
    display:flex; align-items:center; gap:10px;
    padding:7px 0; border-bottom:1px solid #f3f4f6; min-width:0;
}
.ranking-item:last-child { border-bottom:none; }
.rank-num {
    width:22px; height:22px; border-radius:50%; background:#f3f4f6;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#6b7280; flex-shrink:0;
}
.rank-info { flex:1; min-width:0; }
.rank-name { font-size:13px; font-weight:600; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-cat  { font-size:10px; color:#9ca3af; }
.rank-right { display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; }
.rank-qty { font-size:12px; font-weight:700; color:#374151; white-space:nowrap; }
.rank-rev { font-size:11px; font-weight:700; color:#4f46e5; white-space:nowrap; }

.tv-ver-mas {
    display:flex; align-items:center; justify-content:center;
    padding:10px; cursor:pointer; color:#6366f1; font-size:12px; font-weight:700;
    gap:4px; border-top:1px solid #f3f4f6; transition:background .12s;
}
.tv-ver-mas:hover { background:#f5f3ff; }
.tv-sin-datos  { text-align:center; padding:40px 16px; color:#9ca3af; font-size:13px; }
.tv-loading {
    text-align:center; padding:40px 16px; color:#9ca3af; font-size:13px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
}
.tv-spinner {
    width:22px; height:22px; border:3px solid #e5e7eb; border-top-color:#6366f1;
    border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Config Panel ─────────────────────────────────────────────── */
.cfg-overlay { display:none; position:fixed; inset:0; z-index:350; }
.cfg-overlay.open { display:block; }
.cfg-panel {
    position:fixed; top:0; right:0; width:340px; height:100%;
    background:white; z-index:360; display:flex; flex-direction:column;
    box-shadow:-4px 0 24px rgba(0,0,0,.15);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.cfg-panel.open { transform:translateX(0); }
.cfg-head {
    padding:18px 20px; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.cfg-head h3 { font-size:15px; font-weight:700; color:#1a1a2e; }
.cfg-close { background:none; border:none; font-size:20px; cursor:pointer; color:#888; }
.cfg-body { flex:1; overflow-y:auto; padding:16px 20px; }
.cfg-footer {
    padding:14px 20px; border-top:1px solid #e5e7eb;
    flex-shrink:0; display:flex; gap:8px;
}
.btn-cfg-save {
    flex:1; padding:10px; background:#4f46e5; color:white;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn-cfg-save:hover { background:#4338ca; }
.btn-cfg-cancel {
    padding:10px 14px; background:#f3f4f6; color:#6b7280;
    border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
}

.cblock { border:1.5px solid #e5e7eb; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.cblock-head {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.cblock-icon { font-size:16px; }
.cblock-name { flex:1; font-size:13px; font-weight:700; color:#374151; }
.cblock-body { padding:12px 14px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.span-btn {
    padding:5px 12px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-weight:700; color:#6b7280; cursor:pointer;
    background:white; transition:all .12s;
}
.span-btn:hover  { border-color:#a5b4fc; color:#4f46e5; }
.span-btn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
/* Toggle switch minimal */
.tsw-mini {
    position:relative; width:34px; height:19px; flex-shrink:0;
    display:inline-block;
}
.tsw-mini input { opacity:0; width:0; height:0; }
.tsw-mini .tsl {
    position:absolute; inset:0; background:#d1d5db; border-radius:20px;
    cursor:pointer; transition:.2s;
}
.tsw-mini .tsl::before {
    content:''; position:absolute; width:13px; height:13px;
    left:3px; top:3px; background:white; border-radius:50%; transition:.2s;
}
.tsw-mini input:checked + .tsl { background:#4f46e5; }
.tsw-mini input:checked + .tsl::before { transform:translateX(14px); }

/* ── Demanda: estructura general ────────────────────────────── */
.wgt-dem-header {
    display:flex; align-items:center; gap:8px;
    padding:13px 16px; border-bottom:1px solid #f3f4f6; flex-wrap:wrap;
}
.wgt-dem-title { font-size:14px; font-weight:800; color:#1a1a2e; flex:1; }
.dem-trend-badge {
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:4px;
}
.dem-trend-up   { background:#dcfce7; color:#166534; }
.dem-trend-down { background:#fee2e2; color:#991b1b; }
.dem-trend-flat { background:#f3f4f6; color:#6b7280; }

/* ── Demanda: selectores de período ─────────────────────────── */
.dem-period-bar {
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:10px 16px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.dem-period-group { display:flex; align-items:center; gap:6px; }
.dem-period-label { font-size:11px; font-weight:700; color:#9ca3af; white-space:nowrap; }
.dem-pbtn {
    padding:4px 11px; border:1.5px solid #e5e7eb; border-radius:20px;
    font-size:11px; font-weight:700; color:#6b7280; cursor:pointer;
    background:white; transition:all .12s;
}
.dem-pbtn:hover  { border-color:#a5b4fc; color:#4f46e5; }
.dem-pbtn.active { background:#4f46e5; color:white; border-color:#4f46e5; }
.dem-period-sep { color:#e5e7eb; font-size:16px; }

/* ── Demanda: tarjetas resumen ──────────────────────────────── */
.dem-cards {
    display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap;
    border-bottom:1px solid #f3f4f6;
}
.dem-card {
    flex:1; min-width:80px; padding:10px 12px; border-radius:10px;
    cursor:pointer; border:2px solid transparent; transition:all .15s;
    display:flex; flex-direction:column; align-items:center; gap:2px;
}
.dem-card:hover   { transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.1); }
.dem-card.selected { border-color:currentColor; }
.dem-card-count { font-size:22px; font-weight:900; line-height:1; }
.dem-card-label { font-size:10px; font-weight:700; text-align:center; line-height:1.2; }
.dc-alta   { background:#dcfce7; color:#166534; }
.dc-normal { background:#dbeafe; color:#1e40af; }
.dc-obs    { background:#f3f4f6; color:#6b7280; }
.dc-baja   { background:#fef3c7; color:#92400e; }
.dc-caida  { background:#fee2e2; color:#991b1b; }

/* ── Demanda: filtros ───────────────────────────────────────── */
.dem-filter-bar {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:8px 16px; background:#fafafa; border-bottom:1px solid #f3f4f6;
}
.dem-filter-bar select {
    padding:4px 8px; border:1.5px solid #e5e7eb; border-radius:7px;
    font-size:12px; font-family:inherit; background:white; color:#374151; height:28px;
}
.dem-filter-bar select:focus { outline:none; border-color:#4f46e5; }
.dem-chk { display:flex; align-items:center; gap:5px; font-size:12px; color:#6b7280; cursor:pointer; }
.dem-chk input { cursor:pointer; accent-color:#4f46e5; }
.dem-filter-bar .dem-spacer { flex:1; }

/* ── Demanda: tabla ─────────────────────────────────────────── */
.dem-table-wrap { overflow-x:auto; max-height:480px; overflow-y:auto; }
.dem-table {
    width:100%; border-collapse:collapse; font-size:12px;
}
.dem-table th {
    position:sticky; top:0; background:white; z-index:10;
    padding:8px 10px; text-align:left; font-size:11px; font-weight:700;
    color:#9ca3af; text-transform:uppercase; letter-spacing:.4px;
    border-bottom:2px solid #f3f4f6; white-space:nowrap; cursor:pointer;
    user-select:none;
}
.dem-table th:hover { color:#4f46e5; }
.dem-table th.sorted { color:#4f46e5; }
.dem-table th .sort-ico { margin-left:3px; opacity:.5; font-size:9px; }
.dem-table th.sorted .sort-ico { opacity:1; }
.dem-table td {
    padding:7px 10px; border-bottom:1px solid #f9fafb;
    color:#374151; vertical-align:middle;
}
.dem-table tr:last-child td { border-bottom:none; }
.dem-table tr:hover td { background:#fafafa; }
.dem-table td.td-nombre { font-weight:600; color:#1a1a2e; max-width:180px; }
.dem-table td.td-nombre span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dem-table .td-num { text-align:right; font-variant-numeric:tabular-nums; }
.dem-table .td-center { text-align:center; }

/* Badges de estado */
.dem-badge {
    display:inline-flex; align-items:center; gap:3px;
    padding:2px 8px; border-radius:12px; font-size:10px; font-weight:800;
    white-space:nowrap;
}
.db-alta   { background:#dcfce7; color:#166534; }
.db-normal { background:#dbeafe; color:#1e40af; }
.db-baja   { background:#fef3c7; color:#92400e; }
.db-caida  { background:#fee2e2; color:#991b1b; }
.db-obs    { background:#f3f4f6; color:#6b7280; }

/* Badges de tendencia */
.dem-tend { font-size:13px; }

/* Variación coloreada */
.var-pos { color:#16a34a; font-weight:700; }
.var-neg { color:#dc2626; font-weight:700; }
.var-neu { color:#6b7280; }

/* Sin datos / loading tabla */
.dem-empty { text-align:center; padding:40px; color:#9ca3af; font-size:13px; }
.dem-loading {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:40px; color:#9ca3af; font-size:13px;
}

/* Umbral config en panel */
.dem-umbral-row {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
}
.dem-umbral-label { font-size:12px; font-weight:700; flex:1; }
.dem-umbral-inp {
    width:60px; padding:4px 8px; border:1.5px solid #e5e7eb; border-radius:6px;
    font-size:13px; font-family:inherit; text-align:right;
}
.dem-umbral-inp:focus { outline:none; border-color:#4f46e5; }
.dem-umbral-unit { font-size:12px; color:#9ca3af; }
.dem-umbral-note { font-size:10px; color:#9ca3af; margin-top:2px; }
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">🍽️ Gestión Restaurante</div>
    <div class="navbar-links">
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<div class="content">
    <div class="page-header">
        <h1 class="page-title">🛒 Estadísticas de Ventas</h1>
        <button class="btn-config" onclick="abrirConfig()">⚙️ Personalizar</button>
    </div>
    <div id="hub-wgt-grid"></div>
</div>

<!-- Config panel -->
<div class="cfg-overlay" id="cfg-overlay" onclick="cerrarConfig()"></div>
<div class="cfg-panel" id="cfg-panel">
    <div class="cfg-head">
        <h3>⚙️ Personalizar widgets</h3>
        <button class="cfg-close" onclick="cerrarConfig()">✕</button>
    </div>
    <div class="cfg-body" id="cfg-body"></div>
    <div class="cfg-footer">
        <button class="btn-cfg-cancel" onclick="cerrarConfig()">Cancelar</button>
        <button class="btn-cfg-save"   onclick="guardarCfg()">Guardar</button>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth();

// ── Definición de widgets ────────────────────────────────────────
const CFG_KEY  = 'vest_cfg_v1';
const WGT_DEFS = [
    { key:'top_ventas', icon:'🏆', name:'Top de Ventas',          spans:[3,6] },
    { key:'demanda',    icon:'📊', name:'Análisis de Demanda',     fixedSpan:6 },
];

// ── Estado global ────────────────────────────────────────────────
let cfg         = cargarCfg();
let topData     = [];
let showAll     = false;
let categorias  = [];
let draggingKey = null;

// ── Estado análisis de demanda ───────────────────────────────────
let demData    = null;
let demFiltros = { cat:'', estado:'', soloActivos:true, conDatos:false };
let demSort    = { col:'unid_actual', dir:'desc' };
const DEM_UMB_KEY = 'vest_dem_umbrales_v1';
function cargarUmbrales() {
    try { return JSON.parse(localStorage.getItem(DEM_UMB_KEY)||'null') || {alta:25,baja:-20,caida:-40}; }
    catch { return {alta:25,baja:-20,caida:-40}; }
}
let demUmbrales = cargarUmbrales();

// ── Persistencia de config ───────────────────────────────────────
function cfgDefault() {
    return WGT_DEFS.map(w => ({
        key: w.key, visible: true,
        span: w.spans ? w.spans[w.spans.length-1] : (w.fixedSpan||6),
    }));
}
function cargarCfg() {
    try {
        const raw = JSON.parse(localStorage.getItem(CFG_KEY)||'null');
        if (!raw) return cfgDefault();
        WGT_DEFS.forEach(w => {
            if (!raw.find(c => c.key === w.key))
                raw.push({ key:w.key, visible:true, span: w.spans?.[w.spans.length-1]||6 });
        });
        return raw.filter(c => WGT_DEFS.find(w => w.key === c.key));
    } catch { return cfgDefault(); }
}

// ── Helpers ──────────────────────────────────────────────────────
const fmt    = n => new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtInt = n => new Intl.NumberFormat('es-ES').format(n||0);
const esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function getDesdeDefault() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function getHastaDefault() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Render de la cuadrícula ──────────────────────────────────────
function applyCfg() {
    const grid = document.getElementById('hub-wgt-grid');
    grid.innerHTML = '';
    cfg.forEach(c => {
        if (!c.visible) return;
        const def = WGT_DEFS.find(w => w.key === c.key);
        if (!def) return;
        const div = document.createElement('div');
        div.id = `wgt-${c.key}`;
        div.className = 'wgt-card';
        div.style.gridColumn = `span ${c.span}`;
        div.draggable = true;
        div.innerHTML = buildWgtInner(def);
        grid.appendChild(div);
    });
    initDrag();
    initWidgets();
}

function buildWgtInner(def) {
    if (def.key === 'top_ventas') return buildTopVentasHTML();
    if (def.key === 'demanda')    return buildDemandaHTML();
    return `<div style="padding:20px;color:#9ca3af">Widget pendiente</div>`;
}

// ── Top Ventas: HTML base ────────────────────────────────────────
function buildTopVentasHTML() {
    return `
    <div class="wgt-tv-header">
        <span class="wgt-drag" title="Arrastrar para reordenar">⠿</span>
        <span class="wgt-tv-title">🏆 Top de Ventas</span>
    </div>
    <div class="tv-filters">
        <div class="tv-fg">
            <label>Desde</label>
            <input type="date" id="tv-desde" value="${getDesdeDefault()}">
        </div>
        <div class="tv-fg">

// ── Inicializar widgets ──────────────────────────────────────────
async function initWidgets() {
    // Cargar categorías (compartidas entre widgets)
    if (!categorias.length) {
        try { categorias = await api.get('/ventas/categorias'); } catch { /* ok */ }
    }

    if (document.getElementById('tv-body')) {
        const sel = document.getElementById('tv-cat');
        if (sel && sel.options.length <= 1) {
            categorias.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id; opt.textContent = c.nombre;
                sel.appendChild(opt);
            });
        }
        document.getElementById('tv-nombre')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') buscarTopVentas();
        });
        await buscarTopVentas();
    }

    if (document.getElementById('dem-body')) {
        initDemanda();
    }
}

// ── API: cargar top productos ────────────────────────────────────
async function buscarTopVentas() {
    const btn = document.getElementById('tv-buscar-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Buscando…'; }

    const desde  = document.getElementById('tv-desde')?.value  || getDesdeDefault();
    const hasta  = document.getElementById('tv-hasta')?.value  || getHastaDefault();
    const catId  = document.getElementById('tv-cat')?.value    || '';
    const nombre = document.getElementById('tv-nombre')?.value.trim() || '';

    let url = `/ventas/top-productos?desde=${desde}&hasta=${hasta}&limit=20`;
    if (catId)  url += `&categoria_id=${catId}`;
    if (nombre) url += `&nombre=${encodeURIComponent(nombre)}`;

    try {
        topData = await api.get(url);
        showAll = false;
        renderTopVentas();
    } catch(e) {
        const body = document.getElementById('tv-body');
        if (body) body.innerHTML = `<div class="tv-sin-datos">⚠️ Error al cargar: ${esc(e.message)}</div>`;
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🔍 Buscar'; }
    }
}

// ── Render: podio + lista ────────────────────────────────────────
function renderTopVentas() {
    const body = document.getElementById('tv-body');
    if (!body) return;

    if (!topData.length) {
        body.innerHTML = `<div class="tv-sin-datos">📭 Sin ventas en el período seleccionado</div>`;
        return;
    }

    let html = '';

    // ─ PODIO ─────────────────────────────────────────────────────
    // Orden visual: [2°, 1°, 3°]
    const slots = [
        { d: topData[1], pos:2, medal:'🥈', cls:'pp-2' },
        { d: topData[0], pos:1, medal:'🥇', cls:'pp-1' },
        { d: topData[2], pos:3, medal:'🥉', cls:'pp-3' },
    ];
    html += `<div class="podio-wrap">`;
    slots.forEach(({ d, pos, medal, cls }) => {
        if (!d) {
            // Slot vacío (si hay menos de 3 resultados)
            html += `<div class="podio-slot">
                <div class="podio-platform ${cls}" style="opacity:.2">${pos}</div>
            </div>`;
            return;
        }
        const imgTag  = d.imagen_url ? `<img class="podio-thumb" src="${esc(d.imagen_url)}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="">` : '';
        const phStyle = d.imagen_url ? 'style="display:none"' : '';
        html += `
        <div class="podio-slot">
            <div class="podio-info">
                <div class="podio-medal">${medal}</div>
                ${imgTag}
                <div class="podio-thumb-ph" ${phStyle}>🍽️</div>
                <div class="podio-name">${esc(d.nombre)}</div>
                <div class="podio-qty">${fmtInt(d.cantidad_vendida)} uds</div>
                <div class="podio-rev">€ ${fmt(d.ingresos)}</div>
            </div>
            <div class="podio-platform ${cls}">${pos}</div>
        </div>`;
    });
    html += `</div><div class="podio-base-line"></div>`;

    // ─ LISTA 4°+ ─────────────────────────────────────────────────
    const resto = topData.slice(3);
    if (resto.length) {
        const visible  = showAll ? resto : resto.slice(0, 3);
        const masCount = resto.length - 3;

        html += `<div class="tv-section-label">Más productos</div>`;
        html += `<div class="ranking-list">`;
        visible.forEach((d, i) => {
            html += `
            <div class="ranking-item">
                <div class="rank-num">${i + 4}</div>
                <div class="rank-info">
                    <div class="rank-name">${esc(d.nombre)}</div>
                    ${d.categoria ? `<div class="rank-cat">${esc(d.categoria)}</div>` : ''}
                </div>
                <div class="rank-right">
                    <div class="rank-qty">${fmtInt(d.cantidad_vendida)} uds</div>
                    <div class="rank-rev">€ ${fmt(d.ingresos)}</div>
                </div>
            </div>`;
        });
        html += `</div>`;

        if (!showAll && masCount > 0) {
            html += `<div class="tv-ver-mas" onclick="toggleVerMas()">
                ↓ Ver más (${masCount} producto${masCount !== 1 ? 's' : ''})
            </div>`;
        } else if (showAll && resto.length > 3) {
            html += `<div class="tv-ver-mas" onclick="toggleVerMas()">↑ Ver menos</div>`;
        }
    }

    body.innerHTML = html;
}

function toggleVerMas() { showAll = !showAll; renderTopVentas(); }

// ── Inicializar demanda ──────────────────────────────────────────
function initDemanda() {
    // Poblar select de categorías
    const sel = document.getElementById('dem-f-cat');
    if (sel && sel.options.length <= 1) {
        categorias.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.nombre;
            sel.appendChild(opt);
        });
    }

    // Botones de período actual
    document.getElementById('dem-pa-btns')?.addEventListener('click', e => {
        const btn = e.target.closest('.dem-pbtn');
        if (!btn) return;
        document.querySelectorAll('#dem-pa-btns .dem-pbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });

    // Botones de período histórico
    document.getElementById('dem-ph-btns')?.addEventListener('click', e => {
        const btn = e.target.closest('.dem-pbtn');
        if (!btn) return;
        document.querySelectorAll('#dem-ph-btns .dem-pbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });

    cargarDemanda();
}

// ── API: cargar demanda ──────────────────────────────────────────
async function cargarDemanda() {
    const btn = document.getElementById('dem-buscar-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Cargando…'; }

    const pa = document.querySelector('#dem-pa-btns .dem-pbtn.active')?.dataset.val || '30';
    const ph = document.querySelector('#dem-ph-btns .dem-pbtn.active')?.dataset.val || '60';

    const catId = document.getElementById('dem-f-cat')?.value || '';
    const inAct = !(document.getElementById('dem-f-activos')?.checked ?? true);  // incluir_inactivos

    let url = `/ventas/demanda-productos?periodo_actual=${pa}&periodo_historico=${ph}&incluir_inactivos=${inAct}`;
    if (catId) url += `&categoria_id=${catId}`;

    try {
        demData = await api.get(url);
        renderDemanda();
    } catch(e) {
        const tbody = document.getElementById('dem-tbody');
        if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="dem-empty">⚠️ Error al cargar: ${esc(e.message)}</td></tr>`;
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🔄 Actualizar'; }
    }
}

// ── Reclasificar con umbrales locales ───────────────────────────
function reclasificar(r) {
    if (!r.datos_suficientes) return 'observacion';
    const adj = r.variacion_ajustada;
    if (adj === null || adj === undefined) return 'observacion';
    if (adj > demUmbrales.alta)  return 'alta';
    if (adj > demUmbrales.baja)  return 'normal';
    if (adj > demUmbrales.caida) return 'baja';
    return 'caida';
}

// ── Render principal ─────────────────────────────────────────────
function renderDemanda() {
    if (!demData) return;

    // Trend badge
    const badge = document.getElementById('dem-trend-badge');
    if (badge) {
        const t = demData.tendencia_general_pct;
        badge.style.display = '';
        if (t >= 5) {
            badge.className = 'dem-trend-badge dem-trend-up';
            badge.textContent = `↑ +${t.toFixed(1)}% tendencia general`;
        } else if (t <= -5) {
            badge.className = 'dem-trend-badge dem-trend-down';
            badge.textContent = `↓ ${t.toFixed(1)}% tendencia general`;
        } else {
            badge.className = 'dem-trend-badge dem-trend-flat';
            badge.textContent = `→ tendencia estable (${t >= 0 ? '+' : ''}${t.toFixed(1)}%)`;
        }
    }

    // Reclasificar con umbrales locales
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));

    // Cards resumen (siempre sobre todos los productos, sin filtros)
    const counts = { alta:0, normal:0, baja:0, caida:0, observacion:0 };
    prods.forEach(r => { if (counts[r.estadoLocal] !== undefined) counts[r.estadoLocal]++; });

    const cardsEl = document.getElementById('dem-cards');
    if (cardsEl) {
        const cardDefs = [
            { key:'alta',       cls:'dc-alta',   icon:'🚀', label:'Alta demanda' },
            { key:'normal',     cls:'dc-normal', icon:'✅', label:'Normal' },
            { key:'observacion',cls:'dc-obs',    icon:'👁', label:'Observación' },
            { key:'baja',       cls:'dc-baja',   icon:'⚠️', label:'Baja demanda' },
            { key:'caida',      cls:'dc-caida',  icon:'📉', label:'Caída fuerte' },
        ];
        cardsEl.innerHTML = cardDefs.map(cd => {
            const selCls = demFiltros.estado === cd.key ? ' selected' : '';
            return `<div class="dem-card ${cd.cls}${selCls}" onclick="filtrarPorCard('${cd.key}')">
                <div class="dem-card-count">${counts[cd.key]}</div>
                <div class="dem-card-label">${cd.icon} ${cd.label}</div>
            </div>`;
        }).join('');
    }

    // Renderizar tabla con filtros actuales
    _renderTabla(prods);
}

function filtrarPorCard(estado) {
    const sel = document.getElementById('dem-f-estado');
    if (demFiltros.estado === estado) {
        // desseleccionar
        demFiltros.estado = '';
        if (sel) sel.value = '';
    } else {
        demFiltros.estado = estado;
        if (sel) sel.value = estado;
    }
    renderDemanda();
}

function filtrarDemanda() {
    demFiltros.cat        = document.getElementById('dem-f-cat')?.value    || '';
    demFiltros.estado     = document.getElementById('dem-f-estado')?.value || '';
    demFiltros.soloActivos= document.getElementById('dem-f-activos')?.checked ?? true;
    demFiltros.conDatos   = document.getElementById('dem-f-obs')?.checked  ?? false;
    if (!demData) return;
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));
    _renderTabla(prods);
}

function sortDemanda(col) {
    if (demSort.col === col) {
        demSort.dir = demSort.dir === 'desc' ? 'asc' : 'desc';
    } else {
        demSort.col = col;
        demSort.dir = col === 'nombre' || col === 'categoria' ? 'asc' : 'desc';
    }
    // Update header highlights
    document.querySelectorAll('.dem-table th').forEach(th => {
        th.classList.remove('sorted');
        const ico = th.querySelector('.sort-ico');
        if (ico) ico.textContent = '↕';
    });
    const idx = ['nombre','categoria','unid_actual','hist_avg','variacion_ajustada','participacion_pct','tendencia','estado'].indexOf(col);
    const ths = document.querySelectorAll('.dem-table th');
    if (ths[idx]) {
        ths[idx].classList.add('sorted');
        const ico = ths[idx].querySelector('.sort-ico');
        if (ico) ico.textContent = demSort.dir === 'asc' ? '▲' : '▼';
    }
    if (!demData) return;
    const prods = (demData.productos || []).map(r => ({ ...r, estadoLocal: reclasificar(r) }));
    _renderTabla(prods);
}

function _renderTabla(prods) {
    // Aplicar filtros
    let rows = prods.filter(r => {
        if (demFiltros.soloActivos && !r.activo) return false;
        if (!demFiltros.conDatos && r.estadoLocal === 'observacion' && !demFiltros.estado) return false;
        if (demFiltros.cat && String(r.categoria_id) !== String(demFiltros.cat)) return false;
        if (demFiltros.estado && r.estadoLocal !== demFiltros.estado) return false;
        return true;
    });

    // Ordenar
    const dir = demSort.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
        let va = a[demSort.col] ?? -Infinity;
        let vb = b[demSort.col] ?? -Infinity;
        if (demSort.col === 'estado') { va = a.estadoLocal; vb = b.estadoLocal; }
        if (typeof va === 'string') return va.localeCompare(vb) * dir;
        return (va - vb) * dir;
    });

    const tbody = document.getElementById('dem-tbody');
    if (!tbody) return;

    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="dem-empty">📭 Sin productos con los filtros aplicados</td></tr>`;
        return;
    }

    const estadoInfo = {
        alta:        { cls:'db-alta',   icon:'🚀', label:'Alta demanda' },
        normal:      { cls:'db-normal', icon:'✅', label:'Normal' },
        baja:        { cls:'db-baja',   icon:'⚠️', label:'Baja demanda' },
        caida:       { cls:'db-caida',  icon:'📉', label:'Caída fuerte' },
        observacion: { cls:'db-obs',    icon:'👁', label:'Observación' },
    };
    const tendIcon = { subiendo:'↗️', bajando:'↘️', estable:'→' };

    tbody.innerHTML = rows.map(r => {
        const ei  = estadoInfo[r.estadoLocal] || estadoInfo.observacion;
        const varAdj = r.variacion_ajustada;
        const varTxt = varAdj === null || varAdj === undefined
            ? `<span class="var-neu">—</span>`
            : `<span class="${varAdj > 0 ? 'var-pos' : varAdj < 0 ? 'var-neg' : 'var-neu'}">${varAdj >= 0 ? '+' : ''}${varAdj.toFixed(1)}%</span>`;

        return `<tr>
            <td class="td-nombre"><span title="${esc(r.nombre)}">${esc(r.nombre)}</span>
                ${!r.activo ? '<span style="font-size:9px;color:#9ca3af;margin-left:4px">[inactivo]</span>' : ''}
            </td>
            <td>${esc(r.categoria||'—')}</td>
            <td class="td-num">${fmtInt(r.unid_actual)} uds</td>
            <td class="td-num">${r.hist_avg > 0 ? fmtInt(Math.round(r.hist_avg)) + ' uds' : '<span style="color:#9ca3af">—</span>'}</td>
            <td class="td-num">${varTxt}</td>
            <td class="td-num">${r.participacion_pct > 0 ? r.participacion_pct.toFixed(1) + '%' : '<span style="color:#9ca3af">—</span>'}</td>
            <td class="td-center dem-tend" title="${r.tendencia}">${tendIcon[r.tendencia] || '→'}</td>
            <td class="td-center">
                <span class="dem-badge ${ei.cls}">${ei.icon} ${ei.label}</span>
            </td>
        </tr>`;
    }).join('');
}

function toggleSpan(btn) {
    const key = btn.dataset.key;
    document.querySelectorAll(`.span-btn[data-key="${key}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
function guardarCfg() {
    cfg = WGT_DEFS.map(def => {
        const c   = cfg.find(x => x.key === def.key) || {};
        const vis = document.getElementById(`cv-${def.key}`)?.checked ?? c.visible;
        const spanEl = document.querySelector(`.span-btn.active[data-key="${def.key}"]`);
        const span   = spanEl ? parseInt(spanEl.dataset.span) : (c.span || def.fixedSpan || 6);
        return { key:def.key, visible:vis, span };
    });
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));

    // Guardar umbrales de demanda si están presentes
    const cA = parseFloat(document.getElementById('cu-alta')?.value);
    const cB = parseFloat(document.getElementById('cu-baja')?.value);
    const cC = parseFloat(document.getElementById('cu-caida')?.value);
    if (!isNaN(cA) && !isNaN(cB) && !isNaN(cC)) {
        demUmbrales = { alta:cA, baja:cB, caida:cC };
        localStorage.setItem(DEM_UMB_KEY, JSON.stringify(demUmbrales));
    }

    cerrarConfig();
    applyCfg();
}

// ── Drag & Drop ──────────────────────────────────────────────────
function initDrag() {
    document.querySelectorAll('.wgt-card').forEach(card => {
        let fromDragHandle = false;
        card.querySelector('.wgt-drag')?.addEventListener('mousedown', () => { fromDragHandle = true; });
        document.addEventListener('mouseup', () => { fromDragHandle = false; }, { once:false });

        card.addEventListener('dragstart', e => {
            if (!fromDragHandle) { e.preventDefault(); return; }
            draggingKey = card.id.replace('wgt-','');
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend',  () => {
            card.classList.remove('dragging');
            document.querySelectorAll('.wgt-card').forEach(c => c.classList.remove('drag-over'));
            draggingKey = null;
        });
        card.addEventListener('dragover', e => {
            e.preventDefault();
            if (card.id !== `wgt-${draggingKey}`) card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', e => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!draggingKey || card.id === `wgt-${draggingKey}`) return;
            const targetKey = card.id.replace('wgt-','');
            const fromIdx = cfg.findIndex(c => c.key === draggingKey);
            const toIdx   = cfg.findIndex(c => c.key === targetKey);
            if (fromIdx === -1 || toIdx === -1) return;
            const [moved] = cfg.splice(fromIdx, 1);
            cfg.splice(toIdx, 0, moved);
            localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
            applyCfg();
        });
    });
}

// ── Init ─────────────────────────────────────────────────────────
applyCfg();
</script>
